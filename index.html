<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Chit Chat Plus</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;background:#050914;color:#fff;font-family:Arial,sans-serif}
body{overflow:hidden}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
</style>

<body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAEqeB2YXk_2A9gZ41WQ_fNiBKiGnzYGc0",
  authDomain: "chit-chat-plus-7382b.firebaseapp.com",
  projectId: "chit-chat-plus-7382b",
  storageBucket: "chit-chat-plus-7382b.firebasestorage.app",
  messagingSenderId: "98837732974",
  appId: "1:98837732974:web:ff52d3868871c91518507f",
  measurementId: "G-T42H2N5Q0Z"
};
firebase.initializeApp(firebaseConfig);
var db=firebase.firestore();
var auth=firebase.auth();
var me=null;
var CLOUDINARY_CLOUD_NAME="ptqrd8vc";
var CLOUDINARY_UPLOAD_PRESET="your_chat_upload";
var currentPage="login";
var currentChat=null;
var currentGroup=null;
var unsub=[];
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]})}
function safeName(s){return String(s||"").trim().toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,40)||"user"}
function avatar(name){return "https://ui-avatars.com/api/?name="+encodeURIComponent(name||"User")+"&background=071b3b&color=39d9ff&bold=true"}
function timeText(ts){if(!ts)return"";var d=ts.toDate?ts.toDate():new Date(ts);return d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}
function clearUnsub(){unsub.forEach(function(x){try{x()}catch(e){}});unsub=[]}
function page(html){clearUnsub();$("app").innerHTML=html}
function toast(t){var x=document.createElement("div");x.className="toast";x.textContent=t;document.body.appendChild(x);setTimeout(function(){x.remove()},2200)}
function addNotification(toUid,type,text){
 if(!me||!toUid||toUid===me.uid)return Promise.resolve();
 return db.collection("notifications").add({
   toUid:toUid,fromUid:me.uid,type:type,text:text,time:firebase.firestore.FieldValue.serverTimestamp(),read:false
 });
}
function playNotify(){
 try{
  var C=window.AudioContext||window.webkitAudioContext;
  if(!C)return;
  var c=new C(),o=c.createOscillator(),g=c.createGain();
  o.frequency.value=880;g.gain.value=.06;o.connect(g);g.connect(c.destination);
  o.start();o.stop(c.currentTime+.18);
 }catch(e){}
}
function cloudUpload(file){
 if(!file)return Promise.reject(new Error("No file selected"));
 if(file.size>100*1024*1024)return Promise.reject(new Error("File 100MB se chhoti rakho."));
 var fd=new FormData();
 fd.append("file",file);
 fd.append("upload_preset",CLOUDINARY_UPLOAD_PRESET);
 return fetch("https://api.cloudinary.com/v1_1/"+CLOUDINARY_CLOUD_NAME+"/auto/upload",{method:"POST",body:fd})
 .then(function(r){return r.json().then(function(x){
   if(!r.ok||x.error)throw new Error(x.error&&x.error.message||"Cloudinary upload failed");
   return x.secure_url||x.url;
 })});
}
function showLogin(){
 currentPage="login";
 page(`
 <div class="loginWrap">
  <div class="logo">YOUR CHAT</div>
  <div class="sub">PRIVATE • SIMPLE • CONNECTED</div>
  <div class="card">
   <input id="loginName" placeholder="Username">
   <input id="loginPass" type="password" placeholder="Password">
   <label class="remember"><input id="rememberMe" type="checkbox"> Remember Me</label>
   <button class="primary" onclick="login()">Login</button>
   <button class="secondary" onclick="showCreate()">Create Account</button>
   <button class="linkBtn" onclick="forgotPassword()">Forgot Password</button>
  </div>
 </div>`);
}
function showCreate(){
 page(`
 <div class="loginWrap">
  <div class="logo">YOUR CHAT</div>
  <div class="sub">CREATE ACCOUNT</div>
  <div class="card">
   <input id="createName" placeholder="Username">
   <input id="createPass" type="password" placeholder="Password">
   <button class="primary" onclick="createAccount()">Create Account</button>
   <button class="secondary" onclick="showLogin()">Back</button>
  </div>
 </div>`);
}
function login(){
 var n=$("loginName").value.trim(),p=$("loginPass").value;
 if(!n||!p)return toast("Enter username and password");
 var email=safeName(n)+"@yourchat.local";
 auth.signInWithEmailAndPassword(email,p).then(function(c){
   me=c.user;
   if($("rememberMe").checked)localStorage.setItem("yourChatName",n);else localStorage.removeItem("yourChatName");
   return db.collection("users").doc(me.uid).set({uid:me.uid,name:n,dp:avatar(n),online:true,lastSeen:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
 }).then(homePage).catch(function(e){toast(e.message)});
}
function createAccount(){
 var n=$("createName").value.trim(),p=$("createPass").value;
 if(n.length<2||p.length<4)return toast("Username 2+ and password 4+");
 var email=safeName(n)+"@yourchat.local";
 auth.createUserWithEmailAndPassword(email,p).then(function(c){
   me=c.user;
   return db.collection("users").doc(me.uid).set({uid:me.uid,name:n,dp:avatar(n),online:true,lastSeen:firebase.firestore.FieldValue.serverTimestamp()});
 }).then(homePage).catch(function(e){toast(e.message)});
}
function forgotPassword(){toast("Username-only recovery cannot send an email. Please create a new account if needed.")}
auth.onAuthStateChanged(function(u){
 if(u){me=u;homePage()}else showLogin();
});
function homePage(){
 currentPage="home";
 page(`
 <div class="screen">
  <div class="top"><div><b>Your Chat</b><small>Chit Chat Plus</small></div></div>
  <div class="menu">
   <button onclick="worldPage()">🌍 World Chat</button>
   <button onclick="privatePage()">💬 Private Chat</button>
   <button onclick="onlinePage()">🟢 Online Users</button>
   <button onclick="aboutPage()">ℹ️ About Chat</button>
  </div>
 </div>`);
}
function top(title,back){
 return `<div class="top"><button class="back" onclick="${back||"homePage()"}">‹</button><div><b>${esc(title)}</b></div></div>`;
}
function userRow(u,action){
 return `<div class="userRow" onclick="${action||""}">
  <img src="${esc(u.dp||avatar(u.name))}">
  <div><b>${esc(u.name)}</b><span class="${u.online?'on':'off'}">${u.online?'Online':'Offline'}</span></div>
 </div>`;
}
function onlineFlag(u){
 return !!(u.online&&u.lastSeen&&Date.now()-(u.lastSeen.toDate?u.lastSeen.toDate().getTime():new Date(u.lastSeen).getTime())<120000);
}
function worldPage(){
 currentPage="world";
 page(`<div class="screen">${top("World Chat")}
 <div class="count" id="worldCount">Online users: 0</div>
 <div id="worldMessages" class="messages"></div>
 <div class="mentionBox" id="mentionBox"></div>
 <div class="composer">
  <input id="worldInput" placeholder="Write a message...">
  <button onclick="sendWorld()">Send</button>
 </div></div>`);
 var q=db.collection("users").where("online","==",true);
 unsub.push(q.onSnapshot(function(s){$("worldCount").textContent="Online users: "+s.size}));
 unsub.push(db.collection("worldMessages").orderBy("time","asc").limitToLast(100).onSnapshot(function(s){
   var h="";s.forEach(function(d){h+=renderMessage(d.data(),"world",d.id)});$("worldMessages").innerHTML=h;$("worldMessages").scrollTop=$("worldMessages").scrollHeight;
 }));
 var inp=$("worldInput");
 inp.oninput=function(){
   if(inp.value.indexOf("@")>=0)mentionUsers(inp.value);
 };
}
function renderMessage(x,type,id){
 var own=x.uid===me.uid;
 var body="";
 if(x.imageUrl)body+='<img class="msgImg" src="'+esc(x.imageUrl)+'">';
 if(x.videoUrl)body+='<video class="msgVideo" controls src="'+esc(x.videoUrl)+'"></video>';
 if(x.voiceUrl)body+='<audio controls src="'+esc(x.voiceUrl)+'"></audio>';
 if(x.text)body+='<div>'+esc(x.text)+'</div>';
 var controls='<div class="msgActions"><button onclick="replyMsg(\''+esc(id)+'\',\''+type+'\')">Reply</button>';
 if(type==="private")controls+='<button onclick="reactTo(\''+esc(id)+'\',\''+type+'\')">React</button><button onclick="messageInfo(\''+esc(id)+'\',\''+type+'\')">Info</button>';
 else if(type==="group")controls+='<button onclick="messageInfo(\''+esc(id)+'\',\''+type+'\')">Info</button>';
 if(own)controls+='<button onclick="editMsg(\''+esc(id)+'\',\''+type+'\')">Edit</button><button onclick="deleteMsg(\''+esc(id)+'\',\''+type+'\')">Delete</button>';
 controls+='</div>';
 return '<div class="bubble '+(own?'mine':'')+'"><div class="msgName">'+esc(x.name||"User")+'</div>'+body+'<small>'+timeText(x.time)+'</small>'+controls+'</div>';
}
function sendWorld(){
 var i=$("worldInput"),t=i.value.trim();if(!t)return;
 db.collection("worldMessages").add({uid:me.uid,name:me.displayName||localStorage.getItem("yourChatName")||"User",text:t,time:firebase.firestore.FieldValue.serverTimestamp()}).then(function(){i.value=""}).catch(function(e){toast(e.message)});
}
function mentionUsers(v){
 var last=v.slice(v.lastIndexOf("@")+1).toLowerCase();
 if(!last)return $("mentionBox").innerHTML="";
 db.collection("users").where("online","==",true).limit(20).get().then(function(s){
  var h="";s.forEach(function(d){var u=d.data();if(u.name.toLowerCase().indexOf(last)>=0)h+='<button onclick="pickMention(\''+esc(u.name)+'\')">@'+esc(u.name)+'</button>'});
  $("mentionBox").innerHTML=h;
 });
}
function pickMention(n){var i=$("worldInput");var v=i.value;v=v.slice(0,v.lastIndexOf("@"))+"@"+n+" ";i.value=v;$("mentionBox").innerHTML=""}
function privatePage(){
 currentPage="private";
 page(`<div class="screen">${top("Private Chat")}
 <input class="search" id="privateSearch" placeholder="Search User" oninput="searchUsers(this.value)">
 <div class="statusLinks">
  <button onclick="myStatusPage()">My Status</button>
  <button onclick="friendsStatusPage()">Friends Status</button>
  <button onclick="otherStatusPage()">Other Users Status</button>
  <button onclick="groupListPage()">Group Chat</button>
 </div>
 <div id="privateResults"></div><div id="privateChats"></div></div>`);
 loadPrivateChats();
}
function searchUsers(v){
 if(!v.trim())return $("privateResults").innerHTML="";
 db.collection("users").orderBy("name").limit(50).get().then(function(s){
  var h="";s.forEach(function(d){var u=d.data();if(u.uid!==me.uid&&u.name.toLowerCase().indexOf(v.toLowerCase())>=0)h+=userRow(u,"openPrivate('"+u.uid+"')")});
  $("privateResults").innerHTML=h;
 });
}
function chatId(a,b){return[a,b].sort().join("_")}
function openPrivate(uid){
 db.collection("users").doc(uid).get().then(function(d){
  if(d.exists)privateChatPage(d.data());
 });
}
function loadPrivateChats(){
 var el=$("privateChats");if(!el)return;
 unsub.push(db.collection("chats").where("participants","array-contains",me.uid).orderBy("lastMessageAt","desc").onSnapshot(function(s){
  var h="";s.forEach(function(d){var x=d.data(),other=x.participants.filter(function(v){return v!==me.uid})[0];if(other)h+='<div class="chatRow" onclick="openPrivate(\''+other+'\')"><img src="'+esc(x.dp||avatar(x.name))+'"><div><b>'+esc(x.name||"User")+'</b><small>'+esc(x.lastMessage||"")+'</small></div><time>'+timeText(x.lastMessageAt)+'</time></div>'});
  el.innerHTML=h;
 }));
}
function privateChatPage(u){
 currentChat=u;
 page(`<div class="screen">${top(u.name,"privatePage()")}
 <div class="chatHead"><img src="${esc(u.dp||avatar(u.name))}"><div><b>${esc(u.name)}</b><span class="${onlineFlag(u)?'on':'off'}">${onlineFlag(u)?'Online':'Offline'}</span></div></div>
 <div id="privateMessages" class="messages"></div>
 <div id="typing" class="typing"></div>
 <div class="composer">
  <input id="privateInput" placeholder="Write a message...">
  <button onclick="sendPrivateText()">Send</button>
  <button onclick="chooseImage()">Image</button>
  <button onclick="chooseVideo()">Video</button>
  <button onclick="startVoice()">Voice</button>
 </div>
 <input type="file" id="imageFile" accept="image/*" class="hidden" onchange="uploadPrivateFile(this,'image')">
 <input type="file" id="videoFile" accept="video/*" class="hidden" onchange="uploadPrivateFile(this,'video')">
 </div>`);
 var cid=chatId(me.uid,u.uid);
 unsub.push(db.collection("chats").doc(cid).collection("messages").orderBy("time","asc").limitToLast(100).onSnapshot(function(s){
   var h="";s.forEach(function(d){var x=d.data();if(x.uid!==me.uid)db.collection("chats").doc(cid).collection("messages").doc(d.id).update({seenBy:firebase.firestore.FieldValue.arrayUnion(me.uid)}).catch(function(){});h+=renderMessage(x,"private",d.id)});$("privateMessages").innerHTML=h;$("privateMessages").scrollTop=$("privateMessages").scrollHeight;
 }));
 $("privateInput").oninput=function(){setTyping(cid,true)};
 db.collection("chats").doc(cid).set({participants:[me.uid,u.uid],name:u.name,dp:u.dp||avatar(u.name),lastMessage:"",lastMessageAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
}
function sendPrivateText(){
 var i=$("privateInput"),t=i.value.trim();if(!t)return;
 var cid=chatId(me.uid,currentChat.uid);
 var x={uid:me.uid,name:localStorage.getItem("yourChatName")||"User",text:t,time:firebase.firestore.FieldValue.serverTimestamp(),seenBy:[me.uid]};
 db.collection("chats").doc(cid).collection("messages").add(x).then(function(){
  return db.collection("chats").doc(cid).set({participants:[me.uid,currentChat.uid],name:currentChat.name,dp:currentChat.dp||avatar(currentChat.name),lastMessage:t,lastMessageAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
 }).then(function(){addNotification(currentChat.uid,"private","New private message");i.value=""}).catch(function(e){toast(e.message)});
}
function chooseImage(){$("imageFile").click()}
function chooseVideo(){$("videoFile").click()}
function uploadPrivateFile(input,type){
 var f=input.files&&input.files[0];if(!f)return;
 var max=type==="image"?10*1024*1024:50*1024*1024;if(f.size>max)return toast("File size limit exceeded");
 toast("Uploading...");
 cloudUpload(f).then(function(url){
  var cid=chatId(me.uid,currentChat.uid),data={uid:me.uid,name:localStorage.getItem("yourChatName")||"User",time:firebase.firestore.FieldValue.serverTimestamp(),seenBy:[me.uid]};
  if(type==="image")data.imageUrl=url;else data.videoUrl=url;
  return db.collection("chats").doc(cid).collection("messages").add(data).then(function(){
   return db.collection("chats").doc(cid).set({participants:[me.uid,currentChat.uid],name:currentChat.name,dp:currentChat.dp||avatar(currentChat.name),lastMessage:type==="image"?"Image":"Video",lastMessageAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
  });
 }).then(function(){addNotification(currentChat.uid,"private","New private message");input.value=""}).catch(function(e){toast(e.message)});
}
function startVoice(){
 if(!navigator.mediaDevices||!window.MediaRecorder)return toast("Voice recording not supported");
 navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
  var r=new MediaRecorder(stream),chunks=[],start=Date.now();
  r.ondataavailable=function(e){if(e.data.size)chunks.push(e.data)};
  r.onstop=function(){
   stream.getTracks().forEach(function(t){t.stop()});
   var b=new Blob(chunks,{type:"audio/webm"});
   if(Date.now()-start>120000||b.size>25*1024*1024)return toast("Voice must be under 2 minutes");
   toast("Uploading voice...");
   cloudUpload(new File([b],"voice.webm",{type:"audio/webm"})).then(function(url){
    var cid=chatId(me.uid,currentChat.uid);
    return db.collection("chats").doc(cid).collection("messages").add({uid:me.uid,name:localStorage.getItem("yourChatName")||"User",voiceUrl:url,time:firebase.firestore.FieldValue.serverTimestamp(),seenBy:[me.uid]}).then(function(){
     return db.collection("chats").doc(cid).set({participants:[me.uid,currentChat.uid],name:currentChat.name,dp:currentChat.dp||avatar(currentChat.name),lastMessage:"Voice",lastMessageAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
    });
   }).then(function(){addNotification(currentChat.uid,"private","New private message")}).catch(function(e){toast(e.message)});
  };
  r.start();toast("Recording... tap OK in 2 minutes");setTimeout(function(){if(r.state!=="inactive")r.stop()},120000);
 }).catch(function(e){toast(e.message)});
}
function setTyping(cid,on){
 if(!me)return;
 var id=cid+"_"+me.uid;
 db.collection("typing").doc(id).set({uid:me.uid,chatId:cid,typing:on,time:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}).catch(function(){});
 setTimeout(function(){db.collection("typing").doc(id).set({typing:false},{merge:true}).catch(function(){})},2500);
}
function replyMsg(id,type){toast("Reply selected")}
function reactTo(id,type){
 var path=type==="private"?db.collection("chats").doc(chatId(me.uid,currentChat.uid)).collection("messages").doc(id):db.collection("worldMessages").doc(id);
 path.update({reactions:firebase.firestore.FieldValue.arrayUnion({uid:me.uid,reaction:"❤️"})}).then(function(){toast("Reaction added")}).catch(function(e){toast(e.message)});
}
function messageInfo(id,type){toast("Message info")}
function editMsg(id,type){toast("Edit message selected")}
function deleteMsg(id,type){
 var path;
 if(type==="private")path=db.collection("chats").doc(chatId(me.uid,currentChat.uid)).collection("messages").doc(id);
 else if(type==="world")path=db.collection("worldMessages").doc(id);
 else path=db.collection("groups").doc(currentGroup.id).collection("messages").doc(id);
 path.delete().then(function(){toast("Message deleted")}).catch(function(e){toast(e.message)});
}function statusPageBase(title,back){
 page(`<div class="screen">${top(title,back)}
 <div id="statusList"></div></div>`);
}
function myStatusPage(){
 statusPageBase("My Status","privatePage()");
 var el=$("statusList");
 el.innerHTML=`
 <div class="statusCreate">
  <button onclick="statusImage()">Image</button>
  <button onclick="statusVideo()">Video</button>
  <button onclick="statusAudio()">Audio</button>
  <button onclick="statusText()">Text</button>
 </div>
 <input id="statusImageFile" type="file" accept="image/*" class="hidden" onchange="uploadStatus(this,'image')">
 <input id="statusVideoFile" type="file" accept="video/*" class="hidden" onchange="uploadStatus(this,'video')">
 <input id="statusAudioFile" type="file" accept="audio/*" class="hidden" onchange="uploadStatus(this,'audio')">
 <div id="myStatusItems"></div>`;
 unsub.push(db.collection("statuses").where("uid","==",me.uid).orderBy("time","desc").onSnapshot(function(s){
  var h="";s.forEach(function(d){h+=statusItem(d.data(),d.id)});$("myStatusItems").innerHTML=h;
 }));
}
function statusImage(){$("statusImageFile").click()}
function statusVideo(){$("statusVideoFile").click()}
function statusAudio(){$("statusAudioFile").click()}
function statusText(){
 var t=prompt("Write status text");
 if(!t)return;
 db.collection("statuses").add({uid:me.uid,type:"text",text:t,time:firebase.firestore.FieldValue.serverTimestamp()}).then(function(){toast("Status posted")}).catch(function(e){toast(e.message)});
}
function uploadStatus(input,type){
 var f=input.files&&input.files[0];if(!f)return;
 toast("Uploading...");
 cloudUpload(f).then(function(url){
  var d={uid:me.uid,type:type,time:firebase.firestore.FieldValue.serverTimestamp()};
  if(type==="image")d.imageUrl=url;
  if(type==="video")d.videoUrl=url;
  if(type==="audio")d.audioUrl=url;
  return db.collection("statuses").add(d);
 }).then(function(){toast("Status posted");input.value=""}).catch(function(e){toast(e.message)});
}
function statusItem(x,id){
 var h='<div class="statusItem">';
 if(x.imageUrl)h+='<img class="statusImg" src="'+esc(x.imageUrl)+'">';
 if(x.videoUrl)h+='<video class="statusVideo" controls src="'+esc(x.videoUrl)+'"></video>';
 if(x.audioUrl)h+='<audio controls src="'+esc(x.audioUrl)+'"></audio>';
 if(x.text)h+='<div class="statusText">'+esc(x.text)+'</div>';
 h+='<small>'+timeText(x.time)+'</small><div><button onclick="statusReact(\''+id+'\')">❤️ React</button></div></div>';
 return h;
}
function friendsStatusPage(){
 statusPageBase("Friends Status","privatePage()");
 var el=$("statusList");el.innerHTML="<div>Loading...</div>";
 db.collection("chats").where("participants","array-contains",me.uid).get().then(function(cs){
  var ids={};cs.forEach(function(d){d.data().participants.forEach(function(x){if(x!==me.uid)ids[x]=true})});
  if(!Object.keys(ids).length){el.innerHTML="<div class='empty'>No friends status</div>";return}
  return db.collection("statuses").orderBy("time","desc").limit(100).get().then(function(ss){
   var h="";ss.forEach(function(d){var x=d.data();if(ids[x.uid])h+=statusItem(x,d.id)});el.innerHTML=h||"<div class='empty'>No friends status</div>";
  });
 }).catch(function(e){el.innerHTML="<div class='empty'>Unable to load status</div>"});
}
function otherStatusPage(){
 statusPageBase("Other Users Status","privatePage()");
 var el=$("statusList");
 Promise.all([db.collection("chats").where("participants","array-contains",me.uid).get(),db.collection("statuses").orderBy("time","desc").limit(100).get()]).then(function(a){
  var ids={};a[0].forEach(function(d){d.data().participants.forEach(function(x){if(x!==me.uid)ids[x]=true})});
  var h="";a[1].forEach(function(d){var x=d.data();if(x.uid!==me.uid&&!ids[x.uid])h+=statusItem(x,d.id)});
  el.innerHTML=h||"<div class='empty'>No other users status</div>";
 }).catch(function(e){el.innerHTML="<div class='empty'>Unable to load status</div>"});
}
function statusReact(id){
 db.collection("statusReactions").doc(id+"_"+me.uid).set({uid:me.uid,statusId:id,reaction:"❤️",time:firebase.firestore.FieldValue.serverTimestamp()}).then(function(){toast("Reaction added")}).catch(function(e){toast(e.message)});
}
function groupListPage(){
 currentPage="groups";
 page(`<div class="screen">${top("Group Chat")}
 <button class="primary" onclick="createGroup()">Create Group</button>
 <div id="groupsList"></div></div>`);
 loadGroups();
}
function loadGroups(){
 unsub.push(db.collection("groups").where("members","array-contains",me.uid).orderBy("time","desc").onSnapshot(function(s){
  var h="";s.forEach(function(d){var x=d.data();h+='<div class="chatRow" onclick="openGroup(\''+d.id+'\')"><div class="groupIcon">👥</div><div><b>'+esc(x.name)+'</b><small>'+esc(x.lastMessage||"")+'</small></div></div>'});$("groupsList").innerHTML=h||"<div class='empty'>No groups</div>";
 }));
}
function createGroup(){
 var n=prompt("Group name");if(!n)return;
 db.collection("groups").add({name:n,ownerUid:me.uid,members:[me.uid],time:firebase.firestore.FieldValue.serverTimestamp(),lastMessage:""}).then(function(){toast("Group created")}).catch(function(e){toast(e.message)});
}
function openGroup(id){
 db.collection("groups").doc(id).get().then(function(d){if(d.exists){currentGroup={id:id,...d.data()};groupChatPage(currentGroup)}});
}
function groupChatPage(g){
 page(`<div class="screen">${top(g.name,"groupListPage()")}
 <div class="groupTools">
  <button onclick="groupMembers()">Members</button>
  <button onclick="groupMention()">@</button>
  ${g.ownerUid===me.uid?'<button onclick="addGroupMember()">Add Member</button><button onclick="removeGroupMember()">Remove Member</button>':""}
 </div>
 <div id="groupMessages" class="messages"></div>
 <div class="composer">
  <input id="groupInput" placeholder="Write a message...">
  <button onclick="sendGroupText()">Send</button>
  <button onclick="chooseGroupImage()">Image</button>
  <button onclick="chooseGroupVideo()">Video</button>
  <button onclick="startGroupVoice()">Voice</button>
 </div>
 <input type="file" id="groupImageFile" accept="image/*" class="hidden" onchange="uploadGroupFile(this,'image')">
 <input type="file" id="groupVideoFile" accept="video/*" class="hidden" onchange="uploadGroupFile(this,'video')">
 </div>`);
 unsub.push(db.collection("groups").doc(g.id).collection("messages").orderBy("time","asc").limitToLast(100).onSnapshot(function(s){
  var h="";s.forEach(function(d){h+=renderMessage(d.data(),"group",d.id)});$("groupMessages").innerHTML=h;$("groupMessages").scrollTop=$("groupMessages").scrollHeight;
 }));
}
function sendGroupText(){
 var i=$("groupInput"),t=i.value.trim();if(!t)return;
 db.collection("groups").doc(currentGroup.id).collection("messages").add({uid:me.uid,name:localStorage.getItem("yourChatName")||"User",text:t,time:firebase.firestore.FieldValue.serverTimestamp()}).then(function(){
  return db.collection("groups").doc(currentGroup.id).set({lastMessage:t,time:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
 }).then(function(){
  (currentGroup.members||[]).forEach(function(uid){if(uid!==me.uid)addNotification(uid,"group","New group message")});
  i.value="";
 }).catch(function(e){toast(e.message)});
}
function chooseGroupImage(){$("groupImageFile").click()}
function chooseGroupVideo(){$("groupVideoFile").click()}
function uploadGroupFile(input,type){
 var f=input.files&&input.files[0];if(!f)return;
 var max=type==="image"?10*1024*1024:50*1024*1024;if(f.size>max)return toast("File size limit exceeded");
 toast("Uploading...");
 cloudUpload(f).then(function(url){
  var d={uid:me.uid,name:localStorage.getItem("yourChatName")||"User",time:firebase.firestore.FieldValue.serverTimestamp(),type:type};
  if(type==="image")d.imageUrl=url;else d.videoUrl=url;
  return db.collection("groups").doc(currentGroup.id).collection("messages").add(d);
 }).then(function(){input.value="";toast("Sent")}).catch(function(e){toast(e.message)});
}
function startGroupVoice(){
 if(!navigator.mediaDevices||!window.MediaRecorder)return toast("Voice recording not supported");
 navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
  var r=new MediaRecorder(stream),chunks=[],start=Date.now();
  r.ondataavailable=function(e){if(e.data.size)chunks.push(e.data)};
  r.onstop=function(){
   stream.getTracks().forEach(function(t){t.stop()});
   var b=new Blob(chunks,{type:"audio/webm"});
   if(Date.now()-start>120000||b.size>25*1024*1024)return toast("Voice must be under 2 minutes");
   toast("Uploading voice...");
   cloudUpload(new File([b],"group-voice.webm",{type:"audio/webm"})).then(function(url){
    return db.collection("groups").doc(currentGroup.id).collection("messages").add({uid:me.uid,name:localStorage.getItem("yourChatName")||"User",voiceUrl:url,type:"audio",time:firebase.firestore.FieldValue.serverTimestamp()});
   }).then(function(){toast("Voice sent")}).catch(function(e){toast(e.message)});
  };
  r.start();setTimeout(function(){if(r.state!=="inactive")r.stop()},120000);toast("Recording...");
 }).catch(function(e){toast(e.message)});
}
function groupMembers(){
 var h=(currentGroup.members||[]).map(function(uid){return uid}).join("\n");
 toast("Members: "+h);
}
function groupMention(){var n=prompt("Member username to mention");if(n){$("groupInput").value+="@"+n+" "}}
function addGroupMember(){
 if(currentGroup.ownerUid!==me.uid)return toast("Only admin can add members");
 var n=prompt("Username");if(!n)return;
 db.collection("users").where("name","==",n).limit(1).get().then(function(s){
  if(s.empty)return toast("User not found");
  var uid=s.docs[0].id;
  return db.collection("groups").doc(currentGroup.id).update({members:firebase.firestore.FieldValue.arrayUnion(uid)}).then(function(){addNotification(uid,"group","You were added to a group")});
 }).then(function(){toast("Member added")}).catch(function(e){toast(e.message)});
}
function removeGroupMember(){
 if(currentGroup.ownerUid!==me.uid)return toast("Only admin can remove members");
 var n=prompt("Username to remove");if(!n)return;
 db.collection("users").where("name","==",n).limit(1).get().then(function(s){
  if(s.empty)return toast("User not found");
  return db.collection("groups").doc(currentGroup.id).update({members:firebase.firestore.FieldValue.arrayRemove(s.docs[0].id)});
 }).then(function(){toast("Member removed")}).catch(function(e){toast(e.message)});
}
function onlinePage(){
 page(`<div class="screen">${top("Online Users")}
 <input class="search" placeholder="Search users" oninput="filterOnline(this.value)">
 <div id="onlineList"></div></div>`);
 loadOnline();
}
function loadOnline(){
 unsub.push(db.collection("users").where("online","==",true).onSnapshot(function(s){
  var h="";s.forEach(function(d){var u=d.data();if(u.uid!==me.uid&&onlineFlag(u))h+=userRow(u,"openPrivate('"+u.uid+"')")});$("onlineList").innerHTML=h||"<div class='empty'>No online users</div>";
 }));
}
function filterOnline(v){
 db.collection("users").where("online","==",true).get().then(function(s){
  var h="";s.forEach(function(d){var u=d.data();if(u.uid!==me.uid&&onlineFlag(u)&&u.name.toLowerCase().indexOf(v.toLowerCase())>=0)h+=userRow(u,"openPrivate('"+u.uid+"')")});$("onlineList").innerHTML=h||"<div class='empty'>No online users</div>";
 });
}
