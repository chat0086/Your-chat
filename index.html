<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#061326">
<title>YOUR CHAT</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;
 padding:0;
 min-height:100%;
 background:#061326;
 color:#ffffff;
 font-family:Arial,sans-serif;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hide{display:none!important}

#loading{
 position:fixed;
 left:0;
 top:0;
 right:0;
 bottom:0;
 z-index:9999;
 display:block;
 background:#061326;
 text-align:center;
}

.loadbox{
 width:90%;
 max-width:350px;
 margin:15% auto 0 auto;
 padding:24px 18px;
 text-align:center;
 background:#081a31;
 border:1px solid #1975df;
 border-radius:20px;
}

.logo{
 font-size:27px;
 font-weight:bold;
 letter-spacing:1px;
 color:#ffffff;
}
.logo span{color:#b833ff}

.loadingPeople{
 text-align:center;
 margin:16px 0 4px 0;
}

.loadingPerson{
 display:inline-block;
 width:70px;
 height:70px;
 margin:0 8px;
 border-radius:50%;
 border:2px solid #238cff;
 background:#102d4d;
 line-height:66px;
 font-size:36px;
 vertical-align:middle;
}

.loadingPerson.girl{border-color:#d72cff}

.spinner{
 width:34px;
 height:34px;
 margin:15px auto 10px auto;
 border:3px solid #214365;
 border-top-color:#b833ff;
 border-right-color:#168cff;
 border-radius:50%;
 animation:spin .8s linear infinite;
}

@keyframes spin{
 to{transform:rotate(360deg)}
}

.small{
 color:#8da8c5;
 font-size:12px;
 line-height:1.5;
}

#auth{
 min-height:100vh;
 padding:15px;
 background:#061326;
}

.box{
 width:100%;
 max-width:390px;
 margin:20px auto;
 padding:20px;
 background:#081a31;
 border:1px solid #175ea8;
 border-radius:18px;
}

input,textarea{
 width:100%;
 padding:12px;
 margin:6px 0;
 color:#ffffff;
 background:#061326;
 border:1px solid #21496f;
 border-radius:10px;
 outline:none;
}

input:focus,textarea:focus{
 border-color:#9c35ff;
}

textarea{
 min-height:70px;
 resize:none;
}

.btn{
 width:100%;
 padding:11px;
 margin-top:7px;
 color:#ffffff;
 font-weight:bold;
 background:#168cff;
 border:0;
 border-radius:10px;
}

.btn.alt{
 background:#102b49;
 border:1px solid #20547f;
}

.btn.red{background:#a9273d}
.btn.green{background:#087f65}

.tabs{
 margin:10px 0;
 font-size:0;
}

.tab{
 width:49%;
 display:inline-block;
 padding:9px 3px;
 border:1px solid #174b78;
 border-radius:8px;
 background:#0a2039;
 color:#b7cbe0;
 font-size:11px;
 text-align:center;
}
.tab:first-child{margin-right:2%}

.tab.active{
 background:#7b2cff;
 color:#ffffff;
}

header{
 height:55px;
 padding:0 10px;
 background:#07182d;
 border-bottom:1px solid #12518c;
 position:sticky;
 top:0;
 z-index:50;
}

.brand{
 float:left;
 font-weight:bold;
 font-size:19px;
 line-height:55px;
}
.brand span{color:#bd39ff}

.headerUser{
 float:right;
 margin-top:14px;
 font-size:11px;
}

.avatar{
 width:34px;
 height:34px;
 border-radius:50%;
 border:1px solid #238cff;
 background:#102d4d;
 vertical-align:middle;
}

.dot{
 display:inline-block;
 width:8px;
 height:8px;
 border-radius:50%;
 background:#00e99a;
 vertical-align:middle;
}

.offline{background:#65758a}
.grn{color:#00e99a}

main{
 width:100%;
 max-width:520px;
 margin:auto;
 padding:9px;
 padding-bottom:58px;
}

.card{
 background:#081b32;
 border:1px solid #164f83;
 border-radius:14px;
 padding:11px;
 margin-bottom:9px;
}

.demo-badge{
 background:#ff9800;
 color:#000000;
 font-weight:bold;
 font-size:10px;
 padding:2px 6px;
 border-radius:4px;
 display:inline-block;
 margin-bottom:6px;
}

.menuBtn{
 width:48%;
 display:inline-block;
 min-height:75px;
 color:#ffffff;
 text-align:left;
 padding:10px;
 margin:1%;
 border-radius:12px;
 border:1px solid #174c7b;
 background:#0a213b;
 vertical-align:top;
}

.menuBtn strong{
 display:block;
 color:#54aaff;
 margin-bottom:5px;
 font-size:12px;
}

.menuBtn small{
 color:#89a5c1;
 font-size:10px;
}

.topTitle{
 margin-bottom:8px;
}

.back{
 width:auto;
 padding:7px 10px;
 margin:0 0 8px 0;
}

.userRow{
 padding:8px 2px;
 border-bottom:1px solid #123653;
}

.userInfo{
 display:inline-block;
 vertical-align:middle;
 width:60%;
 margin-left:8px;
}

.userInfo b{
 display:block;
 font-size:13px;
}

.userInfo small{
 display:block;
 color:#7e9ab6;
 font-size:10px;
 margin-top:2px;
}

.miniBtn{
 width:auto;
 padding:7px 9px;
 margin:0;
 font-size:11px;
 float:right;
 margin-top:4px;
}

.chatBox{
 height:52vh;
 min-height:260px;
 overflow:auto;
 padding:5px 1px;
}

.message{
 margin:7px 0;
 overflow:hidden;
}

.message.mine .bubble{
 float:right;
 background:#4720a0;
 border-color:#763bdf;
}

.message.mine .messageAvatar{
 float:right;
 margin-left:6px;
}

.message.other .bubble{
 float:left;
 background:#102e4d;
 border-color:#174c79;
}

.message.other .messageAvatar{
 float:left;
 margin-right:6px;
}

.bubble{
 max-width:78%;
 padding:8px 10px;
 border:1px solid #174c79;
 border-radius:11px;
 font-size:12px;
 word-wrap:break-word;
}

.bubble small{
 display:block;
 margin-top:4px;
 color:#9eb7d0;
 font-size:8px;
 text-align:right;
}

.messageAvatar{
 width:27px;
 height:27px;
 border-radius:50%;
 border:1px solid #238cff;
 vertical-align:middle;
}

.mention{
 color:#58b8ff;
 font-weight:bold;
}

.chatInput{
 margin-top:6px;
}

.chatInput textarea{
 width:80%;
 display:inline-block;
 margin:0;
 min-height:40px;
 height:40px;
 vertical-align:middle;
}

.send{
 width:18%;
 display:inline-block;
 margin:0;
 height:40px;
 vertical-align:middle;
}

.tools{
 margin-top:5px;
 font-size:0;
}

.tool{
 width:32%;
 display:inline-block;
 padding:7px 2px;
 margin:0 0.6%;
 color:#b8d3ee;
 background:#0b2744;
 border:1px solid #194b74;
 border-radius:8px;
 font-size:10px;
 text-align:center;
}

.statusCard{
 padding:8px;
 border-bottom:1px solid #143a5d;
}

.reactions{
 margin-top:5px;
}

.react{
 padding:5px 7px;
 margin-right:4px;
 background:#102d4c;
 border:1px solid #1b527f;
 border-radius:15px;
 font-size:12px;
}

.notice{
 padding:10px;
 border-radius:10px;
 margin:7px 0;
 background:#102941;
 border:1px solid #1a557f;
 color:#b9cee2;
 font-size:11px;
}

.warning{
 background:#3b1921;
 border-color:#b72f49;
 color:#ff8fa2;
}

.success{
 background:#10372e;
 border-color:#13856b;
 color:#7ff0cf;
}

.bottom{
 position:fixed;
 left:0;
 right:0;
 bottom:0;
 height:47px;
 background:#07182d;
 border-top:1px solid #164d7d;
 text-align:center;
 z-index:100;
}

.bottom button{
 width:19%;
 display:inline-block;
 background:none;
 color:#91aac2;
 border:0;
 font-size:9px;
 height:100%;
 vertical-align:top;
}

.bottom button.active{color:#bd48ff}

.badge{
 background:#7b2cff;
 color:#ffffff;
 border-radius:12px;
 padding:2px 6px;
 font-size:9px;
}

.search{margin-bottom:7px}

@media(max-width:350px){
 .menuBtn{width:98%; margin:1% 0;}
 main{padding:7px}
}
</style>
</head>

<body>

<div id="loading">
 <div class="loadbox">
  <div class="logo">YOUR <span>CHAT</span></div>
  <div class="loadingPeople">
   <div class="loadingPerson">👦</div>
   <div class="loadingPerson girl">👧</div>
  </div>
  <div class="spinner"></div>
  <div class="small">Starting Your Chat...</div>
 </div>
</div>

<div id="auth" class="hide">
 <div class="box">
  <div style="text-align:center">
   <div class="logo">YOUR <span>CHAT</span></div>
   <div class="demo-badge">FRONTEND / LOCAL DEMO</div>
   <p class="small">Connect • Chat • Share</p>
  </div>

  <div class="tabs">
   <button id="loginTab" class="tab active" onclick="authMode('login')">Login</button>
   <button id="createTab" class="tab" onclick="authMode('create')">Create Account</button>
  </div>

  <input id="username" maxlength="24" placeholder="Username">
  <input id="password" type="password" placeholder="Password">

  <button id="authBtn" class="btn" onclick="authAction()">Login</button>

  <div id="authStatus" class="small" style="text-align:center;margin-top:8px"></div>
 </div>
</div>

<div id="app" class="hide">

<header>
 <div class="brand">YOUR <span>CHAT</span></div>
 <div class="headerUser">
  <span class="dot"></span>
  <span id="headerName">User</span>
 </div>
</header>

<main id="main"></main>

<div class="bottom">
 <button id="navHome" onclick="home()">🏠<br>Home</button>
 <button id="navWorld" onclick="worldChat()">🌍<br>World</button>
 <button id="navUsers" onclick="onlineUsers()"><span class="grn">●</span><br>Online</button>
 <button id="navStatus" onclick="statusPage()">●<br>Status</button>
 <button id="navSettings" onclick="settings()">⚙<br>Settings</button>
</div>

</div>

<script type="text/javascript">

/*
 YOUR CHAT
 Safe JavaScript (ES5). No ES6 syntax.
*/

var mode = "login";
var currentChatUser = null;

var FALLBACK_AVATAR = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='50' fill='%23102d4d'/%3E%3Ccircle cx='50' cy='38' r='20' fill='%23238cff'/%3E%3Cellipse cx='50' cy='90' rx='32' ry='25' fill='%23238cff'/%3E%3C/svg%3E";

var demoUsers = [
 { uid:"U1001", username:"Ali", online:true, avatar:FALLBACK_AVATAR },
 { uid:"U1002", username:"Aisha", online:true, avatar:FALLBACK_AVATAR },
 { uid:"U1003", username:"Zoha", online:true, avatar:FALLBACK_AVATAR },
 { uid:"U1004", username:"Hassan", online:true, avatar:FALLBACK_AVATAR },
 { uid:"U1005", username:"Nimra", online:true, avatar:FALLBACK_AVATAR },
 { uid:"U1006", username:"Usman", online:false, avatar:FALLBACK_AVATAR }
];

var demoMessages = [
 { uid:"U1001", username:"Ali", text:"Hello everyone! 👋", time:"12:42" },
 { uid:"U1002", username:"Aisha", text:"Good morning ☀️", time:"12:41" },
 { uid:"U1003", username:"Zoha", text:"Koi new friend banao yaar 😄", time:"12:38" },
 { uid:"U1004", username:"Hassan", text:"Nice pic!", time:"12:35" },
 { uid:"U1005", username:"Nimra", text:"Welcome all 😊", time:"12:30" },
 { uid:"U1006", username:"Usman", text:"Kya haal hai?", time:"12:20" }
];

var groupsData = [
 { id:"G1001", name:"Friends Group", memberIds:["U1001","U1002","U1003","U1004"] }
];

var me = {
 uid:"LOCAL_USER",
 username:"Malik",
 online:true,
 avatar:FALLBACK_AVATAR
};

var BAD_WORDS = ["badword1", "badword2"];

function $(id){ return document.getElementById(id); }

function esc(v){
 v = String(v || "");
 return v.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function avatar(user){
 if(user && user.avatar){ return user.avatar; }
 return FALLBACK_AVATAR;
}

function findUser(uid){
 var i;
 if(uid === me.uid){ return me; }
 for(i=0; i<demoUsers.length; i++){
  if(demoUsers[i].uid === uid){ return demoUsers[i]; }
 }
 return { uid:uid, username:"User", online:false, avatar:FALLBACK_AVATAR };
}

function timeNow(){
 var d = new Date();
 var h = d.getHours();
 var m = d.getMinutes();
 if(h < 10){ h = "0" + h; }
 if(m < 10){ m = "0" + m; }
 return h + ":" + m;
}

function onlineCount(){
 var count = 0;
 var i;
 for(i=0; i<demoUsers.length; i++){
  if(demoUsers[i].online){ count++; }
 }
 if(me.online){ count++; }
 return count;
}

function setNav(name){
 var ids = ["navHome", "navWorld", "navUsers", "navStatus", "navSettings"];
 var i, el;
 for(i=0; i<ids.length; i++){
  el = $(ids[i]);
  if(el){ el.className = ""; }
 }
 el = $("nav" + name);
 if(el){ el.className = "active"; }
}

function containsAbusiveWord(text){
 var lower = String(text || "").toLowerCase();
 var i;
 for(i=0; i<BAD_WORDS.length; i++){
  if(lower.indexOf(BAD_WORDS[i].toLowerCase()) !== -1){
   return true;
  }
 }
 return false;
}

function showNotice(text, warning){
 var old = $("noticeBox");
 if(old && old.parentNode){ old.parentNode.removeChild(old); }
 var box = document.createElement("div");
 box.id = "noticeBox";
 box.className = "notice " + (warning ? "warning" : "success");
 box.innerHTML = esc(text);
 var mainEl = $("main");
 if(mainEl && mainEl.firstChild){
  mainEl.insertBefore(box, mainEl.firstChild);
 }
 window.setTimeout(function(){
  if(box && box.parentNode){ box.parentNode.removeChild(box); }
 }, 4000);
}

/* HARD SAFE FALLBACK LOADING SCREEN */
function dismissLoading(){
 var loading = $("loading");
 if(loading){ loading.className = "hide"; }
 var auth = $("auth");
 if(auth){ auth.className = ""; }
 try{
  var saved = localStorage.getItem("yourchat_username");
  if(saved && $("username")){ $("username").value = saved; }
 }catch(e){}
}

window.setTimeout(dismissLoading, 1500);

/* AUTH */
function authMode(type){
 mode = type;
 $("loginTab").className = (type === "login" ? "tab active" : "tab");
 $("createTab").className = (type === "create" ? "tab active" : "tab");
 $("authBtn").innerHTML = (type === "login" ? "Login" : "Create Account");
 $("authStatus").innerHTML = "";
}

function validUsername(name){
 return /^[A-Za-z0-9_]{3,24}$/.test(name);
}

function authAction(){
 var name = $("username").value.trim();
 var pass = $("password").value;

 if(!validUsername(name)){
  $("authStatus").innerHTML = "Username 3-24 letters, numbers or _ only.";
  return;
 }
 if(pass.length < 6){
  $("authStatus").innerHTML = "Password must be 6 characters or more.";
  return;
 }

 me.username = name;
 try{ localStorage.setItem("yourchat_username", name); }catch(e){}

 $("headerName").innerHTML = esc(name);
 $("auth").className = "hide";
 $("app").className = "";

 home();
}

/* HOME */
function home(){
 setNav("Home");
 $("main").innerHTML = 
 '<div class="card">'+
 '<div class="demo-badge">FRONTEND / LOCAL DEMO</div>'+
 '<div class="topTitle">'+
 '<img class="avatar" src="' + avatar(me) + '" onerror="this.src=\''+FALLBACK_AVATAR+'\'">'+
 '<div style="display:inline-block;vertical-align:middle;margin-left:8px">'+
 '<b>Welcome, ' + esc(me.username) + ' 👋</b>'+
 '<div class="small">Your Chat is ready</div>'+
 '</div></div>'+
 '<div>'+
 menuButton("🌍 World Chat", "Text + @mentions only", "worldChat()")+
 menuButton('<span class="grn">●</span> Online Users', onlineCount() + " users online", "onlineUsers()")+
 menuButton("👤 All Users", "Username + ID + status", "allUsers()")+
 menuButton("💬 Private Chat", "Friends / approved users", "privateInfo()")+
 menuButton("👥 Group Chat", "Members + messages", "groups()")+
 menuButton("● Status", "Text, image, video", "statusPage()")+
 menuButton("🔔 Notifications", "Messages & mentions", "notifications()")+
 menuButton("⚙️ Settings", "Account & privacy", "settings()")+
 '</div></div>'+
 '<div class="card">'+
 '<b><span class="grn">●</span> Online now</b> <span class="badge">' + onlineCount() + '</span>'+
 '<p class="small">World Chat: text + @mentions only.</p>'+
 '</div>'+
 '<div class="card">'+
 '<b>🔒 Current Build Status</b>'+
 '<p class="small">KaiOS ES5 Frontend Test Build. Firebase Cloud backend is currently in restricted demo mode.</p>'+
 '</div>'+
 '<button class="btn red" onclick="logout()">Log Out</button>';
}

function menuButton(title, small, action){
 return '<button class="menuBtn" onclick="' + action + '"><strong>' + title + '</strong><small>' + small + '</small></button>';
}

/* WORLD CHAT */
function worldChat(){
 setNav("World");
 $("main").innerHTML = 
 '<button class="btn alt back" onclick="home()">← Home</button>'+
 '<div class="card">'+
 '<div class="topTitle"><b>🌍 World Chat</b> <span class="badge"><span class="grn">●</span> ' + onlineCount() + '</span></div>'+
 '<div id="worldMessages" class="chatBox"></div>'+
 '<div class="chatInput">'+
 '<textarea id="worldText" maxlength="1000" placeholder="Type a message..."></textarea>'+
 '<button class="btn send" onclick="sendWorld()">➤</button>'+
 '</div>'+
 '<div class="tools">'+
 '<button class="tool" onclick="mentionPicker()">@ Mention</button>'+
 '<button class="tool" onclick="worldRules()">World Rules</button>'+
 '</div>'+
 '<div class="small" style="margin-top:7px">Latest 15 shown • Old messages stay saved.</div>'+
 '</div>';

 renderWorld();
}

function renderWorld(){
 var box = $("worldMessages");
 if(!box){ return; }
 box.innerHTML = "";
 var start = demoMessages.length - 15;
 if(start < 0){ start = 0; }
 var i;
 for(i = start; i < demoMessages.length; i++){
  var m = demoMessages[i];
  var u = findUser(m.uid);
  var div = document.createElement("div");
  div.className = "message " + (m.uid === me.uid ? "mine" : "other");
  var text = esc(m.text).replace(/@([A-Za-z0-9_]+)/g, '<span class="mention">@$1</span>');
  div.innerHTML = 
   '<img class="messageAvatar" src="' + avatar(u) + '" onerror="this.src=\''+FALLBACK_AVATAR+'\'">'+
   '<div class="bubble"><b>' + esc(m.username) + '</b><br>' + text + '<small>' + esc(m.time) + '</small></div>';
  box.appendChild(div);
 }
 box.scrollTop = box.scrollHeight;
}

function sendWorld(){
 var input = $("worldText");
 if(!input){ return; }
 var text = input.value.trim();
 if(!text){ return; }
 if(containsAbusiveWord(text)){
  showNotice("Message blocked. Abusive words are not allowed.", true);
  return;
 }
 demoMessages.push({ uid: me.uid, username: me.username, text: text, time: timeNow() });
 input.value = "";
 renderWorld();
}

function worldRules(){ showNotice("World Chat: Text + @mentions. Anti-spam active."); }

function mentionPicker(){
 var online = [];
 var i;
 for(i=0; i<demoUsers.length; i++){
  if(demoUsers[i].online){ online.push(demoUsers[i]); }
 }
 $("main").innerHTML = 
  '<button class="btn alt back" onclick="worldChat()">← World Chat</button>'+
  '<div class="card"><b>@ Select Online User</b><div id="mentionList"></div></div>';

 var list = $("mentionList");
 for(i=0; i<online.length; i++){
  var u = online[i];
  list.innerHTML += 
   '<div class="userRow">'+
   '<img class="avatar" src="' + avatar(u) + '" onerror="this.src=\''+FALLBACK_AVATAR+'\'">'+
   '<div class="userInfo"><b>' + esc(u.username) + '</b><small><span class="dot"></span> Online</small></div>'+
   '<button class="btn miniBtn" onclick="insertMention(\'' + esc(u.username) + '\')">Select</button>'+
   '</div>';
 }
}

function insertMention(name){
 worldChat();
 window.setTimeout(function(){
  var box = $("worldText");
  if(box){ box.value = "@" + name + " "; box.focus(); }
 }, 50);
}

/* USERS */
function onlineUsers(){ showUsers(false); }
function allUsers(){ showUsers(true); }

function showUsers(all){
 setNav("Users");
 var list = [];
 var i;
 for(i=0; i<demoUsers.length; i++){
  if(all || demoUsers[i].online){ list.push(demoUsers[i]); }
 }
 if(me.online){ list.push(me); }

 $("main").innerHTML = 
  '<button class="btn alt back" onclick="home()">← Home</button>'+
  '<div class="card">'+
  '<div class="topTitle"><b>' + (all ? "👤 All Users" : '<span class="grn">●</span> Online Users') + '</b> <span class="badge">' + list.length + '</span></div>'+
  '<input id="userSearch" class="search" placeholder="Search users...">'+
  '<div id="userList"></div>'+
  '</div>';

 $("userSearch").onkeyup = function(){ filterUsers($("userSearch").value, all); };
 renderUsers(list);
}

function renderUsers(list){
 var box = $("userList");
 if(!box){ return; }
 box.innerHTML = "";
 var i;
 for(i=0; i<list.length; i++){
  var u = list[i];
  var row = document.createElement("div");
  row.className = "userRow";
  var button = "";
  if(u.uid !== me.uid){
   button = '<button class="btn miniBtn" onclick="privateChat(\'' + u.uid + '\')">Chat</button>';
  }
  row.innerHTML = 
   '<img class="avatar" src="' + avatar(u) + '" onerror="this.src=\''+FALLBACK_AVATAR+'\'">'+
   '<div class="userInfo">'+
   '<b>' + esc(u.username) + (u.uid === me.uid ? " (You)" : "") + '</b>'+
   '<small>ID: ' + esc(u.uid) + '</small>'+
   '<small><span class="dot ' + (u.online ? "" : "offline") + '"></span> ' + (u.online ? "Online" : "Offline") + '</small>'+
   '</div>' + button;
  box.appendChild(row);
 }
}

function filterUsers(q, all){
 var source = [];
 var i;
 for(i=0; i<demoUsers.length; i++){
  if(all || demoUsers[i].online){ source.push(demoUsers[i]); }
 }
 if(me.online){ source.push(me); }
 q = String(q || "").toLowerCase();
 var result = [];
 for(i=0; i<source.length; i++){
  if(source[i].username.toLowerCase().indexOf(q) !== -1){ result.push(source[i]); }
 }
 renderUsers(result);
}

function privateChat(uid){
 currentChatUser = findUser(uid);
 $("main").innerHTML = 
  '<button class="btn alt back" onclick="allUsers()">← Users</button>'+
  '<div class="card">'+
  '<div class="topTitle">'+
  '<img class="avatar" src="' + avatar(currentChatUser) + '" onerror="this.src=\''+FALLBACK_AVATAR+'\'">'+
  '<div style="display:inline-block;vertical-align:middle;margin-left:8px">'+
  '<b>' + esc(currentChatUser.username) + '</b>'+
  '<div class="small">ID: ' + esc(currentChatUser.uid) + '</div>'+
  '</div></div>'+
  '<div id="privateMessages" class="chatBox">'+
  '<div class="message other"><div class="bubble">Hi! Kaise ho? 😊<small>12:40</small></div></div>'+
  '</div>'+
  '<div class="chatInput">'+
  '<textarea id="privateText" maxlength="1000" placeholder="Private message..."></textarea>'+
  '<button class="btn send" onclick="sendPrivate()">➤</button>'+
  '</div>'+
  '<div class="tools">'+
  '<button class="tool" onclick="fakeMedia(\'image\')">🖼 Image</button>'+
  '<button class="tool" onclick="fakeMedia(\'video\')">🎥 Video</button>'+
  '<button class="tool" onclick="reactionPicker()">❤️ React</button>'+
  '</div>'+
  '</div>';
}

function sendPrivate(){
 var box = $("privateText");
 if(!box){ return; }
 var text = box.value.trim();
 if(!text){ return; }
 var area = $("privateMessages");
 area.innerHTML += '<div class="message mine"><div class="bubble">' + esc(text) + '<small>' + timeNow() + '</small></div></div>';
 box.value = "";
 area.scrollTop = area.scrollHeight;
}

function reactionPicker(){ showNotice("Reactions: ❤️ 👍 😂 😢 😮"); }

 location.reload();
}
