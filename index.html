<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Chat</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#eef3ff;color:#18223a}.app{max-width:760px;margin:auto;height:100vh;background:#f7f9ff;display:flex;flex-direction:column}.top{padding:14px;background:linear-gradient(90deg,#245df5,#6b43e8);color:#fff;display:flex;justify-content:space-between;align-items:center}.top b{font-size:22px}.top button,.btn{border:0;border-radius:13px;padding:10px 14px;background:#edf3ff;color:#245df5}.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-bottom:1px solid #ddd}.tabs button{border:0;background:#fff;padding:12px 4px;color:#536078}.tabs .on{color:#245df5;font-weight:bold;border-bottom:3px solid #245df5}.page{flex:1;overflow:auto}.pad{padding:12px}.card{background:#fff;border:1px solid #e0e6f0;border-radius:17px;padding:12px;margin:9px 0}.world{background:linear-gradient(135deg,#173273,#315eff);color:#fff;border-radius:19px;padding:17px}.chat{height:100%;display:flex;flex-direction:column}.head{background:#fff;padding:10px 12px;border-bottom:1px solid #ddd;display:flex;gap:10px;align-items:center}.msgs{flex:1;overflow:auto;padding:13px;background:#f0f4ff}.msg{max-width:82%;padding:9px 12px;margin:7px 0;background:#fff;border-radius:16px;box-shadow:0 2px 6px #0001}.mine{margin-left:auto;background:linear-gradient(135deg,#2c62ef,#5a48e8);color:#fff}.meta{font-size:10px;opacity:.65;margin-top:4px}.media{max-width:100%;border-radius:12px}.compose{display:flex;gap:7px;padding:9px;background:#fff;border-top:1px solid #ddd}.compose input{flex:1;min-width:0;padding:13px;border:1px solid #d5ddea;border-radius:18px}.circle{width:44px;height:44px;border:0;border-radius:50%;background:#edf3ff;color:#245df5;font-size:18px}.send{background:#245df5;color:#fff}.file{width:44px;height:44px;border-radius:50%;background:#edf3ff;display:flex;align-items:center;justify-content:center;color:#245df5}.file input{display:none}.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#22b9ff,#6948ed);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold}.grow{flex:1}.small{font-size:12px;opacity:.7}.empty{text-align:center;padding:50px 10px;color:#657188}.auth{height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#14264f,#2969ff);padding:18px}.box{width:min(420px,100%);padding:25px;border-radius:25px;background:#ffffff18;color:#fff;text-align:center}.box input{width:100%;padding:14px;margin:6px 0;border:0;border-radius:14px}.box button{width:100%;padding:14px;margin-top:8px;border:0;border-radius:14px;font-weight:bold}.primary{background:#20aef5;color:#fff}.secondary{background:#ffffff22;color:#fff;border:1px solid #fff}.hidden{display:none}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:5}.modal>div{width:min(760px,100%);background:#fff;border-radius:22px 22px 0 0;padding:18px;max-height:85vh;overflow:auto}.warn{color:#c6283d}.online{color:#13a85b;font-weight:bold}@media(min-width:700px){.app{box-shadow:0 0 35px #0002}}
</style></head><body>
<div id="auth" class="auth"><div class="box"><div style="font-size:50px">💬</div><h1>Your Chat</h1><p>Chat • Connect • World</p><input id="name" placeholder="Username (letters, numbers, _)"><input id="pass" type="password" placeholder="Password"><button class="primary" id="signup">Create Account</button><button class="secondary" id="login">Login</button><p id="err"></p></div></div>
<div id="app" class="app hidden"><div class="top"><div><b>💬 Your Chat</b><div id="who" class="small"></div></div><button id="logout">Logout</button></div><div class="tabs"><button data-p="home" class="on">🏠 Home</button><button data-p="world">🌍 World</button><button data-p="users">🟢 Users</button><button data-p="profile">👤 Profile</button></div><div id="page" class="page"></div></div>
<div id="modal" class="modal hidden"><div id="modalBody"></div></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,updateProfile}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';import{getFirestore,collection,doc,setDoc,getDoc,addDoc,updateDoc,getDocs,query,orderBy,onSnapshot,serverTimestamp,limit}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';import{getStorage,ref,uploadBytes,getDownloadURL}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js';
const firebaseConfig={apiKey:'AIzaSyCvVgz-mghugvBkv0j9j9SytQKFHA30L9w',authDomain:'your-chat-e1ec1.firebaseapp.com',projectId:'your-chat-e1ec1',storageBucket:'your-chat-e1ec1.firebasestorage.app',messagingSenderId:'98625581549',appId:'1:98625581549:web:870a7f17350c85cac877e4',measurementId:'G-N3CKRTR8TQ'};const A=initializeApp(firebaseConfig),auth=getAuth(A),db=getFirestore(A),storage=getStorage(A);const OWNER='Malik_Talha';let me=null,chatUser=null,worldStop=null,privateStop=null;const $=x=>document.getElementById(x),email=n=>n.toLowerCase()+'@yourchat.local',safe=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
$('signup').onclick=async()=>{let n=$('name').value.trim(),p=$('pass').value;if(!/^[A-Za-z0-9_]{3,24}$/.test(n))return $('err').textContent='Username mein English letters, numbers aur _ use karein.';if(p.length<6)return $('err').textContent='Password 6 characters ya zyada rakhein.';try{let c=await createUserWithEmailAndPassword(auth,email(n),p);await updateProfile(c.user,{displayName:n});await setDoc(doc(db,'users',c.user.uid),{uid:c.user.uid,username:n,usernameLower:n.toLowerCase(),status:'Hello! I am using Your Chat.',online:true,lastSeen:serverTimestamp(),warnings:0,banUntil:0,createdAt:serverTimestamp()})}catch(e){$('err').textContent=e.message}};
$('login').onclick=async()=>{try{await signInWithEmailAndPassword(auth,email($('name').value.trim()),$('pass').value)}catch(e){$('err').textContent=e.message}};$('logout').onclick=()=>signOut(auth);document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>page(b.dataset.p));
async function users(){let s=await getDocs(collection(db,'users'));return s.docs.map(d=>d.data())}function online(u){return u.online&&u.lastSeen?.toDate&&(Date.now()-u.lastSeen.toDate().getTime()<70000)}function cid(a,b){return[a,b].sort().join('_')}function time(t){return t?.toDate?t.toDate().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):''}
function page(p){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));if(p==='home')home();if(p==='world')world();if(p==='users')userPage();if(p==='profile')profile()}
async function home(){let us=await users();$('page').innerHTML='<div class="pad"><div class="world"><h2>🌍 World Chat</h2><div>Sab users ke saath public group</div><button class="btn" id="ow">Open World Chat</button></div><h3>🟢 Online Users</h3><div id="list"></div></div>';$('ow').onclick=()=>page('world');let box=$('list');us.filter(u=>u.uid!==me.uid&&online(u)).forEach(u=>{let c=document.createElement('div');c.className='card';c.innerHTML=`<div class="head"><div class="avatar">${safe(u.username?.[0])}</div><div class="grow"><b>${safe(u.username)}</b><div class="small online">● Online</div></div><button class="btn">Private</button></div>`;c.onclick=()=>privateChat(u.uid);box.appendChild(c)})}
function world(){if(worldStop)worldStop();$('page').innerHTML='<div class="chat"><div class="head"><div class="avatar">🌍</div><div class="grow"><b>World Chat</b><div class="small">Public group • mention with @username</div></div><button class="btn" id="rules">Rules</button></div><div id="msgs" class="msgs"><div class="empty">Loading...</div></div><div class="compose"><label class="file">📎<input id="wf" type="file" accept="image/*,video/*"></label><input id="wi" placeholder="Message likhein... @mention"><button id="ws" class="circle send">➤</button></div></div>';$('rules').onclick=()=>modal('<h3>🌍 World Chat Rules</h3><p>Respect • No spam • No harassment • No threats • No inappropriate content</p><button class="btn" onclick="closeModal()">OK</button>');$('ws').onclick=sendWorld;$('wi').onkeydown=e=>{if(e.key==='Enter')sendWorld()};$('wf').onchange=e=>media(e.target.files[0],true);let q=query(collection(db,'worldMessages'),orderBy('createdAt','asc'),limit(200));worldStop=onSnapshot(q,s=>{let b=$('msgs');if(!b)return;b.innerHTML='';s.forEach(d=>draw(b,{id:d.id,...d.data()}));b.scrollTop=b.scrollHeight})}
function draw(box,m){let e=document.createElement('div');e.className='msg '+(m.uid===me.uid?'mine':'');let body=m.type==='image'?`<img class="media" src="${safe(m.url)}">`:m.type==='video'?`<video class="media" controls playsinline src="${safe(m.url)}"></video>`:safe(m.text);e.innerHTML=`<b>${m.uid===me.uid?'You':safe(m.username)}</b><div>${body}</div><div class="meta">${time(m.createdAt)} ${m.uid===me.uid?'✓✓':''}</div>`;if(m.uid!==me.uid&&me.displayName?.toLowerCase()===OWNER.toLowerCase())e.onclick=()=>moderate(m.uid,m.username);box.appendChild(e)}
async function sendWorld(){let i=$('wi'),t=i.value.trim();if(!t)return;let u=(await getDoc(doc(db,'users',me.uid))).data()||{};if(u.banUntil>Date.now())return alert('Aap temporarily banned hain.');await addDoc(collection(db,'worldMessages'),{uid:me.uid,username:me.displayName,text:t,type:'text',createdAt:serverTimestamp()});i.value=''}
async function media(file,isWorld){if(!file)return;if(file.size>25*1024*1024)return alert('Image/video 25MB se chhoti rakhein.');try{let type=file.type.startsWith('video/')?'video':'image',r=ref(storage,`chatMedia/${me.uid}/${Date.now()}_${file.name}`);await uploadBytes(r,file);let url=await getDownloadURL(r);let data={uid:me.uid,username:me.displayName,type,url,createdAt:serverTimestamp()};if(isWorld)await addDoc(collection(db,'worldMessages'),data);else await addDoc(collection(db,'chats',cid(me.uid,chatUser.uid),'messages'),data)}catch(e){alert('Upload error: '+e.message)}}
async function userPage(){let us=await users();$('page').innerHTML='<div class="pad"><input id="search" class="search" placeholder="🔎 Search username..."><div id="ul"></div></div>';let b=$('ul');us.filter(u=>u.uid!==me.uid).forEach(u=>{let c=document.createElement('div');c.className='card';c.innerHTML=`<div class="head"><div class="avatar">${safe(u.username?.[0])}</div><div class="grow"><b>${safe(u.username)}</b><div class="small">${online(u)?'🟢 Online':'⚪ Offline'} • ${safe(u.status)}</div></div></div>`;c.onclick=()=>privateChat(u.uid);b.appendChild(c)});$('search').oninput=e=>b.querySelectorAll('.card').forEach(c=>c.style.display=c.innerText.toLowerCase().includes(e.target.value.toLowerCase())?'block':'none')}
async function privateChat(uid){let us=await users();chatUser=us.find(u=>u.uid===uid);if(!chatUser)return;$('page').innerHTML=`<div class="chat"><div class="head"><button class="btn" id="back">←</button><div class="avatar">${safe(chatUser.username?.[0])}</div><div class="grow"><b>${safe(chatUser.username)}</b><div class="small">${online(chatUser)?'🟢 Online':'⚪ Offline'}</div></div></div><div id="pm" class="msgs"></div><div class="compose"><label class="file">📎<input id="pf" type="file" accept="image/*,video/*"></label><input id="pi" placeholder="Message likhein..."><button id="ps" class="circle send">➤</button></div></div>`;$('back').onclick=()=>page('users');$('ps').onclick=sendPrivate;$('pi').onkeydown=e=>{if(e.key==='Enter')sendPrivate()};$('pf').onchange=e=>media(e.target.files[0],false);if(privateStop)privateStop();let q=query(collection(db,'chats',cid(me.uid,uid),'messages'),orderBy('createdAt','asc'),limit(200));privateStop=onSnapshot(q,s=>{let b=$('pm');b.innerHTML='';s.forEach(d=>draw(b,{id:d.id,...d.data()}));b.scrollTop=b.scrollHeight})}
async function sendPrivate(){let i=$('pi'),t=i.value.trim();if(!t)return;await addDoc(collection(db,'chats',cid(me.uid,chatUser.uid),'messages'),{uid:me.uid,username:me.displayName,text:t,type:'text',createdAt:serverTimestamp()});i.value=''}
async function profile(){let u=(await getDoc(doc(db,'users',me.uid))).data()||{};$('page').innerHTML=`<div class="pad"><div class="card" style="text-align:center"><div class="avatar" style="margin:auto;width:75px;height:75px">${safe(me.displayName?.[0])}</div><h2>${safe(me.displayName)}</h2><div class="small">@${safe(me.displayName?.toLowerCase())}</div></div><div class="card"><b>📝 Status</b><p>${safe(u.status)}</p><button class="btn" id="es">Edit Status</button></div><div class="card"><b>⚙️ Settings</b><p class="small">Mute, block, notifications aur privacy options.</p><button class="btn" onclick="settings()">Open Settings</button></div>${me.displayName?.toLowerCase()===OWNER.toLowerCase()?'<div class="card"><b>👑 Owner</b><p>World Chat moderation</p><button class="btn" onclick="ownerHelp()">Moderation</button></div>':''}</div>`;$('es').onclick=()=>{modal('<h3>📝 Status</h3><input id="st" maxlength="100" placeholder="Apna status likhein"><button class="btn" id="save">Save</button>');$('save').onclick=async()=>{await updateDoc(doc(db,'users',me.uid),{status:$('st').value.trim()});closeModal();profile()}}}
function moderate(uid,name){modal(`<h3>🛡️ ${safe(name)}</h3><button class="btn warn" id="w">⚠️ Warning</button><button class="btn" id="b">⛔ 5 Minute Ban</button><button class="btn" onclick="closeModal()">Cancel</button>`);$('w').onclick=async()=>{let d=await getDoc(doc(db,'users',uid)),u=d.data()||{},n=(u.warnings||0)+1;if(n>=3)await updateDoc(doc(db,'users',uid),{warnings:n,banUntil:Date.now()+300000});else await updateDoc(doc(db,'users',uid),{warnings:n});closeModal();alert(n>=3?'3 warnings complete: 5 minute ban.':`Warning ${n}/3`)};$('b').onclick=async()=>{await updateDoc(doc(db,'users',uid),{banUntil:Date.now()+300000});closeModal();alert('5 minute ban applied')}}function settings(){modal('<h3>⚙️ Settings</h3><p>Notifications • Privacy • Mute • Block • Dark/Light mode</p><button class="btn" onclick="closeModal()">Done</button>')}function ownerHelp(){modal('<h3>👑 Owner Moderation</h3><p>World Chat mein kisi user ke message par tap karke warning ya 5-minute ban de sakte ho.</p><button class="btn" onclick="closeModal()">OK</button>')}function modal(x){$('modal').classList.remove('hidden');$('modal').firstElementChild.innerHTML=x}function closeModal(){$('modal').classList.add('hidden')}window.closeModal=closeModal;window.settings=settings;window.ownerHelp=ownerHelp;
onAuthStateChanged(auth,async u=>{if(!u){$('auth').classList.remove('hidden');$('app').classList.add('hidden');return}me=u;$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent='@'+u.displayName;await updateDoc(doc(db,'users',u.uid),{online:true,lastSeen:serverTimestamp()}).catch(()=>{});page('home');setInterval(()=>updateDoc(doc(db,'users',u.uid),{online:true,lastSeen:serverTimestamp()}).catch(()=>{}),30000)});
</script></body></html>
