<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050b16">
<title>Your Chat</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#050b16;color:#eef8ff;font-family:Arial,sans-serif}
body{overflow:hidden}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hide{display:none!important}
#app{width:100%;height:100%;overflow:hidden}
.page{width:100%;height:100%;overflow:hidden;background:linear-gradient(180deg,#071323,#02060d)}
.scroll{height:100%;overflow:auto}
.wrap{width:100%;max-width:520px;margin:auto;padding:12px}
.logo{text-align:center;font-size:30px;font-weight:900;color:#49cfff;text-shadow:0 0 15px rgba(73,207,255,.45);margin:14px 0 20px}
.card{background:rgba(8,22,39,.97);border:1px solid #16476c;border-radius:18px;padding:14px;box-shadow:0 0 22px rgba(0,174,255,.08)}
.title{font-size:20px;font-weight:800;color:#82ddff;margin:3px 0 12px}
.sub{font-size:12px;color:#91aac0}
.input{width:100%;padding:12px 13px;margin:6px 0;background:#061221;color:#fff;border:1px solid #235073;border-radius:12px;outline:0}
.input:focus{border-color:#28c2ff;box-shadow:0 0 10px rgba(40,194,255,.14)}
.btn{width:100%;padding:12px;margin:6px 0;background:linear-gradient(135deg,#0a426b,#0785ba);border:1px solid #25bfff;border-radius:12px;color:#fff;font-weight:800}
.btn.secondary{background:#091827;border-color:#245277}
.btn.danger{background:#451827;border-color:#a33a50}
.btn.small{width:auto;padding:7px 9px;font-size:11px}
.row{display:flex;align-items:center;gap:9px}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top{height:54px;display:flex;align-items:center;gap:8px;padding:8px;background:#071525;border-bottom:1px solid #16476c}
.back{width:38px;height:38px;border-radius:50%;background:#091b2e;border:1px solid #245277;color:#fff;font-size:22px}
.topTitle{flex:1;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{height:calc(100% - 54px);overflow:hidden}
.mainScroll{height:100%;overflow:auto;padding-bottom:15px}
.menuBtn{width:100%;padding:16px 15px;margin:7px 0;text-align:left;background:linear-gradient(135deg,#091a2d,#07111e);border:1px solid #1b466b;border-radius:14px;color:#fff;font-weight:800;font-size:15px}
.avatar{width:43px;height:43px;border-radius:50%;object-fit:cover;background:#102b44;border:1px solid #285a7d;flex:none}
.avatar.big{width:62px;height:62px}
.userRow{display:flex;align-items:center;gap:10px;padding:10px 5px;border-bottom:1px solid rgba(39,82,115,.45)}
.userInfo{flex:1;min-width:0}
.userName{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:11px;color:#8ba6bd;margin-top:3px}
.online{color:#20f48b}
.offline{color:#73879a}
.search{margin:9px 0}
.msgList{height:calc(100% - 132px);overflow:auto;padding:10px 10px 15px}
.msg{display:flex;gap:7px;max-width:92%;margin:8px 0}
.msg.mine{margin-left:auto;flex-direction:row-reverse}
.bubble{background:#091a2d;border:1px solid #194262;border-radius:14px;padding:9px 10px;min-width:70px;word-break:break-word}
.mine .bubble{background:#063b5d;border-color:#126d99}
.nm{font-size:10px;color:#75d8ff;font-weight:800}
.t{font-size:9px;color:#87a4bb;margin-top:5px}
.actions{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.actions button{padding:4px 7px;border-radius:7px;background:#071524;border:1px solid #214c70;color:#fff;font-size:9px}
.replyPreview{border-left:3px solid #2ac6ff;background:#061422;padding:5px 7px;border-radius:6px;font-size:10px;color:#9ec5dd;margin-bottom:6px}
.media{max-width:100%;max-height:240px;border-radius:9px;margin-top:5px}
.typing{font-size:11px;color:#4fd0ff;padding:2px 8px;min-height:15px}
.chatBottom{height:78px;padding:7px;background:#06101d;border-top:1px solid #173f61}
.chatInput{display:flex;gap:5px;align-items:center}
.chatInput .input{flex:1;margin:0}
.icon{width:37px;height:37px;border-radius:9px;background:#091a2d;border:1px solid #245277;color:#fff;padding:0}
.send{background:#087eaf;border-color:#27c4ff}
.notice{padding:10px;border:1px solid #194667;background:#07192b;color:#9dc5dd;border-radius:10px;font-size:12px;margin:8px 0}
.empty{text-align:center;color:#718ba2;padding:25px 10px;font-size:13px}
.profile{text-align:center;padding:15px}
.profile .avatar{margin:auto}
.info{font-size:12px;line-height:1.6;color:#a5bfd1}
.statusCard{background:#091b2e;border:1px solid #1a466b;border-radius:14px;padding:12px;margin:8px 0}
.statusActions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.statusActions button{padding:7px 9px;border-radius:9px;background:#071525;border:1px solid #245277;color:#fff;font-size:11px}
.toast{position:fixed;left:5%;right:5%;bottom:18px;background:#0a2339;border:1px solid #29c5ff;color:#fff;padding:10px;border-radius:12px;text-align:center;z-index:99}
.mentionBox{position:absolute;left:8px;right:8px;bottom:85px;max-height:210px;overflow:auto;background:#071525;border:1px solid #27bfff;border-radius:12px;z-index:20}
.check{font-size:12px;color:#a8c1d3}
hr{border:0;border-top:1px solid #19415f;margin:12px 0}
.splash{text-align:center;padding-top:28vh}
.loader{width:36px;height:36px;border:3px solid #17425e;border-top-color:#25c9ff;border-radius:50%;margin:28px auto 10px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rd{color:#71dfff;font-size:9px}
.statusTabs{display:flex;gap:5px;margin-bottom:8px}
.statusTabs button{flex:1;padding:9px 5px;border:1px solid #245277;background:#071525;color:#fff;border-radius:9px;font-size:10px}
.viewer{font-size:10px;color:#7ea0b8;margin-top:5px}
</style>
</head>
<body><div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
var firebaseConfig={
 apiKey:"AIzaSyAEqeB2YXk_2A9gZ41WQ_fNiBKiGnzYGc0",
 authDomain:"chit-chat-plus-7382b.firebaseapp.com",
 projectId:"chit-chat-plus-7382b",
 storageBucket:"chit-chat-plus-7382b.firebasestorage.app",
 messagingSenderId:"98837732974",
 appId:"1:98837732974:web:ff52d3868871c91518507f",
 measurementId:"G-T42H2N5Q0Z"
};

firebase.initializeApp(firebaseConfig);

var auth=firebase.auth(),db=firebase.firestore();

var CLOUDINARY_CLOUD_NAME="ptqrd8vc";
var CLOUDINARY_UPLOAD_PRESET="your_chat_upload";
var CLOUDINARY_UPLOAD_URL="https://api.cloudinary.com/v1_1/"+CLOUDINARY_CLOUD_NAME+"/auto/upload";

var me=null;
var currentPage="";
var currentPeer=null;
var currentChatId="";
var currentGroupId="";
var currentReply=null;
var listeners=[];
var users={};
var typingTimer=null;
var recording=null;
var recStream=null;
var recordChunks=[];
var recordSeconds=0;
var recInterval=null;
var pressTimer=null;

var notificationsOn=localStorage.getItem("yc_notifications")!=="0";
var soundOn=localStorage.getItem("yc_sound")!=="0";

function el(id){return document.getElementById(id)}

function esc(s){
 return String(s==null?"":s)
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

function ts(){
 return firebase.firestore.FieldValue.serverTimestamp();
}

function arrUnion(v){
 return firebase.firestore.FieldValue.arrayUnion(v);
}

function arrRemove(v){
 return firebase.firestore.FieldValue.arrayRemove(v);
}

function timeOf(t){
 if(!t||!t.toDate)return "";
 var d=t.toDate(),h=d.getHours(),m=d.getMinutes();
 var a=h>=12?"PM":"AM";
 h=h%12||12;
 return h+":"+(m<10?"0":"")+m+" "+a;
}

function toast(t){
 var x=document.createElement("div");
 x.className="toast";
 x.textContent=t;
 document.body.appendChild(x);
 setTimeout(function(){x.remove()},2600);
}

function clearListeners(){
 for(var i=0;i<listeners.length;i++){
  try{listeners[i]()}catch(e){}
 }
 listeners=[];
}

function listen(q,cb){
 var u=q.onSnapshot(cb,function(e){
  console.log(e);
  toast("Connection/database error.");
 });
 listeners.push(u);
 return u;
}

function safeName(n){
 return String(n||"").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,35)||"user";
}

function authEmail(n){
 return "user_"+safeName(n)+"@yourchat.local";
}

function isOnline(u){
 return !!(
  u&&
  u.online&&
  u.lastSeen&&
  u.lastSeen.toMillis&&
  Date.now()-u.lastSeen.toMillis()<90000
 );
}

function avatar(u,big){
 if(u&&u.avatar)
  return '<img class="avatar'+(big?" big":"")+'" src="'+esc(u.avatar)+'">';
 return '<div class="avatar'+(big?" big":"")+'"></div>';
}

function statusDot(u){
 return isOnline(u)
  ?'<span class="online">● Online</span>'
  :'<span class="offline">● Offline</span>';
}

function chatIdFor(a,b){
 return [a,b].sort().join("_");
}

function notifySound(){
 if(!soundOn)return;
 try{
  var C=window.AudioContext||window.webkitAudioContext;
  if(!C)return;
  var c=new C(),o=c.createOscillator(),g=c.createGain();
  o.frequency.value=880;
  g.gain.value=.035;
  o.connect(g);
  g.connect(c.destination);
  o.start();
  setTimeout(function(){
   o.stop();
   c.close();
  },180);
 }catch(e){}
}

function addNotification(to,type,text){
 if(!to||to===me.uid)return Promise.resolve();

 return db.collection("notifications").add({
  toUid:to,
  fromUid:me.uid,
  type:type,
  text:text,
  createdAt:ts()
 }).then(function(){
  notifySound();
 }).catch(function(){});
}

function stopAll(){
 clearListeners();

 if(typingTimer)
  clearTimeout(typingTimer);

 typingTimer=null;

 if(recInterval)
  clearInterval(recInterval);

 recInterval=null;
}

function render(h){
 el("app").innerHTML=h;
}

function shell(title,body,back){
 return '<div class="page">'+
 '<div class="top">'+
 (back?'<button class="back" onclick="goBack()">‹</button>':'')+
 '<div class="topTitle">'+esc(title)+'</div>'+
 '</div>'+
 '<div class="main">'+body+'</div>'+
 '</div>';
}

function scrollBody(body){
 return '<div class="mainScroll">'+body+'</div>';
}

function goBack(){
 if(currentPage==="privateChat")
  return showPrivate();

 if(currentPage==="groupChat")
  return showGroups();

 if(currentPage==="settings"||
    currentPage==="blocked"||
    currentPage==="notifications")
  return showPrivate();

 showHome();
}

function splash(){
 render(
 '<div class="page">'+
 '<div class="splash">'+
 '<div class="logo">Your Chat</div>'+
 '<div class="loader"></div>'+
 '<div class="sub">Loading...</div>'+
 '</div>'+
 '</div>'
 );

 setTimeout(function(){
  if(!auth.currentUser)loginPage();
 },900);
}

function loginPage(){
 currentPage="login";

 render(
 '<div class="page">'+
 '<div class="wrap">'+
 '<div class="logo">Your Chat</div>'+
 '<div class="card">'+
 '<div class="title">Welcome Back</div>'+
 '<div class="sub">Login to continue</div>'+
 '<input id="loginUser" class="input" placeholder="Username / Name">'+
 '<input id="loginPass" class="input" type="password" placeholder="Password">'+
 '<label class="check"><input id="remember" type="checkbox"> Remember Me</label>'+
 '<button class="btn" onclick="doLogin()">Login</button>'+
 '<button class="btn secondary" onclick="createAccountPage()">Create Account</button>'+
 '<button class="btn secondary" onclick="forgotPassword()">Forgot Password</button>'+
 '<div id="loginError" class="sub"></div>'+
 '</div>'+
 '</div>'+
 '</div>'
 );
}

function createAccountPage(){
 currentPage="create";

 render(
 '<div class="page">'+
 '<div class="wrap">'+
 '<div class="logo">Your Chat</div>'+
 '<div class="card">'+
 '<div class="title">Create Account</div>'+
 '<div class="sub">Join and start chatting</div>'+
 '<input id="createUser" class="input" placeholder="Username / Name">'+
 '<input id="createPass" class="input" type="password" placeholder="Password">'+
 '<input id="createPass2" class="input" type="password" placeholder="Confirm Password">'+
 '<button class="btn" onclick="doCreate()">Create Account</button>'+
 '<button class="btn secondary" onclick="loginPage()">Back</button>'+
 '<div id="createError" class="sub"></div>'+
 '</div>'+
 '</div>'+
 '</div>'
 );
}

function doLogin(){
 var u=(el("loginUser").value||"").trim();
 var p=el("loginPass").value||"";

 if(!u||!p){
  el("loginError").textContent="Enter username and password.";
  return;
 }

 auth.signInWithEmailAndPassword(authEmail(u),p)
 .then(function(){
  if(el("remember").checked)
   localStorage.setItem("yc_user",u);
  else
   localStorage.removeItem("yc_user");
 })
 .catch(function(e){
  el("loginError").textContent=e.message||"Login failed.";
 });
}

function doCreate(){
 var u=(el("createUser").value||"").trim();
 var p=el("createPass").value||"";
 var p2=el("createPass2").value||"";

 if(u.length<2){
  el("createError").textContent="Username is too short.";
  return;
 }

 if(p.length<6){
  el("createError").textContent="Password must be at least 6 characters.";
  return;
 }

 if(p!==p2){
  el("createError").textContent="Passwords do not match.";
  return;
 }

 auth.createUserWithEmailAndPassword(authEmail(u),p)
 .then(function(c){
  return db.collection("users").doc(c.user.uid).set({
   uid:c.user.uid,
   username:u,
   usernameLower:u.toLowerCase(),
   avatar:"",
   online:true,
   lastSeen:ts(),
   createdAt:ts()
  });
 })
 .catch(function(e){
  el("createError").textContent=e.message||"Account creation failed.";
 });
}

function forgotPassword(){
 alert(
  "This account uses username + password only, so there is no recovery email. "+
  "Use the correct password or create a new account."
 );
}

auth.onAuthStateChanged(function(u){
 if(!u){
  me=null;
  stopAll();
  loginPage();
  return;
 }

 db.collection("users").doc(u.uid).get()
 .then(function(d){
  if(d.exists)return d;

  return db.collection("users").doc(u.uid).set({
   uid:u.uid,
   username:"User",
   usernameLower:"user",
   avatar:"",
   online:true,
   lastSeen:ts(),
   createdAt:ts()
  }).then(function(){
   return db.collection("users").doc(u.uid).get();
  });
 })
 .then(function(d){
  me=d.data();
  me.uid=u.uid;

  return db.collection("users").doc(u.uid).set({
   online:true,
   lastSeen:ts()
  },{merge:true});
 })
 .then(function(){
  showHome();
  startPresence();
 })
 .catch(function(){
  toast("Profile load failed.");
 });
});

function startPresence(){
 clearInterval(window.ycPresence);

 window.ycPresence=setInterval(function(){
  if(auth.currentUser){
   db.collection("users")
   .doc(auth.currentUser.uid)
   .set({
    online:true,
    lastSeen:ts()
   },{merge:true})
   .catch(function(){});
  }
 },30000);
}

function showHome(){
 stopAll();
 currentPage="home";

 render(
 '<div class="page">'+
 '<div class="wrap">'+
 '<div class="logo">Your Chat</div>'+
 '<div class="card">'+
 '<button class="menuBtn" onclick="showWorld()">🌍 World Chat</button>'+
 '<button class="menuBtn" onclick="showPrivate()">💬 Private Chat</button>'+
 '<button class="menuBtn" onclick="showOnline()">🟢 Online Users</button>'+
 '<button class="menuBtn" onclick="showAbout()">ℹ️ About Chat</button>'+
 '</div>'+
 '</div>'+
 '</div>'
 );
}

function showAbout(){
 currentPage="about";

 var b=
 '<div class="wrap">'+
 '<div class="card info">'+

 '<b>World Chat</b><br>'+
 'Public chat with the latest 20 messages, online users, typing, @ mentions, reply, edit and delete.'+

 '<hr><b>Private Chat</b><br>'+
 'Search users, private messages, image, video and voice, reply, edit, delete, react, info and read status.'+

 '<hr><b>Status</b><br>'+
 'My Status, Friends Status and Other Users Status with text, image, video, audio, views and reactions.'+

 '<hr><b>Group Chat</b><br>'+
 'Create groups, search/add members, admin member control, text, image, video, voice, reply, edit, delete, info and mentions.'+

 '<hr><b>Online Users</b><br>'+
 'Sirf currently online users show hotay hain. User search karke Private Chat open kar saktay ho.'+

 '<hr><b>Settings</b><br>'+
 'Edit Profile, Notifications ON/OFF, Notification Sound ON/OFF, Block/Unblock, Blocked Users, Remove ID and Logout.'+

 '<hr><b>Notifications</b><br>'+
 'Private/group messages, group add, reactions, status activity, time and sound control.'+

 '</div>'+
 '</div>';

 render(shell("About Chat",scrollBody(b),true));
}

function showOnline(){
 currentPage="online";
 stopAll();

 render(
 shell(
  "Online Users",
  scrollBody(
   '<div class="wrap">'+
   '<input id="onlineSearch" class="input search" placeholder="Search User" oninput="filterOnline()">'+
   '<div id="onlineList" class="card">Loading...</div>'+
   '</div>'
  ),
  true
 )
 );

 listen(db.collection("users"),function(s){
  var a=[];

  s.forEach(function(d){
   var u=d.data();
   u.uid=d.id;

   if(u.uid!==me.uid&&isOnline(u))
    a.push(u);
  });

  window.ycOnline=a;
  drawOnline();
 });
}

function drawOnline(){
 var a=window.ycOnline||[];
 var q=(el("onlineSearch")&&el("onlineSearch").value||"").toLowerCase();

 a=a.filter(function(u){
  return !q||(u.username||"").toLowerCase().indexOf(q)>-1;
 });

 var h="";

 for(var i=0;i<a.length;i++){
  h+=
  '<div class="userRow" onclick="openPrivate(\''+a[i].uid+'\')">'+
  avatar(a[i])+
  '<div class="userInfo">'+
  '<div class="userName">'+esc(a[i].username)+'</div>'+
  '<div class="status online">● Online</div>'+
  '</div>'+
  '</div>';
 }

 el("onlineList").innerHTML=
  h||'<div class="empty">No online users found.</div>';
}

function filterOnline(){
 drawOnline();
}

function showWorld(){
 currentPage="world";
 stopAll();

 var body=
 '<div class="wrap" style="height:100%;padding:8px">'+
 '<div class="between" style="padding:4px 3px">'+
 '<b>World Chat</b>'+
 '<span id="worldCount" class="status"></span>'+
 '</div>'+
 '<div id="worldTyping" class="typing"></div>'+
 '<div id="worldMessages" class="msgList" style="height:calc(100% - 78px);padding:8px 2px">Loading...</div>'+
 '<div class="chatBottom" style="position:relative">'+
 '<div id="worldMentionList" class="mentionBox hide"></div>'+
 '<div class="chatInput">'+
 '<input id="worldInput" class="input" placeholder="Message or @mention" oninput="worldInputChanged()" onkeydown="if(event.key===\'Enter\'){event.preventDefault();worldTextSend()}">'+
 '<button class="icon send" onclick="worldTextSend()">➤</button>'+
 '</div>'+
 '</div>'+
 '</div>';

 render(shell("World Chat",body,true));

 listen(db.collection("users"),function(s){
  var n=0,a=[];

  s.forEach(function(d){
   var u=d.data();
   u.uid=d.id;

   if(isOnline(u))n++;

   if(isOnline(u)&&u.uid!==me.uid)
    a.push(u);
  });

  window.ycWorldUsers=a;

  if(el("worldCount"))
   el("worldCount").textContent=n+" online";
 });

 listen(
  db.collection("worldMessages")
  .orderBy("createdAt","desc")
  .limit(20),
  function(s){
   var a=[];

   s.forEach(function(d){
    var x=d.data();
    x.id=d.id;
    a.push(x);
   });

   a.reverse();

   window.ycWorldMessages=a;
   drawWorld(a);
  }
 );

 listen(
  db.collection("typing").where("roomId","==","world"),
  function(s){
   var h="";

   s.forEach(function(d){
    var x=d.data();

    if(
     x.uid!==me.uid&&
     x.typing&&
     Date.now()-
     (x.updatedAt&&x.updatedAt.toMillis?
      x.updatedAt.toMillis():0)<8000
    )
     h=esc(x.username||"Someone")+" is typing…";
   });

   if(el("worldTyping"))
    el("worldTyping").textContent=h;
  }
 );
}

function drawWorld(a){
 var h="";

 for(var i=0;i<a.length;i++)
  h+=messageHTML(a[i],"world");

 el("worldMessages").innerHTML=
  h||'<div class="empty">No messages yet.</div>';
}

function messageHTML(x,room){
 var own=x.uid===me.uid;
 var u=users[x.uid]||{
  username:x.username||"User",
  avatar:x.avatar||""
 };

 var b="";

 if(x.replyText)
  b+='<div class="replyPreview">'+esc(x.replyText)+'</div>';

 if(x.text)
  b+='<div>'+esc(x.text)+'</div>';

 if(x.imageUrl)
  b+='<img class="media" src="'+esc(x.imageUrl)+'">';

 if(x.videoUrl)
  b+='<video class="media" controls src="'+esc(x.videoUrl)+'"></video>';

 if(x.voiceUrl)
  b+='<audio class="media" controls src="'+esc(x.voiceUrl)+'"></audio>';

 var ac=
 '<div class="actions">'+
 '<button onclick="replyMsg(\''+room+'\',\''+x.id+'\')">Reply</button>';

 if(own)
  ac+=
  '<button onclick="editMsg(\''+room+'\',\''+x.id+'\')">Edit</button>'+
  '<button onclick="deleteMsg(\''+room+'\',\''+x.id+'\')">Delete</button>';

 if(room==="private")
  ac+=
  '<button onclick="reactPrivateMsg(\''+x.id+'\')">React</button>'+
  '<button onclick="messageInfo(\''+x.id+'\')">Info</button>';

 if(room==="group")
  ac+=

function cloudUpload(file,ok,fail,progress){
 if(!file)
  return fail("No file selected.");

 if(file.size>100*1024*1024)
  return fail("File must be under 100MB.");

 var fd=new FormData();

 fd.append("file",file);
 fd.append("upload_preset",CLOUDINARY_UPLOAD_PRESET);

 var x=new XMLHttpRequest();

 x.open("POST",CLOUDINARY_UPLOAD_URL,true);

 x.upload.onprogress=function(e){
  if(progress&&e.lengthComputable)
   progress(Math.round(e.loaded*100/e.total));
 };

 x.onload=function(){
  try{
   var r=JSON.parse(x.responseText);

   if(
    x.status>=200&&
    x.status<300&&
    r.secure_url
   )
    return ok(r.secure_url);

   fail(
    r.error&&r.error.message||
    "Cloudinary upload failed."
   );
  }catch(e){
   fail("Cloudinary response error.");
  }
 };

 x.onerror=function(){
  fail("Cloudinary network error.");
 };

 x.send(fd);
}

function startVoice(target){
 if(recording)return;

 if(
  !navigator.mediaDevices||
  !navigator.mediaDevices.getUserMedia||
  !window.MediaRecorder
 )
  return toast("Voice recording is not supported in this browser.");

 navigator.mediaDevices.getUserMedia({audio:true})
 .then(function(stream){

  recStream=stream;
  recordChunks=[];
  recordSeconds=0;

  recording=new MediaRecorder(stream);

  recording.ondataavailable=function(e){
   if(e.data&&e.data.size)
    recordChunks.push(e.data);
  };

  recording.onstop=function(){
   clearInterval(recInterval);
   recInterval=null;

   stream.getTracks().forEach(function(t){
    t.stop();
   });

   var b=new Blob(
    recordChunks,
    {type:"audio/webm"}
   );

   if(b.size>25*1024*1024){
    toast("Voice file is too large.");
    recording=null;
    return;
   }

   cloudUpload(
    b,
    function(u){
     if(target==="group")
      sendGroupMedia("audio",u);
     else
      sendPrivateMedia("audio",u);

     recording=null;
    },
    function(e){
     toast(e);
     recording=null;
    },
    function(p){
     toast("Voice upload "+p+"%");
    }
   );
  };

  recording.start();

  recInterval=setInterval(function(){
   recordSeconds++;

   if(recordSeconds>=120)
    stopVoice();
  },1000);

 })
 .catch(function(){
  toast("Microphone permission denied.");
 });
}

function stopVoice(){
 if(recording){
  try{
   recording.stop();
  }catch(e){}
 }

 recording=null;

 if(recStream){
  recStream.getTracks().forEach(function(t){
   t.stop();
  });

  recStream=null;
 }

 clearInterval(recInterval);
 recInterval=null;
}

function recordToggle(){
 if(recording)
  stopVoice();
 else
  startVoice("private");

 '<button class="icon" onclick="pickGroupImage()">🖼</button>'+
 '<button class="icon" onclick="pickGroupVideo()">🎥</button>'+
 '<button class="icon" onclick="recordGroupVoice()">🎙</button>'+
 '<button class="icon" onclick="mentionGroup()"> @ </button>'+

 '<input id="groupInput" class="input" placeholder="Message" oninput="groupTyping(true)" onkeydown="if(event.key===\'Enter\'){event.preventDefault();groupTextSend()}">'+

 '<button class="icon send" onclick="groupTextSend()">➤</button>'+

 '</div>'+
 '</div>'+
 '</div>';

 render(shell(g.name||"Group Chat",body,true));

 listen(db.collection("users"),function(s){
  users={};

  s.forEach(function(d){
   users[d.id]=d.data();
   users[d.id].uid=d.id;
  });

  if(window.ycGroupMessages)
   drawGroupMessages(window.ycGroupMessages);
 });

 listen(
  db.collection("groups")
  .doc(currentGroupId)
  .collection("messages")
  .orderBy("createdAt","asc"),
  function(s){

   var a=[];

   s.forEach(function(d){
    var x=d.data();
    x.id=d.id;
    a.push(x);
   });

   window.ycGroupMessages=a;
   drawGroupMessages(a);
  }
 );

 listen(
  db.collection("typing")
  .where("roomId","==","group_"+currentGroupId),
  function(s){
   var h="";

   s.forEach(function(d){
    var x=d.data();

    if(
     x.uid!==me.uid&&
     x.typing&&
     Date.now()-
     (x.updatedAt&&x.updatedAt.toMillis?
      x.updatedAt.toMillis():0)<8000
    )
     h+=esc(x.username)+" is typing…";
   });

   if(el("groupTyping"))
    el("groupTyping").textContent=h;
  }
 );
}

function drawGroupMessages(a){
 var h="";

 for(var i=0;i<a.length;i++)
  h+=messageHTML(a[i],"group");

 el("groupMessages").innerHTML=
  h||'<div class="empty">No messages yet.</div>';

 drawGroupInput();
}

function drawGroupInput(){
 var r=el("groupReply");

 if(r)
  r.innerHTML=
   currentReply
    ?'<div class="replyPreview">Replying to: '+
     esc(currentReply.text)+
     ' <button class="btn small secondary" onclick="currentReply=null;drawGroupInput()">Cancel</button></div>'
    :"";
}

function groupTextSend(){
 var i=el("groupInput");

 if(!i)return;

 var text=i.value.trim();

 if(!text&&!currentReply)return;

 var d={
  uid:me.uid,
  username:me.username,
  avatar:me.avatar||"",
  text:text,
  createdAt:ts()
 };

 if(currentReply){
  d.replyTo=currentReply.id;
  d.replyText=currentReply.text;
 }

 db.collection("groups")
 .doc(currentGroupId)
 .collection("messages")
 .add(d)
 .then(function(){

  i.value="";
  currentReply=null;
  groupTyping(false);

  var m=window.ycGroup.members||[];

  for(var j=0;j<m.length;j++)
   if(m[j]!==me.uid)
    addNotification(
     m[j],
     "group",
     "New group message in "+window.ycGroup.name
    );
 })
 .catch(function(){
  toast("Group message failed.");
 });
}

function sendGroupMedia(type,url){
 var d={
  uid:me.uid,
  username:me.username,
  avatar:me.avatar||"",
  createdAt:ts()
 };

 if(type==="image")
  d.imageUrl=url;

 if(type==="video")
  d.videoUrl=url;

 if(type==="audio")
  d.voiceUrl=url;

 db.collection("groups")
 .doc(currentGroupId)
 .collection("messages")
 .add(d)
 .then(function(){

  var m=window.ycGroup.members||[];

  for(var j=0;j<m.length;j++)
   if(m[j]!==me.uid)
    addNotification(
     m[j],
     "group",
     "New group "+type+" message"
    );
 })
 .catch(function(){
  toast("Group media failed.");
 });
}

function pickGroupImage(){
 var i=document.createElement("input");

 i.type="file";
 i.accept="image/*";

 i.onchange=function(){
  if(i.files[0])
   cloudUpload(
    i.files[0],
    function(u){
     sendGroupMedia("image",u);
    },
    function(e){
     toast(e);
    },
    function(p){
     toast("Uploading "+p+"%");
    }
   );
 };

 i.click();
}

function pickGroupVideo(){
 var i=document.createElement("input");

 i.type="file";
 i.accept="video/*";

 i.onchange=function(){
  if(i.files[0])
   cloudUpload(
    i.files[0],
    function(u){
     sendGroupMedia("video",u);
    },
    function(e){
     toast(e);
    },
    function(p){
     toast("Uploading "+p+"%");
    }
   );
 };

 i.click();
}

function recordGroupVoice(){
 if(recording)
  stopVoice();
 else
  startVoice("group");
}

function groupTyping(v){
 db.collection("typing")
 .doc(me.uid+"_group_"+currentGroupId)
 .set({
  uid:me.uid,
  username:me.username,
  roomId:"group_"+currentGroupId,
  typing:!!v,
  updatedAt:ts()
 },{merge:true}).catch(function(){});

 if(typingTimer)
  clearTimeout(typingTimer);

 if(v)
  typingTimer=setTimeout(function(){
   groupTyping(false);
  },5000);
}

function mentionGroup(){
 var m=window.ycGroup.members||[];
 var h="Choose member:\n\n";

 for(var i=0;i<m.length;i++){
  var u=users[m[i]]||{};
  h+=(i+1)+". "+(u.username||"User")+"\n";
 }

 var n=prompt(h);

 if(!n)return;

 var k=parseInt(n,10)-1;

 if(k<0||k>=m.length)return;

 var u=users[m[k]];
 var i=el("groupInput");

 if(u&&i){
  i.value+=(i.value?" ":"")+"@"+u.username+" ";
  i.focus();
 }
}

function groupMembers(){
 var m=window.ycGroup.members||[];
 var h="Members:\n\n";

 for(var i=0;i<m.length;i++){
  var u=users[m[i]]||{};

  h+=
   (u.username||"User")+
   (m[i]===window.ycGroup.ownerUid?" (Admin)":"")+
   "\n";
 }

 alert(h);
}

function groupAddMember(){
 if(window.ycGroup.ownerUid!==me.uid)return;

 var n=prompt("Enter exact username to add");

 if(!n)return;

 db.collection("users")
 .where("usernameLower","==",n.toLowerCase())
 .limit(1)
 .get()
 .then(function(s){

  if(s.empty){
   toast("User not found.");
   return;
  }

  var d=s.docs[0];

  if(
   (window.ycGroup.members||[])
   .indexOf(d.id)>-1
  ){
   toast("Already a member.");
   return;
  }

  return db.collection("groups")
  .doc(currentGroupId)
  .update({
   members:arrUnion(d.id)
  })
  .then(function(){

   addNotification(
    d.id,
    "groupAdd",
    "You were added to "+window.ycGroup.name
   );

   window.ycGroup.members.push(d.id);

   toast("Member added.");
  });
 });
}

function groupRemoveMember(){
 if(window.ycGroup.ownerUid!==me.uid)return;

 var n=prompt("Enter exact username to remove");

 if(!n)return;

 db.collection("users")
 .where("usernameLower","==",n.toLowerCase())
 .limit(1)
 .get()
 .then(function(s){

  if(s.empty){
   toast("User not found.");
   return;
  }

  var d=s.docs[0];

  if(d.id===me.uid){
   toast("Admin cannot remove self.");
   return;
  }

  return db.collection("groups")
  .doc(currentGroupId)
  .update({
   members:arrRemove(d.id)
  })
  .then(function(){

   window.ycGroup.members=
    window.ycGroup.members.filter(function(x){
     return x!==d.id;
    });

   toast("Member removed.");
  });
 });
}

function showMyStatus(){
 currentPage="myStatus";
 stopAll();

 var body=
 '<div class="wrap">'+
 '<div class="card">'+
 '<div class="title">My Status</div>'+
 '<button class="btn" onclick="createTextStatus()">Text</button>'+
 '<button class="btn secondary" onclick="pickStatusImage()">Image</button>'+
 '<button class="btn secondary" onclick="pickStatusVideo()">Video</button>'+
 '<button class="btn secondary" onclick="pickStatusAudio()">Audio</button>'+
 '</div>'+
 '<div id="myStatusList">Loading...</div>'+
 '</div>';

 render(shell("My Status",scrollBody(body),true));

 listen(
  db.collection("statuses")
  .where("uid","==",me.uid),
  function(s){

   var h="";

   s.forEach(function(d){
    var x=d.data();
    x.id=d.id;
    h+=statusHTML(x,true);
   });

   el("myStatusList").innerHTML=
    h||'<div class="empty">No status yet.</div>';
  }

function createTextStatus(){
 var t=prompt("Write status");

 if(!t)return;

 db.collection("statuses")
 .add({
  uid:me.uid,
  username:me.username,
  type:"text",
  text:t,
  createdAt:ts()
 })
 .then(function(){
  toast("Status posted.");
 });
}

function statusUpload(type,file){
 if(!file)return;

 cloudUpload(
  file,
  function(u){

   var d={
    uid:me.uid,
    username:me.username,
    type:type,
    createdAt:ts(),
    imageUrl:"",
    videoUrl:"",
    audioUrl:""
   };

   if(type==="image")
    d.imageUrl=u;

   if(type==="video")
    d.videoUrl=u;

   if(type==="audio")
    d.audioUrl=u;

   db.collection("statuses")
   .add(d)
   .then(function(){
    toast("Status posted.");
   });
  },
  function(e){
   toast(e);
  },
  function(p){
   toast("Uploading "+p+"%");
  }
 );
}

function pickStatusImage(){
 var i=document.createElement("input");

 i.type="file";
 i.accept="image/*";

 i.onchange=function(){
  statusUpload("image",i.files[0]);
 };

 i.click();
}

function pickStatusVideo(){
 var i=document.createElement("input");

 i.type="file";
 i.accept="video/*";

 i.onchange=function(){
  statusUpload("video",i.files[0]);
 };

 i.click();
}

function pickStatusAudio(){
 var i=document.createElement("input");

 i.type="file";
 i.accept="audio/*";

 i.onchange=function(){
  statusUpload("audio",i.files[0]);
 };

 i.click();
}

function statusHTML(x,own){
 var content=x.text
  ?'<div>'+esc(x.text)+'</div>'
  :"";

 if(x.imageUrl)
  content+='<img class="media" src="'+esc(x.imageUrl)+'">';

 if(x.videoUrl)
  content+='<video class="media" controls src="'+esc(x.videoUrl)+'"></video>';

 if(x.audioUrl)
  content+='<audio class="media" controls src="'+esc(x.audioUrl)+'"></audio>';

 return(
  '<div class="statusCard">'+
  '<div class="between">'+
  '<b>'+esc(x.username||"User")+'</b>'+
  '<span class="status">'+esc(timeOf(x.createdAt))+'</span>'+
  '</div>'+
  content+
  '<div id="sc_'+x.id+'" class="viewer">Loading activity...</div>'+
  '<div class="statusActions">'+
  '<button onclick="reactStatus(\''+x.id+'\')">❤️ React</button>'+
  (
   own
   ?'<button onclick="deleteStatus(\''+x.id+'\')">Delete</button>'
   :'<button onclick="viewStatus(\''+x.id+'\',\''+x.uid+'\')">View</button>'
  )+
  '</div>'+
  '</div>'
 );
}

function loadStatusCount(id){
 Promise.all([
  db.collection("statusViews")
  .where("statusId","==",id)
  .get(),

  db.collection("statusReactions")
  .where("statusId","==",id)
  .get()
 ])
 .then(function(a){
  var x=el("sc_"+id);

  if(x)
   x.textContent=
    a[0].size+
    " views • "+
    a[1].size+
    " reactions";
 });
}

function reactStatus(id){
 db.collection("statusReactions")
 .doc(id+"_"+me.uid)
 .set({
  statusId:id,
  uid:me.uid,
  reaction:"❤️",
  createdAt:ts()
 })
 .then(function(){

  db.collection("statuses")
  .doc(id)
  .get()
  .then(function(d){
   if(
    d.exists&&
    d.data().uid!==me.uid
   )
    addNotification(
     d.data().uid,
     "statusReaction",
     me.username+" reacted to your status"
    );
  });

  loadStatusCount(id);
 });
}

function viewStatus(id,owner){
 if(owner===me.uid)return;

 db.collection("statusViews")
 .doc(id+"_"+me.uid)
 .set({
  statusId:id,
  uid:me.uid,
  createdAt:ts()
 },{merge:true})
 .then(function(){

  addNotification(
   owner,
   "statusView",
   me.username+" viewed your status"
  );

  loadStatusCount(id);
 });
}

function deleteStatus(id){
 if(!confirm("Delete this status?"))
  return;

 db.collection("statuses")
 .doc(id)
 .delete()
 .catch(function(){
  toast("Delete failed.");
 });
}

function showFriendsStatus(){
 showStatusByType("friends");
}

function showOtherStatus(){
 showStatusByType("other");
}

function showStatusByType(kind){
 currentPage=
  kind==="friends"
   ?"friendsStatus"
   :"otherStatus";

 stopAll();

 render(
  shell(
   kind==="friends"
    ?"Friends Status"
    :"Other Users Status",

   scrollBody(
    '<div class="wrap">'+
    '<div id="statusFeed">Loading...</div>'+
    '</div>'
   ),

   true
  )
 );

 listen(
  db.collection("chats")
  .where("participants","array-contains",me.uid),
  function(cs){

   var ids={};

   cs.forEach(function(d){
    var p=d.data().participants||[];

    for(var i=0;i<p.length;i++)
     if(p[i]!==me.uid)
      ids[p[i]]=true;
   });

   listen(
    db.collection("statuses"),
    function(ss){

     var h="";

     ss.forEach(function(d){
      var x=d.data();

      if(x.uid===me.uid)return;

      var friend=!!ids[x.uid];

      if(
       (kind==="friends"&&friend)||
       (kind==="other"&&!friend)
      ){
       x.id=d.id;
       h+=statusHTML(x,false);
      }
     });

     el("statusFeed").innerHTML=
      h||'<div class="empty">No statuses available.</div>';

     ss.forEach(function(d){
      loadStatusCount(d.id);
     });
    }
   );
  }
);
}function showSettings(){
 currentPage="settings";
 stopAll();

 var body=
 '<div class="wrap">'+
 '<div class="card">'+

 '<button class="menuBtn" onclick="editProfile()">Edit Profile</button>'+

 '<button class="menuBtn" onclick="toggleNotifications()">Notifications: '+
 (notificationsOn?"ON":"OFF")+
 '</button>'+

 '<button class="menuBtn" onclick="toggleSound()">Notification Sound: '+
 (soundOn?"ON":"OFF")+
 '</button>'+

 '<button class="menuBtn" onclick="toggleBlock()">Block / Unblock</button>'+

 '<button class="menuBtn" onclick="showBlocked()">Blocked Users</button>'+

 '<button class="menuBtn" onclick="removeId()">Remove ID</button>'+

 '<button class="menuBtn" onclick="logout()">Logout</button>'+

 '</div>'+
 '</div>';

 render(shell("Settings",scrollBody(body),true));
}

function editProfile(){
 var n=prompt("Username",me.username||"");

 if(n===null)return;

 n=n.trim();

 if(n.length<2)
  return toast("Username is too short.");

 db.collection("users")
 .doc(me.uid)
 .update({
  username:n,
  usernameLower:n.toLowerCase()
 })
 .then(function(){
  me.username=n;
  toast("Profile updated.");
  showSettings();
 })
 .catch(function(){
  toast("Profile update failed.");
 });
}

function toggleNotifications(){
 notificationsOn=!notificationsOn;

 localStorage.setItem(
  "yc_notifications",
  notificationsOn?"1":"0"
 );

 showSettings();
}

function toggleSound(){
 soundOn=!soundOn;

 localStorage.setItem(
  "yc_sound",
  soundOn?"1":"0"
 );

 if(soundOn)
  notifySound();

 showSettings();
}

function toggleBlock(){
 if(!currentPeer)
  return toast("Open a user chat first.");

 var id=me.uid+"_"+currentPeer.uid;

 db.collection("blocks")
 .doc(id)
 .get()
 .then(function(d){

  if(d.exists){
   return db.collection("blocks")
   .doc(id)
   .delete()
   .then(function(){
    toast("User unblocked.");
    showSettings();
   });
  }

  return db.collection("blocks")
  .doc(id)
  .set({
   uid:me.uid,
   blockedUid:currentPeer.uid,
   createdAt:ts()
  })
  .then(function(){
   toast("User blocked.");
   showSettings();
  });
 });
}

function showBlocked(){
 currentPage="blocked";
 stopAll();

 render(
  shell(
   "Blocked Users",
   scrollBody(
    '<div class="wrap">'+
    '<div id="blockedList" class="card">Loading...</div>'+
    '</div>'
   ),
   true
  )
 );

 listen(
  db.collection("blocks")
  .where("uid","==",me.uid),
  function(s){

   var h="";

   s.forEach(function(d){
    var x=d.data();
    var u=users[x.blockedUid]||{};

    h+=
    '<div class="userRow">'+
    '<div class="userInfo">'+
    '<b>'+esc(u.username||"User")+'</b>'+
    '</div>'+
    '<button class="btn small" onclick="unblockUser(\''+x.blockedUid+'\')">Unblock</button>'+
    '</div>';
   });

   el("blockedList").innerHTML=
    h||'<div class="empty">No blocked users.</div>';
  }
 );
}

function unblockUser(uid){
 db.collection("blocks")
 .doc(me.uid+"_"+uid)
 .delete()
 .then(function(){
  showBlocked();
 });
}

function removeId(){
 if(!currentPeer)
  return toast("Open a private chat first.");

 if(!confirm("Remove this ID/user from your private chat?"))
  return;

 db.collection("chats")
 .doc(currentChatId)
 .delete()
 .then(function(){
  toast("ID removed.");
  showPrivate();
 })
 .catch(function(){
  toast("Remove failed.");
 });
}

function logout(){
 if(auth.currentUser)
  db.collection("users")
  .doc(me.uid)
  .set({
   online:false,
   lastSeen:ts()
  },{merge:true})
  .catch(function(){});

 clearInterval(window.ycPresence);
 stopAll();
 auth.signOut();
}

function showNotifications(){
 currentPage="notifications";
 stopAll();

 render(
  shell(
   "Notifications",
   scrollBody(
    '<div class="wrap">'+
    '<button class="btn danger" onclick="clearNotifications()">Clear Notifications</button>'+
    '<div id="notificationList" class="card">Loading...</div>'+
    '</div>'
   ),
   true
  )
 );

 listen(
  db.collection("notifications")
  .where("toUid","==",me.uid),
  function(s){

   var a=[];

   s.forEach(function(d){
    var x=d.data();
    x.id=d.id;
    a.push(x);
   });

   a.sort(function(a,b){
    return(
     (b.createdAt&&b.createdAt.toMillis?
      b.createdAt.toMillis():0)-
     (a.createdAt&&a.createdAt.toMillis?
      a.createdAt.toMillis():0)
    );
   });

   var h="";

   for(var i=0;i<a.length;i++){

    h+=
    '<div class="userRow">'+
    '<div class="userInfo">'+
    '<b>'+esc(a[i].type||"Notification")+'</b>'+
    '<div class="status">'+esc(a[i].text||"")+'</div>'+
    '</div>'+
    '<div class="status">'+esc(timeOf(a[i].createdAt))+'</div>'+
    '</div>';
   }

   el("notificationList").innerHTML=
    h||'<div class="empty">No notifications.</div>';
  }
 );
}

function clearNotifications(){
 db.collection("notifications")
 .where("toUid","==",me.uid)
 .get()
 .then(function(s){

  var b=db.batch();

  s.forEach(function(d){
   b.delete(d.ref);
  });

  return b.commit();
 })
 .then(function(){
  showNotifications();
 })
 .catch(function(){
  toast("Clear failed.");
 });
}

window.addEventListener("beforeunload",function(){

 if(auth.currentUser)
  db.collection("users")
  .doc(auth.currentUser.uid)
  .set({
   online:false,
   lastSeen:ts()
  },{merge:true})
  .catch(function(){});

});

splash();
</script>
