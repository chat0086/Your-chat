<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>Your Chat</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;
 min-height:100%;
 background:#07111f;
 color:#fff;
 font-family:Arial,sans-serif
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hide{display:none!important}

#boot{
 position:fixed;
 inset:0;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#07111f;
 z-index:9999
}

.bootbox{
 width:min(92%,400px);
 padding:30px 22px;
 text-align:center;
 background:#0c1b2d;
 border:1px solid #173b61;
 border-radius:22px
}

.logo{
 font-size:27px;
 font-weight:800;
 color:#4eb4ff;
 letter-spacing:1px
}

.spinner{
 width:30px;
 height:30px;
 margin:18px auto;
 border:3px solid #24405d;
 border-top-color:#4eb4ff;
 border-radius:50%;
 animation:spin .8s linear infinite
}

@keyframes spin{
 to{transform:rotate(360deg)}
}

.small{
 font-size:13px;
 color:#9eb2c8;
 line-height:1.5
}

#errorBox{
 margin-top:12px;
 color:#ff9b9b;
 font-size:13px
}

#app{
 min-height:100vh
}

header{
 height:58px;
 padding:0 14px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 background:#0a1828;
 border-bottom:1px solid #16334f;
 position:sticky;
 top:0;
 z-index:20
}

header b{color:#4eb4ff}

main{
 padding:14px;
 max-width:700px;
 margin:auto
}

.card{
 background:#0c1b2d;
 border:1px solid #173b61;
 border-radius:18px;
 padding:16px;
 margin-bottom:12px
}

h1,h2,h3,p{margin-top:0}
h2{font-size:21px}

.btn{
 width:100%;
 border:0;
 border-radius:12px;
 padding:13px 15px;
 background:#1677c8;
 color:#fff;
 font-weight:700;
 margin-top:9px
}

.btn.alt{
 background:#122941;
 border:1px solid #244866
}

.btn.danger{
 background:#a33a3a
}

input,textarea{
 width:100%;
 background:#081625;
 color:#fff;
 border:1px solid #234866;
 border-radius:11px;
 padding:12px;
 margin:6px 0;
 outline:none
}

input:focus,textarea:focus{
 border-color:#4eb4ff
}

textarea{
 min-height:80px;
 resize:vertical
}

.row{
 display:flex;
 gap:8px;
 align-items:center
}

.row>*{flex:1}

.navgrid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px
}

.navitem{
 min-height:92px;
 background:#0d2034;
 border:1px solid #1b4568;
 border-radius:16px;
 color:#fff;
 padding:16px;
 text-align:left
}

.navitem b{
 display:block;
 color:#4eb4ff;
 margin-bottom:8px
}

.listitem{
 padding:13px;
 border-bottom:1px solid #17324b
}

.listitem:last-child{
 border-bottom:0
}

.msg{
 padding:9px 11px;
 margin:7px 0;
 border-radius:13px;
 background:#10263d;
 max-width:88%
}

.msg.mine{
 margin-left:auto;
 background:#125f96
}

.msg small{
 display:block;
 color:#91abc2;
 margin-top:4px;
 font-size:10px
}

#auth{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:16px
}

.authbox{
 width:min(100%,420px)
}

.status{
 font-size:13px;
 color:#9eb2c8;
 min-height:20px;
 margin:8px 0
}

.badge{
 display:inline-block;
 padding:4px 8px;
 border-radius:20px;
 background:#143858;
 color:#91d2ff;
 font-size:11px
}

@media(max-width:430px){
 main{padding:10px}
 .navgrid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div id="boot">
 <div class="bootbox">
  <div class="logo">YOUR CHAT</div>
  <div class="spinner"></div>
  <div id="bootText" class="small">Starting safely...</div>
  <div id="errorBox" class="hide"></div>
  <button id="bootRetry" class="btn hide" onclick="location.reload()">Retry</button>
 </div>
</div>

<div id="auth" class="hide">
 <div class="authbox">
  <div class="card">
   <div class="logo">YOUR CHAT</div>

   <p class="small">
    Lightweight chat for Android and KaiOS-style browsers.
   </p>

   <input
    id="username"
    maxlength="24"
    autocomplete="username"
    placeholder="Username (3-24 letters/numbers/_)">

   <input
    id="password"
    type="password"
    minlength="6"
    autocomplete="current-password"
    placeholder="Password (6+ characters)">

   <button class="btn" id="loginBtn">Login</button>

   <button class="btn alt" id="createBtn">
    Create Account
   </button>

   <div id="authStatus" class="status"></div>
  </div>
 </div>
</div>

<div id="app" class="hide">

<header>
 <b>YOUR CHAT</b>
 <span id="userBadge" class="badge">Guest</span>
</header>

<main id="main"></main>

</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
"use strict";

/* =========================
   FIREBASE CONFIG
   ========================= */

const firebaseConfig = {
 apiKey:"AIzaSyBmyYlEtZCm7yDsmqAsqdRNmxBjPSiCyQ",
 authDomain:"your-chat-24913.firebaseapp.com",
 projectId:"your-chat-24913",
 storageBucket:"your-chat-24913.firebasestorage.app",
 messagingSenderId:"700520326360",
 appId:"1:700520326360:web:a3dc5fd4e36b54dbb563ad",
 measurementId:"G-7JBWVDK838"
};

let auth=null;
let db=null;
let currentUser=null;
let stopWorld=null;

const $=id=>document.getElementById(id);

const safe=v=>String(v??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;",
 "<":"&lt;",
 ">":"&gt;",
 '"':"&quot;",
 "'":"&#039;"
}[c]));

function usernameEmail(name){
 return name.trim().toLowerCase()+"@yourchat.local";
}

function validUsername(name){
 return /^[A-Za-z0-9_]{3,24}$/.test(name);
}

function setBoot(text,error=false){

 $("bootText").textContent=text;

 $("errorBox").classList.toggle(
  "hide",
  !error
 );

 if(error){

  $("errorBox").textContent=text;

  $("bootText").textContent=
   "Your Chat could not start.";

  $("bootRetry").classList.remove("hide");
 }
}

function show(id){

 $("boot").classList.add("hide");

 $("auth").classList.toggle(
  "hide",
  id!=="auth"
 );

 $("app").classList.toggle(
  "hide",
  id!=="app"
 );
}

function status(text){
 $("authStatus").textContent=text;
}


/* =========================
   FIREBASE START
   ========================= */

function startFirebase(){

 try{

  if(!window.firebase){

   throw new Error(
    "Firebase library did not load. Check internet connection."
   );
  }

  if(!firebase.apps.length){

   firebase.initializeApp(firebaseConfig);
  }

  auth=firebase.auth();
  db=firebase.firestore();

  return true;

 }catch(e){

  console.error(e);

  setBoot(
   e.message||"Firebase could not start.",
   true
  );

  return false;
 }
}


/* =========================
   LOGIN
   ========================= */

$("loginBtn").onclick=async()=>{

 const name=$("username").value.trim();
 const pass=$("password").value;

 if(!validUsername(name)){

  return status(
   "Username: 3-24 letters, numbers or _ only."
  );
 }

 if(pass.length<6){

  return status(
   "Password must be at least 6 characters."
  );
 }

 status("Logging in...");

 try{

  await auth.signInWithEmailAndPassword(
   usernameEmail(name),
   pass
  );

 }catch(e){

  console.error(e);

  status(
   e.code==="auth/user-not-found"
   ?"Account not found. Create it first."
   :
   e.code==="auth/wrong-password"
   ?"Wrong password."
   :
   e.message||"Login failed."
  );
 }
};


/* =========================
   CREATE ACCOUNT
   ========================= */

$("createBtn").onclick=async()=>{

 const name=$("username").value.trim();
 const pass=$("password").value;

 if(!validUsername(name)){

  return status(
   "Username: 3-24 letters, numbers or _ only."
  );
 }

 if(pass.length<6){

  return status(
   "Password must be at least 6 characters."
  );
 }

 status("Creating account...");

 try{

  const cred=
   await auth.createUserWithEmailAndPassword(
    usernameEmail(name),
    pass
   );

  await db.collection("users")
   .doc(cred.user.uid)
   .set({

    uid:cred.user.uid,
    username:name,
    usernameLower:name.toLowerCase(),
    createdAt:
     firebase.firestore.FieldValue.serverTimestamp(),
    online:true

   },{merge:true});

 }catch(e){

  console.error(e);

  status(
   e.code==="auth/email-already-in-use"
   ?"Username already exists."
   :
   e.message||"Account creation failed."
  );
 }
};


/* =========================
   HOME
   ========================= */

function home(){

 $("userBadge").textContent=
  currentUser?.displayName||
  currentUser?.email?.split("@")[0]||
  "User";

 $("main").innerHTML=`

 <div class="card">

  <h2>Welcome to Your Chat 👋</h2>

  <p class="small">
   Choose a chat area.
  </p>

  <div class="navgrid">

   <button class="navitem"
    onclick="world()">

    <b>🌍 World Chat</b>
    Everyone can chat

   </button>

   <button class="navitem"
    onclick="users()">

    <b>🟢 Online Users</b>
    Find people

   </button>

   <button class="navitem"
    onclick="privateChat()">

    <b>💬 Private Chat</b>
    One-to-one messages

   </button>

   <button class="navitem"
    onclick="groups()">

    <b>👥 Group Chat</b>
    Group messages

   </button>

   <button class="navitem"
    onclick="users(true)">

    <b>👤 All Users</b>
    Browse users

   </button>

   <button class="navitem"
    onclick="settings()">

    <b>⚙️ Settings</b>
    Account & privacy

   </button>

  </div>

 </div>

 <button class="btn danger"
  onclick="logout()">
  Log Out
 </button>

 `;
}


/* =========================
   WORLD CHAT
   ========================= */

function world(){

 if(stopWorld){
  stopWorld();
 }

 $("main").innerHTML=`

 <div class="row">

  <button class="btn alt"
   onclick="home()">
   ← Home
  </button>

  <h2>🌍 World Chat</h2>

 </div>

 <div class="card">

  <div id="worldList"
   style="max-height:55vh;overflow:auto">
   Loading...
  </div>

  <textarea
   id="worldText"
   maxlength="1000"
   placeholder="Write a message..."></textarea>

  <button class="btn"
   onclick="sendWorld()">
   Send
  </button>

  <div id="worldStatus"
   class="status"></div>

 </div>

 `;

 stopWorld=
 db.collection("worldMessages")
 .orderBy("createdAt","desc")
 .limit(80)
 .onSnapshot(

 snap=>{

  const rows=[];

  snap.forEach(d=>{

   const m=d.data();

   rows.push(`

    <div class="msg ${
     m.uid===currentUser.uid?"mine":""
    }">

     <b>
      ${safe(m.username||"User")}
     </b>

     <br>

     ${safe(m.text)}

     <small>
      ${
       m.createdAt?.toDate
       ?
       m.createdAt.toDate().toLocaleString()
       :
       "sending..."
      }
     </small>

    </div>

   `);
  });

  $("worldList").innerHTML=
   rows.reverse().join("")||
   `<p class="small">No messages yet.</p>`;

 },

 err=>{

  console.error(err);

  $("worldList").innerHTML=
   `<p class="small">
    World Chat is unavailable.
    Check Firestore rules.
   </p>`;
 }
 );
}


async function sendWorld(){

 const el=$("worldText");
 const text=el.value.trim();

 if(!text)return;

 $("worldStatus").textContent=
  "Sending...";

 try{

  const u=
   await db.collection("users")
   .doc(currentUser.uid)
   .get();

  await db.collection("worldMessages")
   .add({

    uid:currentUser.uid,

    username:
     u.data()?.username||
     "User",

    text,

    createdAt:
     firebase.firestore.FieldValue.serverTimestamp()
   });

  el.value="";

  $("worldStatus").textContent="";

 }catch(e){

  console.error(e);

  $("worldStatus").textContent=
   "Message failed. Check Firestore rules.";
 }
}


/* =========================
   USERS
   ========================= */

function users(all=false){

 $("main").innerHTML=`

 <div class="row">

  <button class="btn alt"
   onclick="home()">
   ← Home
  </button>

  <h2>
   ${all?"👤 All Users":"🟢 Online Users"}
  </h2>

 </div>

 <div class="card">

  <div id="usersList">
   Loading...
  </div>

 </div>

 `;

 db.collection("users")
 .limit(100)
 .get()

 .then(snap=>{

  let html="";

  snap.forEach(d=>{

   const u=d.data();

   if(u.uid===currentUser.uid)
    return;

   if(!all && u.online!==true)
    return;

   html+=`

   <div class="listitem">

    <b>
     ${safe(u.username||"User")}
    </b>

    <span class="badge">
     ${u.online===true?"Online":"Offline"}
    </span>

    <button class="btn alt"
     onclick="openPrivate(
      '${safe(u.uid)}',
      '${safe(u.username||"User")}'
     )">
     Chat
    </button>

   </div>

   `;
  });

  $("usersList").innerHTML=
   html||
   `<p class="small">No users found.</p>`;

 })

 .catch(e=>{

  console.error(e);

  $("usersList").innerHTML=
   `<p class="small">
    Users could not be loaded.
   </p>`;
 });
}


function privateChat(){
 users(true);
}


/* =========================
   PRIVATE CHAT
   ========================= */

function chatIdFor(a,b){
 return [a,b].sort().join("_");
}

async function openPrivate(uid,name){

 const chatId=
  chatIdFor(currentUser.uid,uid);

 $("main").innerHTML=`

 <div class="row">

  <button class="btn alt"
   onclick="users(true)">
   ← Users
  </button>

  <h2>
   💬 ${safe(name)}
  </h2>

 </div>

 <div class="card">

  <div id="privateList"
   style="max-height:55vh;overflow:auto">
   Loading...
  </div>

  <textarea
   id="privateText"
   maxlength="1000"
   placeholder="Private message..."></textarea>

  <button class="btn"
   onclick="sendPrivate(
    '${safe(chatId)}',
    '${safe(uid)}',
    '${safe(name)}'
   )">
   Send
  </button>

  <div class="status">
   Private messages are only visible
   through this chat.
  </div>

 </div>

 `;

 db.collection("chats")
 .doc(chatId)
 .collection("messages")
 .orderBy("createdAt","asc")
 .limit(100)
 .onSnapshot(

 snap=>{

  const rows=[];

  snap.forEach(d=>{

   const m=d.data();

   rows.push(`

   <div class="msg ${
    m.uid===currentUser.uid?"mine":""
   }">

    <b>
     ${safe(m.username||"User")}
    </b>

    <br>

    ${safe(m.text||"")}

    <small>
     ${
      m.createdAt?.toDate
      ?
      m.createdAt.toDate().toLocaleString()
      :
      "sending..."
     }
    </small>

   </div>

   `);
  });

  $("privateList").innerHTML=
   rows.join("")||
   `<p class="small">No messages yet.</p>`;

 },

 err=>{

  console.error(err);

  $("privateList").innerHTML=
   `<p class="small">
    Private chat is unavailable.
    Check Firestore rules.
   </p>`;
 }
 );
}


async function sendPrivate(
 chatId,
 otherUid,
 otherName
){

 const el=$("privateText");
 const text=el.value.trim();

 if(!text)return;

 try{

  const me=
   await db.collection("users")
   .doc(currentUser.uid)
   .get();

  await db.collection("chats")
   .doc(chatId)
   .collection("messages")
   .add({

    uid:currentUser.uid,
    toUid:otherUid,

    username:
     me.data()?.username||
     "User",

    text,

    createdAt:
     firebase.firestore.FieldValue.serverTimestamp()
   });

  el.value="";

 }catch(e){

  console.error(e);

  alert(
   "Private message failed. Check Firestore rules."
  );
 }
}


/* =========================
   GROUPS
   ========================= */

function groups(){

 $("main").innerHTML=`

 <div class="row">

  <button class="btn alt"
   onclick="home()">
   ← Home
  </button>

  <h2>👥 Groups</h2>

 </div>

 <div class="card">

  <input
   id="groupName"
   maxlength="40"
   placeholder="New group name">

  <button class="btn"
   onclick="createGroup()">
   Create Group
  </button>

 </div>

 <div class="card">

  <div id="groupList">
   Loading...
  </div>

 </div>

 `;

 db.collection("groups")
 .limit(50)
 .get()

 .then(s=>{

  let h="";

  s.forEach(d=>{

   const g=d.data();

   h+=`

   <div class="listitem">

    <b>
     ${safe(g.name||"Group")}
    </b>

    <button class="btn alt"
     onclick="openGroup(
      '${safe(d.id)}',
      '${safe(g.name||"Group")}'
     )">
     Open
    </button>

   </div>

   `;
  });

  $("groupList").innerHTML=
   h||
   `<p class="small">No groups yet.</p>`;

 })

 .catch(e=>{

  $("groupList").textContent=
   "Groups unavailable.";

  console.error(e);
 });
}


async function createGroup(){

 const name=
  $("groupName").value.trim();

 if(!name)return;

 try{

  const ref=
   await db.collection("groups")
   .add({

    name,

    ownerUid:
     currentUser.uid,

    createdAt:
     firebase.firestore.FieldValue.serverTimestamp()
   });

  $("groupName").value="";

  openGroup(ref.id,name);

 }catch(e){

  console.error(e);

  alert(
   "Group creation failed."
  );
 }
}


function openGroup(id,name){

 $("main").innerHTML=`

 <div class="row">

  <button class="btn alt"
   onclick="groups()">
   ← Groups
  </button>

  <h2>
   👥 ${safe(name)}
  </h2>

 </div>

 <div class="card">

  <div id="groupMessages"
   style="max-height:55vh;overflow:auto">
   Loading...
  </div>

  <textarea
   id="groupText"
   maxlength="1000"
   placeholder="Group message..."></textarea>

  <button class="btn"
   onclick="sendGroup('${safe(id)}')">
   Send
  </button>

 </div>

 `;

 db.collection("groups")
 .doc(id)
 .collection("messages")
 .orderBy("createdAt","asc")
 .limit(100)
 .onSnapshot(

 s=>{

  let h="";

  s.forEach(d=>{

   const m=d.data();

   h+=`

   <div class="msg ${
    m.uid===currentUser.uid?"mine":""
   }">

    <b>
     ${safe(m.username||"User")}
    </b>

    <br>

    ${safe(m.text)}

    <small>
     ${
      m.createdAt?.toDate
      ?
      m.createdAt.toDate().toLocaleString()
      :
      "sending..."
     }
    </small>

   </div>

   `;
  });

  $("groupMessages").innerHTML=
   h||
   `<p class="small">No messages yet.</p>`;

 },

 e=>{

  $("groupMessages").textContent=
   "Group chat unavailable.";

  console.error(e);
 }
 );
}


async function sendGroup(id){

 const el=$("groupText");
 const text=el.value.trim();

 if(!text)return;

 try{

  const me=
   await db.collection("users")
   .doc(currentUser.uid)
   .get();

  await db.collection("groups")
   .doc(id)
   .collection("messages")
   .add({

    uid:currentUser.uid,

    username:
     me.data()?.username||
     "User",

    text,

    createdAt:
     firebase.firestore.FieldValue.serverTimestamp()
   });

  el.value="";

 }catch(e){

  console.error(e);

  alert(
   "Group message failed."
  );
 }
}


/* =========================
   SETTINGS
   ========================= */

function settings(){

 $("main").innerHTML=`

 <div class="row">

  <button class="btn alt"
   onclick="home()">
   ← Home
  </button>

  <h2>⚙️ Settings</h2>

 </div>

 <div class="card">

  <h3>Account</h3>

  <p class="small">

/* =========================
   ONLINE / LOGOUT
   ========================= */

async function setOnline(value){

 if(!currentUser||!db)return;

 try{

  await db.collection("users")
  .doc(currentUser.uid)
  .set({

   online:value,

   lastSeen:
    firebase.firestore.FieldValue.serverTimestamp()

  },{merge:true});

 }catch(e){

  console.error(e);
 }
}


async function logout(){

 await setOnline(false);

 try{

  await auth.signOut();

 }catch(e){

  console.error(e);
 }
}


/* =========================
   STARTUP
   ========================= */

(async function start(){

 setBoot(
  "Starting Your Chat..."
 );

 if(!startFirebase())
  return;

 let settled=false;

 const timer=setTimeout(()=>{

  if(!settled){

   setBoot(
    "Firebase is taking too long. Check your internet connection and try again.",
    true
   );
  }

 },10000);

 auth.onAuthStateChanged(
  async user=>{

   settled=true;
   clearTimeout(timer);

   currentUser=user||null;

   if(user){

    try{

     await db.collection("
