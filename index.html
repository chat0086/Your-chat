<style>

<script>
/* =========================================================
   CHIT CHAT PLUS FIREBASE CONFIG
   ========================================================= */

var firebaseConfig = {
  apiKey: "AIzaSyAEqeB2YXk_2A9gZ41WQ_fNiBKiGnzYGc0",
  authDomain: "chit-chat-plus-7382b.firebaseapp.com",
  projectId: "chit-chat-plus-7382b",
  storageBucket: "chit-chat-plus-7382b.firebasestorage.app",
  messagingSenderId: "98837732974",
  appId: "1:98837732974:web:ff52d3868871c91518507f",
  measurementId: "G-T42H2N5Q0Z"
};

firebase.initializeApp(firebaseConfig);

var auth = firebase.auth();
var db = firebase.firestore();

var currentUser = null;
var currentUsername = "";
var currentAvatar = "";
var currentPrivateUid = "";
var currentGroupId = "";

var demoUsers = [
  {
    uid:"demo_ali",
    username:"Ali",
    avatar:"",
    online:true
  },
  {
    uid:"demo_nimra",
    username:"Nimra",
    avatar:"",
    online:true
  },
  {
    uid:"demo_aisha",
    username:"Aisha",
    avatar:"",
    online:true
  }
];

var fallbackAvatar =
"data:image/svg+xml;charset=UTF-8," +
encodeURIComponent(
"<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80'>" +
"<rect width='80' height='80' fill='#17304b'/>" +
"<circle cx='40' cy='30' r='15' fill='#7fb8ff'/>" +
"<path d='M15 75c3-20 47-20 50 0' fill='#7fb8ff'/>" +
"</svg>"
);

function esc(s){
  s = String(s == null ? "" : s);
  return s.replace(/&/g,"&amp;")
          .replace(/</g,"&lt;")
          .replace(/>/g,"&gt;")
          .replace(/"/g,"&quot;")
          .replace(/'/g,"&#39;");
}

function avatar(url){
  return url ? url : fallbackAvatar;
}

function nowTime(){
  var d = new Date();
  var h = d.getHours();
  var m = d.getMinutes();

  if(m < 10){m = "0" + m;}

  return h + ":" + m;
}

function removeLoading(){
  var x = document.getElementById("loading");
  if(x){
    x.style.display = "none";
  }
}

function showAuth(){
  document.getElementById("auth").className = "";
  document.getElementById("app").className = "hide";
}

function showApp(){
  document.getElementById("auth").className = "hide";
  document.getElementById("app").className = "";
  homePage();
}

window.setTimeout(removeLoading,1800);
window.setTimeout(removeLoading,3500);

window.onload = function(){
  removeLoading();

  try{
    auth.onAuthStateChanged(function(user){
      if(user){
        currentUser = user;
        currentUsername =
          localStorage.getItem("ccp_username") ||
          user.email.split("@")[0];

        currentAvatar =
          localStorage.getItem("ccp_avatar") || "";

        showApp();
      }else{
        showAuth();
      }
    });
  }catch(e){
    showAuth();
  }
};


/* =========================================================
   AUTH
   ========================================================= */

function showCreate(){
  document.getElementById("authTitle").innerHTML = "Create Account";

  var b = document.getElementById("auth");
  var old = b.innerHTML;

  b.innerHTML =
    '<div class="logo">CHIT CHAT PLUS</div>' +
    '<div class="sub">Create your account</div>' +

    '<div class="card">' +

    '<div class="row">' +
    '<input id="authUsername" type="text" placeholder="Username">' +
    '</div>' +

    '<div class="row">' +
    '<input id="authPassword" type="password" placeholder="Password">' +
    '</div>' +

    '<button class="bigbtn" onclick="createAccount()">Create Account</button>' +
    '<button class="bigbtn secondary" onclick="location.reload()">Back to Login</button>' +

    '</div>';
}

function validUsername(name){
  return /^[A-Za-z0-9_]{3,24}$/.test(name);
}

function fakeEmail(name){
  return name.toLowerCase() + "@chitchatplus.local";
}

function createAccount(){

  var name = document.getElementById("authUsername").value.trim();
  var pass = document.getElementById("authPassword").value;

  if(!validUsername(name)){
    alert("Username 3 se 24 characters ka ho. Sirf A-Z, 0-9 aur _ use karo.");
    return;
  }

  if(pass.length < 6){
    alert("Password kam az kam 6 characters ka hona chahiye.");
    return;
  }

  auth.createUserWithEmailAndPassword(
    fakeEmail(name),
    pass
  ).then(function(result){

    currentUser = result.user;
    currentUsername = name;

    localStorage.setItem("ccp_username",name);

    return db.collection("users")
      .doc(result.user.uid)
      .set({
        uid:result.user.uid,
        username:name,
        avatar:"",
        online:true,
        createdAt:firebase.firestore.FieldValue.serverTimestamp()
      });

  }).then(function(){
    showApp();
  }).catch(function(error){
    alert("Create Account Error: " + error.message);
  });
}

function login(){

  var name = document.getElementById("authUsername").value.trim();
  var pass = document.getElementById("authPassword").value;

  if(!validUsername(name)){
    alert("Username sahi likho.");
    return;
  }

  auth.signInWithEmailAndPassword(
    fakeEmail(name),
    pass
  ).then(function(result){

    currentUser = result.user;
    currentUsername = name;

    localStorage.setItem("ccp_username",name);

    return db.collection("users")
      .doc(result.user.uid)
      .set({
        uid:result.user.uid,
        username:name,
        avatar:localStorage.getItem("ccp_avatar") || "",
        online:true,
        lastSeen:firebase.firestore.FieldValue.serverTimestamp()
      },{
        merge:true
      });

  }).then(function(){
    showApp();
  }).catch(function(error){
    alert("Login Error: " + error.message);
  });
}

function logout(){

  if(currentUser){
    db.collection("users")
      .doc(currentUser.uid)
      .set({
        online:false,
        lastSeen:firebase.firestore.FieldValue.serverTimestamp()
      },{
        merge:true
      });
  }

  auth.signOut().then(function(){
    localStorage.removeItem("ccp_username");
    location.reload();
  });
}

      '<button class="menuBtn" onclick="worldPage()">🌍 World Chat' +

/* =========================================================
   WORLD CHAT
   ========================================================= */

function worldPage(){

  navClear();
  document.getElementById("navWorld").className = "active";

  page(
    '<div class="card">' +
      '<div class="title">🌍 World Chat</div>' +
      '<div class="small">Text messages only</div>' +
      '<div id="worldOnline" class="small" style="margin-top:5px">Online: 0</div>' +
    '</div>' +

    '<div id="worldMessages" class="chatBox">' +
      '<div class="small">Loading messages...</div>' +
    '</div>' +

    '<div id="mentionList" class="mentionList hide"></div>' +

    '<div class="sendRow">' +
      '<textarea id="worldInput" placeholder="Message... @username" ' +
      'onkeyup="worldTyping()"></textarea>' +
      '<button onclick="sendWorld()">Send</button>' +
    '</div>'
  );

  loadWorld();
  loadOnlineCount();
}

function worldTyping(){

  var box = document.getElementById("worldInput");
  var list = document.getElementById("mentionList");

  if(!box || !list){return;}

  if(box.value.indexOf("@") == -1){
    list.className = "mentionList hide";
    return;
  }

  var users = getUsers();
  var html = "";
  var i;

  for(i=0;i<users.length;i++){

    if(users[i].uid == currentUser.uid){continue;}

    html +=
      '<div class="mentionItem" onclick="insertMention(\'' +
      esc(users[i].username) +
      '\')">' +

      '<img src="' + avatar(users[i].avatar) +
      '" onerror="this.onerror=null;this.src=\'' +
      fallbackAvatar + '\'">' +

      '<b>@' + esc(users[i].username) + '</b>' +

      '</div>';
  }

  list.innerHTML = html;
  list.className = "mentionList";
}

function insertMention(name){

  var box = document.getElementById("worldInput");

  if(!box){return;}

  box.value += "@" + name + " ";
  document.getElementById("mentionList").className =
    "mentionList hide";

  box.focus();
}

function loadWorld(){

  db.collection("worldMessages")
    .orderBy("createdAt","desc")
    .limit(15)
    .onSnapshot(function(snapshot){

      var html = "";
      var arr = [];

      snapshot.forEach(function(doc){
        arr.push(doc.data());
      });

      arr.reverse();

      var i;

      for(i=0;i<arr.length;i++){

        var m = arr[i];

        html +=
          '<div class="msg">' +

          '<div class="msgHead">' +

          '<img class="avatar" src="' +
          avatar(m.avatar) +
          '" onerror="this.onerror=null;this.src=\'' +
          fallbackAvatar + '\'">' +

          '<span class="user">' +
          esc(m.username || "User") +
          '</span>' +

          '<span class="time">' +
          esc(m.time || "") +
          '</span>' +

          '</div>' +

          '<div class="msgText">' +
          formatMentions(m.text || "") +
          '</div>' +

          '</div>';
      }

      if(!html){
        html = '<div class="small">Abhi koi message nahi.</div>';
      }

      var box = document.getElementById("worldMessages");

      if(box){
        box.innerHTML = html;
        box.scrollTop = box.scrollHeight;
      }

    },function(error){

      var box = document.getElementById("worldMessages");

      if(box){
        box.innerHTML =
          '<div class="notice">World Chat error: ' +
          esc(error.message) +
          '</div>';
      }
    });
}

function formatMentions(text){

  var safe = esc(text);

  return safe.replace(
    /@([A-Za-z0-9_]{3,24})/g,
    '<span class="mention">@$1</span>'
  );
}

function sendWorld(){

  var box = document.getElementById("worldInput");

  if(!box){return;}

  var text = box.value.trim();

  if(!text){return;}

  if(text.length > 500){
    alert("Message bohat lamba hai.");
    return;
  }

  if(checkSpam("world")){
    return;
  }

  if(hasBadWord(text)){
    alert("Ye message allowed nahi hai.");
    return;
  }

  db.collection("worldMessages").add({
    uid:currentUser.uid,
    username:currentUsername,
    avatar:currentAvatar,
    text:text,
    time:nowTime(),
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){

    box.value = "";

    createMentionNotifications(text);

  }).catch(function(error){
    alert("Message send error: " + error.message);
  });
}

function createMentionNotifications(text){

  var users = getUsers();
  var i;

  for(i=0;i<users.length;i++){

    if(users[i].uid == currentUser.uid){continue;}

    var tag = "@" + users[i].username;

    if(text.indexOf(tag) != -1){

      db.collection("notifications").add({
        toUid:users[i].uid,
        fromUid:currentUser.uid,
        fromUsername:currentUsername,
        fromAvatar:currentAvatar,
        type:"mention",
        text:currentUsername + " ne aap ko mention kiya",
        createdAt:firebase.firestore.FieldValue.serverTimestamp()
      });
    }
  }
}


/* =========================================================
   ONLINE USERS
   ========================================================= */

function getUsers(){

  var users = [];

  if(currentUser){

    users.push({
      uid:currentUser.uid,
      username:currentUsername,
      avatar:currentAvatar,
      online:true
    });
  }

  var i;

  for(i=0;i<demoUsers.length;i++){
    users.push(demoUsers[i]);
  }

  return users;
}

function loadOnlineCount(){

  var count = getUsers().length;

  var x = document.getElementById("onlineCount");
  var y = document.getElementById("worldOnline");

  if(x){
    x.innerHTML = "Online: " + count;
  }

  if(y){
    y.innerHTML = "Online: " + count;
  }
}

function usersPage(){

  navClear();
  document.getElementById("navUsers").className = "active";

  var users = getUsers();
  var html =
    '<div class="card">' +
    '<div class="title">👥 Online Users</div>' +
    '<div class="small">Online: ' + users.length + '</div>' +
    '</div>';

  var i;

  for(i=0;i<users.length;i++){

    html +=
      '<div class="userItem">' +

      '<img src="' + avatar(users[i].avatar) +
      '" onerror="this.onerror=null;this.src=\'' +
      fallbackAvatar + '\'">' +

      '<div class="userInfo">' +

      '<b>' + esc(users[i].username) + '</b><br>' +

      '<span class="' +
      (users[i].online ? "online" : "offline") +
      '">' +
      (users[i].online ? "● Online" : "○ Offline") +
      '</span>';

    if(users[i].uid != currentUser.uid){

      html +=
        '<br><button style="margin-top:5px" ' +
        'onclick="openPrivate(\'' +
        users[i].uid + '\',\'' +
        esc(users[i].username) + '\')">' +
        'Private Chat</button>';
    }

    html += '</div></div>';
  }

  page(html);
}


/* =========================================================
   PRIVATE CHAT
   ========================================================= */

function privateUsersPage(){

  var users = getUsers();

  var html =
    '<div class="card">' +
    '<div class="title">🔒 Private Chat</div>' +
    '<div class="small">Friend/permission required</div>' +
    '</div>';

/* =========================================================
   VOICE
   ========================================================= */

var recorder = null;
var voiceChunks = [];
var voiceStartedAt = 0;

function startVoice(){

  if(!navigator.mediaDevices ||
     !navigator.mediaDevices.getUserMedia){

    alert("Is Digit browser mein voice recording available nahi hai.");
    return;
  }

  navigator.mediaDevices.getUserMedia({
    audio:true
  }).then(function(stream){

    try{
      recorder = new MediaRecorder(stream);
    }catch(e){
      alert("Voice recorder is browser mein available nahi.");
      return;
    }

    voiceChunks = [];
    voiceStartedAt = new Date().getTime();

    recorder.ondataavailable = function(e){
      if(e.data && e.data.size){
        voiceChunks.push(e.data);
      }
    };

    recorder.onstop = function(){

      var blob;

      try{
        blob = new Blob(voiceChunks,{
          type:"audio/webm"
        });
      }catch(e){
        alert("Voice create nahi ho saki.");
        return;
      }

      if(blob.size > 900000){
        alert("Voice bohat bari hai. Chhoti voice bhejo.");
        stream.getTracks()[0].stop();
        return;
      }

      var reader = new FileReader();

      reader.onloadend = function(){

        var id =
          chatIdFor(currentUser.uid,currentPrivateUid);

        db.collection("chats")
          .doc(id)
          .collection("messages")
          .add({
            uid:currentUser.uid,
            toUid:currentPrivateUid,
            username:currentUsername,
            avatar:currentAvatar,
            text:"🎙️ Voice message",
            voice:reader.result,
            type:"voice",
            time:nowTime(),
            createdAt:firebase.firestore.FieldValue.serverTimestamp()
          })
          .then(function(){
            alert("Voice send ho gayi.");
          })
          .catch(function(error){
            alert("Voice send error: " + error.message);
          });
      };

      reader.readAsDataURL(blob);

      stream.getTracks()[0].stop();
    };

    recorder.start();

    alert("Voice recording start ho gayi. Dobara Voice button dabao to stop hogi.");

    setTimeout(function(){

      if(recorder && recorder.state == "recording"){
        recorder.stop();
      }

    },8000);

  }).catch(function(error){

    alert("Microphone permission nahi mili: " + error.message);
  });
}

/* =========================================================
   SPAM / ABUSE
   ========================================================= */

var spamData = {
  world:[],
  private:[],
  group:[]
};

var badWords = [
  "badword",
  "abuseword"
];

function hasBadWord(text){

  var lower = text.toLowerCase();
  var i;

  for(i=0;i<badWords.length;i++){

    if(lower.indexOf(badWords[i]) != -1){
      return true;
    }
  }

  return false;
}

function checkSpam(type){

  var now = new Date().getTime();

  if(!spamData[type]){
    spamData[type] = [];
  }

  var arr = spamData[type];
  var fresh = [];
  var i;

  for(i=0;i<arr.length;i++){

    if(now - arr[i] < 10000){
      fresh.push(arr[i]);
    }
  }

  fresh.push(now);
  spamData[type] = fresh;

  if(fresh.length >= 5){

    alert(
      "Spam detected. 5 minute temporary restriction."
    );

    return true;
  }

  return false;
}
