.navbar{display:flex;gap:5px;padding:7px;background:#07192e;border-bottom:1px solid #224b72;position:sticky;top:0;z-index:45}.navtab{flex:1;padding:8px 4px;font-size:11px;background:#0d2947;border-radius:8px}.navtab.active{background:#1a5a8d}.sideMenu{position:fixed;left:0;top:0;bottom:0;width:82%;max-width:320px;background:#081b31;border-right:1px solid #2a5b88;z-index:100;padding:12px;transform:translateX(-105%);transition:.2s;box-shadow:8px 0 25px #000}.sideMenu.show{transform:translateX(0)}.sideMenu button{width:100%;margin:5px 0;text-align:left}.waChat{background:#06172a;border-radius:12px;padding:7px;min-height:360px;max-height:430px;overflow:auto;border:1px solid #21486e}.bubble{max-width:82%;padding:7px 9px;margin:6px 2px;border-radius:10px;display:inline-block;word-wrap:break-word;line-height:1.35}.bubbleRow{text-align:left;clear:both}.bubbleRow.me{text-align:right}.bubble.me{background:#145437;border-bottom-right-radius:3px}.bubble.them{background:#172f47;border-bottom-left-radius:3px}.bubbleName{font-size:10px;color:#8ecbff;margin-bottom:2px}.bubbleTime{font-size:9px;color:#a9b9c7;margin-left:7px}.mediaMsg{max-width:230px;max-height:220px;border-radius:8px;display:block}.chatTools{display:flex;gap:5px;margin-top:7px}.chatTools input{flex:1}.chatTools button{min-width:44px}.chatReply{display:none;background:#0b2440;border-left:3px solid #52a7df;padding:7px;border-radius:7px;margin-top:6px;font-size:11px}.chatReply.show{display:block}.settingsItem{padding:11px;border-bottom:1px solid #173754}.statusTop{display:flex;gap:7px;margin-bottom:8px}.statusTop button{flex:1}.sideOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90}.sideOverlay.show{display:block}

<body>
<div id="loading"></div>

<div id="auth">
  <div class="logo">YOUR CHAT</div>
  <div class="sub">Chit Chat Plus</div>
  <div class="card">
    <span class="badge">LIVE FIREBASE • NO AI</span>

    <input id="username" maxlength="30" placeholder="Name / Username">

<div id="app" class="app hide">

<div id="bottom" class="bottom hide">
  <button onclick="homePage()">Home</button>
  <button onclick="worldPage()">World</button>
  <button onclick="usersPage()">Users</button>
  <button onclick="groupsPage()">Groups</button>

<div id="privateSettings" class="modal hide">

</div>

<script>

  authDomain: "chit-chat-plus-7382b.firebaseapp.com",

  storageBucket: "chit-chat-plus-7382b.firebasestorage.app",
  messagingSenderId: "98837732974",
  appId: "1:98837732974:web:ff52d3868871c91518507f",
  measurementId: "G-T42H2N5Q0Z"

var FALLBACK_AVATAR = "";

var me = null;
var meProfile = null;
var usersCache = [];
var currentScreen = "home";
var currentPrivateUid = "";
var currentPrivateName = "";
var currentGroupId = "";
var currentGroupName = "";

var groupUnsub = null;

var recording = null;
var recordingStream = null;

var notificationsEnabled = true;
var lastSendAt = 0;
var spamCount = 0;
var spamResetTimer = null;
var abusiveCount = 0;
var onlineTimer = null;
var statusTimer = null;
var blockedCache = {};
var blockedByMe = false;
var blockedMe = false;
var worldReply = null;
var chatReply = null;

function $(id){return document.getElementById(id)}
function esc(s){
  s = s === undefined || s === null ? "" : String(s);
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function nowMs(){return new Date().getTime()}
function avatar(src){ return src ? esc(src) : FALLBACK_AVATAR; }
function avatarHTML(src, cls){
  cls=cls||"avatar";
  if(src && String(src).trim()!=="") return '<img class="'+cls+'" src="'+esc(src)+'" alt="DP">';
  return '<span class="'+cls+' emptyDP" aria-label="No DP"></span>';
}
function tsTime(ts){
  var d = null;
  try{
    if(ts && ts.toDate){d=ts.toDate();}
    else if(ts instanceof Date){d=ts;}
  }catch(e){}
  if(!d){d=new Date();}
  var h=d.getHours(), m=d.getMinutes();
  var ap=h>=12?"PM":"AM";
  h=h%12; if(h===0)h=12;
  return h+":"+("0"+m).slice(-2)+" "+ap;
}
function msgText(s){
  var x=esc(s);
  x=x.replace(/(^|\s)@([A-Za-z0-9_]{3,24})/g,'$1<span class="mention">@$2</span>');
  return x;
}
function setMsg(text,ok){
  $("authMsg").className=ok?"ok":"err";
  $("authMsg").innerHTML=esc(text);
}
function showScreen(html,title,count){
  var h='<div class="card" style="margin-top:0"><b>'+esc(title)+'</b>';
  if(count!==undefined){h+='<span class="countBox headerBtn">'+esc(count)+'</span>';}
  h+='<div class="clear"></div></div>'+html;
  $("screen").innerHTML=h;
}
function errText(e){
  if(!e)return "Unknown error";
  var c=e.code||"";
  if(c.indexOf("email-already-in-use")>=0)return "Ye username pehle se bana hua hai.";
  if(c.indexOf("invalid-email")>=0)return "Username format theek nahi hai.";
  if(c.indexOf("weak-password")>=0)return "Password kam az kam 6 characters ka rakho.";
  if(c.indexOf("wrong-password")>=0)return "Password ghalat hai.";
  if(c.indexOf("user-not-found")>=0)return "Account nahi mila.";
  if(c.indexOf("invalid-credential")>=0)return "Username ya password ghalat hai.";
  if(c.indexOf("api-key-not-valid")>=0)return "Firebase API key/config issue hai.";
  if(c.indexOf("permission-denied")>=0)return "Firestore Rules ne access rok diya.";
  if(c.indexOf("failed-precondition")>=0)return "Firebase query/index issue hai.";
  return c+" "+(e.message||"");
}
function usernameEmail(u){
  var x=unescape(encodeURIComponent(String(u)));
  var h="u";
  for(var i=0;i<x.length;i++){
    var n=x.charCodeAt(i).toString(16);
    h+=("00"+n).slice(-2);
  }
  return h+"@chitchatplus.local";
}
function validUsername(u){
  u=String(u||"").replace(/^\s+|\s+$/g,"");
  if(u.length<2 || u.length>30)return false;
  for(var i=0;i<u.length;i++){
    var c=u.charCodeAt(i);
    if(c<32 || c===127)return false;
  }
  return true;
}

function dismissLoading(){
  var l=$("loading");
  if(l){l.style.display="none";}
}
setTimeout(dismissLoading,1500);
setTimeout(dismissLoading,3500);
window.onload=function(){dismissLoading();};

try{
  appFirebase=firebase.initializeApp(firebaseConfig);
  auth=firebase.auth();
  db=firebase.firestore();
  try{auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);}catch(e){}
}catch(e){
  setTimeout(function(){
    $("authMsg").className="err";
    $("authMsg").innerHTML="Firebase load nahi hua. Internet check karo.";
  },500);
}

function toggleAuthMode(){
  authCreateMode=!authCreateMode;
  $("authTitle").innerHTML=authCreateMode?"<b>Create Account</b>":"<b>Login</b>";
  $("authBtn").innerHTML=authCreateMode?"Create Account":"Login";
  $("modeBtn").innerHTML=authCreateMode?"Back to Login":"Create Account";
  $("authMsg").innerHTML="";
}

function authAction(){
  if(!auth){setMsg("Firebase ready nahi hai.",false);return;}
  var u=$("username").value.replace(/^\s+|\s+$/g,"");
  var p=$("password").value;
  if(!validUsername(u)){setMsg("Name 2–30 characters ka ho. Aap letters, numbers, space aur special characters bhi likh sakte ho.",false);return;}
  if(p.length<6){setMsg("Password kam az kam 6 characters ka hona chahiye.",false);return;}
  setMsg("Please wait...",true);
  if(authCreateMode){
    db.collection("users").where("username","==",u).limit(1).get().then(function(s){
      if(!s.empty)throw {code:"username-exists",message:"Username already exists"};
      return auth.createUserWithEmailAndPassword(usernameEmail(u),p);
    }).then(function(cr){
      me=cr.user;
      return db.collection("users").doc(me.uid).set({
        uid:me.uid,username:u,avatar:"",online:true,lastSeen:firebase.firestore.FieldValue.serverTimestamp(),createdAt:firebase.firestore.FieldValue.serverTimestamp()
      });
    }).then(function(){
      setMsg("Account ban gaya.",true);
    }).catch(function(e){
      if(e.code==="username-exists")setMsg("Ye username pehle se bana hua hai.",false);
      else setMsg(errText(e),false);
    });
  }else{
    auth.signInWithEmailAndPassword(usernameEmail(u),p).then(function(cr){
      me=cr.user;
      setMsg("Login ho gaya.",true);
    }).catch(function(e){setMsg(errText(e),false);});
  }
}

auth && auth.onAuthStateChanged(function(user){
  if(user){
    me=user;
    loadMyProfile(function(){
      $("auth").className="hide";
      $("app").className="app";
      $("bottom").className="bottom";
      homePage();
      setOnline(true);
      startOnlineHeartbeat();
      listenUsers();
      listenNotifications();
    });
  }else{
    me=null;
    $("auth").className="";
    $("app").className="app hide";
    $("bottom").className="bottom hide";
  }
});

function loadMyProfile(cb){
  db.collection("users").doc(me.uid).get().then(function(s){
    meProfile=s.exists?s.data():{uid:me.uid,username:(me.email||"User").split("@")[0],avatar:""};
    if(!s.exists){
      return db.collection("users").doc(me.uid).set({uid:me.uid,username:meProfile.username,avatar:"",online:true,lastSeen:firebase.firestore.FieldValue.serverTimestamp()});
    }
  }).then(function(){if(cb)cb();}).catch(function(e){alert(errText(e));});
}

function setOnline(v){
  if(!me)return;
  db.collection("users").doc(me.uid).update({online:v,lastSeen:firebase.firestore.FieldValue.serverTimestamp()}).catch(function(){});
}
function startOnlineHeartbeat(){
  if(onlineTimer)clearInterval(onlineTimer);
  onlineTimer=setInterval(function(){setOnline(true);},25000);
}
window.onbeforeunload=function(){setOnline(false);};

function listenUsers(){
  if(usersUnsub)usersUnsub();
  usersUnsub=db.collection("users").onSnapshot(function(s){
    usersCache=[];
    s.forEach(function(d){usersCache.push(d.data());});
    updateOnlineCount();
    if(currentScreen==="users")usersPage();
    if(currentScreen==="allusers")allUsersPage();
    if(currentScreen==="world")renderWorldOnlineList();
    if(currentScreen==="private")updatePrivateOnline();
  },function(e){console.log(e);});
}  },function(e){console.log(e);});
}
function isReallyOnline(u){
  if(!u)return false;
  if(!u.online)return false;
  var ms=0;
  try{if(u.lastSeen && u.lastSeen.toMillis)ms=u.lastSeen.toMillis();}catch(e){}
  return !ms || (nowMs()-ms<70000);
}
function updateOnlineCount(){
  var n=0,i;
  for(i=0;i<usersCache.length;i++)if(isReallyOnline(usersCache[i]))n++;
  var el=$("liveCount"); if(el)el.innerHTML="Online: "+n;
  var top=$("topUser"); if(top && meProfile)top.innerHTML="🟢 "+esc(meProfile.username);
}

function toggleSideMenu(){var m=$("sideMenu"),o=$("sideOverlay");if(m){m.className="sideMenu show";}if(o)o.className="sideOverlay show";}
function closeSideMenu(){var m=$("sideMenu"),o=$("sideOverlay");if(m)m.className="sideMenu";if(o)o.className="sideOverlay";}
function settingsPage(){
  currentScreen="settings";
  showScreen(

    '<div class="card settingsItem"><b>Notifications</b><br><span class="time">Private, mention aur group alerts.</span><button style="width:100%;margin-top:7px" onclick="toggleNotify()">Notifications ON/OFF</button></div>'+
    '<div class="card settingsItem"><b>Account</b><br><span class="time">'+esc(meProfile?meProfile.username:"")+'</span><button style="width:100%;margin-top:7px;background:#3a1c27" onclick="logout()">Logout</button></div>'+
    bottomBack(),"Settings"

}

  currentScreen="home";

    '<button class="menuBtn" onclick="worldPage()"><b>🌍 World Chat</b><span>Text + mentions + online count</span></button>'+

    '<button class="menuBtn" onclick="privatePickerPage()"><b>🔒 Private Chat</b><span>WhatsApp style text + voice + video + reply</span></button>'+
    '<button class="menuBtn" onclick="groupsPage()"><b>👨‍👩‍👧 Group Chat</b><span>Text + members list</span></button>'+
    '<button class="menuBtn" onclick="myStatusPage()"><b>🟢 My Status</b><span>Text status only</span></button>'+
    '<button class="menuBtn" onclick="friendsStatusPage()"><b>👀 Friends Status</b><span>Friends only</span></button>'+
    '<button class="menuBtn" onclick="notificationsPage()"><b>🔔 Notifications</b><span id="homeBadge">Messages and mentions</span></button>'+
    '</div>'+
    '<div class="notice">Chit Chat Plus • Digit/KaiOS friendly layout • AI disabled</div>',
    "Home"
  );
}

function bottomBack(){
  return '<button onclick="homePage()" style="margin-top:8px">← Home</button>';
}

function worldPage(){
  currentScreen="world";
  showScreen(
    '<div class="card"><span id="liveCount" class="countBox">Online: 0</span><span class="badge" style="float:right">TEXT ONLY</span><div class="clear"></div></div>'+
    '<div class="card"><b>🟢 Online Users / Mention</b><div id="worldOnlineList" style="margin-top:7px"><div class="notice">Online users loading...</div></div></div>'+
    '<div id="worldBox" class="chatBox"><div class="notice">Loading World Chat...</div></div>'+

function toggleVoice(){
  if(recording){stopVoice();return;}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){
    if(navigator.getUserMedia||navigator.mozGetUserMedia){
      alert("Is Digit browser mein MediaRecorder support nahi mil raha. Voice button tabhi kaam karega jab browser recording support kare.");
    }else{
      alert("Is browser mein microphone recording available nahi hai.");
    }
    return;
  }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    recordingStream=stream;
    var opt={audioBitsPerSecond:16000};
    try{recording=new MediaRecorder(stream,opt);}catch(e){recording=new MediaRecorder(stream);}
    var parts=[];
    recording.ondataavailable=function(e){if(e.data&&e.data.size)parts.push(e.data);};
    recording.onstop=function(){
      var blob=new Blob(parts,{type:recording.mimeType||"audio/webm"});
      stream.getTracks().forEach(function(t){try{t.stop();}catch(x){}});
      recording=null;recordingStream=null;
      if(blob.size>900000){alert("Voice bohat bari hai. Dobara chhoti recording karo.");return;}
      var r=new FileReader();
      r.onload=function(){sendVoiceData(r.result);};
      r.readAsDataURL(blob);
    };
    recording.start();
    $("voiceBtn").innerHTML="⏹ Stop Voice";
    $("voiceInfo").innerHTML="Recording chal rahi hai... 8 sec mein khud stop ho jayegi.";
    setTimeout(function(){if(recording)stopVoice();},8000);
  }).catch(function(e){alert("Microphone permission nahi mili: "+e.message);});
}
function stopVoice(){
  if(recording){try{recording.stop();}catch(e){}}
  $("voiceBtn").innerHTML="🎙️ Hold/Record Voice (max 8 sec)";
  $("voiceInfo").innerHTML="Voice save ho rahi hai...";

}
function createGroup(){
  var n=$("groupName").value.replace(/^\s+|\s+$/g,"");if(!n)return;
  db.collection("groups").add({name:n,ownerUid:me.uid,members:[me.uid],createdAt:firebase.firestore.FieldValue.serverTimestamp()}).then(function(){alert("Group ban gaya.");$("groupName").value="";}).catch(function(e){alert(errText(e));});
}
function openGroup(id,name){
  currentGroupId=id;currentGroupName=name;groupPage();
}
function groupPage(){
  currentScreen="group";
  showScreen(
    '<div class="card"><button class="smallBtn" onclick="groupsPage()">←</button> <b>'+esc(currentGroupName)+'</b><button class="smallBtn headerBtn" onclick="toggleMembers()">👥</button><div class="clear"></div><div id="memberBox" class="groupMemberBox"></div></div>'+
    '<div id="groupBox" class="waChat"><div class="notice">Loading...</div></div>'+
    '<div id="chatReplyBar" class="chatReply"></div>'+
    '<div class="chatTools"><input id="groupInput" placeholder="Message..." onkeyup="if(event.keyCode===13)sendGroup()"><button onclick="sendGroup()">➤</button></div>'+
    bottomBack(),"Group Chat");
  listenGroup();
}
function listenGroup(){
  if(groupUnsub)groupUnsub();
  groupUnsub=db.collection("groups").doc(currentGroupId).collection("messages").orderBy("createdAt","desc").limit(15).onSnapshot(function(s){
    var a=[];s.forEach(function(d){var x=d.data();x.id=d.id;a.push(x);});a.reverse();
    var h="",i;for(i=0;i<a.length;i++)h+=renderMessage(a[i],"group_"+currentGroupId);
    $("groupBox").innerHTML=h||'<div class="notice">Abhi koi message nahi.</div>';
    $("groupBox").scrollTop=$("groupBox").scrollHeight;
  },function(e){$("groupBox").innerHTML='<div class="err">'+esc(errText(e))+'</div>';});
}
function toggleMembers(){
  var box=$("memberBox");
  if(box.className.indexOf("show")>=0){box.className="groupMemberBox";return;}
  db.collection("groups").doc(currentGroupId).get().then(function(s){
    var g=s.data()||{},arr=g.members||[],h="",i,j,u;
    for(i=0;i<arr.length;i++){
      u=null;for(j=0;j<usersCache.length;j++)if(usersCache[j].uid===arr[i])u=usersCache[j];
      h+='<div class="userRow"><img class="avatar" src="'+avatar(u&&u.avatar)+'"><span class="userInfo"><b>'+esc(u?u.username:arr[i])+'</b></span></div>';
    }
    h+='<button style="width:100%" onclick="addGroupMember()">➕ Add Member</button>';
    box.innerHTML=h;box.className="groupMemberBox show";
  });
}
function addGroupMember(){
  var h="",i,u;
  for(i=0;i<usersCache.length;i++){
    u=usersCache[i];if(u.uid===me.uid)continue;
    h+='<div class="userRow"><span class="userInfo"><b>'+esc(u.username)+'</b></span><button class="smallBtn" onclick="addMemberNow(\''+esc(u.uid)+'\')">Add</button></div>';
  }
  $("memberBox").innerHTML=h;
}
function addMemberNow(uid){
  db.collection("groups").doc(currentGroupId).update({members:firebase.firestore.FieldValue.arrayUnion(uid)}).then(function(){alert("Member add ho gaya.");toggleMembers();}).catch(function(e){alert(errText(e));});
}
function sendGroup(){
  var b=$("groupInput"),t=b.value.replace(/^\s+|\s+$/g,"");if(!t)return;
  if(!spamAllowed())return;
  if(containsBadWord(t)){alert("Ye message allowed nahi hai.");return;}
  db.collection("groups").doc(currentGroupId).collection("messages").add({uid:me.uid,username:meProfile.username,avatar:meProfile.avatar||"",text:t,replyTo:chatReply||null,createdAt:firebase.firestore.FieldValue.serverTimestamp()}).then(function(){
    b.value="";clearReply();
    db.collection("groups").doc(currentGroupId).get().then(function(s){
      var g=s.data()||{},arr=g.members||[],i;
      for(i=0;i<arr.length;i++)if(arr[i]!==me.uid)addNotification(arr[i],"group",meProfile.username+" ne "+currentGroupName+" mein message bheja.",currentGroupId+"|"+currentGroupName);
    });
  }).catch(function(e){alert(errText(e));});
}

function myStatusPage(){
  currentScreen="mystatus";
  showScreen(
    '<div class="statusTop"><button onclick="myStatusPage()">◉ My Status</button><button onclick="privatePickerPage()">🔒 Private</button></div><div class="card"><b>My Status</b><textarea id="statusInput" maxlength="240" placeholder="Apna text status likho..."></textarea><button style="width:100%;margin-top:7px" onclick="postStatus()">Post Text Status</button></div>'+
    '<div class="card"><button style="width:100%" onclick="friendsStatusPage()">Friends Status →</button></div>'+
    '<div id="myStatusList"><div class="notice">Loading...</div></div>'+
    bottomBack(),
    "My Status"
  );
  listenMyStatus();
}
function postStatus(){
  var t=$("statusInput").value.replace(/^\s+|\s+$/g,"");if(!t)return;
  db.collection("statuses").add({uid:me.uid,username:meProfile.username,avatar:meProfile.avatar||"",text:t,createdAt:firebase.firestore.FieldValue.serverTimestamp(),reactions:[]}).then(function(){$("statusInput").value="";alert("Status lag gaya.");}).catch(function(e){alert(errText(e));});
}
function listenMyStatus(){
  db.collection("statuses").where("uid","==",me.uid).limit(20).onSnapshot(function(s){
    var a=[];s.forEach(function(d){var x=d.data();x.id=d.id;a.push(x);});
    a.sort(function(a,b){return timeVal(b.createdAt)-timeVal(a.createdAt);});
    var h="",i;for(i=0;i<a.length;i++)h+=statusItem(a[i],true);
    $("myStatusList").innerHTML=h||'<div class="notice">Abhi koi status nahi.</div>';
  });
}
function timeVal(ts){try{if(ts&&ts.toMillis)return ts.toMillis();}catch(e){}return 0;}
function friendsStatusPage(){
  currentScreen="friendsstatus";
  showScreen('<div id="friendsStatusList"><div class="notice">Loading friends status...</div></div><button onclick="myStatusPage()">← My Status</button>'+bottomBack(),"Friends Status");
  db.collection("friendRequests").where("status","==","accepted").get().then(function(s){
    var ids=[],i,d,x;
    s.forEach(function(doc){x=doc.data();if(x.fromUid===me.uid)ids.push(x.toUid);if(x.toUid===me.uid)ids.push(x.fromUid);});
    ids=unique(ids);
    if(!ids.length){$("friendsStatusList").innerHTML='<div class="notice">Abhi koi friend nahi.</div>';return;}
    var all=[],pending=ids.length;
    for(i=0;i<ids.length;i++){
      (function(uid){
        db.collection("statuses").where("uid","==",uid).limit(10).get().then(function(ss){
          ss.forEach(function(doc){var z=doc.data();z.id=doc.id;all.push(z);});
        }).then(function(){pending--;if(!pending)renderFriendStatuses(all);});
      })(ids[i]);
    }
  }).catch(function(e){$("friendsStatusList").innerHTML='<div class="err">'+esc(errText(e))+'</div>';});
}
function unique(a){var o={},r=[],i;for(i=0;i<a.length;i++)if(!o[a[i]]){o[a[i]]=1;r.push(a[i]);}return r;}
function statusItem(x,mine){
  return '<div class="statusItem">'+avatarHTML(x.avatar,"avatar")+' <b>'+esc(x.username)+'</b><span class="time">'+tsTime(x.createdAt)+'</span><div style="margin-top:7px;line-height:1.4">'+msgText(x.text)+'</div><div class="reactRow"><button onclick="statusReact(\''+esc(x.id)+'\')">❤️ React</button>'+(mine?'<button onclick="deleteStatus(\''+esc(x.id)+'\')">Delete</button>':'')+'</div></div>';
}
function renderFriendStatuses(a){
  a.sort(function(x,y){return timeVal(y.createdAt)-timeVal(x.createdAt);});
  var h="",i;for(i=0;i<a.length;i++)h+=statusItem(a[i],false);
  $("friendsStatusList").innerHTML=h||'<div class="notice">Friends ne abhi status nahi lagaya.</div>';
}
function statusReact(id){
  db.collection("statusReactions").doc(id+"_"+me.uid).set({
    statusId:id,uid:me.uid,emoji:"❤️",createdAt:firebase.firestore.FieldValue.serverTimestamp()
  },{merge:true}).then(function(){alert("❤️ Reaction save ho gayi.");}).catch(function(e){alert(errText(e));});
}
function deleteStatus(id){db.collection("statuses").doc(id).delete().catch(function(e){alert(errText(e)}));}

function addNotification(toUid,type,text,target){
  if(!notificationsEnabled)return;
  db.collection("notifications").add({toUid:toUid,fromUid:me.uid,fromUsername:meProfile.username,fromAvatar:meProfile.avatar||"",type:type,text:text,target:target||"",read:false,createdAt:firebase.firestore.FieldValue.serverTimestamp()}).catch(function(){});
}
function listenNotifications(){
  if(notifyUnsub)notifyUnsub();
  notifyUnsub=db.collection("notifications").where("toUid","==",me.uid).onSnapshot(function(s){
    var unread=0;s.forEach(function(d){if(!d.data().read)unread++;});
    var b=$("homeBadge");if(b)b.innerHTML=unread?("Unread: "+unread):"No new alerts";
  });
}
function notificationsPage(){
  currentScreen="notifications";
  showScreen('<div id="notifyList"><div class="notice">Loading...</div></div>'+bottomBack(),"Notifications");
  db.collection("notifications").where("toUid","==",me.uid).limit(30).get().then(function(s){
    var a=[];s.forEach(function(d){var x=d.data();x.id=d.id;a.push(x);});
    a.sort(function(x,y){return timeVal(y.createdAt)-timeVal(x.createdAt);});
    var h="",i;
    for(i=0;i<a.length;i++)h+='<div class="userRow"><img class="avatar" src="'+avatar(a[i].fromAvatar)+'"><span class="userInfo"><b>'+esc(a[i].fromUsername)+'</b><br>'+esc(a[i].text)+'<span class="time">'+tsTime(a[i].createdAt)+'</span></span><button class="smallBtn" onclick="openNotification(\''+esc(a[i].type)+'\',\''+esc(a[i].target)+'\')">Open</button></div>';
    $("notifyList").innerHTML=h||'<div class="notice">No notifications.</div>';
  });
}
function markNotificationsRead(target){
  if(!me)return;
  db.collection("notifications").where("toUid","==",me.uid).get().then(function(s){
    s.forEach(function(d){
      var x=d.data();
      if(!x.read && x.target===target)d.ref.update({read:true});
    });
  }).catch(function(){});
}
function openNotification(type,target){
  if(type==="private"){
    var parts=String(target).split("_"),uid=parts[0]===me.uid?parts[1]:parts[0];
    var u=findUserByUid(uid);if(u)openPrivate(u.uid,u.username);
  }else if(type==="mention")worldPage();
  else if(type==="group"){var x=String(target).split("|");openGroup(x[0],x[1]||"Group");}
  else if(type==="friend")friendRequestsPage();
}

function logout(){
  setOnline(false);
  if(worldUnsub)worldUnsub();if(privateUnsub)privateUnsub();if(groupUnsub)groupUnsub();
  if(usersUnsub)usersUnsub();if(notifyUnsub)notifyUnsub();
  auth.signOut();
}
</script>
</body>
</html>
