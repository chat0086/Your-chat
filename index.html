<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>YOUR CHAT</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#050b14;
 color:white;
}
button,input,textarea{font:inherit}
button{
 border:0;
 cursor:pointer;
}
.hidden{display:none!important}

#loading{
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 text-align:center;
 background:#050b14;
}
.loader{
 width:38px;
 height:38px;
 border:4px solid #17304b;
 border-top:4px solid #29a9ff;
 border-radius:50%;
 animation:spin 1s linear infinite;
 margin:20px auto;
}
@keyframes spin{
 to{transform:rotate(360deg)}
}

.screen{
 max-width:720px;
 margin:auto;
 min-height:100vh;
 padding:15px;
}

.card{
 background:#0d1928;
 border:1px solid #203b55;
 border-radius:18px;
 padding:15px;
 margin-bottom:12px;
}

.brand{
 text-align:center;
 font-size:25px;
 font-weight:bold;
 letter-spacing:5px;
 color:#42b5ff;
 margin-bottom:20px;
}

input,textarea{
 width:100%;
 padding:12px;
 margin:6px 0;
 border-radius:12px;
 border:1px solid #28445f;
 background:#07111f;
 color:white;
 outline:none;
}

button{
 padding:12px 15px;
 border-radius:12px;
 background:#147ed4;
 color:white;
 font-weight:bold;
}

.secondary{
 background:#162b40;
}

.danger{
 background:#a52d3d;
}

.row{
 display:flex;
 gap:8px;
 align-items:center;
}

.row>*{
 flex:1;
}

.top{
 display:flex;
 align-items:center;
 gap:10px;
 margin-bottom:12px;
}

.spacer{
 flex:1;
}

.avatar{
 width:46px;
 height:46px;
 border-radius:50%;
 object-fit:cover;
 background:#18324b;
 display:flex;
 justify-content:center;
 align-items:center;
 font-weight:bold;
 color:#8bd5ff;
}

.avatar.big{
 width:85px;
 height:85px;
}

.nav{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
}

.nav button{
 min-height:60px;
}

.chatlist{
 height:55vh;
 overflow-y:auto;
 padding:5px;
}

.msg{
 background:#102238;
 border-radius:14px;
 padding:10px;
 margin:7px 0;
 max-width:88%;
 word-break:break-word;
}

.mine{
 margin-left:auto;
 background:#075f9f;
}

.msg small{
 display:block;
 color:#9bb1c7;
 font-size:10px;
 margin-top:5px;
}

.media{
 max-width:100%;
 border-radius:12px;
 margin-top:7px;
}

.actions{
 display:flex;
 flex-wrap:wrap;
 gap:6px;
 margin-top:6px;
}

.actions button{
 padding:7px 10px;
 font-size:12px;
 background:#17304a;
}

.user{
 display:flex;
 align-items:center;
 gap:10px;
 padding:10px;
 border-bottom:1px solid #193047;
}

.user>div:nth-child(2){
 flex:1;
}

.status-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;
}

.status-card{
 background:#102238;
 border-radius:14px;
 overflow:hidden;
}

.status-card img,
.status-card video{
 width:100%;
 height:180px;
 object-fit:cover;
}

.muted{
 color:#91a7bb;
 font-size:13px;
}

.modal{
 position:fixed;
 inset:0;
 background:#000b;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:15px;
 z-index:99;
}

.modal .card{
 width:min(600px,100%);
 max-height:90vh;
 overflow:auto;
}

@media(min-width:600px){
 .nav{
  grid-template-columns:repeat(5,1fr);
 }
}
</style>
</head>

<body>

<div id="loading">
 <div>
  <div class="brand">YOUR CHAT</div>
  <div class="loader"></div>
  <div>Connecting to the world...</div>
  <p id="loadError" class="muted"></p>
  <button id="retry" class="hidden">Retry</button>
 </div>
</div>

<div id="app" class="hidden"></div>

<div id="modal" class="modal hidden"></div>


<script type="module">

/* =========================
   FIREBASE CONFIG
========================= */

import {
 initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
 getAuth,
 onAuthStateChanged,
 createUserWithEmailAndPassword,
 signInWithEmailAndPassword,
 signOut,
 updateProfile
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
 getFirestore,
 collection,
 doc,
 setDoc,
 getDoc,
 addDoc,
 updateDoc,
 deleteDoc,
 query,
 orderBy,
 limit,
 onSnapshot,
 where,
 getDocs,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

import {
 getStorage,
 ref,
 uploadBytes,
 getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-storage.js";


const firebaseConfig = {

 apiKey:
 "AIzaSyBmyYllEtZCm7yDsmqAsqdRNmxBjPSiCyQ",

 authDomain:
 "your-chat-24913.firebaseapp.com",

 projectId:
 "your-chat-24913",

 storageBucket:
 "your-chat-24913.firebasestorage.app",

 messagingSenderId:
 "700520326360",

 appId:
 "1:700520326360:web:a3dc5fd4e36b54dbb563ad",

 measurementId:
 "G-7JBWVDK838"
};


const firebaseApp =
 initializeApp(firebaseConfig);

const auth =
 getAuth(firebaseApp);

const db =
 getFirestore(firebaseApp);

const storage =
 getStorage(firebaseApp);


/* =========================
   VARIABLES
========================= */

let me=null;
let profile=null;
let currentScreen="home";
let selectedUser=null;
let selectedGroup=null;
let unsubscribers=[];

const $=id=>document.getElementById(id);


/* =========================
   HELPERS
========================= */

function esc(value){

 return String(value ?? "")
 .replace(/[&<>"']/g,c=>({

 "&":"&amp;",
 "<":"&lt;",
 ">":"&gt;",
 '"':"&quot;",
 "'":"&#39;"

 }[c]));

}


function usernameEmail(username){

 return username.toLowerCase()
 +"@yourchat.local";

}


function avatar(username,photo,big=false){

 if(photo){

  return `
  <img
   class="avatar ${big?"big":""}"
   src="${esc(photo)}"
  >`;

 }

 return `
 <div class="avatar ${big?"big":""}">
 ${esc((username||"?")[0].toUpperCase())}
 </div>`;

}


function cleanup(){

 unsubscribers.forEach(fn=>{
  try{fn()}catch(e){}
 });

 unsubscribers=[];

}


function loading(show){

 $("loading")
 .classList.toggle("hidden",!show);

}


/* =========================
   AUTH SCREEN
========================= */

function showAuth(){

 loading(false);

 $("app").classList.remove("hidden");

 $("app").innerHTML=`

 <div class="screen"
 style="display:flex;align-items:center;justify-content:center">

 <div class="card" style="width:100%;max-width:430px">

 <div class="brand">
 YOUR CHAT
 </div>

 <h2 style="text-align:center">
 Welcome
 </h2>

 <input
 id="username"
 placeholder="Username"
 >

 <input
 id="password"
 type="password"
 placeholder="Password"
 >

 <div class="row">

 <button id="loginBtn">
 Login
 </button>

 <button
 id="createBtn"
 class="secondary">
 Create Account
 </button>

 </div>

 <p
 id="authError"
 class="muted">
 </p>

 </div>

 </div>
 `;


 $("loginBtn").onclick=()=>login(false);

 $("createBtn").onclick=()=>login(true);

}


async function login(create){

 const username=
 $("username").value.trim();

 const password=
 $("password").value;

 if(!/^[A-Za-z0-9_]{3,24}$/.test(username)){

  $("authError").textContent=
  "Username 3-24 letters/numbers/_ hona chahiye.";

  return;

 }

 if(password.length<6){

  $("authError").textContent=
  "Password kam az kam 6 characters ka ho.";

  return;

 }

 try{

  let result;

  if(create){

   result=
   await createUserWithEmailAndPassword(
    auth,
    usernameEmail(username),
    password
   );

   await updateProfile(
    result.user,
    {
     displayName:username
    }
   );

   await setDoc(
    doc(db,"users",result.user.uid),
    {
     uid:result.user.uid,
     username:username,
     photo:"",
     online:true,
     createdAt:serverTimestamp(),
     lastSeen:serverTimestamp()
    }
   );

  }else{

   result=
   await signInWithEmailAndPassword(
    auth,
    usernameEmail(username),
    password
   );

  }

 }catch(error){

  $("authError").textContent=
  error.message;

 }

}


/* =========================
   PROFILE
========================= */

async function loadProfile(){

 const snap=
 await getDoc(
  doc(db,"users",me.uid)
 );

 if(snap.exists()){

  profile=snap.data();

 }else{

  profile={
   uid:me.uid,
   username:me.displayName||"User",
   photo:""
  };

  await setDoc(
   doc(db,"users",me.uid),
   profile
  );

 }

 await updateDoc(
  doc(db,"users",me.uid),
  {
   online:true,
   lastSeen:serverTimestamp()
  }
 );

}


/* =========================
   MAIN LAYOUT
========================= */

function layout(){

 $("app").innerHTML=`

 <div class="screen">

 <div class="top">

 <button
 id="backBtn"
 class="secondary">
 ←
 </button>

 <div>

 <b>YOUR CHAT</b>

 <div class="muted">
 ${esc(currentScreen)}
 </div>

 </div>

 <div class="spacer"></div>

 ${avatar(
  profile.username,
  profile.photo
 )}

 </div>

 <div id="content"></div>

 </div>
 `;


 $("backBtn").onclick=()=>{

  if(currentScreen!=="home"){

   currentScreen="home";

   render();

  }

 };

}


function render(){

 cleanup();

 if(!me){

  showAuth();

  return;

 }

 layout();

 const content=$("content");

 if(currentScreen==="home")
 renderHome(content);

 else if(currentScreen==="world")
 renderWorld(content);

 else if(currentScreen==="users")
 renderUsers(content);

 else if(currentScreen==="private")
 renderPrivate(content);

 else if(currentScreen==="groups")
 renderGroups(content);

 else if(currentScreen==="status")
 renderStatus(content);

 else if(currentScreen==="settings")
 renderSettings(content);

}


/* =========================
   HOME
========================= */

function renderHome(c){

 c.innerHTML=`

 <div class="card">

 <h2>
 Welcome, ${esc(profile.username)}
 </h2>

 <p class="muted">
 Choose an option
 </p>

 <div class="nav">

 <button data-screen="world">
 🌍 World Chat
 </button>

 <button data-screen="users">
 🟢 Online Users
 </button>

 <button data-screen="private">
 💬 Private Chat
 </button>

 <button data-screen="groups">
 👥 Group Chat
 </button>

 <button data-screen="users">
 👤 All Users
 </button>

 <button data-screen="status"
 class="secondary">
 ⭕ Status
 </button>

 <button data-screen="settings"
 class="secondary">
 ⚙️ Settings
 </button>

 </div>

 </div>
 `;


 c.querySelectorAll("[data-screen]")
 .forEach(btn=>{

  btn.onclick=()=>{

   currentScreen=
   btn.dataset.screen;

   render();

  };

 });

}


/* =========================
   WORLD CHAT
========================= */

function renderWorld(c){

 c.innerHTML=`

 <div class="card">

 <div class="row">

 <b>🌍 World Chat</b>

 <span
 id="onlineCount"
 class="muted">
 Online...
 </span>

 </div>

 <div
 id="worldMessages"
 class="chatlist">
 </div>

 <textarea
 id="worldText"
 rows="2"
 placeholder="Write message...">
 </textarea>

 <div class="row">

 <button id="worldSend">
 Send
 </button>

 <button
 id="mentionBtn"
 class="secondary">
 @ Mention
 </button>

 </div>

 <div class="actions">

 <button id="worldVoice">
 🎙 Voice
 </button>

 <label class="secondary"
 style="padding:10px;border-radius:12px">

 📷 Media

 <input
 id="worldFile"
 type="file"
 accept="image/*,video/*"
 hidden>

 </label>

 </div>

 </div>
 `;


 const q=query(
  collection(db,"worldMessages"),
  orderBy("createdAt","desc"),
  limit(12)
 );


 unsubscribers.push(
  onSnapshot(q,snap=>{

   const messages=
   snap.docs
   .map(d=>({
    id:d.id,
    ...d.data()
   }))
   .reverse();

   $("worldMessages").innerHTML=
   messages.map(messageHTML).join("");

  })
 );


 const uq=query(
  collection(db,"users"),
  where("online","==",true)
 );


 unsubscribers.push(
  onSnapshot(uq,snap=>{

   $("onlineCount").textContent=
   snap.size+" online";

  })
 );


 $("worldSend").onclick=
 sendWorld;

 $("mentionBtn").onclick=
 mentionUsers;

 $("worldFile").onchange=
 e=>uploadWorldFile(e.target.files[0]);

}


/* =========================
   MESSAGE HTML
========================= */

function messageHTML(m){

 const mine=
 m.uid===me.uid;

 let media="";

 if(m.type==="image"){

  media=
  `<img
   class="media"
   src="${esc(m.url)}">`;

 }

 if(m.type==="video"){

  media=
  `<video
   class="media"
   controls
   src="${esc(m.url)}">
   </video>`;

 }

 if(m.type==="voice"){

  media=
  `<audio
   class="media"
   controls
   src="${esc(m.url)}">
   </audio>`;

 }

 return `

 <div class="msg ${mine?"mine":""}">

 <b>
 ${esc(m.username||"User")}
 </b>

 <div>
 ${esc(m.text||"")}
 </div>

 ${media}

 <small>
 ${m.createdAt?.toDate
 ?m.createdAt.toDate().toLocaleString()
 :"now"}
 </small>

 ${
 mine
 ?
 `<div class="actions">

 <button
 onclick="editWorld('${m.id}')">
 Edit
 </button>

 <button
 onclick="deleteWorld('${m.id}')">
 Delete
 </button>

 <button
 onclick="reactWorld('${m.id}')">
 ❤️
 </button>

 </div>`
 :""
 }

 </div>

 `;

}


/* =========================
   WORLD SEND
========================= */

async function sendWorld(){

 const box=$("worldText");

 const text=
 box.value.trim();

 if(!text)return;

 await addDoc(
  collection(db,"worldMessages"),
  {
   uid:me.uid,
   username:profile.username,
   text:text,
   type:"text",
   createdAt:serverTimestamp()
  }
 );

 box.value="";

}


window.editWorld=
async function(id){

 const text=
 prompt("New message:");

 if(!text)return;

 await updateDoc(
  doc(db,"worldMessages",id),
  {
   text:text,
   edited:true
  }
 );

};


window.deleteWorld=
async function(id){

 if(!confirm("Delete message?"))
 return;

 await deleteDoc(
  doc(db,"worldMessages",id)
 );

};


window.reactWorld=
async function(id){

 await updateDoc(
  doc(db,"worldMessages",id),
  {
   reaction:"❤️"
  }
 );

};


/* =========================
   MENTION
========================= */

async function mentionUsers(){

 const snap=
 await getDocs(
  query(
   collection(db,"users"),
   where("online","==",true),
   limit(30)
  )
 );

 $("modal").classList.remove("hidden");

 $("modal").innerHTML=`

 <div class="card">

 <h3>
 Online Users
 </h3>

 ${
 snap.docs
 .filter(d=>d.id!==me.uid)
 .map(d=>{

  const u=d.data();

  return `
  <button
   style="width:100%;margin:4px 0"
   onclick="insertMention('${esc(u.username)}')">

   @${esc(u.username)}

  </button>
  `;

 }).join("")
 }

 <button
 id="closeModal"
 class="secondary">
 Close
 </button>

 </div>
 `;

 $("closeModal").onclick=
 ()=>$("modal").classList.add("hidden");

}


window.insertMention=
function(username){

 $("worldText").value+=
 " @"+username+" ";

 $("modal")
 .classList.add("hidden");

};


/* =========================
   WORLD MEDIA
========================= */

async function uploadWorldFile(file){

 if(!file)return;

 if(file.size>25*1024*1024){

  alert("Maximum 25MB.");

  return;

 }

 const type=
 file.type.startsWith("image/")
 ?"image":
 file.type.startsWith("video/")
 ?"video":
 "file";

 try{

  const storageRef=
  ref(
   storage,
   "messages/"
   +me.uid+"/"
   +Date.now()+"_"+file.name
  );

  await uploadBytes(
   storageRef,
   file
  );

  const url=
  await getDownloadURL(
   storageRef
  );

  await addDoc(
   collection(db,"worldMessages"),
   {
    uid:me.uid,
    username:profile.username,
    type:type,
    url:url,
    text:"",
    createdAt:serverTimestamp()
   }
  );

 }catch(e){

  alert(e.message);

 }

}


/* =========================
   USERS
========================= */

function renderUsers(c){

 c.innerHTML=`

 <div class="card">

 <h3>
 👥 Users
 </h3>

 <input
 id="userSearch"
 placeholder="Search username">

 <div id="userList"></div>

 </div>
 `;


 const q=query(
  collection(db,"users"),
  orderBy("username"),
  limit(100)
 );


 unsubscribers.push(
  onSnapshot(q,snap=>{

   showUsers(
    snap.docs.map(d=>d.data())
   );

  })
 );


 $("userSearch").oninput=async()=>{

  const term=
  $("userSearch").value
  .toLowerCase();

  const snap=
  await getDocs(
   query(
    collection(db,"users"),
    orderBy("username"),
    limit(100)
   )
  );

  showUsers(
   snap.docs
   .map(d=>d.data())
   .filter(u=>
    u.username
    ?.toLowerCase()
    .includes(term)
   )
  );

 };

}


function showUsers(users){

 $("userList").innerHTML=
 users.map(u=>`

 <div class="user">

 ${avatar(
  u.username,
  u.photo
 )}

 <div>

 <b>
 ${esc(u.username)}
 </b>

 <div class="muted">
 ${u.online?"🟢 Online":"Offline"}
 </div>

 </div>

 ${
 u.uid!==me.uid
 ?
 `<button
 onclick='openPrivate(
 "${esc(u.uid)}",
 "${esc(u.username)}",
 "${esc(u.photo||"")}"
 )'>
 Chat
 </button>`
 :""
 }

 </div>

 `).join("");

}


window.openPrivate=
function(uid,username,photo){

 selectedUser={
  uid,
  username,
  photo
 };

 currentScreen=
 "private";

 render();

};


/* =========================
   PRIVATE CHAT
========================= */

function privateId(a,b){

 return [a,b]
 .sort()
 .join("_");

}


function renderPrivate(c){

 if(!selectedUser){

  c.innerHTML=`

  <div class="card">

  <h3>
  💬 Private Chat
  </h3>

  <p class="muted">
  First choose a user.
  </p>

  <button id="chooseUser">
  Choose User
  </button>

  </div>
  `;

  $("chooseUser").onclick=()=>{

   currentScreen="users";

   render();

  };

  return;

 }


 const chatId=
 privateId(
  me.uid,
  selectedUser.uid
 );


 c.innerHTML=`

 <div class="card">

 <div class="user">

 ${avatar(
  selectedUser.username,
  selectedUser.photo
 )}

 <div>

 <b>
 ${esc(selectedUser.username)}
 </b>

 <div class="muted">
 Private Chat
 </div>

 </div>

 </div>


 <div
 id="privateMessages"
 class="chatlist">
 </div>


 <textarea
 id="privateText"
 rows="2"
 placeholder="Message...">
 </textarea>


 <div class="row">

 <button
 id="privateSend">
 Send
 </button>

 <button
 id="privateVoice"
 class="secondary">
 🎙
 </button>

 </div>


 <div class="actions">

 <label class="secondary"
 style="padding:10px;border-radius:12px">

 📷🎥 Media

 <input
 id="privateFile"
 type="file"
 accept="image/*,video/*"
 hidden>

 </label>

 <button
 id="blockUser"
 class="danger">
 Block
 </button>

 </div>

 </div>
 `;


 const q=query(
  collection(
   db,
   "chats",
   chatId,
   "messages"
  ),
  orderBy("createdAt","desc"),
  limit(12)
 );


 unsubscribers.push(
  onSnapshot(q,snap=>{

   const arr=
   snap.docs
   .map(d=>({
    id:d.id,
    ...d.data()
   }))
   .reverse();

   $("privateMessages").innerHTML=
   arr.map(messageHTML).join("");

  })
 );


 $("privateSend").onclick=
 async()=>{

  const text=
  $("privateText").value.trim();

  if(!text)return;

  await addDoc(
   collection(
    db,
    "chats",
    chatId,
    "messages"
   ),
   {
    uid:me.uid,
    to:selectedUser.uid,
    username:profile.username,
    text:text,
    type:"text",
    createdAt:serverTimestamp()
   }
  );

  $("privateText").value="";

 };


 $("privateFile").onchange=
 async e=>{

  const file=e.target.files[0];

  if(!file)return;

  const type=
  file.type.startsWith("image/")
  ?"image":"video";

  const r=
  ref(
   storage,
   "private/"
   +me.uid+"/"
   +Date.now()+"_"+file.name
  );

  await uploadBytes(r,file);

  const url=
  await getDownloadURL(r);

  await addDoc(
   collection(
    db,
    "chats",
    chatId,
    "messages"
   ),
   {
    uid:me.uid,
    to:selectedUser.uid,
    username:profile.username,
    type:type,
    url:url,
    createdAt:serverTimestamp()
   }
  );

 };


 $("blockUser").onclick=
 async()=>{

  await setDoc(
   doc(
    db,
    "blocks",
    me.uid+"_"+selectedUser.uid
   ),
   {
    uid:me.uid,
    blocked:selectedUser.uid,
    createdAt:serverTimestamp()
   }
  );

  alert("User blocked.");

 };

}


/* =========================
   GROUPS
========================= */

function renderGroups(c){

 c.innerHTML=`

 <div class="card">

 <div class="row">

 <h3>
 👥 Group Chat
 </h3>

 <button id="newGroup">
 + New Group
 </button>

 </div>

 <div id="groupsList"></div>

 </div>
 `;


 const q=query(
  collection(db,"groups"),
  orderBy("name"),
  limit(50)
 );


 unsubscribers.push(
  onSnapshot(q,snap=>{

   $("groupsList").innerHTML=
   snap.docs.map(d=>{
