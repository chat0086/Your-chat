<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Your Chat</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#020b18;
  color:#fff;
  font-family:Arial,sans-serif;
}
button,input,textarea{font:inherit}
button{cursor:pointer}

#loading{
  position:fixed;
  inset:0;
  background:#020b18;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}
.loadingBox{
  width:90%;
  max-width:420px;
  background:#0d1b2d;
  border:1px solid #21466c;
  border-radius:25px;
  padding:35px 25px;
  text-align:center;
}
.logo{
  color:#4eb4ff;
  font-size:38px;
  font-weight:bold;
  letter-spacing:5px;
}
.loader{
  width:34px;
  height:34px;
  border:4px solid #24415d;
  border-top-color:#2498ed;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:25px auto 12px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.small{color:#8da5bd;font-size:14px}

#app{display:none;min-height:100vh}

.top{
  height:65px;
  background:#0a1727;
  border-bottom:1px solid #193753;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  position:sticky;
  top:0;
  z-index:20;
}
.topTitle{
  color:#4eb4ff;
  font-weight:bold;
  letter-spacing:2px;
}
.iconBtn{
  background:#132940;
  color:white;
  border:0;
  border-radius:12px;
  padding:10px 13px;
}

.page{
  width:94%;
  max-width:700px;
  margin:18px auto 90px;
}

.card{
  background:#0b192b;
  border:1px solid #204260;
  border-radius:20px;
  padding:18px;
  margin-bottom:15px;
}

.auth{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}
.authBox{
  width:100%;
  max-width:590px;
  background:#0d1b2d;
  border:1px solid #234765;
  border-radius:28px;
  padding:30px;
  text-align:center;
}
.authTitle{
  color:#4eb4ff;
  font-size:38px;
  letter-spacing:5px;
  font-weight:bold;
  margin-bottom:20px;
}
.authBox h2{margin:8px 0 25px}
.input{
  width:100%;
  background:#050e1c;
  color:#fff;
  border:1px solid #2b4b69;
  border-radius:15px;
  padding:16px;
  margin:7px 0;
  outline:none;
}
.input:focus{border-color:#2196ee}

.row{
  display:flex;
  gap:10px;
}
.row>*{flex:1}

.btn{
  border:0;
  border-radius:15px;
  padding:15px;
  font-weight:bold;
  color:#fff;
  background:#188ce0;
  width:100%;
  margin-top:8px;
}
.btn2{background:#132b43}
.btnDanger{background:#7b2631}

.error{
  color:#ff9b9b;
  margin-top:12px;
  line-height:1.4;
  font-size:14px;
}

.menuGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.menuBtn{
  min-height:90px;
  background:#0d2035;
  border:1px solid #244765;
  color:#fff;
  border-radius:18px;
  padding:15px;
  text-align:left;
}
.menuBtn b{display:block;font-size:17px;margin-bottom:7px}
.menuBtn span{color:#7895af;font-size:12px}

.sectionTitle{
  font-size:21px;
  font-weight:bold;
  margin-bottom:14px;
}

.message{
  padding:12px;
  border-bottom:1px solid #18334c;
}
.message:last-child{border-bottom:0}
.msgUser{color:#4eb4ff;font-weight:bold}
.msgTime{color:#718ba4;font-size:11px;margin-left:5px}
.msgText{margin-top:5px;white-space:pre-wrap;word-break:break-word}

.chatInput{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:#071426;
  border-top:1px solid #193753;
  padding:10px;
  z-index:30;
}
.chatInner{
  max-width:700px;
  margin:auto;
  display:flex;
  gap:8px;
}
.chatInner input{margin:0}
.sendBtn{
  width:75px;
  border:0;
  border-radius:13px;
  background:#188ce0;
  color:white;
  font-weight:bold;
}

.user{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px 5px;
  border-bottom:1px solid #18334c;
}
.onlineDot{
  width:9px;
  height:9px;
  background:#32d583;
  border-radius:50%;
  display:inline-block;
  margin-right:7px;
}

.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:62px;
  background:#091728;
  border-top:1px solid #1d3b57;
  display:flex;
  justify-content:space-around;
  z-index:25;
}
.nav button{
  background:none;
  border:0;
  color:#8ca4ba;
  font-size:12px;
}
.nav button.active{color:#4eb4ff}

.hide{display:none!important}

@media(max-width:430px){
  .authBox{padding:22px}
  .authTitle{font-size:31px}
  .menuGrid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<!-- LOADING -->
<div id="loading">
  <div class="loadingBox">
    <div class="logo">YOUR CHAT</div>
    <div class="loader"></div>
    <div id="loadingText" class="small">Connecting to the world...</div>
    <button id="retryBtn" class="btn hide" onclick="location.reload()">Retry</button>
  </div>
</div>

<!-- APP -->
<div id="app">

  <div id="authScreen" class="auth hide">
    <div class="authBox">
      <div class="authTitle">YOUR CHAT</div>
      <h2>Welcome</h2>

      <input id="username" class="input" maxlength="24"
             placeholder="Username">

      <input id="password" class="input" type="password"
             placeholder="Password">

      <div class="row">
        <button class="btn" onclick="login()">Login</button>
        <button class="btn btn2" onclick="createAccount()">Create Account</button>
      </div>

      <div id="authError" class="error"></div>
    </div>
  </div>

  <div id="mainScreen" class="hide">

    <div class="top">
      <div class="topTitle">YOUR CHAT</div>
      <button class="iconBtn" onclick="openPage('settings')">⚙</button>
    </div>

    <div id="page" class="page"></div>

    <div class="nav">
      <button id="navHome" onclick="openPage('home')">⌂<br>Home</button>
      <button id="navWorld" onclick="openPage('world')">🌎<br>World</button>
      <button id="navUsers" onclick="openPage('users')">👥<br>Users</button>
      <button id="navGroups" onclick="openPage('groups')">▣<br>Groups</button>
      <button id="navPrivate" onclick="openPage('private')">💬<br>Private</button>
    </div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
/* =========================================================
   YOUR CHAT - FIREBASE CONFIG
   ========================================================= */

const firebaseConfig = {
  apiKey: "AIzaSyBmyYlEtZCm7yDsmqAsqdRNmxBjPSiCyQ",
  authDomain: "your-chat-24913.firebaseapp.com",
  projectId: "your-chat-24913",
  storageBucket: "your-chat-24913.firebasestorage.app",
  messagingSenderId: "700520326360",
  appId: "1:700520326360:web:a3dc5fd4e36b54dbb563ad",
  measurementId: "G-7JBWVDK838"
};

let auth = null;
let db = null;
let currentUser = null;
let profile = {};
let unsubscribe = null;
let currentPage = "home";

/* =========================================================
   ERROR HANDLING
   ========================================================= */

window.onerror = function(message){
  console.error(message);
};

window.addEventListener("unhandledrejection",function(e){
  console.error(e.reason);
});

function bootError(message){
  document.getElementById("loadingText").innerHTML =
    "Firebase error:<br><br>" + escapeHtml(message);

  document.querySelector(".loader").style.display="none";
  document.getElementById("retryBtn").classList.remove("hide");
}

/* =========================================================
   HELPERS
   ========================================================= */

function escapeHtml(value){
  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function cleanUsername(name){
  return String(name || "").trim();
}

function usernameEmail(name){
  return cleanUsername(name).toLowerCase()+"@yourchat.local";
}

function validUsername(name){
  return /^[A-Za-z0-9_]{3,24}$/.test(name);
}

function showLoading(text){
  document.getElementById("loading").style.display="flex";
  document.getElementById("loadingText").textContent=text || "Connecting to the world...";
  document.querySelector(".loader").style.display="block";
  document.getElementById("retryBtn").classList.add("hide");
}

function hideLoading(){
  document.getElementById("loading").style.display="none";
}

function showAuth(){
  hideLoading();
  document.getElementById("authScreen").classList.remove("hide");
  document.getElementById("mainScreen").classList.add("hide");
}

function showMain(){
  hideLoading();
  document.getElementById("authScreen").classList.add("hide");
  document.getElementById("mainScreen").classList.remove("hide");
}

function formatTime(ts){
  try{
    if(!ts) return "";
    const d=ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleTimeString([],{
      hour:"2-digit",
      minute:"2-digit"
    });
  }catch(e){return "";}
}

function withTimeout(promise,ms){
  return Promise.race([
    promise,
    new Promise((_,reject)=>
      setTimeout(()=>reject(new Error("Connection timed out")),ms)
    )
  ]);
}

/* =========================================================
   FIREBASE START
   ========================================================= */

try{

  if(!window.firebase){
    throw new Error("Firebase SDK did not load.");
  }

  firebase.initializeApp(firebaseConfig);

  auth=firebase.auth();
  db=firebase.firestore();

  /* Auth listener */
  auth.onAuthStateChanged(async function(user){

    currentUser=user;

    if(!user){
      showAuth();
      return;
    }

    showLoading("Loading your account...");

    profile={
      uid:user.uid,
      username:user.displayName || "User"
    };

    try{
      await loadProfile();
    }catch(e){
      console.warn("Profile:",e);
    }

    setTimeout(function(){
      showMain();
      openPage("home");
    },1200);
  });

}catch(e){
  console.error(e);
  bootError(e.message || "Firebase could not start.");
}

/* =========================================================
   PROFILE
   ========================================================= */

async function loadProfile(){

  if(!currentUser) return;

  try{

    const ref=db.collection("users").doc(currentUser.uid);

    const snap=await withTimeout(ref.get(),5000);

    if(snap.exists){
      profile=Object.assign(profile,snap.data());
    }

    const username=
      profile.username ||
      currentUser.displayName ||
      "User";

    await ref.set({
      uid:currentUser.uid,
      username:username,
      online:true,
      lastSeen:firebase.firestore.FieldValue.serverTimestamp()
    },{merge:true});

  }catch(e){
    console.warn("Profile sync failed:",e);
  }
}

/* =========================================================
   ACCOUNT
   ========================================================= */

async function login(){

  const name=cleanUsername(document.getElementById("username").value);
  const pass=document.getElementById("password").value;
  const error=document.getElementById("authError");

  error.textContent="";

  if(!validUsername(name)){
    error.textContent="Username 3-24 characters ka ho: A-Z, a-z, 0-9 ya _.";
    return;
  }

  if(pass.length<6){
    error.textContent="Password kam az kam 6 characters ka hona chahiye.";
    return;
  }

  try{

    showLoading("Logging in...");

    await auth.signInWithEmailAndPassword(
      usernameEmail(name),
      pass
    );

  }catch(e){

    hideLoading();

    error.textContent=
      "Login failed: "+friendlyError(e);

  }
}

async function createAccount(){

  const name=cleanUsername(document.getElementById("username").value);
  const pass=document.getElementById("password").value;
  const error=document.getElementById("authError");

  error.textContent="";

  if(!validUsername(name)){
    error.textContent="Username 3-24 characters ka ho: A-Z, a-z, 0-9 ya _.";
    return;
  }

  if(pass.length<6){
    error.textContent="Password kam az kam 6 characters ka hona chahiye.";
    return;
  }

  try{

    showLoading("Creating your account...");

    const result=await auth.createUserWithEmailAndPassword(
      usernameEmail(name),
      pass
    );

    await result.user.updateProfile({
      displayName:name
    });

    await db.collection("users").doc(result.user.uid).set({
      uid:result.user.uid,
      username:name,
      online:true,
      createdAt:firebase.firestore.FieldValue.serverTimestamp(),
      lastSeen:firebase.firestore.FieldValue.serverTimestamp()
    },{merge:true});

  }catch(e){

    hideLoading();

    error.textContent=
      "Create account failed: "+friendlyError(e);

  }
}

function friendlyError(e){

  const code=e && e.code ? e.code : "";

  if(code==="auth/invalid-api-key")
    return "Firebase API key invalid hai.";

  if(code==="auth/invalid-credential")
    return "Username ya password ghalat hai.";

  if(code==="auth/email-already-in-use")
    return "Ye username pehle se bana hua hai.";

  if(code==="auth/weak-password")
    return "Password kam az kam 6 characters ka hona chahiye.";

  if(code==="auth/network-request-failed")
    return "Internet connection check karo.";

  if(code==="permission-denied")
    return "Firebase Firestore permission denied.";

  return e && e.message ? e.message : "Unknown error";
}

/* =========================================================
   PAGES
   ========================================================= */

function openPage(page){

  currentPage=page;

  if(unsubscribe){
    unsubscribe();
    unsubscribe=null;
  }

  document.querySelectorAll(".nav button").forEach(function(b){
    b.classList.remove("active");
  });

  const map={
    home:"navHome",
    world:"navWorld",
    users:"navUsers",
    groups:"navGroups",
    private:"navPrivate"
  };

  if(map[page]){
    document.getElementById(map[page]).classList.add("active");
  }

  if(page==="home") renderHome();
  if(page==="world") renderWorld();
  if(page==="users") renderUsers();
  if(page==="groups") renderGroups();
  if(page==="private") renderPrivate();
  if(page==="settings") renderSettings();
}

/* =========================================================
   HOME
   ========================================================= */

function renderHome(){

  const name=escapeHtml(profile.username || "User");

  document.getElementById("page").innerHTML=`

    <div class="card">
      <div class="sectionTitle">Welcome, ${name} 👋</div>
      <div class="small">Your Chat mein khush aamdeed.</div>
    </div>

    <div class="menuGrid">

      <button class="menuBtn" onclick="openPage('world')">
        <b>🌎 World Chat</b>
        <span>Sab users ke saath chat</span>
      </button>

      <button class="menuBtn" onclick="renderUsers()">
        <b>🟢 Online Users</b>
        <span>Online users dekho</span>
      </button>

      <button class="menuBtn" onclick="openPage('private')">
        <b>💬 Private Chat</b>
        <span>Private conversation</span>
      </button>

      <button class="menuBtn" onclick="openPage('groups')">
        <b>👥 Group Chat</b>
        <span>Groups aur messages</span>
      </button>

      <button class="menuBtn" onclick="renderUsers()">
        <b>👤 All Users</b>
        <span>Users ki list</span>
      </button>

      <button class="menuBtn" onclick="openPage('settings')">
        <b>⚙ Settings</b>
        <span>Account aur app settings</span>
      </button>

    </div>
  `;
}

/* =========================================================
   WORLD CHAT
   ========================================================= */

function renderWorld(){

  document.getElementById("page").innerHTML=`

    <div class="card">
      <div class="sectionTitle">🌎 World Chat</div>
      <div class="small">Public chat for Your Chat users.</div>
    </div>

    <div id="worldMessages" class="card">
      <div class="small">Loading messages...</div>
    </div>

    <div style="height:70px"></div>

    <div class="chatInput">
      <div class="chatInner">
        <input id="worldInput" class="input"
          placeholder="Write a message..."
          maxlength="1000"
          onkeydown="if(event.key==='Enter')sendWorld()">
        <button class="sendBtn" onclick="sendWorld()">Send</button>
      </div>
    </div>
  `;

  loadWorld();
}

function loadWorld(){

  const box=document.getElementById("worldMessages");

  if(!box) return;

  unsubscribe=db.collection("worldMessages")
    .limit(50)
    .onSnapshot(function(snapshot){

      let arr=[];

      snapshot.forEach(function(doc){
        arr.push(Object.assign({id:doc.id},doc.data()));
      });

      arr.sort(function(a,b){
        const aa=a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis():0;
        const bb=b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis():0;
        return aa-bb;
      });

      if(!arr.length){
        box.innerHTML='<div class="small">No messages yet. Be the first!</div>';
        return;
      }

      box.innerHTML=arr.map(function(m){

        return `
          <div class="message">
            <span class="msgUser">${escapeHtml(m.username || "User")}</span>
            <span class="msgTime">${formatTime(m.createdAt)}</span>
            <div class="msgText">${escapeHtml(m.text || "")}</div>
          </div>
        `;

      }).join("");

      box.scrollTop=box.scrollHeight;

    },function(error){

      box.innerHTML=
        '<div class="error">World Chat error: '+
        escapeHtml(error.message)+'</div>';

    });
}

async function sendWorld(){

  const input=document.getElementById("worldInput");

  if(!input || !currentUser) return;

  const text=input.value.trim();

  if(!text) return;

  input.disabled=true;

  try{

    await db.collection("worldMessages").add({
      uid:currentUser.uid,
      username:profile.username || currentUser.displayName || "User",
      text:text,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });

    input.value="";

  }catch(e){

    alert("Message send nahi hua:\n"+friendlyError(e));

  }

  input.disabled=false;
}

/* =========================================================
   USERS
   ========================================================= */

function renderUsers(){

  if(unsubscribe){
    unsubscribe();
    unsubscribe=null;
  }

  document.getElementById("page").innerHTML=`

    <div class="card">
      <div class="sectionTitle">👥 All Users</div>
      <div class="small">Registered Your Chat users.</div>
    </div>

    <div id="usersList" class="card">
      <div class="small">Loading users...</div>
    </div>
  `;

  loadUsers();
}

function loadUsers(){

  const box=document.getElementById("usersList");

  unsubscribe=db.collection("users")
    .limit(100)
    .onSnapshot(function(snapshot){

      let users=[];

      snapshot.forEach(function(doc){
        users.push(doc.data());
      });

      users.sort(function(a,b){
        return String(a.username||"")
          .localeCompare(String(b.username||""));
      });

      if(!users.length){
        box.innerHTML='<div class="small">No users found.</div>';
        return;
      }

      box.innerHTML=users.map(function(u){

        const online=u.online===true;

        return `
          <div class="user">
            <div>
              <span class="onlineDot"
                style="background:${online?'#32d583':'#56697a'}"></span>
              <b>${escapeHtml(u.username||"User")}</b>
            </div>

            ${
              u.uid!==currentUser.uid
              ? `<button class="iconBtn"
                   onclick="startPrivate('${escapeHtml(u.uid)}','${escapeHtml(u.username||"User")}')">
                   Chat
                 </button>`
              : `<span class="small">You</span>`
            }
          </div>
        `;

      }).join("");

    },function(error){

      box.innerHTML=
        '<div class="error">Users error: '+
        escapeHtml(error.message)+'</div>';

    });
}

/* =================
