.userRow{display:flex;align-items:center;gap:9px;padding:10px 3px;border-bottom:1px solid #16405d}.userInfo{flex:1;min-width:0}

.msghead{font-size:11px;color:#65d5ff;font-weight:bold}.meta{font-size:9px;color:#8caabd;margin-top:5px}.media{max-width:100%;max-height:280px;border-radius:10px;margin-top:5px}
.actions{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}.actions button{padding:5px 7px;background:#061321;border:1px solid #245678;color:#fff;border-radius:7px;font-size:10px}

.compose{display:flex;gap:4px;align-items:center}.compose input{flex:1;margin:0}
.icon{width:38px;height:38px;border-radius:9px;background:#091d31;border:1px solid #245678;color:#fff}.send{background:#0785b9;border-color:#2bcaff}
.typing{height:17px;padding-left:8px;color:#49d4ff;font-size:11px}.empty{text-align:center;padding:25px;color:#71899d;font-size:12px}
.menuPanel{position:absolute;top:55px;right:6px;width:245px;max-height:calc(100% - 65px);overflow:auto;background:#061525;border:1px solid #20bfff;border-radius:15px;z-index:20;padding:8px;box-shadow:0 0 30px #000}
.menuPanel button{width:100%;padding:11px;text-align:left;background:#081b2d;border:0;border-bottom:1px solid #153d59;color:#fff}
.toast{position:fixed;bottom:15px;left:5%;right:5%;padding:10px;background:#09253c;border:1px solid #29c8ff;border-radius:10px;text-align:center;z-index:99}
.chatDots{width:34px;height:34px;border-radius:9px;background:#081b2d;border:1px solid #245678;color:#fff;font-size:19px;flex:none}
.mediaMenu{position:absolute;right:8px;bottom:58px;background:#061525;border:1px solid #20bfff;border-radius:12px;padding:7px;z-index:30;width:150px;box-shadow:0 0 25px #000}
.mediaMenu button{width:100%;padding:10px;background:#081b2d;border:0;border-bottom:1px solid #153d59;color:#fff;text-align:left}
.voicePreview{background:#061525;border:1px solid #23719e;border-radius:11px;padding:8px;margin-bottom:5px}
.voicePreview audio{width:100%;height:35px}
.light{background:#eef4f8;color:#102030}.light .page{background:#eef4f8}.light .top,.light .bottom{background:#fff;color:#102030}.light .card,.light .menuBtn,.light .menuPanel,.light .mediaMenu{background:#fff;color:#102030}.light .input{background:#f4f7fa;color:#102030}.light .msg{background:#fff;color:#102030}.light .msg.mine{background:#d5f1ff;color:#102030}
</style>

<script>
var firebaseConfig={
apiKey:"AIzaSyAEqeB2YXk_2A9gZ41WQ_fNiBKiGnzYGc0",
authDomain:"chit-chat-plus-7382b.firebaseapp.com",
projectId:"chit-chat-plus-7382b",
storageBucket:"chit-chat-plus-7382b.firebasestorage.app",
messagingSenderId:"98837732974",
appId:"1:98837732974:web:ff52d3868871c91518507f",
measurementId:"G-T42H2N5Q0Z"
};

firebase.initializeApp(firebaseConfig);
var auth=firebase.auth(),db=firebase.firestore();

var CLOUD_NAME="ptqrd8vc";
var CLOUD_PRESET="your_chat_upload";
var CLOUD_URL="https://api.cloudinary.com/v1_1/"+CLOUD_NAME+"/auto/upload";

var me=null,page="",peer=null,chatId="",groupId="",group=null,reply=null;
var unsubs=[],users={},typingTimer=null,recording=null,recChunks=[],recStream=null,recTimer=null,recSeconds=0;
var voiceBlob=null,voiceUrl="",voiceTimer=null,voiceSeconds=0;
var notif=localStorage.getItem("yc_notif")!=="0";
var sound=localStorage.getItem("yc_sound")!=="0";

function $(x){return document.getElementById(x)}

function esc(x){
return String(x==null?"":x)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function ts(){return firebase.firestore.FieldValue.serverTimestamp()}
function au(x){return firebase.firestore.FieldValue.arrayUnion(x)}
function ar(x){return firebase.firestore.FieldValue.arrayRemove(x)}

function clean(x){
return String(x||"").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,35)||"user";
}

function email(x){return "user_"+clean(x)+"@yourchat.local"}

function time(t){
if(!t||!t.toDate)return "";
var d=t.toDate(),h=d.getHours(),m=d.getMinutes(),a=h>=12?"PM":"AM";
h=h%12||12;
return h+":"+(m<10?"0":"")+m+" "+a;
}

function online(u){
return !!(u&&u.online&&u.lastSeen&&u.lastSeen.toMillis&&Date.now()-u.lastSeen.toMillis()<90000);
}

function av(u,b){
if(u&&u.avatar)
return '<img class="avatar'+(b?" big":"")+'" src="'+esc(u.avatar)+'">';
return '<div class="avatar'+(b?" big":"")+'"></div>';
}

function toast(t){
var x=document.createElement("div");
x.className="toast";
x.textContent=t;
document.body.appendChild(x);
setTimeout(function(){x.remove()},2500);
}

function stop(){
unsubs.forEach(function(x){
try{x()}catch(e){}
});
unsubs=[];
if(typingTimer)clearTimeout(typingTimer);
if(recTimer)clearInterval(recTimer);
if(voiceTimer)clearInterval(voiceTimer);
}

function listen(q,cb){
var u=q.onSnapshot(cb,function(e){
console.log(e);
toast("Database connection error.");
});
unsubs.push(u);
}

function cid(a,b){return[a,b].sort().join("_")}

/* FIXED NOTIFICATION FUNCTION */
function notify(uid,type,text){
if(!notif||!uid||uid===me.uid)return;
return db.collection("notifications").add({
toUid:uid,
fromUid:me.uid,
type:type,
text:text,
createdAt:ts()
});
}

function beep(){
if(!sound)return;
try{
var C=AudioContext||webkitAudioContext;
var c=new C(),o=c.createOscillator(),g=c.createGain();
o.frequency.value=880;
g.gain.value=.04;
o.connect(g);
g.connect(c.destination);
o.start();
setTimeout(function(){
o.stop();
c.close();
},150);
}catch(e){}
}

function shell(title,body,back){
return '<div class="page">'+
'<div class="top">'+
(back?'<button class="back" onclick="back()">‹</button>':'')+
'<div class="topTitle">'+esc(title)+'</div>'+
'<button class="menu" onclick="toggleMenu()">☰</button>'+
'</div>'+
'<div class="main">'+body+'</div>'+
'<div id="menuPanel" class="menuPanel hide">'+menuHTML()+'</div>'+
'</div>';
}

/* ONLY REQUESTED MENU OPTIONS */
function menuHTML(){
return ''+
'<button onclick="showWorld();closeMenu()">🌍 World Chat</button>'+
'<button onclick="showPrivate();closeMenu()">💬 Private Chat</button>'+
'<button onclick="showGroups();closeMenu()">👥 Group Chat</button>'+
'<button onclick="changeDP();closeMenu()">🖼 Change DP</button>'+
'<button onclick="theme();closeMenu()">🎨 Theme: '+(document.body.classList.contains("light")?"White":"Dark")+'</button>'+
'<button onclick="toggleNotif();closeMenu()">🔔 Notifications: '+(notif?"ON":"OFF")+'</button>'+
'<button onclick="showBlocked();closeMenu()">🚫 Blocked Users</button>'+
'<button onclick="showAll();closeMenu()">👥 All Users</button>'+
'<button onclick="showOnline();closeMenu()">🟢 Exact Online Users</button>'+
'<button onclick="logout();closeMenu()">🚪 Logout</button>';
}

function toggleMenu(){
var x=$("menuPanel");
if(x)x.classList.toggle("hide");
}

function closeMenu(){
var x=$("menuPanel");
if(x)x.classList.add("hide");
}

function back(){
if(page==="world"||page==="private"||page==="groups"||page==="online"||page==="all"||page==="about"||page==="myStatus"||page==="friendsStatus"||page==="otherStatus")
showHome();
else if(page==="privateChat")
showPrivate();
else if(page==="groupChat")
showGroups();
else if(page==="blocked"||page==="notifications")
showHome();
else
showHome();
}

function login(){
page="login";
document.getElementById("app").innerHTML=
'<div class="page"><div class="wrap">'+
'<div class="logo">Your Chat</div>'+
'<div class="card">'+
'<input id="lu" class="input" placeholder="Username">'+
'<input id="lp" class="input" type="password" placeholder="Password">'+
'<label><input id="rem" type="checkbox"> Remember Me</label>'+
'<button class="btn" onclick="doLogin()">Login</button>'+
'<button class="btn secondary" onclick="createPage()">Create Account</button>'+
'<button class="btn secondary" onclick="forgot()">Forgot Password</button>'+
'<div id="err" class="small"></div>'+
'</div></div></div>';
}

function createPage(){
page="create";
document.getElementById("app").innerHTML=
'<div class="page"><div class="wrap">'+
'<div class="logo">Your Chat</div>'+
'<div class="card">'+
'<input id="cu" class="input" placeholder="Username">'+
'<input id="cp" class="input" type="password" placeholder="Password">'+
'<input id="cc" class="input" type="password" placeholder="Confirm Password">'+
'<button class="btn" onclick="create()">Create Account</button>'+
'<button class="btn secondary" onclick="login()">Back</button>'+
'<div id="ce" class="small"></div>'+
'</div></div></div>';
}

function doLogin(){
var u=$("lu").value.trim(),p=$("lp").value;
if(!u||!p){
$("err").textContent="Enter username and password.";
return;
}
auth.signInWithEmailAndPassword(email(u),p).catch(function(e){
$("err").textContent=e.message;
});
}

function create(){
var u=$("cu").value.trim(),p=$("cp").value,c=$("cc").value;
if(u.length<2){
$("ce").textContent="Username too short.";
return;
}
if(p.length<6||p!==c){
$("ce").textContent="Password must be 6+ characters and match.";
return;
}
auth.createUserWithEmailAndPassword(email(u),p).then(function(x){
return db.collection("users").doc(x.user.uid).set({
uid:x.user.uid,
username:u,
usernameLower:u.toLowerCase(),
avatar:"",
online:true,
lastSeen:ts(),
createdAt:ts()
});
}).catch(function(e){
$("ce").textContent=e.message;
});
}

function forgot(){
alert("Username-only accounts do not have a recovery email. Use your correct username/password or create a new account.");
}

auth.onAuthStateChanged(function(u){
if(!u){
me=null;
stop();
login();
return;
}

db.collection("users").doc(u.uid).get().then(function(d){
if(!d.exists)
return db.collection("users").doc(u.uid).set({
uid:u.uid,
username:"User",
usernameLower:"user",
avatar:"",
online:true,
lastSeen:ts(),
createdAt:ts()
}).then(function(){
return db.collection("users").doc(u.uid).get();
});
return d;
}).then(function(d){
me=d.data();
me.uid=u.uid;
db.collection("users").doc(me.uid).set({
online:true,
lastSeen:ts()
},{merge:true});
showHome();
presence();
});
});

function presence(){
clearInterval(window.p);
window.p=setInterval(function(){
if(auth.currentUser)
db.collection("users").doc(auth.currentUser.uid).set({
online:true,
lastSeen:ts()
},{merge:true});
},30000);
}

page="home";

'<div class="logo">Your Chat</div>'+
'<div class="card">'+

'<div class="wrap"><div class="card">'+

stop();
page="online";
document.getElementById("app").innerHTML=shell("Online Users",
'<div class="wrap">'+
'<input id="us" class="input" placeholder="Search user" oninput="drawOnline()">'+
'<div id="ul" class="card">Loading...</div>'+
'</div>',true);

listen(db.collection("users"),function(s){
window.onlineUsers=[];
s.forEach(function(d){
var u=d.data();
u.uid=d.id;
if(d.id!==me.uid&&online(u))
window.onlineUsers.push(u);
});
drawOnline();
});
}

function drawOnline(){
var q=($("us")&&$("us").value||"").toLowerCase();
var a=(window.onlineUsers||[]).filter(function(u){
return !q||(u.username||"").toLowerCase().indexOf(q)>-1;
});
var h="";
a.forEach(function(u){
h+='<div class="userRow" onclick="openPrivate(\''+u.uid+'\')">'+
av(u)+
'<div class="userInfo"><b>'+esc(u.username)+'</b>'+
'<div class="small online">● Online</div></div></div>';
});
$("ul").innerHTML=h||'<div class="empty">No online users.</div>';

function showAll(){
stop();
page="all";
document.getElementById("app").innerHTML=shell("All Users",
'<div class="wrap">'+
'<input id="as" class="input" placeholder="Search user" oninput="drawAll()">'+
'<div id="al" class="card">Loading...</div>'+
'</div>',true);

listen(db.collection("users"),function(s){
window.allUsers=[];
s.forEach(function(d){
var u=d.data();
u.uid=d.id;
if(d.id!==me.uid)window.allUsers.push(u);
});
drawAll();
});
}

function drawAll(){
var q=($("as")&&$("as").value||"").toLowerCase();
var a=(window.allUsers||[]).filter(function(u){
return !q||(u.username||"").toLowerCase().indexOf(q)>-1;
});
var h="";
a.forEach(function(u){
h+='<div class="userRow" onclick="openPrivate(\''+u.uid+'\')">'+
av(u)+
'<div class="userInfo"><b>'+esc(u.username)+'</b>'+
'<div class="small '+(online(u)?"online":"offline")+'">● '+(online(u)?"Online":"Offline")+
'</div></div></div>';

function showWorld(){
stop();
page="world";

document.getElementById("app").innerHTML=shell("World Chat",
'<div class="wrap">'+
'<div class="between card"><b>World Chat</b><b id="wc" class="online">Online: 0</b></div>'+
'<div id="wt" class="typing"></div>'+
'<div id="wm" class="msgList">Loading...</div>'+
'<div class="bottom">'+
'<div id="wr"></div>'+
'<div class="compose">'+
'<input id="wi" class="input" placeholder="Message or @mention" oninput="worldInput()" onkeydown="if(event.key===\'Enter\'){event.preventDefault();sendWorld()}">'+
'<button class="icon send" onclick="sendWorld()">➤</button>'+
'</div>'+
'<div id="mentions"></div>'+
'</div></div>',true);

listen(db.collection("users"),function(s){
var n=0;
window.worldUsers=[];
s.forEach(function(d){
var u=d.data();
u.uid=d.id;
if(online(u)){
n++;
window.worldUsers.push(u);
}
});
if($("wc"))$("wc").textContent="Online: "+n;
});

listen(db.collection("worldMessages").orderBy("createdAt","desc").limit(20),function(s){
var a=[];
s.forEach(function(d){
var x=d.data();
x.id=d.id;
a.unshift(x);
});
window.world=a;
drawMessages(a,"world","wm");
});

listen(db.collection("typing").where("roomId","==","world"),function(s){
var z="";
s.forEach(function(d){
var x=d.data();
if(x.uid!==me.uid&&x.typing&&Date.now()-(x.updatedAt&&x.updatedAt.toMillis?x.updatedAt.toMillis():0)<8000)
z=x.username+" is typing…";
});
if($("wt"))$("wt").textContent=z;
});
}

function worldInput(){
var v=$("wi").value;
if(v.slice(-1)==="@")showMentions();
worldTyping(true);
}

function showMentions(){
var h='<div class="card">';
(window.worldUsers||[]).forEach(function(u){
h+='<div class="userRow" onclick="mention(\''+
esc(u.username).replace(/'/g,"&#39;")+'\')">'+
av(u)+
'<div class="userInfo"><b>'+esc(u.username)+'</b></div></div>';
});
h+='</div>';
$("mentions").innerHTML=h;
}

function mention(n){
$("wi").value=$("wi").value.slice(0,-1)+"@"+n+" ";
$("mentions").innerHTML="";
$("wi").focus();
}

function worldTyping(v){
db.collection("typing").doc(me.uid+"_world").set({
uid:me.uid,
username:me.username,
roomId:"world",
typing:v,
updatedAt:ts()
},{merge:true});

clearTimeout(typingTimer);

if(v)
typingTimer=setTimeout(function(){
worldTyping(false);
},5000);
}

function sendWorld(){
var t=$("wi").value.trim();
if(!t&&!reply)return;

var d={
uid:me.uid,
username:me.username,
avatar:me.avatar||"",
text:t,
createdAt:ts()
};

if(reply){
d.replyText=reply.text;
d.replyTo=reply.id;
}

db.collection("worldMessages").add(d).then(function(){
$("wi").value="";
reply=null;
worldTyping(false);
});
}

function message(x,room){
var own=x.uid===me.uid;
var u=users[x.uid]||{
username:x.username||"User",
avatar:x.avatar||""
};

var c=x.text?'<div>'+esc(x.text)+'</div>':"";

if(x.imageUrl)
c+='<img class="media" src="'+esc(x.imageUrl)+'">';

if(x.videoUrl)
c+='<video class="media" controls src="'+esc(x.videoUrl)+'"></video>';

if(x.voiceUrl)
c+='<audio class="media" controls src="'+esc(x.voiceUrl)+'"></audio>';

var r=x.replyText?
'<div class="reply">'+esc(x.replyText)+'</div>':"";

return '<div class="msg '+(own?"mine":"")+'">'+
'<div class="msghead">'+esc(u.username)+'</div>'+
r+c+
'<div class="meta">'+time(x.createdAt)+' '+
(room==="private"&&own?
"✓✓ "+((x.seenBy||[]).indexOf(peer.uid)>-1?"Read":"Delivered"):"")+
'</div>'+
'<div class="actions">'+
'<button onclick="replyTo(\''+room+'\',\''+x.id+'\')">↩ Reply</button>'+
(own?
'<button onclick="editMessage(\''+room+'\',\''+x.id+'\')">✎ Edit</button>'+
'<button onclick="deleteMessage(\''+room+'\',\''+x.id+'\')">🗑 Delete</button>':"")+
(room!=="world"?
'<button onclick="react(\''+room+'\',\''+x.id+'\')">❤️ React</button>'+
'<button onclick="info(\''+room+'\',\''+x.id+'\')">ⓘ Info</button>':"")+
'</div></div>';
}

function drawMessages(a,r,id){
var h="";
a.forEach(function(x){
h+=message(x,r);
});
$(id).innerHTML=h||'<div class="empty">No messages yet.</div>';
}

function replyTo(r,id){
var a=r==="world"?window.world:r==="private"?window.pm:window.gm;
var x=a.find(function(z){return z.id===id});
if(!x)return;
reply={id:id,text:x.text||"[media]"};

/* UPLOAD */
function upload(file,ok,fail){

if(file.size>100*1024*1024){
fail("File must be under 100MB.");
return;
}

var f=new FormData();

f.append("file",file);
f.append("upload_preset",CLOUD_PRESET);

var x=new XMLHttpRequest();

x.open("POST",CLOUD_URL);

x.onload=function(){

try{

var r=JSON.parse(x.responseText);

if(
x.status>=200&&
x.status<300&&
r.secure_url
)
ok(r.secure_url);
else
fail(
(r.error&&r.error.message)||
"Upload failed"
);

}catch(e){
fail("Upload failed");
}

};

x.onerror=function(){
fail("Upload network error");
};

x.send(f);
}

/* START VOICE RECORDING */
function startVoiceRecording(){

if(recording){
toast("Recording already running.");
return;
}

if(
!navigator.mediaDevices||
!navigator.mediaDevices.getUserMedia||
!window.MediaRecorder
){
toast("Voice is not supported.");
return;
}

voiceBlob=null;
voiceUrl="";
voiceSeconds=0;

navigator.mediaDevices.getUserMedia({
audio:true
}).then(function(s){

recStream=s;
recChunks=[];

recording=new MediaRecorder(s);

recording.ondataavailable=function(e){
if(e.data&&e.data.size)
recChunks.push(e.data);
};

recording.onstop=function(){

s.getTracks().forEach(function(t){
t.stop();
});

if(voiceTimer)
clearInterval(voiceTimer);

voiceTimer=null;

voiceBlob=new Blob(
recChunks,
{type:recording.mimeType||"audio/webm"}
);

recording=null;

showVoicePreview();

};

recording.start();

voiceTimer=setInterval(function(){

voiceSeconds++;

if($("voicePreview")){
$("voicePreview").innerHTML=
'<div class="small online">● Recording '+voiceSeconds+'s</div>'+
'<button class="btn danger" onclick="stopVoiceRecording()">■ Stop</button>';
}

if(voiceSeconds>=120)
stopVoiceRecording();

},1000);

showRecordingUI();

}).catch(function(){

toast("Microphone permission denied.");

});
}

/* RECORDING UI */
function showRecordingUI(){

var x=$("voicePreview");

if(!x)return;

x.classList.remove("hide");

x.innerHTML=

'<button class="btn danger" onclick="stopVoiceRecording()">■ Stop</button>';
}

/* STOP = PREVIEW, NOT AUTO SEND */
function stopVoiceRecording(){

if(!recording)return;

if(voiceTimer)
clearInterval(voiceTimer);

voiceTimer=null;

try{
recording.stop();
}catch(e){}

}

/* CANCEL VOICE */
function cancelVoice(){

if(recording){
try{recording.stop()}catch(e){}
recording=null;
}

if(recStream){
recStream.getTracks().forEach(function(t){
t.stop();
});
recStream=null;
}

if(voiceTimer)
clearInterval(voiceTimer);

voiceTimer=null;

clearVoicePreview();
}

}catch(e){}
}

voiceBlob=null;
voiceUrl="";
voiceSeconds=0;
recChunks=[];
}

/* STATUS */
function statusExpired(x){
if(!x)return true;
if(x.expiresAt&&x.expiresAt.toMillis)
return Date.now()>=x.expiresAt.toMillis();
if(x.createdAt&&x.createdAt.toMillis)
return Date.now()-x.createdAt.toMillis()>=24*60*60*1000;
return false;
}

function statusExpiry(){
return firebase.firestore.Timestamp.fromMillis(
Date.now()+24*60*60*1000
);
}

expiresAt:statusExpiry()
};

if(type==="image")
d.imageUrl=u;

if(type==="video")
d.videoUrl=u;

if(type==="audio")
d.audioUrl=u;

db.collection("statuses").add(d);

},
function(e){
toast(e);
});

};

i.click();
}

function statusPage(k){

stop();

page=k==="friends"?
"friendsStatus":
"otherStatus";

document.getElementById("app").innerHTML=shell(
k==="friends"?"Friends Status":"Other Users Status",
'<div class="wrap"><div id="st" class="card">Loading...</div></div>',
true
);

listen(
db.collection("statuses")
.orderBy("createdAt","desc"),
function(s){

var h="";

s.forEach(function(d){

var x=d.data();

if(x.uid===me.uid)return;
if(statusExpired(x))return;

h+='<div class="card">'+
'<div class="between">'+
'<b>'+esc(x.username)+'</b>'+
'<span class="small">'+time(x.createdAt)+'</span>'+
'</div>'+
(x.text?'<p>'+esc(x.text)+'</p>':"")+
(x.imageUrl?'<img class="media" src="'+esc(x.imageUrl)+'">':"")+
(x.videoUrl?'<video class="media" controls src="'+esc(x.videoUrl)+'"></video>':"")+
(x.audioUrl?'<audio controls src="'+esc(x.audioUrl)+'"></audio>':"")+
'<div class="actions">'+
'<button onclick="reactStatus(\''+d.id+'\',\''+x.uid+'\')">❤️ React</button>'+
'<button onclick="viewStatus(\''+d.id+'\',\''+x.uid+'\')">👁 View</button>'+
'</div></div>';

});

$("st").innerHTML=
h||'<div class="empty">No statuses.</div>';

});
}

function reactStatus(id,owner){

db.collection("statusReactions")
.doc(id+"_"+me.uid)
.set({
statusId:id,
uid:me.uid,
reaction:"❤️",
createdAt:ts()
})
.then(function(){

notify(
owner,
"statusReaction",
me.username+" reacted to your status"
);

});
}

function viewStatus(id,owner){

db.collection("statusViews")
.doc(id+"_"+me.uid)
.set({
statusId:id,
uid:me.uid,
createdAt:ts()
},{merge:true})
.then(function(){

notify(
owner,
"statusView",
me.username+" viewed your status"
);

});
}

function showBlocked(){

stop();
page="blocked";

document.getElementById("app").innerHTML=shell(
"Blocked Users",
'<div class="wrap"><div id="bl" class="card">Loading...</div></div>',
true
);

listen(
db.collection("blocks")
.where("uid","==",me.uid),
function(s){

var h="";

s.forEach(function(d){

var x=d.data();
var u=users[x.blockedUid]||{};

h+='<div class="userRow">'+
av(u)+
'<div class="userInfo">'+
'<b>'+esc(u.username||"User")+'</b>'+
'<div class="small">Blocked</div>'+
'</div>'+
'<button class="btn" onclick="unblock(\''+
x.blockedUid+
'\')">Unblock</button>'+
'</div>';

});

$("bl").innerHTML=
h||'<div class="empty">No blocked users.</div>';

});
}

function unblock(id){

db.collection("blocks")
.doc(me.uid+"_"+id)
.delete()
.then(function(){

toast("User unblocked.");
showBlocked();

});
}

function changeDP(){

var i=document.createElement("input");

i.type="file";
i.accept="image/*";

i.onchange=function(){

if(!i.files[0])return;

upload(
i.files[0],
function(u){

db.collection("users")
.doc(me.uid)
.update({
avatar:u
})
.then(function(){

me.avatar=u;

toast("DP updated.");

});

},
function(e){
toast(e);
});

};

i.click();
}

function theme(){

var light=document.body.classList.toggle("light");

localStorage.setItem(
"yc_theme",
light?"light":"dark"
);

toast(
"Theme changed to "+
(light?"White":"Dark")
);
}

function toggleNotif(){

notif=!notif;

localStorage.setItem(
"yc_notif",
notif?"1":"0"
);

toast(
"Notifications "+
(notif?"ON":"OFF")
);
}

function toggleSound(){

sound=!sound;

localStorage.setItem(
"yc_sound",
sound?"1":"0"
);

if(sound)beep();

toast(
"Sound "+
(sound?"ON":"OFF")
);
}

function logout(){

if(me)

db.collection("users")
.doc(me.uid)
.set({
online:false,
lastSeen:ts()
},{merge:true});

auth.signOut();
}

window.addEventListener(
"beforeunload",
function(){

if(auth.currentUser)

db.collection("users")
.doc(auth.currentUser.uid)
.set({
online:false,
lastSeen:ts()
},{merge:true});

}
);

if(localStorage.getItem("yc_theme")==="light")
document.body.classList.add("light");

</script>
</body>
</html>
