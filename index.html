.replace(/&/g,"&amp;")

.onSnapshot(function(s){

var count=0;

s.forEach(function(d){

x.online&&

(ls&&now-ls<75000)
);

users[d.id]=x;

if(x._realOnline){
count++;
}

});

$("onlineTop").innerHTML=
"Online: "+count;

if(page==="users"){
renderUsers();
}

});
