<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050b16">
<title>Your Chat</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#050b16;color:#eef8ff;font-family:Arial,sans-serif}
body{overflow:hidden}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hide{display:none!important}
#app{width:100%;height:100%;overflow:hidden}
.page{width:100%;height:100%;overflow:auto;background:linear-gradient(180deg,#071323,#02060d)}
.wrap{width:100%;max-width:520px;margin:auto;padding:14px}
.logo{text-align:center;font-size:30px;font-weight:900;color:#49cfff;text-shadow:0 0 15px rgba(73,207,255,.45);margin:14px 0 22px}
.card{background:rgba(8,22,39,.96);border:1px solid #16476c;border-radius:18px;padding:15px;box-shadow:0 0 22px rgba(0,174,255,.08)}
.title{font-size:21px;font-weight:800;color:#82ddff;margin:3px 0 14px}
.sub{font-size:12px;color:#91aac0}
.input{width:100%;padding:13px 14px;margin:6px 0;background:#061221;color:#fff;border:1px solid #235073;border-radius:12px;outline:0}
.input:focus{border-color:#28c2ff;box-shadow:0 0 10px rgba(40,194,255,.14)}
.btn{width:100%;padding:13px 14px;margin:6px 0;background:linear-gradient(135deg,#0a426b,#0785ba);border:1px solid #25bfff;border-radius:12px;color:#fff;font-weight:800}
.btn.secondary{background:#091827;border-color:#245277}
.btn.danger{background:#451827;border-color:#a33a50}
.btn.small{width:auto;padding:8px 10px;font-size:12px}
.row{display:flex;align-items:center;gap:9px}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top{height:54px;display:flex;align-items:center;gap:8px;padding:8px;background:#071525;border-bottom:1px solid #16476c}
.back{width:38px;height:38px;border-radius:50%;background:#091b2e;border:1px solid #245277;color:#fff}
.topTitle{flex:1;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{height:calc(100% - 54px);overflow:auto}
.menuBtn{width:100%;padding:16px 15px;margin:7px 0;text-align:left;background:linear-gradient(135deg,#091a2d,#07111e);border:1px solid #1b466b;border-radius:14px;color:#fff;font-weight:800;font-size:15px}
.menuBtn:active{border-color:#2ac6ff}
.avatar{width:43px;height:43px;border-radius:50%;object-fit:cover;background:#102b44;border:1px solid #285a7d;flex:none}
.avatar.big{width:62px;height:62px}
.userRow{display:flex;align-items:center;gap:10px;padding:11px 5px;border-bottom:1px solid rgba(39,82,115,.45)}
.userInfo{flex:1;min-width:0}
.userName{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:11px;color:#8ba6bd;margin-top:3px}
.online{color:#20f48b}
.offline{color:#73879a}
.search{margin:9px 0}
.msgList{padding:10px 10px 90px}
.msg{max-width:88%;margin:8px 0;padding:10px 11px;border-radius:14px;background:#091a2d;border:1px solid #194262;word-break:break-word}
.msg.mine{margin-left:auto;background:#063b5d;border-color:#126d99}
.msgMeta{font-size:10px;color:#87a4bb;margin-top:5px}
.replyPreview{border-left:3px solid #2ac6ff;background:#061422;padding:6px 8px;border-radius:6px;font-size:11px;color:#9ec5dd;margin-bottom:6px}
.chatBottom{position:absolute;left:0;right:0;bottom:0;padding:7px;background:#06101d;border-top:1px solid #173f61}
.chatInput{display:flex;gap:5px;align-items:center}
.chatInput input{flex:1;margin:0}
.icon{width:40px;height:40px;border-radius:10px;background:#091a2d;border:1px solid #245277;color:#fff}
.send{background:#087eaf;border-color:#27c4ff}
.typing{font-size:11px;color:#4fd0ff;padding:2px 10px}
.media{max-width:100%;max-height:300px;border-radius:10px;margin-top:5px}
.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.actions button{padding:5px 8px;border-radius:8px;background:#071524;border:1px solid #214c70;color:#fff;font-size:10px}
.notice{padding:10px;border:1px solid #194667;background:#07192b;color:#9dc5dd;border-radius:10px;font-size:12px;margin:8px 0}
.empty{text-align:center;color:#718ba2;padding:28px 10px;font-size:13px}
.fileBtn{position:relative;overflow:hidden}
.fileBtn input{position:absolute;inset:0;opacity:0}
.profile{text-align:center;padding:15px}
.profile .avatar{margin:auto}
.info{font-size:12px;line-height:1.6;color:#a5bfd1}
.statusCard{background:#091b2e;border:1px solid #1a466b;border-radius:14px;padding:12px;margin:8px 0}
.statusActions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.statusActions button{padding:7px 9px;border-radius:9px;background:#071525;border:1px solid #245277;color:#fff;font-size:11px}
.toast{position:fixed;left:5%;right:5%;bottom:18px;background:#0a2339;border:1px solid #29c5ff;color:#fff;padding:10px;border-radius:12px;text-align:center;z-index:99}
.check{font-size:12px;color:#a8c1d3}
hr{border:0;border-top:1px solid #19415f;margin:13px 0}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
var firebaseConfig={
 apiKey:"AIzaSyAEqeB2YXk_2A9gZ41WQ_fNiBKiGnzYGc0",
 authDomain:"chit-chat-plus-7382b.firebaseapp.com",
 projectId:"chit-chat-plus-7382b",
 storageBucket:"chit-chat-plus-7382b.firebasestorage.app",
 messagingSenderId:"98837732974",
 appId:"1:98837732974:web:ff52d3868871c91518507f",
 measurementId:"G-T42H2N5Q0Z"
};
firebase.initializeApp(firebaseConfig);
var auth=firebase.auth();
var db=firebase.firestore();

var CLOUDINARY_CLOUD_NAME="ptqrd8vc";
var CLOUDINARY_UPLOAD_PRESET="your_chat_upload";
var CLOUDINARY_UPLOAD_URL="https://api.cloudinary.com/v1_1/"+CLOUDINARY_CLOUD_NAME+"/auto/upload";

var me=null;
var currentPage="";
var currentPeer=null;
var currentChatId="";
var currentGroupId="";
var currentReply=null;
var listeners=[];
var typingTimer=null;
var recording=null;
var recordChunks=[];
var recordSeconds=0;
var recordInterval=null;
var notificationsOn=localStorage.getItem("yc_notifications")!=="0";
var soundOn=localStorage.getItem("yc_sound")!=="0";

function el(id){return document.getElementById(id)}
function esc(s){
 return String(s==null?"":s)
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}
function ts(){return firebase.firestore.FieldValue.serverTimestamp()}
function arrUnion(v){return firebase.firestore.FieldValue.arrayUnion(v)}
function arrRemove(v){return firebase.firestore.FieldValue.arrayRemove(v)}
function timeOf(t){
 if(!t||!t.toDate)return "";
 var d=t.toDate(),h=d.getHours(),m=d.getMinutes();
 var a=h>=12?"PM":"AM";h=h%12||12;
 return h+":"+(m<10?"0":"")+m+" "+a;
}
function toast(t){
 var x=document.createElement("div");
 x.className="toast";x.textContent=t;document.body.appendChild(x);
 setTimeout(function(){if(x.parentNode)x.parentNode.removeChild(x)},3000);
}
function clearListeners(){
 for(var i=0;i<listeners.length;i++){try{listeners[i]()}catch(e){}}
 listeners=[];
}
function listen(q,cb){
 var u=q.onSnapshot(cb,function(e){console.log(e);toast("Connection/database error.")});
 listeners.push(u);
 return u;
}
function safeName(n){
 return String(n||"").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,35)||"user";
}
function authEmail(n){
 return "user_"+safeName(n)+"@yourchat.local";
}
function isOnline(u){
 if(!u||!u.online)return false;
 if(!u.lastSeen||!u.lastSeen.toMillis)return false;
 return Date.now()-u.lastSeen.toMillis()<90000;
}
function avatar(u,big){
 if(u&&u.avatar)return '<img class="avatar'+(big?" big":"")+'" src="'+esc(u.avatar)+'">';
 return '<div class="avatar'+(big?" big":"")+'"></div>';
}
function statusDot(u){
 return isOnline(u)?'<span class="online">● Online</span>':'<span class="offline">● Offline</span>';
}
function chatIdFor(a,b){
 return [a,b].sort().join("_");
}
function notifySound(){
 if(!soundOn)return;
 try{
  var C=window.AudioContext||window.webkitAudioContext;
  if(!C)return;
  var c=new C(),o=c.createOscillator(),g=c.createGain();
  o.frequency.value=880;g.gain.value=.035;
  o.connect(g);g.connect(c.destination);o.start();
  setTimeout(function(){o.stop();c.close()},180);
 }catch(e){}
}
function addNotification(toUid,type,text){
 if(!notificationsOn||!toUid||toUid===me.uid)return;
 return db.collection("notifications").add({
  toUid:toUid,
  fromUid:me.uid,
  type:type,
  text:text,
  createdAt:ts()
 }).catch(function(){});
}
function profileDoc(uid){
 return db.collection("users").doc(uid);
}
function stopAll(){
 clearListeners();
 if(typingTimer)clearTimeout(typingTimer);
 if(recordInterval)clearInterval(recordInterval);
 recordInterval=null;
}
function render(html){
 el("app").innerHTML=html;
}
function pageShell(title,body,back){
 return '<div class="page"><div class="top">'+
 (back?'<button class="back" onclick="goBack()">‹</button>':'')+
 '<div class="topTitle">'+esc(title)+'</div></div>'+
 '<div class="main">'+body+'</div></div>';
}
function goBack(){
 if(currentPage==="world"||currentPage==="online"||currentPage==="about"){showHome();return}
 if(currentPage==="private"||currentPage==="status"||currentPage==="groupList"){showHome();return}
 if(currentPage==="privateChat"){showPrivate();return}
 if(currentPage==="groupChat"){showGroups();return}
 if(currentPage==="settings"){showPrivate();return}
 if(currentPage==="blocked"){showSettings();return}
 if(currentPage==="notifications"){showPrivate();return}
 showHome();
}

function loginPage(){
 currentPage="login";
 render('<div class="page"><div class="wrap"><div class="logo">Your Chat</div>'+
 '<div class="card"><div class="title">Welcome</div>'+
 '<input id="loginUser" class="input" placeholder="Username">'+
 '<input id="loginPass" class="input" type="password" placeholder="Password">'+
 '<label class="check"><input id="remember" type="checkbox"> Remember Me</label>'+
 '<button class="btn" onclick="doLogin()">Login</button>'+
 '<button class="btn secondary" onclick="createAccountPage()">Create Account</button>'+
 '<button class="btn secondary" onclick="forgotPassword()">Forgot Password</button>'+
 '<div id="loginError" class="sub"></div></div></div></div>');
}
function createAccountPage(){
 currentPage="create";
 render('<div class="page"><div class="wrap"><div class="logo">Your Chat</div>'+
 '<div class="card"><div class="title">Create Account</div>'+
 '<input id="createUser" class="input" placeholder="Username">'+
 '<input id="createPass" class="input" type="password" placeholder="Password">'+
 '<button class="btn" onclick="doCreate()">Create Account</button>'+
 '<button class="btn secondary" onclick="loginPage()">Back</button>'+
 '<div id="createError" class="sub"></div></div></div></div>');
}
function doLogin(){
 var u=(el("loginUser").value||"").trim();
 var p=el("loginPass").value||"";
 if(!u||!p){el("loginError").textContent="Enter username and password.";return}
 auth.signInWithEmailAndPassword(authEmail(u),p).then(function(){
  if(el("remember").checked)localStorage.setItem("yc_user",u);
  else localStorage.removeItem("yc_user");
 }).catch(function(e){el("loginError").textContent=e.message||"Login failed.";});
}
function doCreate(){
 var u=(el("createUser").value||"").trim();
 var p=el("createPass").value||"";
 if(u.length<2){el("createError").textContent="Username is too short.";return}
 if(p.length<6){el("createError").textContent="Password must be at least 6 characters.";return}
 auth.createUserWithEmailAndPassword(authEmail(u),p).then(function(c){
  return db.collection("users").doc(c.user.uid).set({
   uid:c.user.uid,username:u,usernameLower:u.toLowerCase(),
   avatar:"",online:true,lastSeen:ts(),createdAt:ts()
  });
 }).catch(function(e){el("createError").textContent=e.message||"Account creation failed.";});
}
function forgotPassword(){
 alert("This username-only account does not have a recovery email. Please use the correct username and password, or create a new account.");
}
auth.onAuthStateChanged(function(u){
 if(!u){me=null;stopAll();loginPage();return}
 db.collection("users").doc(u.uid).get().then(function(d){
  if(!d.exists){
   return db.collection("users").doc(u.uid).set({
    uid:u.uid,username:"User",usernameLower:"user",
    avatar:"",online:true,lastSeen:ts(),createdAt:ts()
   }).then(function(){return db.collection("users").doc(u.uid).get()});
  }
  return d;
 }).then(function(d){
  me=d.data()||{};
  me.uid=u.uid;
  db.collection("users").doc(u.uid).set({online:true,lastSeen:ts()},{merge:true});
  showHome();
  startPresence();
 }).catch(function(e){console.log(e);toast("Profile load failed.");});
});
function startPresence(){
 clearInterval(window.ycPresence);
 window.ycPresence=setInterval(function(){
  if(auth.currentUser){
   db.collection("users").doc(auth.currentUser.uid).set({
    online:true,lastSeen:ts()
   },{merge:true}).catch(function(){});
  }
 },30000);
}
function showHome(){
 stopAll();currentPage="home";
 render('<div class="page"><div class="wrap">'+
 '<div class="logo">Your Chat</div>'+
 '<div class="card">'+
 '<button class="menuBtn" onclick="showWorld()">🌍 World Chat</button>'+
 '<button class="menuBtn" onclick="showPrivate()">💬 Private Chat</button>'+
 '<button class="menuBtn" onclick="showOnline()">🟢 Online Users</button>'+
 '<button class="menuBtn" onclick="showAbout()">ℹ️ About Chat</button>'+
 '</div></div></div>');
}
function showAbout(){
 currentPage="about";
 var b='<div class="wrap"><div class="card info">'+
 '<b>World Chat</b><br>Public chat with online count, display pictures, usernames, message time, typing indicator, @ mentions, reply, edit and delete.<hr>'+
 '<b>Private Chat</b><br>Search users, private conversations, status sections, groups, text, image, video and voice messages, reply, edit, delete, reactions and message information with sent, delivered and read status.<hr>'+
 '<b>Status</b><br>My Status, Friends Status and Other Users Status with text, image, video, audio, views and reactions.<hr>'+
 '<b>Group Chat</b><br>Create groups, search and add members, admin member control, text/image/video/voice, reply, edit, delete, info and member mentions.<hr>'+
 '<b>Online Users</b><br>Only currently online users are shown. Search a user and open Private Chat.<hr>'+
 '<b>Settings</b><br>Edit Profile, Notifications ON/OFF, Notification Sound ON/OFF, Block/Unblock, Blocked Users, Remove ID and Logout.<hr>'+
 '<b>Notifications</b><br>Private messages, group messages, group additions, reactions, status activity, online activity, typing, sound control, notification control, clear notifications and notification time.'+
 '</div></div>';
 render(pageShell("About Chat",b,true));
}
function showOnline(){
 currentPage="online";stopAll();
 var body='<div class="wrap"><input id="onlineSearch" class="input search" placeholder="Search User" oninput="filterOnline()"><div id="onlineList" class="card">Loading...</div></div>';
 render(pageShell("Online Users",body,true));
 listen(db.collection("users"),function(s){
  var a=[];s.forEach(function(d){var u=d.data();u.uid=d.id;if(isOnline(u)&&u.uid!==me.uid)a.push(u)});
  window.ycOnline=a;drawOnline(a);
 });
}
function drawOnline(a){
 var q=(el("onlineSearch")&&el("onlineSearch").value||"").toLowerCase();
 a=a.filter(function(u){return !q||(u.username||"").toLowerCase().indexOf(q)>-1});
 var h="";
 for(var i=0;i<a.length;i++){
  h+='<div class="userRow" onclick="openPrivate(\''+a[i].uid+'\')">'+avatar(a[i])+
  '<div class="userInfo"><div class="userName">'+esc(a[i].username)+'</div><div class="status online">● Online</div></div></div>';
 }
 el("onlineList").innerHTML=h||'<div class="empty">No online users found.</div>';
}
function filterOnline(){drawOnline(window.ycOnline||[])}function showWorld(){
 currentPage="world";stopAll();
 var body='<div class="wrap"><div class="card">'+
 '<div class="between"><b>World Chat</b><span id="worldCount" class="status"></span></div>'+
 '<div id="worldTyping" class="typing"></div>'+
 '<div id="worldMessages" class="msgList" style="padding:8px 0 12px;min-height:300px">Loading...</div>'+
 '</div></div>';
 render(pageShell("World Chat",body,true));
 listen(db.collection("users"),function(s){
  var n=0;s.forEach(function(d){if(isOnline(d.data()))n++});
  if(el("worldCount"))el("worldCount").textContent=n+" online";
  window.ycWorldUsers=[];
  s.forEach(function(d){var u=d.data();u.uid=d.id;if(isOnline(u))window.ycWorldUsers.push(u)});
 });
 listen(db.collection("worldMessages").orderBy("createdAt","asc"),function(s){
  var a=[];s.forEach(function(d){var x=d.data();x.id=d.id;a.push(x)});
  window.ycWorldMessages=a;drawWorld(a);
 });
 listen(db.collection("typing").where("roomId","==","world"),function(s){
  var h="";
  s.forEach(function(d){
   var x=d.data();
   if(x.uid!==me.uid&&x.typing&&Date.now()-(x.updatedAt&&x.updatedAt.toMillis?x.updatedAt.toMillis():0)<8000){
    h+=esc(x.username||"Someone")+" is typing…";
   }
  });
  if(el("worldTyping"))el("worldTyping").textContent=h;
 });
}
function drawWorld(a){
 var h="";
 for(var i=0;i<a.length;i++)h+=messageHTML(a[i],"world");
 if(!h)h='<div class="empty">No messages yet.</div>';
 if(el("worldMessages"))el("worldMessages").innerHTML=h;
}
function messageHTML(x,room){
 var own=x.uid===me.uid;
 var u=users[x.uid]||{username:x.username||"User",avatar:x.avatar||""};
 var b="";
 if(x.replyText)b+='<div class="replyPreview">'+esc(x.replyText)+'</div>';
 if(x.text)b+='<div>'+esc(x.text)+'</div>';
 if(x.imageUrl)b+='<img class="media" src="'+esc(x.imageUrl)+'">';
 if(x.videoUrl)b+='<video class="media" controls src="'+esc(x.videoUrl)+'"></video>';
 if(x.voiceUrl)b+='<audio class="media" controls src="'+esc(x.voiceUrl)+'"></audio>';
 var actions='<div class="actions">';
 if(room!=="world")actions+='<button onclick="replyMsg(\''+room+'\',\''+x.id+'\')">Reply</button>';
 else actions+='<button onclick="replyMsg(\'world\',\''+x.id+'\')">Reply</button>';
 if(own)actions+='<button onclick="editMsg(\''+room+'\',\''+x.id+'\')">Edit</button><button onclick="deleteMsg(\''+room+'\',\''+x.id+'\')">Delete</button>';
 if(room==="private")actions+='<button onclick="reactMsg(\''+x.id+'\')">React</button><button onclick="messageInfo(\''+x.id+'\')">Info</button>';
 if(room==="group")actions+='<button onclick="messageInfoGroup(\''+x.id+'\')">Info</button>';
 actions+='</div>';
 var read="";
 if(room==="private"&&own&&currentPeer){
  var readBy=x.seenBy&&x.seenBy.indexOf(currentPeer.uid)>-1;
  read='<span class="rd">✓✓ '+(readBy?"Read":"Delivered")+'</span>';
 }
 return '<div class="m '+(own?"me":"ot")+'">'+
 avatar(u)+'<div class="b"><span class="nm">'+esc(u.username)+'</span>'+
 b+actions+'<div class="t">'+esc(timeOf(x.createdAt))+' '+read+'</div></div></div>';
}
function replyMsg(room,id){
 var a=room==="world"?window.ycWorldMessages:(room==="private"?window.ycPrivateMessages:window.ycGroupMessages);
 var x=null;
 for(var i=0;i<a.length;i++)if(a[i].id===id)x=a[i];
 if(!x)return;
 currentReply={id:id,text:x.text||"[media]",uid:x.uid};
 toast("Reply selected.");
 if(room==="world")sendWorldUI();
 if(room==="private")drawPrivateInput();
 if(room==="group")drawGroupInput();
}
function editMsg(room,id){
 var a=room==="world"?window.ycWorldMessages:(room==="private"?window.ycPrivateMessages:window.ycGroupMessages),x=null;
 for(var i=0;i<a.length;i++)if(a[i].id===id)x=a[i];
 if(!x||x.uid!==me.uid)return;
 var n=prompt("Edit message",x.text||"");
 if(n===null)return;
 n=n.trim();
 if(!n)return;
 var ref=room==="world"?db.collection("worldMessages").doc(id):
 room==="private"?db.collection("chats").doc(currentChatId).collection("messages").doc(id):
 db.collection("groups").doc(currentGroupId).collection("messages").doc(id);
 ref.update({text:n,edited:true}).catch(function(e){toast("Edit failed.");});
}
function deleteMsg(room,id){
 if(!confirm("Delete this message?"))return;
 var a=room==="world"?window.ycWorldMessages:(room==="private"?window.ycPrivateMessages:window.ycGroupMessages),x=null;
 for(var i=0;i<a.length;i++)if(a[i].id===id)x=a[i];
 if(!x||x.uid!==me.uid)return;
 var ref=room==="world"?db.collection("worldMessages").doc(id):
 room==="private"?db.collection("chats").doc(currentChatId).collection("messages").doc(id):
 db.collection("groups").doc(currentGroupId).collection("messages").doc(id);
 ref.delete().catch(function(){toast("Delete failed.");});
}
function reactMsg(id){
 var ref=db.collection("chats").doc(currentChatId).collection("messages").doc(id);
 var r=prompt("Reaction","❤️");
 if(!r)return;
 ref.update({reactions:arrUnion({uid:me.uid,reaction:r})}).then(function(){
  var other=currentPeer&&currentPeer.uid;
  if(other)addNotification(other,"reaction",me.username+" reacted to a message");
 }).catch(function(){toast("Reaction failed.");});
}
function messageInfo(id){
 var x=null,a=window.ycPrivateMessages||[];
 for(var i=0;i<a.length;i++)if(a[i].id===id)x=a[i];
 if(!x)return;
 alert("Time: "+timeOf(x.createdAt)+"\nSent: Yes\nDelivered: Yes\nRead: "+((x.seenBy||[]).indexOf(currentPeer.uid)>-1?"Yes":"No"));
}
function messageInfoGroup(id){
 var x=null,a=window.ycGroupMessages||[];
 for(var i=0;i<a.length;i++)if(a[i].id===id)x=a[i];
 if(!x)return;
 alert("Time: "+timeOf(x.createdAt)+"\nSent: Yes");
}
function worldTextSend(){
 var input=el("worldInput");if(!input)return;
 var text=input.value.trim();if(!text&&!currentReply)return;

function cloudUpload(file,ok,fail,progress){
 if(!file){if(fail)fail("No file selected.");return}
 if(file.size>100*1024*1024){if(fail)fail("File must be under 100MB.");return}
 var fd=new FormData();fd.append("file",file);fd.append("upload_preset",CLOUDINARY_UPLOAD_PRESET);
 var x=new XMLHttpRequest();x.open("POST",CLOUDINARY_UPLOAD_URL,true);
 x.upload.onprogress=function(e){if(progress&&e.lengthComputable)progress(Math.round(e.loaded*100/e.total))};
 x.onload=function(){
  try{
   var r=JSON.parse(x.responseText);
   if(x.status>=200&&x.status<300&&r.secure_url){ok(r.secure_url);return}
   fail((r.error&&r.error.message)||"Cloudinary upload failed.");
  }catch(e){fail("Cloudinary response error.");}
 };
 x.onerror=function(){fail("Cloudinary network error.");};
 x.send(fd);
}

 if(x.videoUrl)content+='<video class="media" controls src="'+esc(x.videoUrl)+'"></video>';
 if(x.audioUrl)content+='<audio class="media" controls src="'+esc(x.audioUrl)+'"></audio>';
 return '<div class="statusCard">'+
 '<div class="between"><b>'+esc(x.username||"User")+'</b><span class="status">'+esc(timeOf(x.createdAt))+'</span></div>'+
 '<div class="statusActions">'+
 content+
 '<button onclick="reactStatus(\''+x.id+'\')">❤️ React</button>'+
 (own?'<button onclick="deleteStatus(\''+x.id+'\')">Delete</button>':'<button onclick="viewStatus(\''+x.id+'\',\''+x.uid+'\')">View</button>')+
 '</div></div>';
}
function reactStatus(id){
 db.collection("statusReactions").doc(id+"_"+me.uid).set({
  statusId:id,uid:me.uid,reaction:"❤️",createdAt:ts()
 }).then(function(){
  db.collection("statuses").doc(id).get().then(function(d){
   if(d.exists&&d.data().uid!==me.uid)addNotification(d.data().uid,"statusReaction","Someone reacted to your status");
  });
 });
}
function viewStatus(id,owner){
 if(owner===me.uid)return;
 db.collection("statusViews").doc(id+"_"+me.uid).set({
  statusId:id,uid:me.uid,createdAt:ts()
 },{merge:true}).then(function(){
  addNotification(owner,"statusView",me.username+" viewed your status");
 });
}
function deleteStatus(id){
 if(!confirm("Delete this status?"))return;
 db.collection("statuses").doc(id).delete().catch(function(){toast("Delete failed.");});
}
function showFriendsStatus(){
 showStatusByType("friends");
}
function showOtherStatus(){
 showStatusByType("other");
}
function showStatusByType(kind){
 currentPage=kind==="friends"?"friendsStatus":"otherStatus";stopAll();
 var body='<div class="wrap"><div id="statusFeed">Loading...</div></div>';
 render(pageShell(kind==="friends"?"Friends Status":"Other Users Status",body,true));
 listen(db.collection("chats").where("participants","array-contains",me.uid),function(cs){
  var friendIds={};
  cs.forEach(function(d){
   var p=d.data().participants||[];
   for(var i=0;i<p.length;i++)if(p[i]!==me.uid)friendIds[p[i]]=true;
  });
  listen(db.collection("statuses"),function(ss){
   var h="";
   ss.forEach(function(d){
    var x=d.data();
    if(x.uid===me.uid)return;
    var isFriend=!!friendIds[x.uid];
    if((kind==="friends"&&isFriend)||(kind==="other"&&!isFriend)){
     x.id=d.id;h+=statusHTML(x,false);
    }
   });
   el("statusFeed").innerHTML=h||'<div class="empty">No statuses available.</div>';
  });
 });
}
function showSettings(){
 currentPage="settings";stopAll();
 var body='<div class="wrap"><div class="card">'+
 '<button class="menuBtn" onclick="editProfile()">Edit Profile</button>'+
 '<button class="menuBtn" onclick="toggleNotifications()">Notifications: '+(notificationsOn?"ON":"OFF")+'</button>'+
 '<button class="menuBtn" onclick="toggleSound()">Notification Sound: '+(soundOn?"ON":"OFF")+'</button>'+
 '<button class="menuBtn" onclick="toggleBlock()">Block / Unblock</button>'+
 '<button class="menuBtn" onclick="showBlocked()">Blocked Users</button>'+
 '<button class="menuBtn" onclick="removeId()">Remove ID</button>'+
 '<button class="menuBtn" onclick="logout()">Logout</button>'+
 '</div></div>';
 render(pageShell("Settings",body,true));
}
function editProfile(){
 var n=prompt("Username",me.username||"");
 if(n===null)return;
 n=n.trim();if(n.length<2)return;
 db.collection("users").doc(me.uid).update({username:n,usernameLower:n.toLowerCase()}).then(function(){
  me.username=n;toast("Profile updated.");
  showSettings();
 });
}
function toggleNotifications(){
 notificationsOn=!notificationsOn;
 localStorage.setItem("yc_notifications",notificationsOn?"1":"0");
 showSettings();
}
function toggleSound(){
 soundOn=!soundOn;
 localStorage.setItem("yc_sound",soundOn?"1":"0");
 if(soundOn)notifySound();
 showSettings();
}
function toggleBlock(){
 if(!currentPeer)return;
 db.collection("blocks").doc(me.uid+"_"+currentPeer.uid).get().then(function(d){
  if(d.exists){
   db.collection("blocks").doc(me.uid+"_"+currentPeer.uid).delete().then(function(){toast("User unblocked.");showSettings()});
  }else{
   db.collection("blocks").doc(me.uid+"_"+currentPeer.uid).set({
    uid:me.uid,blockedUid:currentPeer.uid,createdAt:ts()
   }).then(function(){toast("User blocked.");showSettings()});
  }
 });
}
function showBlocked(){
 currentPage="blocked";stopAll();
 var body='<div class="wrap"><div id="blockedList" class="card">Loading...</div></div>';
 render(pageShell("Blocked Users",body,true));
 listen(db.collection("blocks").where("uid","==",me.uid),function(s){
  var h="";
  s.forEach(function(d){
   var x=d.data(),u=users[x.blockedUid]||{};
   h+='<div class="userRow"><div class="userInfo"><b>'+esc(u.username||"User")+'</b></div>'+
   '<button class="btn small" onclick="unblockUser(\''+x.blockedUid+'\')">Unblock</button></div>';
  });
  el("blockedList").innerHTML=h||'<div class="empty">No blocked users.</div>';
 });
}
function unblockUser(uid){
 db.collection("blocks").doc(me.uid+"_"+uid).delete().then(function(){showBlocked()});
}
function removeId(){
 if(!currentPeer)return;
 if(!confirm("Remove this ID/user from your private chat?"))return;
 var id=chatIdFor(me.uid,currentPeer.uid);
 db.collection("chats").doc(id).delete().then(function(){
  toast("ID removed.");
  showPrivate();
 });
}
function logout(){
 if(auth.currentUser)db.collection("users").doc(me.uid).set({online:false,lastSeen:ts()},{merge:true}).catch(function(){});
 stopAll();auth.signOut();
}
function showNotifications(){
 currentPage="notifications";stopAll();
 var body='<div class="wrap"><button class="btn danger" onclick="clearNotifications()">Clear notifications</button>'+
 '<div id="notificationList" class="card">Loading...</div></div>';
 render(pageShell("Notifications",body,true));
 listen(db.collection("notifications").where("toUid","==",me.uid).orderBy("createdAt","desc"),function(s){
  var h="";
  s.forEach(function(d){
   var x=d.data();
   h+='<div class="userRow"><div class="userInfo"><b>'+esc(x.type||"Notification")+'</b><div class="status">'+esc(x.text||"")+'</div></div><div class="status">'+esc(timeOf(x.createdAt))+'</div></div>';
  });
  el("notificationList").innerHTML=h||'<div class="empty">No notifications.</div>';
 });
}
function clearNotifications(){
 db.collection("notifications").where("toUid","==",me.uid).get().then(function(s){
  var b=db.batch();s.forEach(function(d){b.delete(d.ref)});return b.commit();
 }).then(function(){showNotifications()});
}
function onNotificationEvent(){
 if(notificationsOn)notifySound();
}
window.addEventListener("beforeunload",function(){
 if(auth.currentUser){
  db.collection("users").doc(auth.currentUser.uid).set({online:false,lastSeen:ts()},{merge:true}).catch(function(){});
 }
});
</script>
</body>
</html>
