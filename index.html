<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,
      maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#061326">
<title>YOUR CHAT</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 min-height:100%;
 background:#061326;
 color:#fff;
 font-family:Arial,sans-serif;
}

button,input,textarea{font:inherit}
button{cursor:pointer}
.hide{display:none!important}

:root{
 --bg:#061326;
 --panel:#081b32;
 --panel2:#0d2745;
 --line:#16568c;
 --blue:#168cff;
 --purple:#8b35ff;
 --pink:#d72cff;
 --green:#00e99a;
 --muted:#8da8c5;
}

#loading{
 position:fixed;
 inset:0;
 z-index:9999;
 display:flex;
 align-items:center;
 justify-content:center;
 background:
 radial-gradient(circle at 50% 18%,#173d70,#061326 68%);
}

.loadbox{
 width:92%;
 max-width:350px;
 padding:24px 18px;
 text-align:center;
 background:#081a31;
 border:1px solid #1975df;
 border-radius:20px;
 box-shadow:0 0 35px #071d40;
}

.logo{
 font-size:27px;
 font-weight:bold;
 letter-spacing:1px;
}

.logo span{color:#b833ff}

.loadingPeople{
 display:flex;
 justify-content:center;
 align-items:center;
 gap:18px;
 margin:16px 0 4px;
}

.loadingPerson{
 width:82px;
 height:82px;
 border-radius:50%;
 border:2px solid #238cff;
 background:#102d4d;
 object-fit:cover;
}

.loadingPerson.girl{
 border-color:#d72cff;
}

.spinner{
 width:34px;
 height:34px;
 margin:15px auto 10px;
 border:3px solid #214365;
 border-top-color:#b833ff;
 border-right-color:#168cff;
 border-radius:50%;
 animation:spin .8s linear infinite;
}

@keyframes spin{
 to{transform:rotate(360deg)}
}

.small{
 color:var(--muted);
 font-size:12px;
 line-height:1.5;
}

#auth{
 min-height:100vh;
 padding:15px;
 display:flex;
 align-items:center;
 justify-content:center;
 background:
 radial-gradient(circle at 80% 20%,#301061,#061326 55%);
}

.box{
 width:100%;
 max-width:390px;
 padding:20px;
 background:#081a31;
 border:1px solid #175ea8;
 border-radius:18px;
}

input,textarea{
 width:100%;
 padding:12px;
 margin:6px 0;
 color:#fff;
 background:#061326;
 border:1px solid #21496f;
 border-radius:10px;
 outline:none;
}

input:focus,textarea:focus{
 border-color:#9c35ff;
}

textarea{
 min-height:70px;
 resize:none;
}

.btn{
 width:100%;
 padding:11px;
 margin-top:7px;
 color:#fff;
 font-weight:bold;
 background:linear-gradient(90deg,#167fff,#8b2fff);
 border:0;
 border-radius:10px;
}

.btn.alt{
 background:#102b49;
 border:1px solid #20547f;
}

.btn.red{
 background:#a9273d;
}

.btn.green{
 background:#087f65;
}

.tabs{
 display:flex;
 gap:5px;
 margin:10px 0;
}

.tab{
 flex:1;
 padding:9px 3px;
 border:1px solid #174b78;
 border-radius:8px;
 background:#0a2039;
 color:#b7cbe0;
 font-size:11px;
}

.tab.active{
 background:#7b2cff;
 color:#fff;
}

header{
 height:55px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 10px;
 background:#07182d;
 border-bottom:1px solid #12518c;
 position:sticky;
 top:0;
 z-index:50;
}

.brand{
 font-weight:bold;
 font-size:19px;
}

.brand span{color:#bd39ff}

.headerUser{
 display:flex;
 align-items:center;
 gap:6px;
 font-size:11px;
}

.avatar{
 width:34px;
 height:34px;
 border-radius:50%;
 object-fit:cover;
 border:1px solid #238cff;
 background:#102d4d;
}

.dot{
 display:inline-block;
 width:8px;
 height:8px;
 border-radius:50%;
 background:#00e99a;
}

.offline{background:#65758a}

.grn{color:#00e99a}

main{
 width:100%;
 max-width:520px;
 margin:auto;
 padding:9px;
 padding-bottom:58px;
}

.card{
 background:#081b32;
 border:1px solid #164f83;
 border-radius:14px;
 padding:11px;
 margin-bottom:9px;
}

.menu{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:7px;
}

.menuBtn{
 min-height:75px;
 color:#fff;
 text-align:left;
 padding:10px;
 border-radius:12px;
 border:1px solid #174c7b;
 background:#0a213b;
}

.menuBtn strong{
 display:block;
 color:#54aaff;
 margin-bottom:5px;
 font-size:13px;
}

.menuBtn small{
 color:#89a5c1;
 font-size:10px;
}

.topTitle{
 display:flex;
 align-items:center;
 gap:7px;
 margin-bottom:8px;
}

.back{
 width:auto;
 padding:7px 10px;
 margin:0 0 8px;
}

.userRow{
 display:flex;
 align-items:center;
 gap:8px;
 padding:8px 2px;
 border-bottom:1px solid #123653;
}

.userInfo{
 flex:1;
}

.userInfo b{
 display:block;
 font-size:13px;
}

.userInfo small{
 display:block;
 color:#7e9ab6;
 font-size:10px;
 margin-top:2px;
}

.miniBtn{
 width:auto;
 padding:7px 9px;
 margin:0;
 font-size:11px;
}

.chatBox{
 height:52vh;
 min-height:260px;
 overflow:auto;
 padding:5px 1px;
}

.message{
 display:flex;
 gap:6px;
 margin:7px 0;
 align-items:flex-end;
}

.message.mine{
 justify-content:flex-end;
}

.message.mine .messageAvatar{
 order:2;
}

.message.mine .bubble{
 order:1;
}

.bubble{
 max-width:78%;
 padding:8px 10px;
 background:#102e4d;
 border:1px solid #174c79;
 border-radius:11px;
 font-size:12px;
}

.mine .bubble{
 background:#4720a0;
 border-color:#763bdf;
}

.bubble small{
 display:block;
 margin-top:4px;
 color:#9eb7d0;
 font-size:8px;
 text-align:right;
}

.messageAvatar{
 width:27px;
 height:27px;
 border-radius:50%;
 object-fit:cover;
 border:1px solid #238cff;
}

.mention{
 color:#58b8ff;
 font-weight:bold;
}

.chatInput{
 display:flex;
 gap:5px;
 margin-top:6px;
}

.chatInput textarea{
 margin:0;
 min-height:40px;
 height:40px;
}

.send{
 width:45px;
 margin:0;
}

.tools{
 display:flex;
 gap:5px;
 margin-top:5px;
}

.tool{
 flex:1;
 padding:7px 2px;
 color:#b8d3ee;
 background:#0b2744;
 border:1px solid #194b74;
 border-radius:8px;
 font-size:10px;
}

.statusCard{
 padding:8px;
 border-bottom:1px solid #143a5d;
}

.statusImg{
 width:100%;
 max-height:210px;
 object-fit:cover;
 border-radius:9px;
 margin-top:5px;
}

.reactions{
 display:flex;
 gap:5px;
 margin-top:5px;
}

.react{
 padding:5px 7px;
 background:#102d4c;
 border:1px solid #1b527f;
 border-radius:15px;
 font-size:12px;
}

.notice{
 padding:10px;
 border-radius:10px;
 margin:7px 0;
 background:#102941;
 border:1px solid #1a557f;
 color:#b9cee2;
 font-size:11px;
}

.warning{
 background:#3b1921;
 border-color:#b72f49;
 color:#ff8fa2;
}

.success{
 background:#10372e;
 border-color:#13856b;
 color:#7ff0cf;
}

.bottom{
 position:fixed;
 left:0;
 right:0;
 bottom:0;
 height:47px;
 background:#07182d;
 border-top:1px solid #164d7d;
 display:flex;
 justify-content:center;
 z-index:100;
}

.bottom button{
 flex:1;
 max-width:105px;
 background:none;
 color:#91aac2;
 border:0;
 font-size:9px;
}

.bottom button.active{
 color:#bd48ff;
}

.badge{
 background:#7b2cff;
 color:#fff;
 border-radius:12px;
 padding:2px 6px;
 font-size:9px;
}

.search{
 margin-bottom:7px;
}

@media(max-width:350px){
 .menuBtn{min-height:67px}
 .menuBtn strong{font-size:12px}
 main{padding:7px}
}
</style>
</head>

<body>

<!-- =========================
     LOADING
========================= -->

<div id="loading">
 <div class="loadbox">

  <div class="logo">
   YOUR <span>CHAT</span>
  </div>

  <div class="loadingPeople">

   <!-- Built-in boy DP -->
   <img
    class="loadingPerson"
    alt="Boy"
    src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23102745'/%3E%3Ccircle cx='50' cy='39' r='24' fill='%23d99b70'/%3E%3Cpath d='M27 38c2-25 46-34 49 2-8-7-15-11-25-11-9 0-16 3-24 9z' fill='%231b1720'/%3E%3Cpath d='M25 92c3-25 47-25 50 0' fill='%23168cff'/%3E%3Ccircle cx='41' cy='40' r='3' fill='%23061326'/%3E%3Ccircle cx='59' cy='40' r='3' fill='%23061326'/%3E%3Cpath d='M43 51q7 5 14 0' fill='none' stroke='%236c3828' stroke-width='2'/%3E%3C/svg%3E">

   <!-- Built-in girl DP -->
   <img
    class="loadingPerson girl"
    alt="Girl"
    src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23301950'/%3E%3Ccircle cx='50' cy='42' r='22' fill='%23e0a27d'/%3E%3Cpath d='M25 43c-5-30 51-40 52 0l-8 27H31z' fill='%23201828'/%3E%3Cpath d='M22 95c3-27 53-27 56 0' fill='%23d72cff'/%3E%3Ccircle cx='42' cy='43' r='3' fill='%23061326'/%3E%3Ccircle cx='58' cy='43' r='3' fill='%23061326'/%3E%3Cpath d='M43 54q7 5 14 0' fill='none' stroke='%23723c2d' stroke-width='2'/%3E%3C/svg%3E">

  </div>

  <div class="spinner"></div>

  <div class="small">
   Starting Your Chat...
  </div>

 </div>
</div>

<!-- =========================
     LOGIN
========================= -->

<div id="auth" class="hide">

 <div class="box">

  <div style="text-align:center">

   <div class="logo">
    YOUR <span>CHAT</span>
   </div>

   <p class="small">
    Connect • Chat • Share
   </p>

  </div>

  <div class="tabs">

   <button id="loginTab"
           class="tab active"
           onclick="authMode('login')">
    Login
   </button>

   <button id="createTab"
           class="tab"
           onclick="authMode('create')">
    Create Account
   </button>

  </div>

  <input id="username"
         maxlength="24"
         placeholder="Username">

  <input id="password"
         type="password"
         minlength="6"
         placeholder="Password">

  <button id="authBtn"
          class="btn"
          onclick="authAction()">
   Login
  </button>

  <div id="authStatus"
       class="small"
       style="text-align:center;margin-top:8px">
  </div>

 </div>
</div>

<!-- =========================
     APP
========================= -->

<div id="app" class="hide">

<header>

 <div class="brand">
  YOUR <span>CHAT</span>
 </div>

 <div class="headerUser">
  <span class="dot"></span>
  <span id="headerName">User</span>
 </div>

</header>

<main id="main"></main>

<div class="bottom">

 <button id="navHome"
         onclick="home()">
  🏠<br>Home
 </button>

 <button id="navWorld"
         onclick="worldChat()">
  🌍<br>World
 </button>

 <button id="navUsers"
         onclick="onlineUsers()">
  <span class="grn">●</span><br>Online
 </button>

 <button id="navStatus"
         onclick="statusPage()">
  ●<br>Status
 </button>

 <button id="navSettings"
         onclick="settings()">
  ⚙<br>Settings
 </button>

</div>

</div>

<script>
"use strict";

/* =========================
   DEMO USERS
   ========================= */

const demoUsers=[
 {
  uid:"U1001",
  username:"Ali",
  online:true,
  avatar:"https://i.pravatar.cc/100?img=12"
 },
 {
  uid:"U1002",
  username:"Aisha",
  online:true,
  avatar:"https://i.pravatar.cc/100?img=47"
 },
 {
  uid:"U1003",
  username:"Zoha",
  online:true,
  avatar:"https://i.pravatar.cc/100?img=32"
 },
 {
  uid:"U1004",
  username:"Hassan",
  online:true,
  avatar:"https://i.pravatar.cc/100?img=11"
 },
 {
  uid:"U1005",
  username:"Nimra",
  online:true,
  avatar:"https://i.pravatar.cc/100?img=44"
 },
 {
  uid:"U1006",
  username:"Usman",
  online:false,
  avatar:"https://i.pravatar.cc/100?img=68"
 }
];

let demoMessages=[
 {
  uid:"U1001",
  username:"Ali",
  text:"Hello everyone! 👋",
  time:"12:42"
 },
 {
  uid:"U1002",
  username:"Aisha",
  text:"Good morning ☀️",
  time:"12:41"
 },
 {
  uid:"U1003",
  username:"Zoha",
  text:"Koi new friend banao yaar 😄",
  time:"12:38"
 },
 {
  uid:"U1004",
  username:"Hassan",
  text:"Nice pic!",
  time:"12:35"
 },
 {
  uid:"U1005",
  username:"Nimra",
  text:"Welcome all 😊",
  time:"12:30"
 },
 {
  uid:"U1006",
  username:"Usman",
  text:"Kya haal hai?",
  time:"12:20"
 }
];

let groupsData=[
 {
  id:"G1001",
  name:"Friends Group",
  memberIds:[
   "U1001",
   "U1002",
   "U1003",
   "U1004"
  ]
 }
];

let me={
 uid:"LOCAL_"+Math.random()
       .toString(36)
       .slice(2,8)
       .toUpperCase(),
 username:"Malik",
 online:true,
 avatar:"https://i.pravatar.cc/100?img=13"
};

let mode="login";
let currentChatUser=null;

/* =========================
   HELPERS
========================= */

function $(id){
 return document.getElementById(id);
}

function esc(v){
 return String(v||"")
 .replace(/[&<>"']/g,function(x){
  return {
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#039;"
  }[x];
 });
}

function avatar(user){

 if(user && user.avatar){
  return user.avatar;
 }

 return FALLBACK_AVATAR;
}

/* Offline fallback avatar */
const FALLBACK_AVATAR=
"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='50' fill='%23102d4d'/%3E%3Ccircle cx='50' cy='38' r='20' fill='%23238cff'/%3E%3Cellipse cx='50' cy='90' rx='32' ry='25' fill='%23238cff'/%3E%3C/svg%3E";

document.addEventListener(
 "error",
 function(e){

  const el=e.target;

  if(!el || el.tagName!=="IMG"){
   return;
  }

  if(
   el.classList.contains("avatar") ||
   el.classList.contains("messageAvatar")
  ){

   el.onerror=null;
   el.src=FALLBACK_AVATAR;
  }

  if(el.classList.contains("statusImg")){
   el.style.display="none";
  }

 },
 true
);

function findUser(uid){

 if(uid===me.uid){
  return me;
 }

 return demoUsers.find(
  u=>u.uid===uid
 ) || {
  uid:uid,
  username:"User",
  online:false,
  avatar:FALLBACK_AVATAR
 };
}

function timeNow(){

 return new Date().toLocaleTimeString(
  [],
  {
   hour:"2-digit",
   minute:"2-digit"
  }
 );
}

function onlineCount(){

 return demoUsers.filter(
  u=>u.online
 ).length + (me.online?1:0);
}

function setNav(name){

 document.querySelectorAll(
  ".bottom button"
 ).forEach(function(x){
  x.classList.remove("active");
 });

 const el=$("nav"+name);

 if(el){
  el.classList.add("active");
 }
}

/* =========================
   MODERATION
========================= */

const BAD_WORDS=[
 "badword1",
 "badword2"
];

function containsAbusiveWord(text){

 const lower=
  String(text||"").toLowerCase();

 return BAD_WORDS.some(
  function(word){

   const safe=
    word.replace(
     /[.*+?^${}()|[\]\\]/g,
     "\\$&"
    );

   return new RegExp(
    "\\b"+safe+"\\b",
    "i"
   ).test(lower);

  }
 );
}

/* =========================
   START
========================= */

setTimeout(function(){

 $("loading").classList.add("hide");
 $("auth").classList.remove("hide");

},1100);

/* =========================
   AUTH
========================= */

function authMode(type){

 mode=type;

 $("loginTab").classList.toggle(
  "active",
  type==="login"
 );

 $("createTab").classList.toggle(
  "active",
  type==="create"
 );

 $("authBtn").textContent=
  type==="login"
  ? "Login"
  : "Create Account";

 $("authStatus").textContent="";
}

function validUsername(name){

 return /^[A-Za-z0-9_]{3,24}$/.test(name);
}

function authAction(){

 const name=
  $("username").value.trim();

 const pass=
  $("password").value;

 if(!validUsername(name)){

  $("authStatus").textContent=
   "Username 3-24 letters, numbers or _ only.";

  return;
 }

 if(pass.length<6){

  $("authStatus").textContent=
   "Password must be 6 characters or more.";

  return;
 }

 me.username=name;

 localStorage.setItem(
  "yourchat_username",
  name
 );

 $("headerName").textContent=name;

 $("auth").classList.add("hide");
 $("app").classList.remove("hide");

 home();
}

/* =========================
   HOME
========================= */

function home(){

 setNav("Home");

 $("main").innerHTML=`

 <div class="card">

  <div class="topTitle">

   <img class="avatar"
        src="${avatar(me)}">

   <div>

    <b>
     Welcome, ${esc(me.username)} 👋
    </b>

    <div class="small">
     Your Chat is ready
    </div>

   </div>

  </div>

  <div class="menu">

   <button class="menuBtn"
           onclick="worldChat()">
    <strong>🌍 World Chat</strong>
    <small>Text + @mentions only</small>
   </button>

   <button class="menuBtn"
           onclick="onlineUsers()">
    <strong>
     <span class="grn">●</span>
     Online Users
    </strong>
    <small>
     ${onlineCount()} users online
    </small>
   </button>

   <button class="menuBtn"
           onclick="allUsers()">
    <strong>👤 All Users</strong>
    <small>Username + ID + status</small>
   </button>

   <button class="menuBtn"
           onclick="privateInfo()">
    <strong>💬 Private Chat</strong>
    <small>Friends / approved users</small>
   </button>

   <button class="menuBtn"
           onclick="groups()">
    <strong>👥 Group Chat</strong>
    <small>Members + messages</small>
   </button>

   <button class="menuBtn"
           onclick="statusPage()">
    <strong>● Status</strong>
    <small>Text, image, video</small>
   </button>

   <button class="menuBtn"
           onclick="notifications()">
    <strong>🔔 Notifications</strong>
    <small>Messages & mentions</small>
   </button>

   <button class="menuBtn"
           onclick="settings()">
    <strong>⚙️ Settings</strong>
    <small>Account & privacy</small>
   </button>

  </div>

 </div>

 <div class="card">

  <b>
   <span class="grn">●</span>
   Online now
  </b>

  <span class="badge">
   ${onlineCount()}
  </span>

  <p class="small">
   World Chat: text + @mentions only.
  </p>

 </div>

 <div class="card">

  <b>🔒 Current build</b>

  <p class="small">
   Frontend preview only. Firebase backend will be
   connected after Google Cloud access is restored.
  </p>

 </div>

 <button class="btn red"
         onclick="logout()">
  Log Out
 </button>
 `;
}

/* =========================
   WORLD CHAT
========================= */

function worldChat(){

 setNav("World");

 $("main").innerHTML=`

 <button class="btn alt back"
         onclick="home()">
  ← Home
 </button>

 <div class="card">

  <div class="topTitle">

   <b>🌍 World Chat</b>

   <span class="badge">
    <span class="grn">●</span>
    ${onlineCount()}
   </span>

  </div>

  <div id="worldMessages"
       class="chatBox">
  </div>

  <div class="chatInput">

   <textarea id="worldText"
             maxlength="1000"
             placeholder="Type a message..."></textarea>

   <button class="btn send"
           onclick="sendWorld()">
    ➤
   </button>

  </div>

  <div class="tools">

   <button class="tool"
           onclick="mentionPicker()">
    @ Mention
   </button>

   <button class="tool"
           onclick="showNotice(
            'World Chat only supports text and @mentions.'
           )">
    World Rules
   </button>

  </div>

  <div class="small"
       style="margin-top:7px">
   Latest 15 shown • Old database messages are not
   automatically deleted.
  </div>

 </div>
 `;

 renderWorld();
}

function renderWorld(){

 const box=$("worldMessages");

 if(!box)return;

 box.innerHTML="";

 demoMessages
 .slice(-15)
 .forEach(function(m){

  const u=findUser(m.uid);

  const div=
   document.createElement("div");

  div.className=
   "message "+
   (m.uid===me.uid?"mine":"");

  let text=esc(m.text);

  text=text.replace(
   /@([A-Za-z0-9_]+)/g,
   '<span class="mention">@$1</span>'
  );

  div.innerHTML=`

   <img class="messageAvatar"
        src="${avatar(u)}">

   <div class="bubble">

    <b>${esc(m.username)}</b><br>

    ${text}

    <small>
     ${esc(m.time)}
    </small>

function sendWorld(){

 const input=$("worldText");

 if(!input)return;

 const text=input.value.trim();

 if(!text)return;

 if(containsAbusiveWord(text)){

  showNotice(
   "⚠ Message blocked. Please avoid abusive words.",
   true
  );

  return;
 }

 const recent=
  JSON.parse(
   localStorage.getItem(
    "worldSendTimes"
   ) || "[]"
  );

 const now=Date.now();

 const active=
  recent.filter(
   x=>now-x<10000
  );

 if(active.length>=5){

  showNotice(
   "⚠ You are sending messages too fast. Please wait.",
   true
  );

  return;
 }

 active.push(now);

 localStorage.setItem(
  "worldSendTimes",
  JSON.stringify(active)
 );

 demoMessages.push({

  uid:me.uid,
  username:me.username,
  text:text,
  time:timeNow()

 });

 input.value="";

 renderWorld();
}

function filterUsers(q,all){

 const source=
  all
  ?[...demoUsers,me]
  :demoUsers.filter(
    u=>u.online
   ).concat(
    me.online?[me]:[]
   );

 const search=
  String(q||"").toLowerCase();

 const filtered=
  source.filter(
   u=>u.username
    .toLowerCase()
    .includes(search)
  );

 renderUsers(filtered);
}
