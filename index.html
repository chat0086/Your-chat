function openStatus(id){db.collection("statuses").doc(id).get().then(function(d){if(!d.exists)return;var x=d.data();if(statusExpired(x)){toast("Status expired.");return}db.collection("statusViews").doc(id+"_"+me.uid).set({statusId:id,uid:me.uid,createdAt:ts()},{merge:true});return db.collection("statusViews").where("statusId","==",id).get().then(function(viewSnap){var count=viewSnap.size,v=document.createElement("div");v.className="statusViewer";var body=x.text?'<div class="statusText">'+esc(x.text)+'</div>':x.imageUrl?'<img src="'+esc(x.imageUrl)+'">':x.videoUrl?'<video controls autoplay src="'+esc(x.videoUrl)+'"></video>':'';var bottom='<div class="statusBottom"><div class="row"><button class="btn secondary" onclick="showStatusReactions(\''+id+'\',\''+x.uid+'\')">❤️</button><button class="btn secondary" onclick="showStatusReactions(\''+id+'\',\''+x.uid+'\')">😂</button><button class="btn secondary" onclick="showStatusReactions(\''+id+'\',\''+x.uid+'\')">😮</button><button class="btn secondary" onclick="showStatusReactions(\''+id+'\',\''+x.uid+'\')">😢</button><button class="btn secondary" onclick="showStatusReactions(\''+id+'\',\''+x.uid+'\')">👍</button></div>';if(x.uid===me.uid)bottom+='<button class="btn" onclick="showStatusViews(\''+id+'\')">👁 '+count+' Viewers</button>';bottom+='</div>';v.innerHTML='<div class="statusTop">'+av(users[x.uid]||x)+'<div class="userInfo"><b>'+esc(x.username||"User")+'</b><div class="small">'+time(x.createdAt)+'</div></div><button class="back" onclick="this.parentNode.parentNode.remove()">×</button></div><div class="statusBody">'+body+'</div>'+bottom;document.body.appendChild(v)})})}
function showStatusReactions(id,owner){var a=["❤️","😂","😮","😢","👍"],r=prompt("Choose reaction:\n1 ❤️\n2 😂\n3 😮\n4 😢\n5 👍");var n=parseInt(r,10)-1;if(n<0||n>=a.length)return;db.collection("statusReactions").doc(id+"_"+me.uid).set({statusId:id,uid:me.uid,reaction:a[n],createdAt:ts()}).then(function(){if(owner!==me.uid)notify(owner,"statusReaction",me.username+" reacted to your status");toast("Reaction sent.")})}
function reactStatus(id,owner){showStatusReactions(id,owner)}
function showStatusViews(id){Promise.all([db.collection("statusViews").where("statusId","==",id).get(),db.collection("users").get()]).then(function(a){var s=a[0],us=a[1],map={};us.forEach(function(d){map[d.id]=d.data()});var h='<div class="card"><b>People who viewed</b>';if(s.empty)h+='<div class="empty">No views yet.</div>';s.forEach(function(d){var x=d.data(),u=map[x.uid]||{};h+='<div class="userRow">'+av(u)+'<div class="userInfo"><b>'+esc(u.username||"User")+'</b><div class="small">ID: '+esc(u.uid||x.uid)+'</div><div class="small">'+fullDate(x.createdAt)+'</div></div></div>'});h+='</div>';var v=document.createElement("div");v.className="statusViewer";v.innerHTML='<div class="statusTop"><b>Status Viewers</b><button class="back" onclick="this.parentNode.parentNode.remove()">×</button></div><div class="viewerList">'+h+'</div>';document.body.appendChild(v)})}
var themes=[["wc-blue","Ocean Blue"],["wc-purple","Purple Night"],["wc-green","Emerald"],["wc-red","Red Night"],["wc-gold","Golden Night"],["wc-cyan","Cyber Cyan"],["wc-pink","Pink Night"],["wc-orange","Orange Fire"],["wc-ocean","Deep Ocean"],["wc-night","Midnight"],["wc-ice","Ice Blue"],["wc-candy","Candy Night"]];
function worldThemes(){themeChooser("world")}
function groupThemes(){themeChooser("group")}
function privateThemes(){themeChooser("private")}
function themeChooser(type){var v=document.createElement("div");v.className="statusViewer";var h='<div class="statusTop"><b>'+type.charAt(0).toUpperCase()+type.slice(1)+' Chat Themes</b><button class="back" onclick="this.parentNode.parentNode.remove()">×</button></div><div class="themeList">';themes.forEach(function(t){h+='<button class="themeItem '+t[0]+'" onclick="applyTheme(\''+type+'\',\''+t[0]+'\');this.parentNode.parentNode.remove()">'+t[1]+'</button>'});h+='</div>';v.innerHTML=h;document.body.appendChild(v)}
function applyTheme(type,t){if(type==="world"){currentWorldTheme=t;localStorage.setItem("yc_world_theme",t);if(page==="world")showWorld()}else if(type==="group"){localStorage.setItem("yc_group_theme_"+groupId,t);currentGroupTheme=t;if(page==="groupChat")showGroupChat()}else{localStorage.setItem("yc_private_theme_"+chatId,t);currentPrivateTheme=t;if(page==="privateChat")showPrivateChat()}}
function toggleNotif(){notif=!notif;localStorage.setItem("yc_notif",notif?"1":"0");toast("Notifications "+(notif?"ON":"OFF"))}
function toggleSound(){sound=!sound;localStorage.setItem("yc_sound",sound?"1":"0");if(sound)beep();toast("Sound "+(sound?"ON":"OFF"))}
function showSettings(){stop();page="settings";mount(shell("Settings",'<div class="wrap"><div class="card"><button class="btn secondary" onclick="editProfile()">👤 Edit Profile</button><button class="btn secondary" onclick="toggleNotif()">🔔 Notifications: '+(notif?"ON":"OFF")+'</button><button class="btn secondary" onclick="toggleSound()">🔊 Sound: '+(sound?"ON":"OFF")+'</button><button class="btn secondary" onclick="showBlocked()">🚫 Blocked Users</button><button class="btn danger" onclick="logout()">🚪 Logout</button></div></div>',true))}
function editProfile(){var n=prompt("Username",me.username||"");if(n===null)return;n=n.trim();if(n.length<2)return;db.collection("users").doc(me.uid).update({username:n,usernameLower:n.toLowerCase()}).then(function(){me.username=n;toast("Profile updated.");showSettings()}).catch(function(e){toast(e.message||"Profile update failed.")})}
function showBlocked(){stop();page="blocked";mount(shell("Blocked Users",'<div class="wrap"><div id="bl" class="card">Loading...</div></div>',true));listen(db.collection("blocks").where("uid","==",me.uid),function(s){loadUsers(function(){drawBlocked(s)})})}
function drawBlocked(s){if(!$('bl')||!s)return;var h="";s.forEach(function(d){var x=d.data(),u=users[x.blockedUid]||{};h+='<div class="userRow">'+av(u)+'<div class="userInfo"><b>'+esc(u.username||"User")+'</b><div class="small">Blocked</div></div><button class="btn" onclick="unblock(\''+x.blockedUid+'\')">Unblock</button></div>'});$('bl').innerHTML=h||'<div class="empty">No blocked users.</div>'}
function unblock(id){db.collection("blocks").doc(me.uid+"_"+id).delete().then(function(){toast("User unblocked.");showBlocked()})}
function changeDP(){var i=document.createElement("input");i.type="file";i.accept="image/*";i.onchange=function(){if(!i.files[0])return;upload(i.files[0],function(u){db.collection("users").doc(me.uid).update({avatar:u}).then(function(){me.avatar=u;toast("DP updated.")})},function(e){toast(e)},"image")};i.click()}
function trimMessages(ref){return ref.orderBy("createdAt","desc").limit(50).get().then(function(s){if(s.size<=12)return null;var b=db.batch(),i=0;s.forEach(function(d){i++;if(i>12)b.delete(d.ref)});return b.commit()}).catch(function(e){console.log(e)})}
function logout(){if(me)db.collection("users").doc(me.uid).set({online:false,lastSeen:ts()},{merge:true}).catch(function(){});clearInterval(window.presenceTimer);if(window.notificationUnsub){try{window.notificationUnsub()}catch(e){}window.notificationUnsub=null}auth.signOut()}
window.addEventListener("beforeunload",function(){if(auth.currentUser)db.collection("users").doc(auth.currentUser.uid).set({online:false,lastSeen:ts()},{merge:true}).catch(function(){})});
if(localStorage.getItem("yc_theme")==="light")document.body.classList.add("light");
</script>
</body>
</html>
