<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>YOUR CHAT</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050b14;color:#fff;font-family:Arial,sans-serif}
button,input,textarea{font:inherit}
button{border:0;border-radius:12px;padding:12px 14px;background:#147ed4;color:#fff;font-weight:bold}
button.secondary{background:#162b40}
button.danger{background:#a52d3d}
.hidden{display:none!important}

#loading{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 padding:20px
}
.loadingBox{width:100%;max-width:430px}
.brand{font-size:25px;font-weight:bold;letter-spacing:5px;color:#42b5ff;margin-bottom:20px}
.loader{
 width:42px;height:42px;
 border:4px solid #17304b;
 border-top-color:#29a9ff;
 border-radius:50%;
 animation:spin 1s linear infinite;
 margin:20px auto
}
@keyframes spin{to{transform:rotate(360deg)}}
#loadError{color:#ffb5bd;font-size:13px;line-height:1.5;margin:12px 0}

.screen{max-width:720px;margin:auto;min-height:100vh;padding:15px}
.card{
 background:#0d1928;
 border:1px solid #203b55;
 border-radius:18px;
 padding:15px;
 margin-bottom:12px
}
input,textarea{
 width:100%;
 padding:12px;
 margin:6px 0;
 border-radius:12px;
 border:1px solid #28445f;
 background:#07111f;
 color:#fff;
 outline:none
}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.spacer{flex:1}

.avatar{
 width:46px;height:46px;border-radius:50%;
 background:#18324b;
 display:flex;align-items:center;justify-content:center;
 font-weight:bold;color:#8bd5ff;
 object-fit:cover
}

.nav{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.nav button{min-height:62px}

.chatlist{
 height:55vh;
 overflow-y:auto;
 padding:5px
}
.msg{
 background:#102238;
 border-radius:14px;
 padding:10px;
 margin:7px 0;
 max-width:88%;
 word-break:break-word
}
.mine{margin-left:auto;background:#075f9f}
.msg small{display:block;color:#9bb1c7;font-size:10px;margin-top:5px}

.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.actions button{padding:7px 10px;font-size:12px;background:#17304a}

.user{
 display:flex;
 align-items:center;
 gap:10px;
 padding:10px;
 border-bottom:1px solid #193047
}
.grow{flex:1}
.muted{color:#91a7bb;font-size:13px}

#toast{
 position:fixed;
 left:12px;
 right:12px;
 bottom:15px;
 background:#13283d;
 border:1px solid #2b5374;
 border-radius:12px;
 padding:12px;
 text-align:center;
 display:none;
 z-index:999
}

@media(min-width:600px){
 .nav{grid-template-columns:repeat(5,1fr)}
}
</style>
</head>

<body>

<div id="loading">
 <div class="loadingBox">
  <div class="brand">YOUR CHAT</div>
  <div id="loader" class="loader"></div>
  <div id="loadingText">Starting YOUR CHAT...</div>
  <div id="loadError"></div>
  <button id="retry" class="secondary hidden">Retry</button>
 </div>
</div>

<div id="app" class="hidden"></div>
<div id="toast"></div>

<script>
(function(){

 function errorScreen(message){
  var e=document.getElementById("loadError");
  var l=document.getElementById("loader");
  var r=document.getElementById("retry");

  if(e)e.textContent=message;
  if(l)l.classList.add("hidden");
  if(r)r.classList.remove("hidden");
 }

 window.__chatBootError=errorScreen;

 window.addEventListener("error",function(e){
  errorScreen("App error: "+(e.message||"JavaScript error"));
 });

 window.addEventListener("unhandledrejection",function(e){
  var m=e.reason&&e.reason.message
   ?e.reason.message
   :String(e.reason||"Unknown error");

  errorScreen("Firebase error: "+m);
 });

 document.getElementById("retry").onclick=function(){
  location.reload();
 };

 setTimeout(function(){
  var loading=document.getElementById("loading");

  if(loading && !loading.classList.contains("hidden")){
   errorScreen("Connection zyada time le rahi hai. Retry dabao.");
  }
 },12000);

})();
</script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>

var firebaseConfig={
 apiKey:"AIzaSyBmyYlEtZCm7yDsmqAsqdRNmxBjPSiCyQ",
 authDomain:"your-chat-24913.firebaseapp.com",
 projectId:"your-chat-24913",
 storageBucket:"your-chat-24913.firebasestorage.app",
 messagingSenderId:"700520326360",
 appId:"1:700520326360:web:a3dc5fd4e36b54dbb563ad",
 measurementId:"G-7JBWVDK838"
};

var auth=null;
var db=null;
var me=null;
var profile=null;
var current="home";
var selectedUser=null;
var selectedGroup=null;
var unsubs=[];
var allUsers=[];

function $(id){
 return document.getElementById(id);
}

function esc(v){
 return String(v==null?"":v).replace(/[&<>"']/g,function(c){
  return {
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  }[c];
 });
}

function toast(message){
 var t=$("toast");
 t.textContent=message;
 t.style.display="block";
 clearTimeout(window.__toastTimer);
 window.__toastTimer=setTimeout(function(){
  t.style.display="none";
 },3500);
}

function stopListeners(){
 unsubs.forEach(function(fn){
  try{fn();}catch(e){}
 });
 unsubs=[];
}

function hideLoading(){
 $("loading").classList.add("hidden");
 $("app").classList.remove("hidden");
}

function showConnecting(){
 $("loading").classList.remove("hidden");
 $("app").classList.add("hidden");
 $("loader").classList.remove("hidden");
 $("retry").classList.add("hidden");
 $("loadError").textContent="";
 $("loadingText").textContent="Connecting to the world...";
}

function emailFor(username){
 return username.toLowerCase()+"@yourchat.local";
}

function avatar(username){
 return '<div class="avatar">'+
  esc((username||"?").charAt(0).toUpperCase())+
  '</div>';
}

try{
 firebase.initializeApp(firebaseConfig);
 auth=firebase.auth();
 db=firebase.firestore();
 window.__firebaseReady=true;
}catch(e){
 window.__chatBootError("Firebase start nahi hua: "+e.message);
}

 </script><script>

function showAuth(){

 hideLoading();

 $("app").innerHTML=
 '<div class="screen" style="display:flex;align-items:center;min-height:100vh">'+
 '<div class="card" style="width:100%;max-width:430px;margin:auto">'+

 '<div class="brand" style="text-align:center">YOUR CHAT</div>'+

 '<h2 style="text-align:center">Welcome</h2>'+

 '<input id="username" placeholder="Username">'+

 '<input id="password" type="password" placeholder="Password">'+

 '<div class="row">'+
 '<button id="loginBtn">Login</button>'+
 '<button id="createBtn" class="secondary">Create Account</button>'+
 '</div>'+

 '<p id="authMsg" class="muted"></p>'+

 '</div></div>';

 $("loginBtn").onclick=function(){
  authAction(false);
 };

 $("createBtn").onclick=function(){
  authAction(true);
 };
}

async function authAction(create){

 var username=$("username").value.trim();
 var password=$("password").value;
 var msg=$("authMsg");

 if(!/^[A-Za-z0-9_]{3,24}$/.test(username)){
  msg.textContent="Username 3-24 letters, numbers ya _ hona chahiye.";
  return;
 }

 if(password.length<6){
  msg.textContent="Password kam az kam 6 characters ka ho.";
  return;
 }

 msg.textContent="Please wait...";

 try{

  if(create){

   var result=await auth.createUserWithEmailAndPassword(
    emailFor(username),
    password
   );

   await result.user.updateProfile({
    displayName:username
   });

   await db.collection("users").doc(result.user.uid).set({
    uid:result.user.uid,
    username:username,
    photo:"",
    online:true,
    createdAt:firebase.firestore.FieldValue.serverTimestamp(),
    lastSeen:firebase.firestore.FieldValue.serverTimestamp()
   },{merge:true});

  }else{

   await auth.signInWithEmailAndPassword(
    emailFor(username),
    password
   );

  }

 }catch(e){
  msg.textContent=e.message;
 }
}

async function loadProfile(){

 var ref=db.collection("users").doc(me.uid);
 var snap=await ref.get();

 if(snap.exists){

  profile=snap.data();

 }else{

  profile={
   uid:me.uid,
   username:me.displayName||"User",
   photo:""
  };

  await ref.set(profile,{merge:true});
 }

 await ref.set({
  online:true,
  lastSeen:firebase.firestore.FieldValue.serverTimestamp()
 },{merge:true});
}

function render(){

 stopListeners();

 if(!me){
  showAuth();
  return;
 }

 $("app").innerHTML=
 '<div class="screen">'+

 '<div class="top">'+
 '<button id="backBtn" class="secondary">←</button>'+

 '<div>'+
 '<b>YOUR CHAT</b>'+
 '<div class="muted">'+esc(current)+'</div>'+
 '</div>'+

 '<div class="spacer"></div>'+
 avatar(profile.username)+

 '</div>'+

 '<div id="content"></div>'+

 '</div>';

 $("backBtn").onclick=function(){
  current="home";
  selectedUser=null;
  selectedGroup=null;
  render();
 };

 var c=$("content");

 if(current==="home")home(c);
 if(current==="world")world(c);
 if(current==="users")users(c);
 if(current==="private")privateChat(c);
 if(current==="groups")groups(c);
 if(current==="group")groupChat(c);
 if(current==="settings")settings(c);
}

function home(c){

 c.innerHTML=
 '<div class="card">'+

 '<h2>Welcome, '+esc(profile.username)+'</h2>'+
 '<p class="muted">Choose an option</p>'+

 '<div class="nav">'+

 '<button data-screen="world">🌍 World Chat</button>'+
 '<button data-screen="users">🟢 Online Users</button>'+
 '<button data-screen="private">💬 Private Chat</button>'+
 '<button data-screen="groups">👥 Group Chat</button>'+
 '<button data-screen="users">👤 All Users</button>'+
 '<button data-screen="settings" class="secondary">⚙️ Settings</button>'+

 '</div></div>';

 c.querySelectorAll("[data-screen]").forEach(function(b){
  b.onclick=function(){
   current=b.getAttribute("data-screen");
   render();
  };
 });
}

function messageHTML(m,type,chatId){

 var mine=m.uid===me.uid;
 var time="now";

 if(m.createdAt && m.createdAt.toDate){
  time=m.createdAt.toDate().toLocaleString();
 }

 return '<div class="msg '+(mine?"mine":"")+'">'+

 '<b>'+esc(m.username||"User")+'</b>'+

 '<div>'+esc(m.text||"")+'</div>'+

 '<small>'+time+(m.edited?" · edited":"")+'</small>'+

 (mine?
 '<div class="actions">'+
 '<button onclick="editMessage(\''+type+'\',\''+chatId+'\',\''+m.id+'\')">Edit</button>'+
 '<button onclick="deleteMessage(\''+type+'\',\''+chatId+'\',\''+m.id+'\')">Delete</button>'+
 '</div>'
 :"")+

 '</div>';
}

function world(c){

 c.innerHTML=
 '<div class="card">'+

 '<div class="row">'+
 '<b>🌍 World Chat</b>'+
 '<span id="onlineCount" class="muted">Online...</span>'+
 '</div>'+

 '<div id="worldMessages" class="chatlist"></div>'+

 '<textarea id="worldText" rows="2" placeholder="Write message..."></textarea>'+

 '<button id="sendWorld">Send</button>'+

 '</div>';

 var q=db.collection("worldMessages")
  .orderBy("createdAt","desc")
  .limit(50);

 unsubs.push(
  q.onSnapshot(function(snap){

   var html="";

   snap.docs.slice().reverse().forEach(function(d){

    var m=d.data();
    m.id=d.id;

    html+=messageHTML(m,"world","world");

   });

   $("worldMessages").innerHTML=html;

  },function(e){

   $("worldMessages").innerHTML=
    '<p class="muted">'+esc(e.message)+'</p>';

  })
 );

 var uq=db.collection("users")
  .where("online","==",true);

 unsubs.push(
  uq.onSnapshot(function(snap){
   $("onlineCount").textContent=snap.size+" online";
  },function(){
   $("onlineCount").textContent="Online";
  })
 );

 $("sendWorld").onclick=sendWorld;
}

async function sendWorld(){

 var box=$("worldText");
 var text=box.value.trim();

 if(!text)return;

 try{

  await db.collection("worldMessages").add({
   uid:me.uid,
   username:profile.username,
   text:text,
   type:"text",
   createdAt:firebase.firestore.FieldValue.serverTimestamp()
  });

  box.value="";

 }catch(e){
  toast(e.message);
 }
}

window.editMessage=async function(type,chatId,messageId){

 var text=prompt("New message:");

 if(!text)return;

 try{

  var ref;

  if(type==="world"){
   ref=db.collection("worldMessages").doc(messageId);
  }else if(type==="private"){
   ref=db.collection("chats").doc(chatId)
    .collection("messages").doc(messageId);
  }else{
   ref=db.collection("groups").doc(chatId)
    .collection("messages").doc(messageId);
  }

  await ref.update({
   text:text,
   edited:true
  });

 }catch(e){
  toast(e.message);
 }
};

window.deleteMessage=async function(type,chatId,messageId){

 if(!confirm("Delete message?"))return;

 try{

  var ref;

  if(type==="world"){
   ref=db.collection("worldMessages").doc(messageId);
  }else if(type==="private"){
   ref=db.collection("chats").doc(chatId)
    .collection("messages").doc(messageId);
  }else{
   ref=db.collection("groups").doc(chatId)
    .collection("messages").doc(messageId);
  }

  await ref.delete();

 }catch(e){
  toast(e.message);
 }
};

 </script><script>

function users(c){

 c.innerHTML=
 '<div class="card">'+

 '<h3>👥 Users</h3>'+

 '<input id="userSearch" placeholder="Search username">'+

 '<div id="userList"></div>'+

 '</div>';

 var q=db.collection("users")
  .orderBy("username")
  .limit(100);

 unsubs.push(
  q.onSnapshot(function(snap){

   allUsers=snap.docs.map(function(d){
    return d.data();
   });

   showUsers(allUsers);

  },function(e){

   $("userList").innerHTML=
    '<p class="muted">'+esc(e.message)+'</p>';

  })
 );

 $("userSearch").oninput=function(){

  var term=$("userSearch").value.toLowerCase();

  showUsers(
   allUsers.filter(function(u){
    return (u.username||"").toLowerCase().indexOf(term)>=0;
   })
  );
 };
}

function showUsers(arr){

 $("userList").innerHTML=arr.map(function(u){

  return '<div class="user">'+

   avatar(u.username)+

   '<div class="grow">'+
   '<b>'+esc(u.username)+'</b>'+
   '<div class="muted">'+
   (u.online?"🟢 Online":"Offline")+
   '</div>'+
   '</div>'+

   (u.uid!==me.uid?
    '<button data-chat="'+esc(u.uid)+'">Chat</button>'
    :"")+

   '</div>';

 }).join("");

 $("userList").querySelectorAll("[data-chat]").forEach(function(b){

  b.onclick=function(){

   var uid=b.getAttribute("data-chat");

   var u=allUsers.find(function(x){
    return x.uid===uid;
   });

   if(!u)return;

   selectedUser={
    uid:u.uid,
    username:u.username,
    photo:u.photo||""
   };

   current="private";
   render();
  };
 });
}

function privateId(a,b){
 return [a,b].sort().join("_");
}

function privateChat(c){

 if(!selectedUser){

  c.innerHTML=
   '<div class="card">'+
   '<h3>💬 Private Chat</h3>'+
   '<p class="muted">Choose a user first.</p>'+
   '<button id="choosePrivate">Choose User</button>'+
   '</div>';

  $("choosePrivate").onclick=function(){
   current="users";
   render();
  };

  return;
 }

 var chatId=privateId(me.uid,selectedUser.uid);

 c.innerHTML=
 '<div class="card">'+

 '<div class="user">'+
 avatar(selectedUser.username)+

 '<div class="grow">'+
 '<b>'+esc(selectedUser.username)+'</b>'+
 '<div class="muted">Private Chat</div>'+
 '</div>'+
 '</div>'+

 '<div id="privateMessages" class="chatlist"></div>'+

 '<textarea id="privateText" rows="2" placeholder="Message..."></textarea>'+

 '<button id="sendPrivate">Send</button>'+

 '</div>';

 var q=db.collection("chats")
  .doc(chatId)
  .collection("messages")
  .orderBy("createdAt","desc")
  .limit(50);

 unsubs.push(
  q.onSnapshot(function(snap){

   var html="";

   snap.docs.slice().reverse().forEach(function(d){

    var m=d.data();
    m.id=d.id;

    html+=messageHTML(m,"private",chatId);

   });

   $("privateMessages").innerHTML=html;

  },function(e){

   $("privateMessages").innerHTML=
    '<p class="muted">'+esc(e.message)+'</p>';

  })
 );

 $("sendPrivate").onclick=async function(){

  var box=$("privateText");
  var text=box.value.trim();

  if(!text)return;

  try{

   await db.collection("chats")
    .doc(chatId)
    .collection("messages")
    .add({
     uid:me.uid,
     username:profile.username,
     text:text,
     type:"text",
     createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });

   box.value="";

  }catch(e){
   toast(e.message);
  }
 };
}

function groups(c){

 c.innerHTML=
 '<div class="card">'+

 '<h3>👥 Group Chat</h3>'+

 '<div class="row">'+
 '<input id="newGroupName" placeholder="Group name">'+
 '<button id="createGroup">Create</button>'+
 '</div>'+

 '<div id="groupList"></div>'+

 '</div>';

 var q=db.collection("groups")
  .orderBy("name")
  .limit(50);

 unsubs.push(
  q.onSnapshot(function(snap){

   $("groupList").innerHTML=snap.docs.map(function(d){

    var g=d.data();

    return '<div class="user">'+

     '<div class="grow">'+
     '<b>'+esc(g.name||"Group")+'</b>'+
     '<div class="muted">'+
     (g.members||[]).length+" members"+
     '</div>'+
     '</div>'+

     '<button data-group="'+d.id+'">Open</button>'+

     '</div>';

   }).join("");

   $("groupList").querySelectorAll("[data-group]").forEach(function(b){

    b.onclick=function(){

     selectedGroup=b.getAttribute("data-group");
     current="group";
     render();

    };
   });

  },function(e){

   $("groupList").innerHTML=
    '<p class="muted">'+esc(e.message)+'</p>';

  })
 );

 $("createGroup").onclick=async function(){

  var name=$("newGroupName").value.trim();

  if(!name)return;

  try{

   await db.collection("groups").add({
    name:name,
    members:[me.uid],
    ownerId:me.uid,
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
   });

   $("newGroupName").value="";

  }catch(e){
   toast(e.message);
  }
 };
}

function groupChat(c){

 if(!selectedGroup){
  current="groups";
  render();
  return;
 }

 c.innerHTML=
 '<div class="card">'+

 '<button id="groupBack" class="secondary">← Groups</button>'+

 '<div id="groupTitle"></div>'+

 '<div id="groupMessages" class="chatlist"></div>'+

 '<textarea id="groupText" rows="2" placeholder="Group message..."></textarea>'+

 '<button id="sendGroup">Send</button>'+

 '</div>';

 $("groupBack").onclick=function(){
  current="groups";
  selectedGroup=null;
  render();
 };

 db.collection("groups").doc(selectedGroup).get()
 .then(function(snap){

  if(snap.exists){

   var g=snap.data();

   $("groupTitle").innerHTML=
    '<h3>👥 '+esc(g.name)+'</h3>'+
    '<div class="muted">'+
    (g.members||[]).length+
    ' members</div>';
  }
 });

 var q=db.collection("groups")
  .doc(selectedGroup)
  .collection("messages")
  .orderBy("createdAt","desc")
  .limit(50);

 unsubs.push(
  q.onSnapshot(function(snap){

   var html="";

   snap.docs.slice().reverse().forEach(function(d){

    var m=d.data();
    m.id=d.id;

    html+=messageHTML(
     m,
     "group",
     selectedGroup
    );

   });

   $("groupMessages").innerHTML=html;

  },function(e){

   $("groupMessages").innerHTML=
    '<p class="muted">'+esc(e.message)+'</p>';

  })
 );

 $("sendGroup").onclick=async function(){

  var box=$("groupText");
  var text=box.value.trim();

  if(!text)return;

  try{

   await db.collection("groups")
    .doc(selectedGroup)
    .collection("messages")
    .add({
     uid:me.uid,
     username:profile.username,
     text:text,
     type:"text",
     createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });

   box.value="";

  }catch(e){
   toast(e.message);
  }
 };

}

 </script><script>

function settings(c){

 c.innerHTML=
 '<div class="card">'+

 '<h3>⚙️ Settings</h3>'+

 '<p><b>Account</b></p>'+
 '<p class="muted">'+
 'Username: '+esc(profile.username)+
 '</p>'+

 '<hr style="border-color:#203b55">'+

 '<p><b>Privacy & Security</b></p>'+
 '<p class="muted">'+
 'Your account uses Firebase Authentication. Private messages are stored in your chat database.'
 +'</p>'+

 '<hr style="border-color:#203b55">'+

 '<p><b>About</b></p>'+
 '<p class="muted">YOUR CHAT</p>'+

 '<button id="logout" class="danger">Log Out</button>'+

 '</div>';

 $("logout").onclick=async function(){

  try{

   await db.collection("users")
    .doc(me.uid)
    .set({
     online:false,
     lastSeen:firebase.firestore.FieldValue.serverTimestamp()
    },{merge:true});

  }catch(e){}

  await auth.signOut();
 };
}

auth.onAuthStateChanged(async function(user){

 me=user;

 if(!user){

  stopListeners();
  profile=null;
  current="home";
  selectedUser=null;
  selectedGroup=null;
  showAuth();
  return;

 }

 try{

  await loadProfile();

  showConnecting();

  setTimeout(function(){

   render();

   hideLoading();

  },1500);

 }catch(e){

  window.__chatBootError(
   "Profile load error: "+e.message
  );

 }
});

</script>

</body>
</html>
