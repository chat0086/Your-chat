<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>YOUR CHAT</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#050b14;
 color:#fff;
}
button,input,textarea{font:inherit}
button{
 border:0;
 border-radius:12px;
 padding:12px 15px;
 background:#147ed4;
 color:#fff;
 font-weight:bold;
 cursor:pointer;
}
button.secondary{background:#162b40}
button.danger{background:#a52d3d}
.hidden{display:none!important}

#loading{
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 text-align:center;
 background:#050b14;
 padding:20px;
}
.loadingBox{
 width:100%;
 max-width:430px;
}
.brand{
 text-align:center;
 font-size:25px;
 font-weight:bold;
 letter-spacing:5px;
 color:#42b5ff;
 margin-bottom:20px;
}
.loader{
 width:38px;
 height:38px;
 border:4px solid #17304b;
 border-top:4px solid #29a9ff;
 border-radius:50%;
 animation:spin 1s linear infinite;
 margin:20px auto;
}
@keyframes spin{
 to{transform:rotate(360deg)}
}

#loadError{
 color:#ffb5bd;
 font-size:13px;
 line-height:1.5;
 margin-top:12px;
}

.screen{
 max-width:720px;
 margin:auto;
 min-height:100vh;
 padding:15px;
}

.card{
 background:#0d1928;
 border:1px solid #203b55;
 border-radius:18px;
 padding:15px;
 margin-bottom:12px;
}

input,textarea{
 width:100%;
 padding:12px;
 margin:6px 0;
 border-radius:12px;
 border:1px solid #28445f;
 background:#07111f;
 color:#fff;
 outline:none;
}

.row{
 display:flex;
 gap:8px;
 align-items:center;
}

.row>*{
 flex:1;
}

.top{
 display:flex;
 align-items:center;
 gap:10px;
 margin-bottom:12px;
}

.spacer{
 flex:1;
}

.avatar{
 width:46px;
 height:46px;
 border-radius:50%;
 object-fit:cover;
 background:#18324b;
 display:flex;
 justify-content:center;
 align-items:center;
 font-weight:bold;
 color:#8bd5ff;
}

.nav{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
}

.nav button{
 min-height:60px;
}

.chatlist{
 height:55vh;
 overflow-y:auto;
 padding:5px;
}

.msg{
 background:#102238;
 border-radius:14px;
 padding:10px;
 margin:7px 0;
 max-width:88%;
 word-break:break-word;
}

.mine{
 margin-left:auto;
 background:#075f9f;
}

.msg small{
 display:block;
 color:#9bb1c7;
 font-size:10px;
 margin-top:5px;
}

.media{
 max-width:100%;
 border-radius:12px;
 margin-top:7px;
}

.actions{
 display:flex;
 flex-wrap:wrap;
 gap:6px;
 margin-top:6px;
}

.actions button{
 padding:7px 10px;
 font-size:12px;
 background:#17304a;
}

.user{
 display:flex;
 align-items:center;
 gap:10px;
 padding:10px;
 border-bottom:1px solid #193047;
}

.userGrow{
 flex:1;
}

.muted{
 color:#91a7bb;
 font-size:13px;
}

.modal{
 position:fixed;
 inset:0;
 background:#000b;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:15px;
 z-index:99;
}

.modal .card{
 width:min(600px,100%);
 max-height:90vh;
 overflow:auto;
}

@media(min-width:600px){
 .nav{
  grid-template-columns:repeat(5,1fr);
 }
}
</style>
</head>

<body>

<!-- =========================
     LOADING
========================= -->

<div id="loading">

 <div class="loadingBox">

  <div class="brand">
   YOUR CHAT
  </div>

  <div id="loader" class="loader"></div>

  <div id="loadingText">
   Connecting to the world...
  </div>

  <div id="loadError"></div>

  <button
   id="retryBtn"
   class="secondary hidden"
   style="margin-top:12px">
   Retry
  </button>

 </div>

</div>


<div id="app" class="hidden"></div>

<div id="modal" class="modal hidden"></div>


<!-- =========================
     FIREBASE
========================= -->

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>


<script>

/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

 apiKey:
 "AIzaSyBmyYlEtZCm7yDsmqAsqdRNmxBjPSiCyQ",

 authDomain:
 "your-chat-24913.firebaseapp.com",

 projectId:
 "your-chat-24913",

 storageBucket:
 "your-chat-24913.firebasestorage.app",

 messagingSenderId:
 "700520326360",

 appId:
 "1:700520326360:web:a3dc5fd4e36b54dbb563ad",

 measurementId:
 "G-7JBWVDK838"

};


/* =========================
   VARIABLES
========================= */

let me = null;

let profile = null;

let currentScreen = "home";

let selectedUser = null;

let listeners = [];

let firebaseReady = false;


/* =========================
   HELPERS
========================= */

function $(id){
 return document.getElementById(id);
}


function esc(value){

 return String(value ?? "")
 .replace(/[&<>"']/g,function(c){

  return {
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  }[c];

 });

}


function usernameEmail(username){

 return username.toLowerCase()
 +"@yourchat.local";

}


function hideLoading(){

 $("loading")
 .classList.add("hidden");

 $("app")
 .classList.remove("hidden");

}


function showLoadingError(message){

 $("loader")
 .classList.add("hidden");

 $("loadingText")
 .textContent="YOUR CHAT";

 $("loadError")
 .textContent=message;

 $("retryBtn")
 .classList.remove("hidden");

}


$("retryBtn").onclick=function(){

 location.reload();

};


/* =========================
   LOADING SAFETY
========================= */

setTimeout(function(){

 if(!firebaseReady){

  showLoadingError(
   "Firebase connect nahi hua. Retry dabao."
  );

 }

},8000);


/* =========================
   AVATAR
========================= */

function avatar(username,photo){

 if(photo){

  return `
  <img
   class="avatar"
   src="${esc(photo)}">
  `;

 }

 return `
 <div class="avatar">
 ${esc((username||"?")[0].toUpperCase())}
 </div>
 `;

}


/* =========================
   CLEANUP
========================= */

function cleanup(){

 listeners.forEach(function(fn){

  try{
   fn();
  }catch(e){}

 });

 listeners=[];

}


/* =========================
   AUTH SCREEN
========================= */

function showAuth(){

 hideLoading();

 $("app").innerHTML=`

 <div
 class="screen"
 style="
 display:flex;
 align-items:center;
 justify-content:center;
 min-height:100vh">

 <div
 class="card"
 style="width:100%;max-width:430px">

 <div class="brand">
 YOUR CHAT
 </div>

 <h2 style="text-align:center">
 Welcome
 </h2>

 <input
 id="username"
 placeholder="Username"
 autocomplete="username">

 <input
 id="password"
 type="password"
 placeholder="Password"
 autocomplete="current-password">

 <div class="row">

 <button id="loginBtn">
 Login
 </button>

 <button
 id="createBtn"
 class="secondary">
 Create Account
 </button>

 </div>

 <p
 id="authError"
 class="muted">
 </p>

 </div>

 </div>
 `;


 $("loginBtn").onclick=function(){

  authAction(false);

 };


 $("createBtn").onclick=function(){

  authAction(true);

 };

}


/* =========================
   LOGIN / CREATE
========================= */

async function authAction(create){

 const username=
 $("username").value.trim();

 const password=
 $("password").value;

 const error=
 $("authError");


 if(!/^[A-Za-z0-9_]{3,24}$/.test(username)){

  error.textContent=
  "Username 3-24 letters/numbers/_ hona chahiye.";

  return;

 }


 if(password.length<6){

  error.textContent=
  "Password kam az kam 6 characters ka ho.";

  return;

 }


 error.textContent=
 "Please wait...";


 try{

  let result;


  if(create){

   result=
   await firebase.auth()
   .createUserWithEmailAndPassword(
    usernameEmail(username),
    password
   );


   await result.user.updateProfile({

    displayName:username

   });


   await firebase.firestore()
   .collection("users")
   .doc(result.user.uid)
   .set({

    uid:result.user.uid,

    username:username,

    photo:"",

    online:true,

    createdAt:
    firebase.firestore.FieldValue
    .serverTimestamp(),

    lastSeen:
    firebase.firestore.FieldValue
    .serverTimestamp()

   });

  }else{

   result=
   await firebase.auth()
   .signInWithEmailAndPassword(
    usernameEmail(username),
    password
   );

  }

 }catch(error){

  $("authError").textContent=
  error.message;

 }

}


/* =========================
   PROFILE
========================= */

async function loadProfile(){

 const db=
 firebase.firestore();


 const userRef=
 db.collection("users")
 .doc(me.uid);


 const snap=
 await userRef.get();


 if(snap.exists){

  profile=snap.data();

 }else{

  profile={

   uid:me.uid,

   username:
   me.displayName||"User",

   photo:""

  };


  await userRef.set(profile);

 }


 await userRef.set({

  online:true,

  lastSeen:
  firebase.firestore.FieldValue
  .serverTimestamp()

 },{
  merge:true
 });

}


/* =========================
   MAIN RENDER
========================= */

function render(){

 cleanup();


 if(!me){

  showAuth();

  return;

 }


 $("app").innerHTML=`

 <div class="screen">

 <div class="top">

 <button
 id="backBtn"
 class="secondary">
 ←
 </button>

 <div>

 <b>
 YOUR CHAT
 </b>

 <div class="muted">
 ${esc(currentScreen)}
 </div>

 </div>

 <div class="spacer"></div>

 ${avatar(
  profile.username,
  profile.photo
 )}

 </div>


 <div id="content"></div>

 </div>

 `;


 $("backBtn").onclick=function(){

  if(currentScreen!=="home"){

   currentScreen="home";

   render();

  }

 };


 const content=
 $("content");


 if(currentScreen==="home")
 renderHome(content);


 if(currentScreen==="world")
 renderWorld(content);


 if(currentScreen==="users")
 renderUsers(content);


 if(currentScreen==="private")
 renderPrivate(content);


 if(currentScreen==="groups")
 renderGroups(content);


 if(currentScreen==="status")
 renderStatus(content);


 if(currentScreen==="settings")
 renderSettings(content);

}


/* =========================
   HOME
========================= */

function renderHome(c){

 c.innerHTML=`

 <div class="card">

 <h2>
 Welcome, ${esc(profile.username)}
 </h2>

 <p class="muted">
 Choose an option
 </p>


 <div class="nav">

 <button data-screen="world">
 🌍 World Chat
 </button>

 <button data-screen="users">
 🟢 Online Users
 </button>

 <button data-screen="private">
 💬 Private Chat
 </button>

 <button data-screen="groups">
 👥 Group Chat
 </button>

 <button data-screen="users">
 👤 All Users
 </button>

 <button
 data-screen="status"
 class="secondary">
 ⭕ Status
 </button>

 <button
 data-screen="settings"
 class="secondary">
 ⚙️ Settings
 </button>

 </div>

 </div>

 `;


 c.querySelectorAll("[data-screen]")
 .forEach(function(button){

  button.onclick=function(){

   currentScreen=
   button.dataset.screen;

   render();

  };

 });

}


/* =========================
   WORLD CHAT
========================= */

function renderWorld(c){

 c.innerHTML=`

 <div class="card">

 <div class="row">

 <b>
 🌍 World Chat
 </b>

 <span
 id="onlineCount"
 class="muted">
 Online...
 </span>

 </div>


 <div
 id="worldMessages"
 class="chatlist">
 </div>


 <textarea
 id="worldText"
 rows="2"
 placeholder="Write message...">
 </textarea>


 <div class="row">

 <button id="worldSend">
 Send
 </button>

 <button
 id="mentionBtn"
 class="secondary">
 @ Mention
 </button>

 </div>


 <div class="actions">

 <label
 class="secondary"
 style="
 padding:10px;
 border-radius:12px">

 📷 Media

 <input
 id="worldFile"
 type="file"
 accept="image/*,video/*"
 hidden>

 </label>

 </div>

 </div>

 `;


 const db=
 firebase.firestore();


 const messageQuery=
 db.collection("worldMessages")
 .orderBy("createdAt","desc")
 .limit(50);


 listeners.push(

  messageQuery.onSnapshot(

   function(snapshot){

    const messages=
    snapshot.docs
    .map(function(doc){

     return {
      id:doc.id,
      ...doc.data()
     };

    })
    .reverse();


    $("worldMessages")
    .innerHTML=
    messages
    .map(messageHTML)
    .join("");


   },

   function(error){

    $("worldMessages")
    .innerHTML=
    `<p class="muted">
    World Chat error:
    ${esc(error.message)}
    </p>`;

   }

  )

 );


 const onlineQuery=
 db.collection("users")
 .where("online","==",true);


 listeners.push(

  onlineQuery.onSnapshot(
   function(snapshot){

    $("onlineCount")
    .textContent=
    snapshot.size+" online";

   }
  )

 );


 $("worldSend").onclick=
 sendWorld;


 $("mentionBtn").onclick=
 mentionUsers;


 $("worldFile").onchange=
 function(e){

  uploadWorldFile(
   e.target.files[0]
  );

 };

}


/* =========================
   MESSAGE HTML
========================= */

function messageHTML(m){

 const mine=
 m.uid===me.uid;


 let media="";


 if(m.type==="image"){

  media=`
  <img
   class="media"
   src="${esc(m.url)}">
  `;

 }


 if(m.type==="video"){

  media=`
  <video
   class="media"
   controls
   src="${esc(m.url)}">
  </video>
  `;

 }


 if(m.type==="voice"){

  media=`
  <audio
   class="media"
   controls
   src="${esc(m.url)}">
  </audio>
  `;

 }


 return `

 <div class="msg ${mine?"mine":""}">

 <b>
 ${esc(m.username||"User")}
 </b>

 <div>
 ${esc(m.text||"")}
 </div>

 ${media}


 <small>

 ${
  m.createdAt &&
  m.createdAt.toDate

  ?

  m.createdAt
  .toDate()
  .toLocaleString()

  :

  "now"

 }

 </small>


 ${
  mine

  ?

  `<div class="actions">

  <button
   onclick="editWorld('${m.id}')">
   Edit
  </button>

  <button
   onclick="deleteWorld('${m.id}')">
   Delete
  </button>

  </div>`

  :

  ""

 }

 </div>

 `;

}


/* =========================
   SEND WORLD
========================= */

async function sendWorld(){

 const box=
 $("worldText");


 const text=
 box.value.trim();


 if(!text)
 return;


 try{

  await firebase.firestore()
  .collection("worldMessages")
  .add({

   uid:me.uid,

   username:
   profile.username,

   text:text,

   type:"text",

   createdAt:
   firebase.firestore.FieldValue
   .serverTimestamp()

  });


  box.value="";


 }catch(error){

  alert(error.message);

 }

}


/* =========================
   EDIT
========================= */

window.editWorld=
async function(id){

 const text=
 prompt("New message:");


 if(!text)
 return;


 try{

  await firebase.firestore()
  .collection("worldMessages")
  .doc(id)
  .update({

   text:text,

   edited:true

  });

 }catch(error){

  alert(error.message);

 }

};


/* =========================
   DELETE
========================= */

window.deleteWorld=
async function(id){

 if(!confirm("Delete message?"))
 return;


 try{

  await firebase.firestore()
  .collection("worldMessages")
  .doc(id)
  .delete();

 }catch(error){

  alert(error.message);

 }

};


/* =========================
   MENTION
========================= */

async function mentionUsers(){

 try{

  const snapshot=
  await firebase.firestore()
  .collection("users")
  .where("online","==",true)
  .limit(30)
  .get();


  $("modal")
  .classList.remove("hidden");


  $("modal").innerHTML=`

  <div class="card">

  <h3>
  Online Users
  </h3>

  ${
   snapshot.docs
   .filter(function(d){

    return d.id!==me.uid;

   })
   .map(function(d){

    const u=d.data();

    return `

    <button
     style="
     width:100%;
     margin:4px 0"
     onclick="
     insertMention('${esc(u.username)}')">

     @${esc(u.username)}

    </button>

    `;

   })
   .join("")
  }


  <button
   id="closeModal"
   class="secondary">

   Close

  </button>

  </div>

  `;


  $("closeModal").onclick=
  function(){

   $("modal")
   .classList.add("hidden");

  };


 }catch(error){

  alert(error.message);

 }

}


window.insertMention=
function(username){

 $("worldText").value+=
 " @"+username+" ";

 $("modal")
 .classList.add("hidden");

};


/* =========================
   WORLD MEDIA
========================= */

async function uploadWorldFile(file){

 if(!file)
 return;


 if(file.size>25*1024*1024){

  alert("Maximum 25MB.");

  return;

 }


 try{

  const type=
  file.type.startsWith("image/")
  ?

  "image"

  :

  "video";


  const storage=
  firebase.storage();


  const storageRef=
  storage.ref(
   "messages/"
   +me.uid+"/"
   +Date.now()
   +"_"+file.name
  );


  await storageRef.put(file);


  const url=
  await storageRef.getDownloadURL();


  await firebase.firestore()
  .collection("worldMessages")
  .add({

   uid:me.uid,

   username:
   profile.username,

   type:type,

   url:url,

   text:"",

   createdAt:
   firebase.firestore.FieldValue
   .serverTimestamp()

  });


 }catch(error){

  alert(error.message);

 }

}


/* =========================
   USERS
========================= */

function renderUsers(c){

 c.innerHTML=`

 <div class="card">

 <h3>
 👥 Users
 </h3>

 <input
 id="userSearch"
 placeholder="Search username">

 <div id="userList"></div>

 </div>

 `;


 const queryRef=
 firebase.firestore()
 .collection("users")
 .orderBy("username")
 .limit(100);


 listeners.push(

  queryRef.onSnapshot(

   function(snapshot){

    displayUsers(
     snapshot.docs
     .map(function(d){

      return d.data();

     })
    );

   },

   function(error){

    $("userList")
    .innerHTML=
    `<p class="muted">
    ${esc(error.message)}
    </p>`;

   }

  )

 );


 $("userSearch").oninput=
 async function(){

  const term=
  $("userSearch")
  .value
  .toLowerCase();


  try{

   const snapshot=
   await queryRef.get();


   displayUsers(

    snapshot.docs
    .map(function(d){

     return d.data();

    })
    .filter(function(user){

     return (user.username||"")
     .toLowerCase()
     .includes(term);

    })

   );

  }catch(error){

   $("userList")
   .textContent=
   error.message;

  }

 };

}


/* =========================
   DISPLAY USERS
========================= */

function displayUsers(users){

 $("userList")
 .innerHTML=

 users.map(function(user){

  return `

  <div class="user">

  ${avatar(
   user.username,
   user.photo
  )}


  <div class="userGrow">

  <b>
  ${esc(user.username)}
  </b>

  <div class="muted">

  ${
   user.online
   ?

   "🟢 Online"

   :

   "Offline"

  }

  </div>

  </div>


  ${
   user.uid!==me.uid

   ?

   `<button
   onclick='openPrivate(
   "${esc(user.uid)}",
   "${esc(user.username)}",
   "${esc(user.photo||"")}"
   )'>

   Chat

   </button>`

   :

   ""

  }

  </div>

  `;

 })
 .join("");

}


/* =========================
   OPEN PRIVATE
========================= */

window.openPrivate=
function(uid,username,photo){

 selectedUser={

  uid:uid,

  username:username,

  photo:photo

 };


 currentScreen=
 "private";


 render();

};


/* =========================
   PRIVATE ID
========================= */

function privateId(a,b){

 return [a,b]
 .sort()
 .join("_");

}


/* =========================
   PRIVATE CHAT
========================= */

function renderPrivate(c){

 if(!selectedUser){

  c.innerHTML=`

  <div class="card">

  <h3>
  💬 Private Chat
  </h3>

  <p class="muted">
  First choose a user.
  </p>

  <button id="chooseUser">
  Choose User
  </button>

  </div>

  `;


  $("chooseUser").onclick=
  function(){

   currentScreen="users";

   render();

  };


  return;

 }


 const chatId=
 privateId(
  me.uid,
  selectedUser.uid
 );


 c.innerHTML=`

 <div class="card">

 <div class="user">

 ${avatar(
  selectedUser.username,
  selectedUser.photo
 )}

 <div class="userGrow">

 <b>
 ${esc(selectedUser.username)}
 </b>

 <div class="muted">
 Private Chat
 </div>

 </div>

 </div>


 <div
 id="privateMessages"
 class="chatlist">
 </div>


 <textarea
 id="privateText"
 rows="2"
 placeholder="Message...">
 </textarea>


 <button id="privateSend">
 Send
 </button>

 </div>

 `;


 const db=
 firebase.firestore();


 const queryRef=
 db.collection("chats")
 .doc(chatId)
 .collection("messages")
 .orderBy("createdAt","desc")
 .limit(50);


 listeners.push(

  queryRef.onSnapshot(

   function(snapshot){

    const messages=
    snapshot.docs
    .map(function(d){

     return {
      id:d.id,
      ...d.data()
     };

    })
