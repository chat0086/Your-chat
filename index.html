<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CHIT CHAT PLUS</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#07111f;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
button,input,textarea{font-family:Arial,sans-serif}
button{cursor:pointer}
#loading{position:fixed;inset:0;background:#07111f;z-index:9999}
#loading img{width:100%;height:100%;object-fit:cover}
.top{height:54px;background:#101d32;border-bottom:1px solid #263957;display:flex;align-items:center;padding:0 10px}
.logo{font-weight:bold;font-size:18px;color:#7de3ff;flex:1}
.online{font-size:12px;color:#75f5a5}
.screen{height:calc(100% - 106px);overflow:auto;padding:10px}
.nav{height:52px;background:#0d1829;border-top:1px solid #263957;display:flex}
.nav button{flex:1;background:none;border:0;color:#9db0ca;font-size:11px}
.nav button.on{color:#fff;background:#15253d}
.card{background:#0e1b2d;border:1px solid #263957;border-radius:10px;padding:10px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:9px}
.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#263957}
.name{font-size:14px;font-weight:bold}
.small{font-size:11px;color:#93a8c3}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#586a80;margin-right:5px}
.dot.on{background:#3ff08a}
.msg{background:#162844;border-radius:9px;padding:8px 9px;margin:5px 0;max-width:92%;word-break:break-word}
.mine{margin-left:auto;background:#15536a}
.time{font-size:9px;color:#8297b1;margin-top:3px}
.mention{color:#7de3ff}
.inputbar{position:fixed;bottom:52px;left:0;right:0;background:#0c1728;border-top:1px solid #263957;padding:7px;display:flex;gap:6px}
.inputbar input{flex:1;background:#091424;color:#fff;border:1px solid #314967;border-radius:8px;padding:10px;outline:none}
.btn{border:0;border-radius:8px;background:#20a8d8;color:#fff;padding:9px 12px;font-weight:bold}
.gray{background:#263957}
.green{background:#198c60}
.red{background:#a83c4a}
.listbtn{width:100%;text-align:left;background:#0e1b2d;color:#fff;border:1px solid #263957;padding:9px;border-radius:9px;margin-bottom:7px}
.form{max-width:380px;margin:35px auto;padding:15px}
.form h1{text-align:center;color:#7de3ff}
.form input{width:100%;margin:6px 0;background:#091424;color:#fff;border:1px solid #314967;border-radius:8px;padding:11px}
.form .btn{width:100%;margin-top:7px}
.center{text-align:center}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9000;padding:15px;overflow:auto}
.modalbox{max-width:430px;margin:20px auto;background:#0d1a2b;border:1px solid #314967;border-radius:12px;padding:12px}
#toast{position:fixed;left:10px;right:10px;bottom:62px;background:#172941;padding:10px;border-radius:8px;text-align:center;z-index:10000;display:none}
hr{border:0;border-top:1px solid #263957}
</style>
</head>

<body>

<div id="loading">
<img src="/loading.png" onerror="this.style.display='none'">
</div>

<div id="login" class="screen hidden">
<div class="form">
<h1>CHIT CHAT PLUS</h1>
<div class="small center">Real Firebase login — same account on every browser</div>

<input id="loginUser" placeholder="Username" maxlength="30">
<input id="loginPass" type="password" placeholder="Password (6+ characters)" maxlength="60">

</div>
</div>

</div>

<div class="nav">
<button data-page="world">World</button>

<button data-page="groups">Groups</button>
<button data-page="status">Status</button>
<button data-page="users">Users</button>
</div>

</div>

<div id="inputBar" class="inputbar hidden">

</div>

<div id="modal" class="modal hidden">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

<script>

var firebaseConfig={
apiKey:"AIzaSyAEqeB2YXk_2A9gZ41WQ_fNiBKiGnzYGc0",
authDomain:"chit-chat-plus-7382b.firebaseapp.com",
projectId:"chit-chat-plus-7382b",
storageBucket:"chit-chat-plus-7382b.firebasestorage.app",
messagingSenderId:"98837732974",
appId:"1:98837732974:web:ff52d3868871c91518507f",
measurementId:"G-T42H2N5Q0Z"
};

firebase.initializeApp(firebaseConfig);

var auth=firebase.auth();
var db=firebase.firestore();
var storage=firebase.storage();

var me=null;
var users={};
var page="world";
var privateUid=null;
var groupId=null;

var pageUnsub=null;
var usersUnsub=null;
var presenceTimer=null;
var recording=null;
var recordChunks=[];

var $=function(id){
return document.getElementById(id);
};

function esc(s){
return String(s||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");
}

function toast(s){
$("toast").innerHTML=esc(s);
$("toast").style.display="block";

setTimeout(function(){
$("toast").style.display="none";
},2500);
}

function hideLoading(){
setTimeout(function(){
$("loading").className="hidden";
},250);
}

setTimeout(function(){
hideLoading();
},5000);

function timeOf(t){
if(!t)return "";

var d=t.toDate?t.toDate():new Date(t);

return d.toLocaleTimeString([],{
hour:"2-digit",
minute:"2-digit"
});
}

function avatar(u){

if(u&&u.avatar)
return u.avatar;

var n=(u&&u.username||"?").charAt(0).toUpperCase();

return "https://dummyimage.com/80x80/263957/ffffff&text="+encodeURIComponent(n);
}

function usernameEmail(u){

return u.toLowerCase()
.replace(/[^a-z0-9_]/g,"")
.slice(0,25)+"@chitchatplus.local";

}

function err(e){

var m={
"auth/email-already-in-use":"Username already exists.",
"auth/user-not-found":"Account not found.",
"auth/wrong-password":"Wrong password.",
"auth/invalid-credential":"Wrong username or password.",
"auth/weak-password":"Password must be at least 6 characters.",
"auth/too-many-requests":"Too many attempts. Try later."
};

return m[e&&e.code]||(e&&e.message)||"Something went wrong.";
}

function badWord(s){

var a=[
"fuck",
"bitch",
"chutiya",
"madarchod",
"behenchod",
"bc",
"mc"
];

var t=s.toLowerCase();

for(var i=0;i<a.length;i++){

if(t.indexOf(a[i])>=0)
return true;

}

return false;
}

function spamOK(){

var k="ccspam_"+me.uid;
var rk="ccrestrict_"+me.uid;

var now=Date.now();

var until=parseInt(
localStorage.getItem(rk)||"0",
10
);

if(until>now){

toast(
"Spam restriction active for "+
Math.ceil((until-now)/60000)+
" minute(s)."
);

return false;
}

var a=[];

try{
a=JSON.parse(
localStorage.getItem(k)||"[]"
);
}catch(e){
a=[];
}

var b=[];

for(var i=0;i<a.length;i++){

if(now-a[i]<30000)
b.push(a[i]);

}

b.push(now);

localStorage.setItem(
k,
JSON.stringify(b)
);

if(b.length>=12){

localStorage.setItem(
rk,
String(now+300000)
);

toast("5 minute spam restriction.");

return false;
}

if(b.length>=8)
toast("Spam warning — slow down.");

return true;
}

function closeModal(){
$("modal").className="modal hidden";
}

function openModal(h){

$("modalBox").innerHTML=h;
$("modal").className="modal";

}

$("modal").onclick=function(e){

if(e.target===this)
closeModal();

};

$("loginBtn").onclick=function(){

var u=$("loginUser").value
.replace(/^\s+|\s+$/g,"");

var p=$("loginPass").value;

if(u.length<2||p.length<6){

$("authMsg").innerHTML=
"Username 2+ chars; password 6+ chars.";

return;
}

$("authMsg").innerHTML="Logging in...";

auth.signInWithEmailAndPassword(
usernameEmail(u),
p
).catch(function(e){

$("authMsg").innerHTML=esc(err(e));

});

};

$("createBtn").onclick=function(){

var u=$("loginUser").value
.replace(/^\s+|\s+$/g,"");

var p=$("loginPass").value;

if(u.length<2||p.length<6){

$("authMsg").innerHTML=
"Username 2+ chars; password 6+ chars.";

return;
}

$("authMsg").innerHTML="Creating...";

auth.createUserWithEmailAndPassword(
usernameEmail(u),
p
).then(function(c){

return db.collection("users")
.doc(c.user.uid)
.set({

uid:c.user.uid,
username:u,
usernameLower:u.toLowerCase(),
avatar:"",
online:true,
lastSeen:
firebase.firestore.FieldValue.serverTimestamp(),
createdAt:
firebase.firestore.FieldValue.serverTimestamp()

});

}).catch(function(e){

$("authMsg").innerHTML=esc(err(e));

});

};

auth.onAuthStateChanged(function(u){

if(!u){

me=null;

$("app").className="hidden";
$("login").className="screen";

hideLoading();

return;
}

db.collection("users")
.doc(u.uid)
.get()
.then(function(s){

var d=s.exists?s.data():{};

me={
uid:u.uid,
username:d.username||u.email.split("@")[0],
avatar:d.avatar||""
};

return db.collection("users")
.doc(u.uid)
.set({

uid:me.uid,
username:me.username,
usernameLower:me.username.toLowerCase(),
avatar:me.avatar||"",
online:true,
lastSeen:
firebase.firestore.FieldValue.serverTimestamp()

},{
merge:true
});

})
.then(function(){

$("login").className="screen hidden";
$("app").className="";

startPresence();
startUsers();

render("world");

hideLoading();

})
.catch(function(e){

toast(err(e));

});

});

function startPresence(){

if(presenceTimer)
clearInterval(presenceTimer);

updatePresence();

presenceTimer=setInterval(
updatePresence,
30000
);

window.onbeforeunload=function(){

if(me){

db.collection("users")
.doc(me.uid)
.set({

online:false,
lastSeen:
firebase.firestore.FieldValue.serverTimestamp()

},{
merge:true
});

}

};

}

function updatePresence(){

if(me)

db.collection("users")
.doc(me.uid)
.set({

online:true,
lastSeen:
firebase.firestore.FieldValue.serverTimestamp()

},{
merge:true
})
.catch(function(){});

}

function startUsers(){

if(usersUnsub)
usersUnsub();

usersUnsub=
db.collection("users")
.onSnapshot(function(s){

users={};

var count=0;
var now=Date.now();

s.forEach(function(d){

var x=d.data();

x.uid=d.id;

var ls=
x.lastSeen&&x.lastSeen.toDate?
x.lastSeen.toDate().getTime():
0;

x._realOnline=
x.online&&
(
x.uid===me.uid||
(ls&&now-ls<75000)
);

users[d.id]=x;

if(x._realOnline)
count++;

});

$("onlineTop").innerHTML=
"Online: "+count;

if(page==="users")
renderUsers();

},function(e){

toast(
"Users live error: "+
e.message
);

});

}

function render(p){

page=p;

var bs=
document.querySelectorAll(".nav button");

var i;

for(i=0;i<bs.length;i++){

bs[i].className=
bs[i].getAttribute("data-page")===p?
"on":"";

}

if(pageUnsub){

pageUnsub();
pageUnsub=null;

}

$("inputBar").className=
"inputbar hidden";

if(p==="world")
world();

else if(p==="private")
privateHome();

else if(p==="groups")
groups();

else if(p==="status")
statusPage();

else
usersPage();

}

var nav=
document.querySelectorAll(".nav button");

for(var z=0;z<nav.length;z++){

nav[z].onclick=function(){

render(
this.getAttribute("data-page")
);

};

}

function baseMsg(x){

var u=users[x.uid]||x;

var mine=x.uid===me.uid;

var t=
esc(x.text||"")
.replace(
/@([A-Za-z0-9_]+)/g,
'<span class="mention">@$1</span>'
);

var media=x.voice?
'<audio controls src="'+
esc(x.voice)+
'" style="max-width:100%"></audio>':
"";

return '<div class="msg '+
(mine?"mine":"")+
'">'+

'<div class="row">'+
'<img class="avatar" src="'+
esc(avatar(u))+
'">'+

'<div>'+
'<div class="name">'+
esc(u.username||"User")+
'</div>'+

'<div class="small">'+
(u._realOnline?"Online":"Offline")+
'</div>'+

'</div>'+
'</div>'+

'<div style="margin-top:5px">'+
t+
media+
'</div>'+

'<div class="time">'+
esc(timeOf(x.createdAt))+
'</div>'+

'<button class="btn gray" style="padding:4px 7px;margin-top:4px" onclick="react(&quot;'+
x.id+
'&quot;,&quot;'+
esc(x.uid)+
'&quot;)">❤ React</button>'+

'</div>';

}

function world(){

$("screen").innerHTML=
'<div class="card">'+
'<b>World Chat</b>'+
'<div class="small">'+
'Text only • latest 15 shown • old messages are not deleted'+
'</div>'+
'</div>'+
'<div id="worldMsgs"></div>';

$("inputBar").className="inputbar";

$("voiceBtn").className="btn gray";
$("voiceBtn").style.display="none";

$("msgInput").placeholder=
"World message...";

$("sendBtn").onclick=sendWorld;

$("msgInput").oninput=mentionBox;

pageUnsub=
db.collection("worldMessages")
.orderBy("createdAt","desc")
.limit(15)
.onSnapshot(function(s){

var a=[];

s.forEach(function(d){

var x=d.data();

x.id=d.id;

a.push(x);

});

a.reverse();

var h="";

for(var i=0;i<a.length;i++)
h+=baseMsg(a[i]);

$("worldMsgs").innerHTML=
h||
'<div class="small center">No messages yet.</div>';

},function(e){

toast("World: "+e.message);

});

}

function mentionBox(){

var v=$("msgInput").value;

var p=$("msgInput").selectionStart||v.length;

var j=v.lastIndexOf("@",p);

if(
j<0||
v.slice(j+1,p).indexOf(" ")>=0
){

closeModal();

return;
}

var q=
v.slice(j+1,p)
.toLowerCase();

var a=[];
var id;

for(id in users){

if(
id!==me.uid&&
(users[id].username||"")
.toLowerCase()
.indexOf(q)===0
)

a.push(users[id]);

}

if(!a.length){

closeModal();

return;
}

var h="<h3>Mention</h3>";

var i;

for(i=0;i<a.length;i++){

h+=
'<button class="listbtn" data-name="'+
esc(a[i].username)+
'">'+

'<img class="avatar" src="'+
esc(avatar(a[i]))+
'"> '+
esc(a[i].username)+

'</button>';

}

openModal(h);

var bs=
$("modalBox")
.querySelectorAll(".listbtn");

for(i=0;i<bs.length;i++){

bs[i].onclick=function(){

var val=$("msgInput").value;

var p2=
$("msgInput").selectionStart||val.length;

var j2=
val.lastIndexOf("@",p2);

$("msgInput").value=
val.slice(0,j2)+
"@"+
this.getAttribute("data-name")+
" "+
val.slice(p2);

closeModal();

};

}

}

function sendWorld(){

var s=$("msgInput").value
.replace(/^\s+|\s+$/g,"");

if(!s)
return;

if(badWord(s)){

toast("Abusive words blocked.");

return;

}

if(!spamOK())
return;

db.collection("worldMessages")
.add({

uid:me.uid,
username:me.username,
avatar:me.avatar||"",
text:s,
createdAt:
firebase.firestore.FieldValue.serverTimestamp()

})
.then(function(){

$("msgInput").value="";

notifyMentions(s);

})
.catch(function(e){

toast(err(e));

});

}

function notifyMentions(s){

var re=/@([A-Za-z0-9_]+)/g;

var m,id;

while((m=re.exec(s))){

for(id in users){

if(
id!==me.uid&&
(users[id].username||"")
.toLowerCase()===
m[1].toLowerCase()
)

db.collection("notifications")
.add({

toUid:id,
fromUid:me.uid,
type:"mention",
text:me.username+" mentioned you",
read:false,
createdAt:
firebase.firestore.FieldValue.serverTimestamp()

});

}

}

}

function react(messageId,ownerUid){

var rid=
page+"_"+
(privateUid||groupId||"world")+"_"+
messageId+"_"+
me.uid;

db.collection("reactions")
.doc(rid)
.set({

uid:me.uid,
messageId:messageId,
ownerUid:ownerUid,
type:"heart",
where:page,
createdAt:
firebase.firestore.FieldValue.serverTimestamp()

})
.then(function(){

toast("Reaction sent.");

if(ownerUid&&ownerUid!==me.uid)

db.collection("notifications")
.add({

toUid:ownerUid,
fromUid:me.uid,
type:"reaction",
text:me.username+
" reacted to your message",
read:false,
createdAt:
firebase.firestore.FieldValue.serverTimestamp()

});

})
.catch(function(e){

toast(err(e));

});

}

function usersPage(){

renderUsers();

}

function renderUsers(){

var h=
'<div class="card">'+
'<b>Users</b>'+
'<div class="small">Real Firebase users • live online/offline status</div>'+
'<button class="btn gray" style="float:right" onclick="showRequests()">Requests</button>'+
'</div>';

var a=[];
var id;

for(id in users)

if(id!==me.uid)
a.push(users[id]);

a.sort(function(x,y){

return (x.username||"")
.localeCompare(y.username||"");

});

if(!a.length)

h+=
'<div class="small center">No other users yet.</div>';

for(var i=0;i<a.length;i++){

var u=a[i];

h+=
'<div class="card">'+
'<div class="row">'+

'<img class="avatar" src="'+
esc(avatar(u))+
'">'+

'<div style="flex:1">'+
'<b>'+
esc(u.username)+
'</b>'+

'<div class="small">'+
'<span class="dot '+
(u._realOnline?"on":"")+
'"></span>'+
(u._realOnline?"Online":"Offline")+
'</div>'+

'</div>'+

'<button class="btn" onclick="userMenu(&quot;'+
u.uid+
'&quot;)">Open</button>'+

'</div>'+
'</div>';

}

$("screen").innerHTML=h;

}

function userMenu(uid){

var u=users[uid]||{};

openModal(

'<h3>'+
esc(u.username)+
'</h3>'+

'<div class="row">'+

'<img class="avatar" src="'+
esc(avatar(u))+
'">'+

'<div>'+
(u._realOnline?"Online":"Offline")+
'</div>'+

'</div>'+

'<hr>'+

'<button class="listbtn" onclick="friendReq(&quot;'+
uid+
'&quot;)">Send Friend Request</button>'+

'<button class="listbtn" onclick="closeModal()">Close</button>'

);

}

function friendReq(uid){

db.collection("friendRequests")
.add({

fromUid:me.uid,
toUid:uid,
status:"pending",
createdAt:
firebase.firestore.FieldValue.serverTimestamp()

})
.then(function(){

return db.collection("notifications")
.add({

toUid:uid,
fromUid:me.uid,
type:"friend",
text:
me.username+
" sent you a friend request",
read:false,
createdAt:
firebase.firestore.FieldValue.serverTimestamp()

});

})
.then(function(){

toast("Friend request sent.");
closeModal();

});

}

function showRequests(){

var h="<h3>Friend Requests</h3>";

db.collection("friendRequests")
.where("toUid","==",me.uid)
.where("status","==","pending")
.get()
.then(function(s){

var a=[];
var i;

s.forEach(function(d){

var x=d.data();

x.id=d.id;

a.push(x);

});

if(!a.length)

h+="<div class='small'>No pending requests.</div>";

for(i=0;i<a.length;i++){

var u=
users[a[i].fromUid]||{};

h+=
'<div class="card">'+

'<img class="avatar" src="'+
esc(avatar(u))+
'"> '+
esc(u.username||"User")+

'<br>'+

'<button class="btn green" onclick="acceptReq(&quot;'+
a[i].id+
'&quot;)">Accept</button> '+

'<button class="btn red" onclick="rejectReq(&quot;'+
a[i].id+
'&quot;)">Reject</button>'+

'</div>';

}

openModal(h);

});

}

function acceptReq(id){

db.collection("friendRequests")
.doc(id)
.update({
status:"accepted"
})
.then(function(){

closeModal();

toast("Friend request accepted.");

});

}

function rejectReq(id){

db.collection("friendRequests")
.doc(id)
.update({
status:"rejected"
})
.then(function(){

closeModal();

toast("Request rejected.");

});

}

function friendList(cb){

var a=[];

db.collection("friendRequests")
.where("fromUid","==",me.uid)
.where("status","==","accepted")
.get()
.then(function(s){

s.forEach(function(d){

a.push(
d.data().toUid
);

});

return db.collection("friendRequests")
.where("toUid","==",me.uid)
.where("status","==","accepted")
.get();

})
.then(function(s){

s.forEach(function(d){

a.push(
d.data().fromUid
);

});

cb(a);

})

function voice(){

if(
!navigator.mediaDevices||
!navigator.mediaDevices.getUserMedia||
!window.MediaRecorder
){

toast(
"Voice is not supported by this browser."
);

return;

}

if(recording){

recording.stop();

return;

}

navigator.mediaDevices
.getUserMedia({
audio:true
})
.then(function(stream){

recordChunks=[];

recording=
new MediaRecorder(stream);

recording.ondataavailable=
function(e){

if(e.data&&e.data.size)
recordChunks.push(e.data);

};

recording.onstop=function(){

stream.getTracks()[0].stop();

var b=
new Blob(
recordChunks,
{type:"audio/webm"}
);

recording=null;

uploadVoice(b);

};

recording.start();

$("voiceBtn").innerHTML="⏹";

toast(
"Recording... tap again to stop."
);

})
.catch(function(){

toast(
"Microphone permission denied."
);

});

}

var r=

me.uid+

Date.now()+

return r.getDownloadURL();

})

return db.collection("chats")

})

me.username
);

})

.catch(function(){

$("voiceBtn").innerHTML="🎙";

toast(
"Voice upload failed. Firebase Storage must be enabled."
);

});

}
