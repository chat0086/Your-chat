<body>

<div id="loading">
 <div class="loadingBox">
  <div class="brand">YOUR CHAT</div>
  <div id="loader" class="loader"></div>
  <div id="loadingText">Starting YOUR CHAT...</div>
  <div id="loadError"></div>
  <button id="retry" class="secondary hidden">Retry</button>
 </div>
</div>

<div id="app" class="hidden"></div>
<div id="toast"></div>

<script>
(function(){

 function bootError(msg){

  var e=document.getElementById("loadError");
  var r=document.getElementById("retry");

  if(e)e.textContent=msg;
  if(r)r.classList.remove("hidden");

  var l=document.getElementById("loader");

  if(l)l.classList.add("hidden");
 }

 window.__bootError=bootError;

 window.addEventListener("error",function(e){

  bootError(
   "App error: "+
   (e.message||"JavaScript error")
  );

 });

 window.addEventListener(
  "unhandledrejection",
  function(e){

   var m=
   e.reason&&e.reason.message
   ?
   e.reason.message
   :
   String(e.reason||"Unknown error");

   bootError(
    "Firebase error: "+m
   );

  }
 );

 document.getElementById("retry").onclick=
 function(){

  location.reload();

 };

 setTimeout(function(){

  var l=document.getElementById("loading");

  if(
   l &&
   !l.classList.contains("hidden")
  ){

   bootError(
    "Connection is taking too long. Retry dabao."
   );

  }

 },12000);

})();
</script>


<script type="module">

const firebaseConfig={

 projectId:

let app;
let auth;

let profile=null;

let unsubs=[];


const $=id=>

const esc=v=>
 String(v??"")
 .replace(
  /[&<>"']/g,
  c=>({

   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",

function toast(s){

 const t=$("toast");

 t.textContent=s;

 t.style.display="block";

 clearTimeout(window.__toast);

 window.__toast=
 setTimeout(
  ()=>t.style.display="none",
  3500
 );

}


function stopListeners(){

 unsubs.forEach(
  f=>{
   try{
    f();
   }catch(e){}
  }
 );

 unsubs=[];

}


function hideLoading(){

 $("loading")
 .classList.add("hidden");

 $("app")
 .classList.remove("hidden");

}


function showConnecting(){

 $("loading")
 .classList.remove("hidden");

 $("app")
 .classList.add("hidden");

 $("loader")
 .classList.remove("hidden");

 $("loadError").textContent="";

 $("retry")

function av(username,photo){

 }

/* AUTH */

function authScreen(){

 $("app").innerHTML=`

  align-items:center;

  <div
   class="card"

 </div>
 `;


 $("login").onclick=

}


/* LOGIN / CREATE */

async function authAction(create){

 const u=
 $("username").value.trim();

 const p=
 $("password").value;

 const msg=
 $("authMsg");


 if(
  !/^[A-Za-z0-9_]{3,24}$/.test(u)
 ){

  msg.textContent=
  "Username 3-24 letters, numbers ya _ hona chahiye.";

  return;

 }


 if(p.length<6){

  msg.textContent=
  "Password kam az kam 6 characters ka ho.";

  return;

 }


 msg.textContent=
 "Please wait...";


 try{

  if(create){

   const r=
   await createUserWithEmailAndPassword(
    auth,
    email(u),
    p
   );


   await updateProfile(
    r.user,
    {
     displayName:u
    }
   );


   await setDoc(
    doc(db,"users",r.user.uid),
    {
     uid:r.user.uid,
     username:u,
     photo:"",
     online:true,
     createdAt:serverTimestamp(),
     lastSeen:serverTimestamp()
    },
    {
     merge:true
    }
   );

  }else{

   await signInWithEmailAndPassword(
    auth,
    email(u),
    p
   );

  }

 }catch(e){

  msg.textContent=e.message;

 }

}


/* PROFILE */

async function loadProfile(){

 const ref=
 doc(db,"users",me.uid);

 const snap=
 await getDoc(ref);


 if(snap.exists()){

  profile=snap.data();

 }else{

  profile={
   uid:me.uid,
   username:me.displayName||"User",
   photo:""
  };


  await setDoc(
   ref,
   profile,
   {merge:true}
  );

 }


 await setDoc(
  ref,
  {
   online:true,
   lastSeen:serverTimestamp()
  },
  {merge:true}
 );

}

function render(){

 stopListeners();

/* MESSAGE HTML */

function msgHtml(m,kind,id){

 const mine=
 m.uid===me.uid;

 let media="";


 if(m.type==="image"){

  media=`
  <img
   class="media"
   src="${esc(m.url)}">
  `;

 }


 if(m.type==="video"){

  media=`
  <video
   class="media"
   controls
   src="${esc(m.url)}">
  </video>
  `;

 }


 if(m.type==="voice"){

  media=`
  <audio
   class="media"
   controls
   src="${esc(m.url)}">
  </audio>
  `;

 }


 const tm=
 m.createdAt?.toDate
 ?
 m.createdAt
  .toDate()
  .toLocaleString()
 :
 "now";


 return `

 <div
  class="msg ${mine?"mine":""}">

  <b>
   ${esc(m.username||"User")}
  </b>

  <div>
   ${esc(m.text||"")}
  </div>

  ${media}

  <small>
   ${tm}
   ${m.edited?" · edited":""}
  </small>

  ${
   mine
   ?

   `<div class="actions">

    <button
     onclick="
     editMsg(
      '${kind}',
      '${id}',
      '${m.id}'
     )">

     Edit

    </button>

    <button
     onclick="
     delMsg(
      '${kind}',
      '${id}',
      '${m.id}'
     )">

     Delete

    </button>

   </div>`

   :

   ""
  }

 </div>
 `;

}

async function sendWorld(){

  await addDoc(
   collection(db,"worldMessages"),

    uid:me.uid,

/* EDIT */

window.editMsg=
async function(
 kind,
 id,
 mid
){

 const text=
 prompt("New message:");

 if(!text)return;


 try{

  const ref=
  kind==="world"
  ?
  doc(
   db,
   "worldMessages",
   mid
  )
  :
  doc(
   db,
   "chats",
   id,
   "messages",
   mid
  );


  await updateDoc(
   ref,
   {
    text:text,
    edited:true
   }
  );

 }catch(e){

  toast(e.message);

 }

};


/* DELETE */

window.delMsg=
async function(
 kind,
 id,
 mid
){

 if(!confirm("Delete message?"))
  return;


 try{

  const ref=
  kind==="world"
  ?
  doc(
   db,
   "worldMessages",
   mid
  )
  :
  doc(
   db,
   "chats",
   id,
   "messages",
   mid
  );


  await deleteDoc(ref);

 }catch(e){

  toast(e.message);

 }

};
