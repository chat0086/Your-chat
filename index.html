<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#050d18">
<title>Chit Chat Plus</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050d18;color:#e8f1fa;font:14px Arial,sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer}
.hide{display:none!important}
#load,#auth{position:fixed;top:0;left:0;right:0;bottom:0;background:#050d18;text-align:center;padding-top:14%;z-index:50;overflow:auto}
.box{width:90%;max-width:340px;margin:0 auto;background:#0a1a2e;border:1px solid #14607a;border-radius:16px;padding:18px}
.logo{font-size:26px;font-weight:bold}.logo b{color:#19c3b1}
input,textarea{width:100%;padding:11px;margin:5px 0;background:#061322;color:#fff;border:1px solid #1d4a63;border-radius:12px;outline:0}
.btn{padding:10px 14px;border:0;border-radius:12px;background:#1a8fe0;color:#fff;font-weight:bold}
.btn.g{background:#0f9d8a}.btn.r{background:#a52a3f}.btn.d{background:#12304a}
.wide{width:100%;margin-top:6px}
#app{position:fixed;top:0;bottom:0;left:0;right:0}
#top{height:50px;background:#0a1a2e;border-bottom:1px solid #14607a;padding:0 6px;white-space:nowrap}
#top button{background:none;border:0;color:#9fc3dd;height:50px;padding:0 12px}
#top button.on{color:#19c3b1;border-bottom:2px solid #19c3b1}
#main{position:absolute;top:50px;bottom:0;left:0;right:0;overflow:auto;padding:8px}
#drawer{position:fixed;top:0;bottom:0;left:0;width:72%;max-width:270px;background:#0a1a2e;border-right:1px solid #14607a;z-index:40;overflow:auto}
#drawer div{padding:13px 16px;border-bottom:1px solid #12304a}
.card{background:#0a1a2e;border:1px solid #14607a;border-radius:14px;padding:11px;margin-bottom:9px}
.av{display:inline-block;width:36px;height:36px;border-radius:50%;background:#fff;vertical-align:middle;object-fit:cover}
.row{padding:8px 0;border-bottom:1px solid #12304a;overflow:hidden}
.row .btn{float:right;padding:6px 10px;margin-top:4px}
.mut{color:#7f9bb3;font-size:12px}
.grn{color:#00e99a}.gry{color:#7f9bb3}
.tag{background:#0f9d8a;border-radius:10px;padding:1px 7px;font-size:11px;color:#fff}
.chat{position:absolute;top:0;bottom:0;left:0;right:0;display:flex;flex-direction:column;padding:8px}
.ch{padding:4px 0 8px;border-bottom:1px solid #12304a;overflow:hidden;position:relative}
.ch .btn{padding:6px 10px}
.ms{flex:1;overflow:auto}
.m{margin:6px 0;overflow:hidden}
.b{max-width:80%;padding:7px 10px;border-radius:12px;word-wrap:break-word;white-space:pre-wrap;font-size:13px}
.me .b{float:right;background:#0b6b5f}.ot .b{float:left;background:#12304a}
.m .av{width:28px;height:28px;float:left;margin-right:5px}
.nm{color:#19c3b1;display:block;font-size:12px}
.q{background:rgba(0,0,0,.25);border-left:3px solid #19c3b1;padding:4px 6px;border-radius:6px;font-size:11px;margin-bottom:4px}
.t{font-size:10px;color:#a9c4d9;text-align:right;margin-top:3px}
.t a{color:#5be0d0;margin-left:6px;cursor:pointer}.rd{color:#4fc3ff}
.rb{background:#12304a;border-left:3px solid #19c3b1;padding:6px 8px;border-radius:8px;font-size:12px}
.rb a{float:right;padding:0 6px;cursor:pointer}
.ci{display:flex;padding:6px 0}
.ci textarea{margin:0 6px 0 0;height:42px;min-height:42px;resize:none;border-radius:21px}
.ml{background:#0a1a2e;border:1px solid #14607a;border-radius:10px;max-height:120px;overflow:auto}
.mi{padding:7px 8px}.mi .av{width:24px;height:24px}
.onl{max-height:100px;overflow:auto;border-bottom:1px solid #12304a}
.warn{background:#3b1921;color:#ff8fa2;padding:8px;border-radius:8px;margin:6px 0;text-align:center}
.pop{position:absolute;right:0;top:44px;background:#0a1a2e;border:1px solid #14607a;border-radius:12px;padding:6px;z-index:10;width:210px}
.pop button{display:block;width:100%;margin:4px 0;text-align:left}
.sm{width:100%;max-height:260px;border-radius:10px;margin-top:6px;background:#000}
.ci textarea{flex:1}
.ab{flex:0 0 auto;padding:0 10px;height:42px;margin-right:4px;font-size:16px;border-radius:21px}
.ab.on{background:#a52a3f}
.au{width:100%}
.upl{color:#7f9bb3;font-size:11px;margin-top:4px}
#toast{position:fixed;bottom:16px;left:6%;right:6%;background:#12304a;border:1px solid #19c3b1;padding:10px;border-radius:12px;z-index:99;text-align:center}
</style>
</head>
<body>

<div id="load"><div class="box"><div class="logo">Chit Chat <b>Plus</b></div><p class="mut" id="lt">Loading...</p></div></div>

<div id="auth" class="hide"><div class="box">
 <div class="logo">Chit Chat <b>Plus</b></div>
 <div style="margin:10px 0">
  <button id="tl" class="btn g" data-a="am" data-i="login">Login</button>
  <button id="tc" class="btn d" data-a="am" data-i="create">Create Account</button>
 </div>
 <input id="un" maxlength="30" placeholder="Username / name">
 <input id="pw" type="password" placeholder="Password">
 <button id="ab" class="btn wide" data-a="auth">Login</button>
 <div id="ae" class="mut" style="margin-top:8px"></div>
</div></div>

<div id="app" class="hide">
 <div id="drawer" class="hide"></div>
 <div id="top">
  <button id="t0" data-a="go" data-i="status">Status</button>
  <button id="t1" data-a="go" data-i="private">Private</button>
  <button id="t2" data-a="go" data-i="world">World Chat</button>
  <button id="t3" data-a="menu">&#9776; <span id="nb" class="tag hide"></span></button>
 </div>
 <div id="main"></div>
</div>

<div id="toast" class="hide"></div>
<input type="file" id="fi" accept="image/*" class="hide">
<input type="file" id="fs" accept="image/*" class="hide">
<input type="file" id="fv" accept="video/*" class="hide">
<input type="file" id="pi" accept="image/*" class="hide">
<input type="file" id="pv" accept="video/*" class="hide">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
/* ===== FIREBASE CONFIG: Firebase Console > Project Settings > Your apps se exact values paste karo ===== */
var CFG={
 apiKey:"AIzaSyAEqeB2YXk_2A9gZ41WQ_fNiBKiGnzYGc0",
 authDomain:"chit-chat-plus-7382b.firebaseapp.com",
 projectId:"chit-chat-plus-7382b",
 storageBucket:"chit-chat-plus-7382b.firebasestorage.app",
 messagingSenderId:"98837732974",
 appId:"1:98837732974:web:ff52d3868871c91518507f",
 measurementId:"G-T42H2N5Q0Z"
};

/* ===== Cloudinary (image/video/voice storage) ===== */
var CLOUD_NAME="ptqrd8vc";
var CLOUD_PRESET="your_chat_upload";
var CLOUD_URL="https://api.cloudinary.com/v1_1/"+CLOUD_NAME+"/auto/upload";

function cloudUpload(file,onOk,onErr,onProg){
 if(!file){onErr("File nahi mili.");return}
 var fd=new FormData();
 fd.append("file",file);
 fd.append("upload_preset",CLOUD_PRESET);
 var xhr=new XMLHttpRequest();
 xhr.open("POST",CLOUD_URL);
 if(xhr.upload&&onProg){xhr.upload.onprogress=function(e){if(e.lengthComputable)onProg(Math.round(e.loaded*100/e.total))}}
 xhr.onload=function(){
  var r;
  if(xhr.status>=200&&xhr.status<300){
   try{r=JSON.parse(xhr.responseText)}catch(e){onErr("Upload response samajh nahi aaya.");return}
   if(r&&r.secure_url){onOk(r.secure_url)}else{onErr("Upload fail: URL nahi mila.")}
  }else{onErr("Upload fail ho gaya (status "+xhr.status+"). Cloudinary preset/cloud name check karo.")}
 };
 xhr.onerror=function(){onErr("Upload fail: network unavailable.")};
 xhr.send(fd);
}

var db,auth,uid="",me={},users={},bMine={},bBy={},notes=[],cur=[];
var rep=null,view="",ck="",cid="",peer="",ulOnly=false,creating=false,mode="login",loaded=false;
var uU,uB1,uB2,uN,uC,hb,pt,tt,sList=[];
var rec=null,recChunks=[],recTimer=null,recSec=0,recTick=null,recStream=null;

function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function TS(){return firebase.firestore.FieldValue.serverTimestamp()}
function ms(t){return t&&t.toMillis?t.toMillis():Date.now()}
function fmt(t){if(!t||!t.toDate)return "";var d=t.toDate(),h=d.getHours(),m=d.getMinutes(),a=h>=12?"PM":"AM";h=h%12||12;return h+":"+(m<10?"0":"")+m+" "+a}
function toast(t){var e=$("toast");e.textContent=t;e.className="";clearTimeout(tt);tt=setTimeout(function(){e.className="hide"},3500)}
function noop(){}

function fe(e){
 var c=(e&&e.code)||"",m=(e&&e.message)||"";
 if(c=="permission-denied")return "Permission denied: Firestore rules check karo.";
 if(c=="auth/wrong-password"||c=="auth/invalid-credential"||c=="auth/invalid-login-credentials")return "Login failed: username ya password galat hai.";
 if(c=="auth/user-not-found")return "User nahi mila.";
 if(c=="auth/email-already-in-use")return "Ye username pehle se maujood hai.";
 if(c=="auth/weak-password")return "Password kam az kam 6 characters ka rakho.";
 if(c=="auth/network-request-failed"||c=="unavailable")return "Network unavailable hai.";
 if(c=="auth/invalid-api-key"||m.indexOf("api-key")>-1)return "Firebase API key galat hai: Project Settings se config paste karo.";
 if(c=="auth/operation-not-allowed")return "Firebase Auth mein Email/Password enable karo.";
 return m||"Kuch galat ho gaya.";
}

/* username -> internal synthetic email (UI par kabhi nahi dikhta) */
function emailOf(n){
 var s="",i,c;n=n.toLowerCase();
 for(i=0;i<n.length;i++){c=n.charCodeAt(i);s+=c<128?(c<16?"0":"")+c.toString(16):"x"+("000"+c.toString(16)).slice(-4)}
 return "u"+s+"@chitchatplus.app";
}

function isOn(u){
 if(!u||!u.online)return false;
 var t=u.lastSeen&&u.lastSeen.toMillis?u.lastSeen.toMillis():Date.now();
 return Date.now()-t<70000;
}
function av(u){return u&&u.avatar?'<img class="av" src="'+esc(u.avatar)+'">':'<span class="av"></span>'}
function nameOf(k){return users[k]?users[k].username:"User"}

/* ---------- START ---------- */
try{
 if(CFG.apiKey.indexOf("PASTE")===0){throw {code:"cfg"}}
 if(typeof firebase==="undefined"){throw {code:"net"}}
 firebase.initializeApp(CFG);auth=firebase.auth();db=firebase.firestore();
 auth.onAuthStateChanged(onAuth);
 setTimeout(function(){if(!$("load").className){$("lt").textContent="Firebase respond nahi kar raha. Network/config check karo."}},10000);
}catch(e){
 $("lt").textContent=e.code=="cfg"?"Firebase config paste karo (Project Settings > Your apps).":(e.code=="net"?"Firebase load nahi hua: internet check karo.":fe(e));
}

function onAuth(u){
 if(!u){stopAll();uid="";$("ae").textContent="";$("load").className="hide";$("app").className="hide";$("auth").className="";return}
 if(creating)return;
 uid=u.uid;
 db.collection("users").doc(uid).get().then(function(d){
  if(d.exists)return;
  return db.collection("users").doc(uid).set({uid:uid,username:"User",usernameLower:"user",avatar:"",online:true,notifOn:true,lastSeen:TS(),createdAt:TS()});
 }).then(begin).catch(function(e){$("load").className="";$("lt").textContent=fe(e)});
}

function authGo(){
 var n=$("un").value.replace(/^\s+|\s+$/g,""),p=$("pw").value,er=$("ae");
 if(n.length<2||n.length>30){er.textContent="Username 2 se 30 characters ka ho.";return}
 if(p.length<6){er.textContent="Password kam az kam 6 characters.";return}
 er.textContent="Loading...";
 var e=emailOf(n),pr;
 if(mode=="login"){pr=auth.signInWithEmailAndPassword(e,p)}
 else{
  creating=true;
  pr=auth.createUserWithEmailAndPassword(e,p).then(function(c){
   uid=c.user.uid;
   return db.collection("users").doc(uid).set({uid:uid,username:n,usernameLower:n.toLowerCase(),avatar:"",online:true,notifOn:true,lastSeen:TS(),createdAt:TS()});
  }).then(function(){creating=false;begin()});
 }
 pr.catch(function(x){creating=false;er.textContent=fe(x)});
}

function begin(){
 $("load").className="hide";$("auth").className="hide";$("app").className="";
 listen();go("home");
}

function listen(){
 stopAll();
 uU=db.collection("users").onSnapshot(function(s){users={};s.forEach(function(d){users[d.id]=d.data()});me=users[uid]||me;loaded=true;paint()},function(e){toast(fe(e))});
 uB1=db.collection("blocks").where("uid","==",uid).onSnapshot(function(s){bMine={};s.forEach(function(d){bMine[d.data().blockedUid]=1});blkUI()},function(e){toast(fe(e))});
 uB2=db.collection("blocks").where("blockedUid","==",uid).onSnapshot(function(s){bBy={};s.forEach(function(d){bBy[d.data().uid]=1});blkUI()},function(e){toast(fe(e))});
 uN=db.collection("notifications").where("toUid","==",uid).limit(50).onSnapshot(function(s){
  notes=[];s.forEach(function(d){var n=d.data();n.id=d.id;notes.push(n)});
  notes.sort(function(a,b){return ms(b.createdAt)-ms(a.createdAt)});
  cnt();if(view=="notes")vNotes();
 },function(e){toast(fe(e))});
 beat();hb=setInterval(beat,25000);pt=setInterval(paint,30000);
}

function stopAll(){
 var a=[uU,uB1,uB2,uN,uC],i;
 for(i=0;i<a.length;i++){if(a[i])a[i]()}
 uU=uB1=uB2=uN=uC=null;clearInterval(hb);clearInterval(pt);loaded=false;
}

function beat(){if(uid)db.collection("users").doc(uid).update({online:true,lastSeen:TS()}).catch(noop)}
window.onbeforeunload=function(){if(uid&&db)db.collection("users").doc(uid).update({online:false}).catch(noop)};

/* ---------- PAINT ---------- */
function paint(){paintOnline();paintUsers();if(view=="chat")pst()}

function onlineList(){var a=[],k;for(k in users){if(k!=uid&&isOn(users[k]))a.push(k)}return a}

function paintOnline(){
 var el=$("onl"),wc=$("wc");if(!el)return;
 var a=onlineList(),h="",i;
 if(wc)wc.textContent="● "+(a.length+1)+" online";
 if(!loaded){el.innerHTML='<div class="mut">Loading...</div>';return}
 for(i=0;i<a.length;i++){h+='<div class="row">'+av(users[a[i]])+' '+esc(users[a[i]].username)+' <span class="mut"><span class="grn">●</span> Online</span><button class="btn g" data-a="chat" data-i="'+a[i]+'">Private</button></div>'}
 el.innerHTML=h||'<div class="mut">Koi online user nahi.</div>';
}

function paintUsers(){
 var el=$("ul");if(!el)return;
 if(!loaded){el.innerHTML='<div class="mut">Loading...</div>';return}
 var h="",k,u;
 for(k in users){
  u=users[k];if(k==uid)continue;
  if(ulOnly&&!isOn(u))continue;
  h+='<div class="row">'+av(u)+' <b>'+esc(u.username)+'</b> <span class="mut">'+(isOn(u)?'<span class="grn">●</span> Online':'<span class="gry">●</span> Offline')+'</span><button class="btn g" data-a="chat" data-i="'+k+'">Chat</button></div>';
 }
 el.innerHTML=h||'<div class="mut">'+(ulOnly?"Koi online user nahi.":"Abhi koi user nahi.")+'</div>';
}

function cnt(){
 var n=0,i;for(i=0;i<notes.length;i++){if(!notes[i].read)n++}
 var b=$("nb");b.textContent=n;b.className=n?"tag":"tag hide";
 return n;
}

/* ---------- NAV ---------- */
function go(v,a){
 if(uC){uC();uC=null}
 rep=null;view=v;$("drawer").className="hide";
 if(v=="home")vHome();
 else if(v=="world")vWorld();
 else if(v=="private"){ulOnly=false;vUsers("Private Chat: kisi ko chuno")}
 else if(v=="users"){ulOnly=false;vUsers("All Users")}
 else if(v=="online"){ulOnly=true;vUsers("Online Users")}
 else if(v=="notes")vNotes();
 else if(v=="settings")vSet();
 else if(v=="chat")vChat(a);
 else if(v=="status")vStatus();
 $("t0").className=v=="status"?"on":"";
 $("t1").className=(v=="private"||v=="chat")?"on":"";
 $("t2").className=v=="world"?"on":"";
}

function menu(){
 var d=$("drawer");
 if(d.className==""){d.className="hide";return}
 var it=[["home","🏠 Home"],["status","📷 Status"],["private","💬 Private Chat"],["world","🌍 World Chat"],["users","👤 Users"],["online",'<span class="grn">●</span> Online Users'],["notes","🔔 Notifications ("+cnt()+")"],["settings","⚙ Settings"]],h="",i;
 for(i=0;i<it.length;i++){h+='<div data-a="go" data-i="'+it[i][0]+'">'+it[i][1]+'</div>'}
 h+='<div data-a="dp">🖼 Change DP</div><div data-a="logout">🚪 Logout</div><div data-a="menu" class="mut">✕ Close</div>';
 d.innerHTML=h;d.className="";
}

/* ---------- VIEWS ---------- */
function vHome(){
 var c=[["status","📷 Status"],["world","🌍 World Chat"],["online",'<span class="grn">●</span> Online Users'],["users","👤 All Users"],["private","💬 Private Chat"],["notes","🔔 Notifications"],["settings","⚙ Settings"]],h='<div class="card"><b>Welcome, '+esc(me.username||"")+'</b><div class="mut">Chit Chat Plus</div></div>',i;
 for(i=0;i<c.length;i++){h+='<button class="btn d wide" data-a="go" data-i="'+c[i][0]+'">'+c[i][1]+'</button>'}
 $("main").innerHTML=h;
}

function vUsers(t){
 $("main").innerHTML='<button class="btn d" style="margin-bottom:8px" data-a="go" data-i="home">← Home</button>'+'<div class="card"><b>'+esc(t)+'</b></div><div id="ul"></div>';
 paintUsers();
}

function vSet(){
 $("main").innerHTML='<button class="btn d" style="margin-bottom:8px" data-a="go" data-i="home">← Home</button>'+'<div class="card" style="text-align:center">'+av(me).replace('class="av"','class="av" style="width:70px;height:70px"')+'<h3>'+esc(me.username||"")+'</h3></div>'+
 '<div class="card"><button class="btn d wide" data-a="dp">🖼 Change DP</button>'+
 '<button class="btn d wide" data-a="ntf">🔔 Notifications: '+(me.notifOn===false?"OFF":"ON")+'</button></div>'+
 '<div class="card"><b>Account</b><div class="mut">Username: '+esc(me.username||"")+'</div></div>'+
 '<button class="btn r wide" data-a="logout">Logout</button>';
}

function vNotes(){
 var h='<button class="btn d" style="margin-bottom:8px" data-a="go" data-i="home">← Home</button>'+'<div class="card"><b>🔔 Notifications</b></div>',i,n;
 if(!notes.length)h+='<div class="mut">Abhi koi notification nahi.</div>';
 for(i=0;i<notes.length;i++){
  n=notes[i];
  h+='<div class="row">'+av(users[n.fromUid])+' <b>'+esc(n.fromName)+'</b>'+(n.read?"":' <span class="tag">new</span>')+'<div class="mut">'+esc(n.text)+' • '+fmt(n.createdAt)+'</div><button class="btn g" data-a="opn" data-i="'+i+'">Open</button></div>';
 }
 $("main").innerHTML=h;
}

function composer(){
 var extra = ck=="p" ?
  '<button class="btn d ab" data-a="atti" title="Image">🖼</button>'+
  '<button class="btn d ab" data-a="attv" title="Video">🎥</button>'+
  '<button class="btn d ab" id="micBtn" data-a="mic" title="Voice">🎤</button>' : "";
 return '<div id="bs" class="warn hide"></div><div id="up" class="upl hide"></div><div id="cm"><div id="rb" class="rb hide"></div><div id="ml" class="ml hide"></div><div class="ci">'+extra+'<textarea id="ti" placeholder="Write text... @username"></textarea><button class="btn g" data-a="send">➤</button></div></div>';
}

function vWorld(){
 ck="w";
 $("main").innerHTML='<div class="chat"><div class="ch"><b>🌍 World Chat</b> <span id="wc" class="tag"></span></div><div id="onl" class="onl"></div><div id="ms" class="ms"><div class="mut">Loading...</div></div>'+composer()+'</div>';
 $("ti").oninput=onIn;bindEnter();paintOnline();
 uC=db.collection("worldMessages").orderBy("createdAt","desc").limit(30).onSnapshot(function(s){
  var a=[];s.forEach(function(d){var m=d.data();m.id=d.id;a.unshift(m)});paintMsgs(a);
 },function(e){var el=$("ms");if(el)el.textContent=fe(e)});
}

function vChat(ou){
 var u=users[ou];
 if(!u||ou==uid){toast("User nahi mila.");go("private");return}
 ck="p";peer=ou;cid=[uid,ou].sort().join("_");
 $("main").innerHTML='<div class="chat"><div class="ch"><button class="btn d" data-a="go" data-i="private">←</button> '+av(u)+' <b>'+esc(u.username)+'</b> <span id="ps" class="mut"></span><button class="btn d" style="float:right" data-a="dots">⋮</button><div id="pp" class="pop hide"></div></div><div id="ms" class="ms"><div class="mut">Loading...</div></div>'+composer()+'</div>';
 $("ti").oninput=null;bindEnter();pst();blkUI();
 uC=db.collection("chats").doc(cid).collection("messages").orderBy("createdAt","desc").limit(40).onSnapshot(function(s){
  var a=[];s.forEach(function(d){var m=d.data();m.id=d.id;a.unshift(m)});
  paintMsgs(a);
  var i;for(i=0;i<a.length;i++){if(a[i].uid!=uid&&a[i].read===false){db.collection("chats").doc(cid).collection("messages").doc(a[i].id).update({read:true}).catch(noop)}}
 },function(e){var el=$("ms");if(el)el.textContent=fe(e)});
}

function pst(){
 var e=$("ps"),u=users[peer];if(!e||!u)return;

function mediaHTML(m){
 if(m.type=="image"&&m.mediaUrl)return '<img class="sm" src="'+esc(m.mediaUrl)+'">';

 if(m.type=="voice"&&m.mediaUrl)return '<audio class="au" controls preload="none" src="'+esc(m.mediaUrl)+'"></audio>';
 return esc(m.text);
}

/* ---------- SEND / REPLY / MENTION ---------- */
function bindEnter(){
 $("ti").onkeydown=function(e){e=e||window.event;if(e.keyCode==13&&!e.shiftKey){if(e.preventDefault)e.preventDefault();send()}};
}

function send(){
 var ti=$("ti");if(!ti)return;
 var t=ti.value.replace(/^\s+|\s+$/g,"");if(!t)return;
 if(t.length>1000)t=t.slice(0,1000);
 var m={uid:uid,username:me.username,text:t,createdAt:TS(),replyTo:rep||null},col;
 if(ck=="w"){col=db.collection("worldMessages")}
 else{
  if(bMine[peer]||bBy[peer]){toast("Blocked: message nahi bhej sakte.");return}
  m.read=false;col=db.collection("chats").doc(cid).collection("messages");
 }
 var k=ck,pr=peer;
 col.add(m).then(function(){
  if(k=="p"){note(pr,"private",t,uid)}
  else{var q,uu;for(q in users){uu=users[q];if(q!=uid&&uu.username&&t.toLowerCase().indexOf("@"+uu.username.toLowerCase())>-1)note(q,"mention",t,"world")}}
 }).catch(function(e){toast(fe(e))});
 ti.value="";rep=null;showRep();$("ml").className="ml hide";
}

function note(to,type,text,ref){
 if(users[to]&&users[to].notifOn===false)return;
 var lbl=type=="mention"?"Aapko mention kiya: ":"";
 db.collection("notifications").add({toUid:to,fromUid:uid,fromName:me.username,type:type,text:lbl+text.slice(0,80),ref:ref,read:false,createdAt:TS()}).catch(noop);
}

function showRep(){
 var e=$("rb");if(!e)return;
 if(!rep){e.className="rb hide";return}
 e.innerHTML='<a data-a="xrep">×</a>Reply to <b>'+esc(rep.username)+'</b>: '+esc(rep.text.slice(0,60));
 e.className="rb";
}

function onIn(){
 var v=$("ti").value,m=/@([^@\n]*)$/.exec(v),l=$("ml");
 if(!m){l.className="ml hide";return}
 var q=m[1].toLowerCase(),h="",a=onlineList(),i,u;
 for(i=0;i<a.length;i++){u=users[a[i]];if(u.username.toLowerCase().indexOf(q)==0)h+='<div class="mi" data-a="ment" data-i="'+a[i]+'">'+av(u)+' '+esc(u.username)+'</div>'}
 l.innerHTML=h;l.className=h?"ml":"ml hide";
}

/* ---------- DP ---------- */
function pickDP(f){
 if(!f)return;
 var r=new FileReader();
 r.onload=function(){
  var im=new Image();
  im.onload=function(){
   var c=document.createElement("canvas"),s=Math.min(im.width,im.height),S=240;
   c.width=S;c.height=S;
   c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,S,S);
   toast("DP upload ho rahi hai...");
   c.toBlob(function(blob){
    if(!blob){toast("Image process nahi hui.");return}
    cloudUpload(blob,function(url){
     db.collection("users").doc(uid).update({avatar:url}).then(function(){toast("DP update ho gayi.")}).catch(function(e){toast(fe(e))});
    },function(msg){toast(msg)});
   },"image/jpeg",0.8);
  };
  im.onerror=function(){toast("Image load nahi hui.")};
  im.src=r.result;
 };
 r.onerror=function(){toast("File read nahi hui.")};
 r.readAsDataURL(f);
}
$("fi").onchange=function(){pickDP(this.files&&this.files[0]);this.value=""};

/* ---------- PRIVATE MEDIA (image/video/voice via Cloudinary) ---------- */
function uProg(t){
 var e=$("up");if(!e)return;
 if(t==null){e.className="upl hide";e.textContent="";return}
 e.textContent=t;e.className="upl";
}

function sendMedia(type,url){
 if(bMine[peer]||bBy[peer]){toast("Blocked: media nahi bhej sakte.");return}
 var m={uid:uid,username:me.username,text:"",type:type,mediaUrl:url,createdAt:TS(),replyTo:rep||null,read:false};
 db.collection("chats").doc(cid).collection("messages").add(m).then(function(){
  note(peer,"private",type=="image"?"[Image]":type=="video"?"[Video]":"[Voice message]",uid);
 }).catch(function(e){toast(fe(e))});
 rep=null;showRep();
}

function attachPick(f,type,maxBytes,tooBig){
 if(!f)return;
 if(maxBytes&&f.size>maxBytes){toast(tooBig);return}
 uProg("Uploading "+type+"... 0%");
 cloudUpload(f,function(url){uProg(null);sendMedia(type,url)},function(msg){uProg(null);toast(msg)},function(p){uProg("Uploading "+type+"... "+p+"%")});
}

$("pi").onchange=function(){var f=this.files&&this.files[0];this.value="";attachPick(f,"image",15000000,"Image bohat bari hai (max 15MB).")};
$("pv").onchange=function(){var f=this.files&&this.files[0];this.value="";attachPick(f,"video",25000000,"Video bohat bari hai (max 25MB).")};

/* ---------- VOICE RECORDING ---------- */
function micSupported(){
 return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
}

function micToggle(){
 if(rec&&rec.state=="recording"){micStop();return}
 if(!micSupported()){toast("Voice recording is not supported in this browser.");return}
 navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
  recStream=stream;recChunks=[];recSec=0;
  try{rec=new MediaRecorder(stream)}catch(e){toast("Recorder start nahi hua.");stream.getTracks().forEach(function(t){t.stop()});return}
  rec.ondataavailable=function(e){if(e.data&&e.data.size>0)recChunks.push(e.data)};
  rec.onstop=function(){
   clearInterval(recTick);recTick=null;
   var mb=$("micBtn");if(mb){mb.className="btn d ab";mb.textContent="🎤"}
   if(recStream){recStream.getTracks().forEach(function(t){t.stop()});recStream=null}
   if(!recChunks.length){return}
   var blob=new Blob(recChunks,{type:rec.mimeType||"audio/webm"});
   uProg("Uploading voice... 0%");
   cloudUpload(blob,function(url){uProg(null);sendMedia("voice",url)},function(msg){uProg(null);toast(msg)},function(p){uProg("Uploading voice... "+p+"%")});
  };
  rec.start();
  var mb=$("micBtn");if(mb){mb.className="btn d ab on";mb.textContent="⏹"}
  recTick=setInterval(function(){
   recSec++;
   var mb2=$("micBtn");if(mb2)mb2.title=recSec+"s";
   if(recSec>=8){micStop()}
  },1000);
 }).catch(function(){toast("Microphone unavailable ya permission denied.")});
}

function micStop(){
 if(rec&&rec.state=="recording"){rec.stop()}
}

/* ---------- ACTIONS ---------- */
function act(a,i){
 var n,e;
 if(a=="am"){
  mode=i;$("tl").className=i=="login"?"btn g":"btn d";$("tc").className=i=="create"?"btn g":"btn d";
  $("ab").textContent=i=="login"?"Login":"Create Account";$("ae").textContent="";
 }
 else if(a=="auth")authGo();
 else if(a=="go")go(i);
 else if(a=="menu")menu();
 else if(a=="chat")go("chat",i);
 else if(a=="send")send();
 else if(a=="rep"){n=cur[i];if(n){rep={id:n.id,uid:n.uid,username:n.username,text:n.text||(n.type=="image"?"[Image]":n.type=="video"?"[Video]":n.type=="voice"?"[Voice]":"")};showRep();$("ti").focus()}}
 else if(a=="xrep"){rep=null;showRep()}
 else if(a=="ment"){$("ti").value=$("ti").value.replace(/@[^@\n]*$/,"@"+nameOf(i)+" ");$("ml").className="ml hide";$("ti").focus()}
 else if(a=="opn"){n=notes[i];if(!n)return;if(!n.read)db.collection("notifications").doc(n.id).update({read:true}).catch(noop);if(n.type=="mention")go("world");else go("chat",n.ref)}
 else if(a=="stt"){var tx=$("st").value.replace(/^\s+|\s+$/g,"");if(!tx){toast("Pehle kuch likho.");return}postSt("text",tx,"");$("st").value=""}
 else if(a=="sti")$("fs").click();
 else if(a=="stv")$("fv").click();
 else if(a=="atti")$("pi").click();
 else if(a=="attv")$("pv").click();
 else if(a=="mic")micToggle();
 else if(a=="sdel"){n=sList[i];if(n)db.collection("statuses").doc(n.id).delete().catch(function(x){toast(fe(x))})}
 else if(a=="dp"){$("drawer").className="hide";$("fi").click()}
 else if(a=="ntf"){db.collection("users").doc(uid).update({notifOn:me.notifOn===false}).then(function(){if(view=="settings")setTimeout(vSet,300)}).catch(function(x){toast(fe(x))});e=$("pp");if(e)e.className="pop hide"}
 else if(a=="dots"){
  e=$("pp");if(!e)return;
  if(e.className=="pop"){e.className="pop hide";return}
  e.innerHTML='<button class="btn d" data-a="dp">🖼 Change DP</button><button class="btn d" data-a="ntf">🔔 Notifications '+(me.notifOn===false?"OFF → ON":"ON → OFF")+'</button><button class="btn d" data-a="blk">'+(bMine[peer]?"Unblock User":"Block User")+'</button><button class="btn d" data-a="xpop">Close</button>';
  e.className="pop";
 }
 else if(a=="xpop"){e=$("pp");if(e)e.className="pop hide"}
 else if(a=="blk"){
  e=$("pp");if(e)e.className="pop hide";
  var ref=db.collection("blocks").doc(uid+"_"+peer);
  (bMine[peer]?ref.delete():ref.set({uid:uid,blockedUid:peer,createdAt:TS()})).then(function(){toast(bMine[peer]?"Unblocked.":"Blocked.")}).catch(function(x){toast(fe(x))});
 }
 else if(a=="logout"){
  $("drawer").className="hide";
  var f=function(){auth.signOut()};
  db.collection("users").doc(uid).update({online:false}).then(f,f);
 }
}

document.addEventListener("click",function(ev){
 var t=ev.target;
 while(t&&t!==document&&!(t.getAttribute&&t.getAttribute("data-a")))t=t.parentNode;
 if(!t||t===document)return;
 act(t.getAttribute("data-a"),t.getAttribute("data-i"));
});
</script>

rules_version = '2';
service cloud.firestore {

   function other(){ return ps()[0] == request.auth.uid ? ps()[1] : ps()[0]; }

   allow create: if ok() && request.auth.uid in ps() && mine()

     && !exists(/databases/$(database)/documents/blocks/$(other() + '_' + request.auth.uid));

   allow read: if ok() && (resource.data.uid == request.auth.uid || resource.data.blockedUid == request.auth.uid);

   allow create: if ok() && request.resource.data.fromUid == request.auth.uid;
  }
 }
