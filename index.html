function startVoiceRecording(room){
  if(recording){stopVoiceRecording();return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){toast("Voice recording is not supported.");return}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){

    var opts=null;
    try{if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported("audio/webm;codecs=opus"))opts={mimeType:"audio/webm;codecs=opus"}}catch(e){}
    try{recording=opts?new MediaRecorder(stream,opts):new MediaRecorder(stream)}catch(e){recording=new MediaRecorder(stream)}

    recording.onstop=function(){
      clearInterval(recInterval);recInterval=null;
      stream.getTracks().forEach(function(t){try{t.stop()}catch(e){}});
      recStream=null;
      var mime=recording&&recording.mimeType||"audio/webm";
      var blob=new Blob(recChunks,{type:mime});
      recording=null;
      if(!blob.size){toast("No voice recorded.");return}
      var ext=mime.indexOf("ogg")>-1?"ogg":"webm";
      var file;
      try{file=new File([blob],"voice."+ext,{type:mime})}catch(e){file=blob}
      toast("Uploading voice...");

        if(room==="private"){
          var d={uid:me.uid,username:me.username,avatar:me.avatar||"",createdAt:ts(),seenBy:[],voiceUrl:url};

      },function(e){toast("Voice upload failed: "+e)},"voice");
    };
    recording.start();

    },1000);

    var f=i.files&&i.files[0];
    if(!f)return;
    if(f.size>10*1024*1024){
      toast("Image must be under 10MB.");
      return;
    }
    toast("Uploading DP...");
    upload(f,function(url){
      db.collection("users").doc(me.uid).update({
        avatar:url
      }).then(function(){
        me.avatar=url;
        if(users[me.uid])users[me.uid].avatar=url;
        toast("DP updated.");
        settingsPage();
      }).catch(function(e){toast(e.message||"DP update failed.")});
    },function(e){toast("Upload failed: "+e)},"image");
  };
  i.click();
}

function notificationSettings(){
  var current=localStorage.getItem("yc_notifications")!=="off";
  var choice=prompt("Notifications:\n1 ON\n2 OFF\nCurrent: "+(current?"ON":"OFF"));
  if(choice==="1"){

    localStorage.setItem("yc_notifications","off");

    ["Dark Theme","dark"],
    ["Ocean Blue","ocean"],
    ["Sky Blue","sky"],
    ["Midnight Blue","midnight"],
    ["Emerald Green","emerald"],

function selectTheme(name){
  localStorage.setItem("yc_theme",name);
  applyTheme(name);
  toast("Theme changed.");
}

function loadSavedTheme(){
  var t=localStorage.getItem("yc_theme")||"";
  applyTheme(t);
}

function notificationAllowed(){
  return localStorage.getItem("yc_notifications")!=="off";
}

function notify(uid,type,text,target){
  if(!notificationAllowed())return Promise.resolve();
  if(!uid||uid===me.uid)return Promise.resolve();
  return db.collection("notifications").add({
    toUid:uid,
    fromUid:me.uid,
    fromUsername:me.username,
    fromAvatar:me.avatar||"",
    type:type||"message",
    text:text||"",
    target:target||"",
    read:false,
    createdAt:ts()
  }).catch(function(){});
}

function notificationListener(){
  if(!me)return;
  if(window.notificationUnsub)window.notificationUnsub();
  window.notificationUnsub=db.collection("notifications")
    .where("toUid","==",me.uid)
    .where("read","==",false)
    .onSnapshot(function(s){
      if(!s.empty&&notificationAllowed()){
        playNotificationSound();
      }
    },function(){});
}

function playNotificationSound(){
  if(!notificationAllowed())return;
  try{
    var a=document.getElementById("notificationAudio");
    if(a){
      a.currentTime=0;
      var p=a.play();
      if(p&&p.catch)p.catch(function(){});
      return;
    }

    var C=window.AudioContext||window.webkitAudioContext;
    if(!C)return;
    var c=new C(),o=c.createOscillator(),g=c.createGain();
    o.frequency.value=880;
    o.type="sine";
    g.gain.value=.08;
    o.connect(g);
    g.connect(c.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.25);
    o.stop(c.currentTime+.25);
  }catch(e){}
}

function addNotificationAudio(){
  if(document.getElementById("notificationAudio"))return;
  var a=document.createElement("audio");
  a.id="notificationAudio";
  a.preload="auto";
  a.src="New_Iphone_18_Pro_Max_Sms_Ringtone___New_Iphone_Notification_Sound___Sms_Ringtone(256k).mp3";
  document.body.appendChild(a);
}

function allUsersPage(){
  stop();
  page="allUsers";
  mount(shell("All Users",'<div class="wrap"><input id="allSearch" class="input" placeholder="Search username or Easy ID" oninput="drawAllUsers()"><div id="allUsersList">Loading...</div></div>',true));
  listen(db.collection("users"),function(s){users={};s.forEach(function(d){users[d.id]=d.data();users[d.id].uid=d.id});drawAllUsers()});
}

function drawAllUsers(){
  var box=$("allUsersList");
  if(!box)return;
  var q=(($("allSearch")&&$("allSearch").value)||"").trim().toLowerCase();
  var a=[];
  Object.keys(users).forEach(function(id){
    if(id===me.uid)return;
    var u=users[id]||{};
    var un=(u.username||"").toLowerCase();
    var ei=(u.easyId||"").toLowerCase();
    if(!q||un.indexOf(q)>-1||ei.indexOf(q)>-1)a.push(u);
  });

  a.sort(function(x,y){
    return String(x.username||"").localeCompare(String(y.username||""));
  });

  var h="";
  a.forEach(function(u){
    h+='<div class="userRow" onclick="openPrivate(\''+u.uid+'\')">'+
      av(u)+
      '<div class="userInfo"><b>'+esc(u.username||"User")+'</b>'+
      '<div class="small">Easy ID: '+esc(u.easyId||"")+' • '+(online(u)?"Online":"Offline")+'</div></div>'+
      '</div>';
  });

  box.innerHTML=h||'<div class="card empty">No users found.</div>';
}

function onlineUsersPage(){
  stop();
  page="online";
  mount(shell("Online Users",'<div class="wrap"><div id="onlineList">Loading...</div></div>',true));
  listen(db.collection("users"),function(s){users={};s.forEach(function(d){users[d.id]=d.data();users[d.id].uid=d.id});drawOnlineUsers()});
}

function drawOnlineUsers(){
  var box=$("onlineList");
  if(!box)return;

  var a=[];
  Object.keys(users).forEach(function(id){
    if(id===me.uid)return;
    if(online(users[id]))a.push(users[id]);
  });

  a.sort(function(x,y){
    return String(x.username||"").localeCompare(String(y.username||""));
  });

  var h="";
  a.forEach(function(u){
    h+='<div class="userRow" onclick="openPrivate(\''+u.uid+'\')">'+
      av(u)+
      '<div class="userInfo"><b>'+esc(u.username||"User")+'</b>'+
      '<div class="small online">● Online</div></div>'+
      '</div>';
  });

  box.innerHTML=h||'<div class="card empty">No other users are online.</div>';
}

function homePage(){
  stop();
  page="home";

  mount(shell("YOUR CHAT",'<div class="wrap homeGrid">'+
    '<button class="homeBtn" onclick="worldPage()">🌍<span>World Chat</span></button>'+
    '<button class="homeBtn" onclick="onlineUsersPage()">🟢<span>Online Users</span></button>'+
    '<button class="homeBtn" onclick="showPrivate()">💬<span>Private Chat</span></button>'+
    '<button class="homeBtn" onclick="showGroups()">👥<span>Group Chat</span></button>'+
    '<button class="homeBtn" onclick="allUsersPage()">👤<span>All Users</span></button>'+
    '<button class="homeBtn" onclick="statusPage(\'other\')">⭕<span>Status</span></button>'+
    '<button class="homeBtn" onclick="settingsPage()">⚙️<span>Settings</span></button>'+
  '</div>',false));

  loadSavedTheme();
  addNotificationAudio();
  notificationListener();
}

function worldPage(){
  stop();
  page="world";

  mount(shell("World Chat",'<div class="worldWrap">'+
    '<div class="worldHeader"><button class="smallBtn" onclick="worldMenu()">☰ Menu</button><span id="worldOnline">Online: 0</span><button class="smallBtn" onclick="worldOptions()">Options</button></div>'+
    '<div id="wm" class="msgList">Loading...</div>'+
    '<div id="wr"></div>'+
    '<div class="compose"><input id="wi" class="input" placeholder="Message" oninput="setTyping(\'world\',true)" onkeydown="if(event.key===\'Enter\'){event.preventDefault();sendWorld()}"><button id="wsend" class="icon send" onclick="sendWorld()">➤</button></div>'+
  '</div>',true));

  listen(db.collection("worldMessages").orderBy("createdAt","asc"),function(s){
    window.world=[];
    s.forEach(function(d){
      var x=d.data();x.id=d.id;window.world.push(x);
    });
    window.world=window.world.slice(-15);
    drawMessages(window.world,"world","wm");
    scrollBottom("wm");
  });

  listen(db.collection("users"),function(s){
    users={};
    s.forEach(function(d){
      users[d.id]=d.data();
      users[d.id].uid=d.id;
    });
    updateWorldOnline();
  });

  updateWorldOnline();
}

function updateWorldOnline(){
  var c=0;
  Object.keys(users).forEach(function(id){
    if(online(users[id]))c++;
  });
  var x=$("worldOnline");
  if(x)x.textContent="Online: "+c;
}

function worldMenu(){
  var choice=prompt("World Chat Menu:\n1 Online Users\n2 Mention User\n3 All Users\n4 Back");
  if(choice==="1")onlineUsersPage();
  else if(choice==="2")showWorldMentions();
  else if(choice==="3")allUsersPage();
}

function showWorldMentions(){
  var box=$("wm");
  if(!box)return;

  var h='<div class="card"><b>Select user to mention</b>';
  Object.keys(users).forEach(function(id){
    if(id===me.uid)return;
    var u=users[id];
    h+='<button class="userRow" onclick="mentionUser(\''+esc(u.username)+'\')">'+av(u)+'<span class="userInfo">@'+esc(u.username)+'</span></button>';
  });
  h+='<button class="btn secondary" onclick="worldPage()">Back</button></div>';

  box.innerHTML=h;
}

function mentionUser(username){
  var i=$("wi");
  var val=i?i.value:"";
  worldPage();
  var n=$("wi");
  if(n){
    n.value=val+(val?" ":"")+"@"+username+" ";
    n.focus();
  }
}

function worldOptions(){
  var choice=prompt("World Chat Options:\n1 Back");
  if(choice==="1")worldPage();
}

function startAppAfterLogin(){
  setOnline(true);
  setTimeout(function(){
    homePage();
  },1000);
}

loadSavedTheme();
addNotificationAudio();

function boot(){
  if(window.appBooted)return;
  window.appBooted=true;

  auth.onAuthStateChanged(function(user){
    if(user){
      db.collection("users").doc(user.uid).get().then(function(d){
        if(!d.exists){
          auth.signOut();
          return;
        }

        me=d.data();
        me.uid=user.uid;

        if(!me.username){
          me.username=user.email ? user.email.split("@")[0] : "User";
        }

        users[me.uid]=me;
        setOnline(true);
        clearInterval(window.ycPresence);
        window.ycPresence=setInterval(function(){
          if(me)setOnline(true);
        },30000);
        loadSavedTheme();
        addNotificationAudio();

        setTimeout(function(){
          homePage();
        },1000);
      }).catch(function(){
        auth.signOut();
      });
    }else{
      me=null;
      page="login";
      loginPage();
    }
  });
}

function loginPage(){
  stop();

  mount('<div class="authPage">'+
    '<div class="authBox">'+
      '<div class="logo">YOUR CHAT</div>'+
      '<div class="authSub">Connect • Chat • Share</div>'+
      '<input id="loginUser" class="input" placeholder="Username" autocomplete="username">'+
      '<input id="loginPass" class="input" type="password" placeholder="Password" autocomplete="current-password">'+
      '<button class="btn primary" onclick="doLogin()">Login</button>'+
      '<button class="btn secondary" onclick="createAccountPage()">Create Account</button>'+
      '<div id="authMsg" class="notice"></div>'+
    '</div>'+
  '</div>');
}

function createAccountPage(){
  stop();

  mount('<div class="authPage">'+
    '<div class="authBox">'+
      '<div class="logo">YOUR CHAT</div>'+
      '<div class="authSub">Create your account</div>'+
      '<input id="newUser" class="input" placeholder="Username">'+
      '<input id="newPass" class="input" type="password" placeholder="Password">'+
      '<button class="btn primary" onclick="doCreateAccount()">Create Account</button>'+
      '<button class="btn secondary" onclick="loginPage()">Back to Login</button>'+
      '<div id="authMsg" class="notice"></div>'+
    '</div>'+
  '</div>');
}

function usernameEmail(name){
  return String(name).trim().toLowerCase()+"@yourchat.local";
}

function validUsername(name){
  return /^[A-Za-z0-9_]{3,24}$/.test(name);
}

function doCreateAccount(){
  var n=($("newUser")&&$("newUser").value||"").trim();
  var p=($("newPass")&&$("newPass").value||"");

  if(!validUsername(n)){
    toast("Username must be 3-24 letters, numbers or _.");
    return;
  }

  if(p.length<6){
    toast("Password must be at least 6 characters.");
    return;
  }

  auth.createUserWithEmailAndPassword(usernameEmail(n),p)
    .then(function(c){
      var easy="YC"+String(Math.floor(100000+Math.random()*900000));

      return db.collection("users").doc(c.user.uid).set({
        uid:c.user.uid,
        username:n,
        easyId:easy,
        avatar:"",
        bio:"",
        online:true,
        lastSeen:ts(),
        createdAt:ts()
      });
    })
    .then(function(){
      toast("Account created.");
    })
    .catch(function(e){
      toast(e.message||"Account creation failed.");
    });
}

function doLogin(){
  var n=($("loginUser")&&$("loginUser").value||"").trim();
  var p=($("loginPass")&&$("loginPass").value||"");

  if(!n||!p){
    toast("Enter username and password.");
    return;
  }

  auth.signInWithEmailAndPassword(usernameEmail(n),p)
    .then(function(){
      toast("Login successful.");
    })
    .catch(function(e){
      toast(e.message||"Login failed.");
    });
}

function setOnline(v){
  if(!me)return;

  return db.collection("users").doc(me.uid).set({
    online:!!v,
    lastSeen:ts()
  },{merge:true}).catch(function(){});
}

function stop(){
  try{
    listenStops.forEach(function(x){try{x()}catch(e){}});
    listenStops=[];
    if(worldUnsub)worldUnsub();
    if(privateUnsub)privateUnsub();
    if(groupUnsub)groupUnsub();
    if(usersUnsub)usersUnsub();
    if(notifyUnsub)notifyUnsub();
    if(window.notificationUnsub)window.notificationUnsub();
  }catch(e){}

  worldUnsub=null;
  privateUnsub=null;
  groupUnsub=null;
  usersUnsub=null;
  notifyUnsub=null;

  if(recInterval){
    clearInterval(recInterval);
    recInterval=null;
  }

  if(recording){
    try{recording.stop()}catch(e){}
  }

  if(recStream){
    try{
      recStream.getTracks().forEach(function(t){t.stop()});
    }catch(e){}
  }

  recording=null;
  recStream=null;
}

function logout(){
  if(!me)return;

  clearInterval(window.ycPresence);
  setOnline(false).then(function(){
    stop();
    auth.signOut().then(function(){
      me=null;
      peer=null;
      chatId=null;
      groupId=null;
      groupName="";
      page="login";
      loginPage();
    });
  });
}

window.addEventListener("beforeunload",function(){
  try{
    if(me)setOnline(false);
  }catch(e){}
});

window.addEventListener("online",function(){
  if(me)setOnline(true);
});

window.addEventListener("offline",function(){
  if(me)setOnline(false);
});

boot();

</script>
