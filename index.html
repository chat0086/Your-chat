<html>
<head>
<meta charset="utf-8">

<title>Chit Chat Plus</title>
<style>
html,body{margin:0;padding:0;background:#040b16;color:#eef7ff;font-family:Arial,sans-serif;font-size:14px}
*{box-sizing:border-box}
button,input,textarea{font-family:Arial,sans-serif}
button{background:linear-gradient(180deg,#163f68,#0e2b4a);color:#fff;border:1px solid #2c6a9e;border-radius:10px;padding:9px 10px}
button:active{background:#1d4d82}
input,textarea{width:100%;background:#071a2d;color:#fff;border:1px solid #28557d;border-radius:11px;padding:10px;outline:none}
textarea{height:70px;resize:none}
button:disabled{opacity:.45}
.hide{display:none!important}

#loading{
position:fixed;left:0;top:0;right:0;bottom:0;
background:#061326 url('loading.png') no-repeat center center;
background-size:cover;z-index:9999;text-align:center;
animation:fadeSplash 1.8s forwards
}
@keyframes fadeSplash{
0%,72%{opacity:1;visibility:visible}
100%{opacity:0;visibility:hidden}
}

#auth{max-width:420px;margin:0 auto;padding:24px 14px}
.logo{font-size:28px;font-weight:bold;text-align:center;margin:12px 0 5px;letter-spacing:.6px}
.sub{text-align:center;color:#7fc9f3;margin-bottom:20px}
.card{
background:linear-gradient(180deg,#0a2038,#07182b);
border:1px solid #1f4e76;border-radius:15px;
padding:12px;margin:10px 0;
box-shadow:0 7px 22px rgba(0,0,0,.22)
}
.badge{
display:inline-block;background:#0a2946;border:1px solid #2a638f;
color:#9cc8ee;border-radius:20px;padding:5px 9px;font-size:11px
}
.err{color:#ff9b9b;margin-top:8px;line-height:1.4}
.ok{color:#83e5a7;margin-top:8px}
.app{max-width:520px;margin:0 auto;min-height:100%}

.top{
background:linear-gradient(180deg,#0a2038,#07192d);
border-bottom:1px solid #28618e;padding:9px 10px;
box-shadow:0 4px 15px rgba(0,0,0,.2)
}
.toprow{display:block}
.topTitle{font-size:19px;font-weight:bold;display:inline-block;width:58%}
.topRight{display:inline-block;width:40%;text-align:right;color:#8ed2ff;font-size:12px}
.content{padding:10px 10px 76px}

.navbar{
display:flex;gap:5px;padding:7px;background:#061426;
border-bottom:1px solid #224b72;position:sticky;top:0;z-index:45
}
.navtab{flex:1;padding:8px 4px;font-size:11px;background:#0b2947;border-radius:8px}
.navtab:hover{background:#14517d}

.bottom{
position:fixed;left:0;right:0;bottom:0;height:58px;
background:#061426;border-top:1px solid #24587f;
text-align:center;z-index:50
}
.bottom button{width:19%;margin:4px 0;padding:8px 2px;font-size:11px;background:#0b2845}

.sideMenu{
position:fixed;left:0;top:0;bottom:0;width:82%;max-width:320px;
background:#061426;border-right:1px solid #2c638e;z-index:100;
padding:12px;transform:translateX(-105%);transition:.2s;
box-shadow:8px 0 25px #000
}
.sideMenu.show{transform:translateX(0)}
.sideMenu button{width:100%;margin:5px 0;text-align:left}
.sideOverlay{
display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90
}
.sideOverlay.show{display:block}

.menuBtn{
width:48%;margin:1%;min-height:76px;text-align:left;
vertical-align:top;background:linear-gradient(180deg,#0d2947,#081b30);
border:1px solid #245a86
}
.menuBtn b{display:block;font-size:15px;margin-bottom:4px}
.menuBtn span{display:block;color:#80aeca;font-size:11px}

.row{display:block}
.clear{clear:both}
.headerBtn{float:right;margin-left:5px}
.smallBtn{padding:6px 8px;font-size:11px}

.avatar{
width:38px;height:38px;border-radius:50%;vertical-align:middle;
border:1px solid #2d5e8e;background:#0e3559;object-fit:cover
}
.emptyDP{
display:inline-block;position:relative;background:#fff!important;
border:1px solid #ddd;overflow:hidden
}

.userRow{padding:8px 2px;border-bottom:1px solid #173c59;min-height:54px}
.userInfo{display:inline-block;vertical-align:middle;width:58%;padding-left:7px}
.userName{font-weight:bold}
.time{color:#7798b8;font-size:10px;margin-left:5px}
.onlineDot{color:#52e28b;font-size:11px}
.offlineDot{color:#74869a;font-size:11px}

.countBox{
display:inline-block;background:#0a2946;border:1px solid #2a638f;
border-radius:18px;padding:5px 9px;color:#9fd7ff
}

.notice{
padding:8px;background:#08213a;border:1px solid #24577f;
border-radius:8px;color:#9fc4e4;font-size:12px;margin:7px 0
}

.waChat,.chatBox{
background:#030d19;border:1px solid #1c496e;border-radius:14px;
padding:7px;min-height:240px;max-height:430px;overflow:auto
}

.bubble{
max-width:82%;padding:7px 9px;margin:6px 2px;border-radius:10px;
display:inline-block;word-wrap:break-word;line-height:1.35;
border:1px solid rgba(66,133,176,.22)
}
.bubbleRow{text-align:left;clear:both}
.bubbleRow.me{text-align:right}
.bubble.me{background:#104b3c;border-bottom-right-radius:3px}
.bubble.them{background:#112a41;border-bottom-left-radius:3px}
.bubbleName{font-size:10px;color:#8ecbff;margin-bottom:2px}
.bubbleTime{font-size:9px;color:#a9b9c7;margin-left:7px}

.mediaMsg{
max-width:240px;max-height:240px;border-radius:8px;display:block
}

.chatTools{
display:flex;gap:5px;margin-top:7px;background:#06172a;
padding:5px;border:1px solid #1c486c;border-radius:11px
}
.chatTools input{flex:1;border:0}
.chatTools button{min-width:46px}

.chatReply{
display:none;background:#0b2440;border-left:3px solid #52a7df;
padding:7px;border-radius:7px;margin-top:6px;font-size:11px
}
.chatReply.show{display:block}

.msg{border-bottom:1px solid #173754;padding:8px 2px}
.msgText{margin:4px 0 0 45px;line-height:1.35;word-wrap:break-word}
.mention{color:#7ed8ff;font-weight:bold}
.replyBox{
margin:4px 0 5px 45px;padding:5px 7px;border-left:3px solid #4d91c9;
background:#0a2138;border-radius:5px;color:#9fc4e4;font-size:11px
}

.statusItem{padding:9px;border-bottom:1px solid #173c59}
.reactRow button{padding:4px 7px;margin:2px;font-size:12px}
.statusTop{display:flex;gap:7px;margin-bottom:8px}
.statusTop button{flex:1}

.groupMemberBox{
display:none;background:#071a30;border:1px solid #24537e;
border-radius:8px;padding:8px;margin:8px 0
}
.groupMemberBox.show{display:block}

.modal{
position:fixed;left:5%;right:5%;top:15%;background:#071a2e;
border:1px solid #2c638e;border-radius:15px;padding:12px;
z-index:80;box-shadow:0 8px 30px #000
}

@media(max-width:360px){
.topTitle{width:54%}
.topRight{width:44%}
.menuBtn{width:100%;margin:1% 0}
.content{padding-left:7px;padding-right:7px}
}

<script>

var firebaseConfig={
apiKey:"AIzaSyAEqeB2YXk_2A9gZ41WQ_fNiBKiGnzYGc0",
authDomain:"chit-chat-plus-7382b.firebaseapp.com",
projectId:"chit-chat-plus-7382b",
storageBucket:"chit-chat-plus-7382b.firebasestorage.app",
messagingSenderId:"98837732974",
appId:"1:98837732974:web:ff52d3868871c91518507f",
measurementId:"G-T42H2N5Q0Z"
};

var auth=null;
var db=null;
var me=null;
var meProfile=null;
var usersCache=[];
var currentScreen="home";
var currentPrivateUid="";
var currentPrivateName="";
var currentGroupId="";
var currentGroupName="";
var worldUnsub=null;
var privateUnsub=null;
var groupUnsub=null;
var usersUnsub=null;
var notifyUnsub=null;
var authCreateMode=false;
var notificationsEnabled=true;
var blockedByMe=false;
var blockedMe=false;
var recording=null;
var recordingStream=null;
var worldReply=null;
var chatReply=null;
var notifyAudioCtx=null;
var lastNotificationId="";

function $(id){
return document.getElementById(id);
}

function esc(s){
s=s===undefined||s===null?"":String(s);
return s.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#39;");
}

function timeVal(ts){
try{
if(ts&&ts.toMillis)return ts.toMillis();
}catch(e){}
return 0;
}

function tsTime(ts){
var d=new Date();
try{
if(ts&&ts.toDate)d=ts.toDate();
}catch(e){}
var h=d.getHours();
var m=d.getMinutes();
var ap=h>=12?"PM":"AM";
h=h%12;
if(h===0)h=12;
return h+":"+(("0"+m).slice(-2))+" "+ap;
}

function avatarHTML(src,cls,set){
cls=cls||"avatar";

if(set===true&&src&&String(src).trim()!==""){
return '<img class="'+cls+'" src="'+esc(src)+'" alt="DP">';
}

return '<span class="'+cls+' emptyDP"></span>';
}

function msgText(s){
var x=esc(s);
return x.replace(/(^|\s)@([A-Za-z0-9_]{2,30})/g,
'$1<span class="mention">@$2</span>');
}

function usernameEmail(u){
var x=unescape(encodeURIComponent(String(u)));
var h="u";

for(var i=0;i<x.length;i++){
h+=("00"+x.charCodeAt(i).toString(16)).slice(-2);
}

return h+"@chitchatplus.local";
}

function validUsername(u){
u=String(u||"").replace(/^\s+|\s+$/g,"");

if(u.length<2||u.length>30)return false;

for(var i=0;i<u.length;i++){
var c=u.charCodeAt(i);
if(c<32||c===127)return false;
}

return true;
}

function errText(e){
if(!e)return"Unknown error";

var c=e.code||"";

if(c.indexOf("email-already-in-use")>=0)
return"Ye username pehle se bana hua hai.";

if(c.indexOf("wrong-password")>=0)
return"Password ghalat hai.";

if(c.indexOf("user-not-found")>=0)
return"Account nahi mila.";

if(c.indexOf("invalid-credential")>=0)
return"Username ya password ghalat hai.";

if(c.indexOf("weak-password")>=0)
return"Password kam az kam 6 characters ka rakho.";

if(c.indexOf("permission-denied")>=0)
return"Firestore Rules ne access rok diya.";

return(c+" "+(e.message||"")).trim();
}

function setMsg(t,ok){
$("authMsg").className=ok?"ok":"err";
$("authMsg").innerHTML=esc(t);
}

function dismissLoading(){
var l=$("loading");
if(l)l.style.display="none";
}

setTimeout(dismissLoading,1800);

try{
firebase.initializeApp(firebaseConfig);
auth=firebase.auth();
db=firebase.firestore();
try{
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
}catch(e){}
}catch(e){}

function toggleAuthMode(){
authCreateMode=!authCreateMode;

$("authTitle").innerHTML=authCreateMode?
"<b>Create Account</b>":"<b>Login</b>";

$("authBtn").innerHTML=authCreateMode?
"Create Account":"Login";

$("modeBtn").innerHTML=authCreateMode?
"Back to Login":"Create Account";

$("authMsg").innerHTML="";
}

function authAction(){

if(!auth){
setMsg("Firebase ready nahi hai.",false);
return;
}

var u=$("username").value.replace(/^\s+|\s+$/g,"");
var p=$("password").value;

if(!validUsername(u)){
setMsg("Name 2–30 characters ka ho.",false);
return;
}

if(p.length<6){
setMsg("Password kam az kam 6 characters ka hona chahiye.",false);
return;
}

setMsg("Please wait...",true);

if(authCreateMode){

auth.createUserWithEmailAndPassword(
usernameEmail(u),p
).then(function(cr){

me=cr.user;

return db.collection("users").doc(me.uid).set({
uid:me.uid,
username:u,
avatar:"",
avatarSet:false,
online:true,
lastSeen:firebase.firestore.FieldValue.serverTimestamp(),
createdAt:firebase.firestore.FieldValue.serverTimestamp()
});

}).then(function(){

setMsg("Account ban gaya.",true);

}).catch(function(e){

setMsg(errText(e),false);

});

}else{

auth.signInWithEmailAndPassword(
usernameEmail(u),p
).then(function(cr){

me=cr.user;
setMsg("Login ho gaya.",true);

}).catch(function(e){

setMsg(errText(e),false);

});

}
}


auth.onAuthStateChanged(function(user){

if(user){

me=user;

loadMyProfile(function(){

$("auth").className="hide";
$("app").className="app";
$("bottom").className="bottom";

homePage();

setOnline(true);
listenUsers();
listenNotifications();

});

}else{

me=null;

$("auth").className="";
$("app").className="app hide";
$("bottom").className="bottom hide";

}

});


function loadMyProfile(cb){

db.collection("users").doc(me.uid).get().then(function(s){

if(s.exists){

meProfile=s.data();

}else{

meProfile={
uid:me.uid,
username:"User",
avatar:"",
avatarSet:false
};

return db.collection("users").doc(me.uid).set(meProfile);

}

}).then(function(){

if(cb)cb();

}).catch(function(e){

alert(errText(e));

});

}


function setOnline(v){

if(!me)return;

db.collection("users").doc(me.uid).set({
online:v,
lastSeen:firebase.firestore.FieldValue.serverTimestamp()
},{merge:true}).catch(function(){});

}


function listenUsers(){

if(usersUnsub)usersUnsub();

usersUnsub=db.collection("users").onSnapshot(function(s){

usersCache=[];

s.forEach(function(d){
usersCache.push(d.data());
});

updateTop();

if(currentScreen==="users")usersPage();

});

}


function updateTop(){

var x=$("topUser");

if(x&&meProfile){

x.innerHTML="🟢 "+esc(meProfile.username);

}

}


function findUserByUid(uid){

for(var i=0;i<usersCache.length;i++){

if(usersCache[i].uid===uid)
return usersCache[i];

}

return null;
}


function findUser(name){

for(var i=0;i<usersCache.length;i++){

if(usersCache[i].username===name)
return usersCache[i];

}

return null;
}


function isOnline(u){

if(!u||!u.online)return false;

if(u.lastSeen&&u.lastSeen.toMillis){

return Date.now()-u.lastSeen.toMillis()<90000;

}

return true;
}

'<div class="card">'+

function renderPrivateUsers(){

var q=$("privateSearch");
var search=q?q.value.toLowerCase():"";

var h="";

for(var i=0;i<usersCache.length;i++){

var u=usersCache[i];

if(u.uid===me.uid)continue;

if(search&&u.username.toLowerCase().indexOf(search)<0)continue;

h+=
'<div class="userRow">'+
avatarHTML(u.avatar,"avatar",u.avatarSet)+
'<span class="userInfo">'+
'<b>'+esc(u.username)+'</b><br>'+

(isOnline(u)?"● Online":"○ Offline")+
'</span>'+
'</span>'+
'<button class="smallBtn" onclick="openPrivate(\''+
esc(u.uid)+'\',\''+esc(u.username)+'\')">Chat</button>'+
'</div>';

}

$("privateUsers").innerHTML=
h||'<div class="notice">User nahi mila.</div>';

}


function pairId(a,b){

return a<b?a+"_"+b:b+"_"+a;

}

'<div class="card">'+

function updatePrivateOnline(){

var u=findUserByUid(currentPrivateUid);

if($("privateOnline")){

$("privateOnline").innerHTML=u?

function toggleVoice(){

if(recording){

stopVoice();
return;

}

if(!navigator.mediaDevices||
!navigator.mediaDevices.getUserMedia||
!window.MediaRecorder){

alert("Is browser mein voice recording support nahi hai.");
return;

}

navigator.mediaDevices.getUserMedia({
audio:true
}).then(function(stream){

recordingStream=stream;

try{

recording=new MediaRecorder(
stream,
{audioBitsPerSecond:16000}
);

}catch(e){

recording=new MediaRecorder(stream);

}

var parts=[];

recording.ondataavailable=function(e){

if(e.data&&e.data.size)
parts.push(e.data);

};

recording.onstop=function(){

var blob=new Blob(parts,{
type:recording.mimeType||"audio/webm"
});

stream.getTracks().forEach(function(t){

try{t.stop()}catch(e){}

});

recording=null;
recordingStream=null;

if(blob.size>900000){

alert("Voice file bohat bari hai.");
return;

}

var r=new FileReader();

r.onload=function(){

var cid=pairId(me.uid,currentPrivateUid);

db.collection("chats")
.doc(cid)
.collection("messages")
.add({

uid:me.uid,
username:meProfile.username,
avatar:meProfile.avatar||"",
voiceData:r.result,
replyTo:chatReply||null,
createdAt:firebase.firestore.FieldValue.serverTimestamp()

})
.then(function(){

chatReply=null;

addNotification(
currentPrivateUid,
"private",
meProfile.username+" sent a voice message.",
cid
);

});

};

r.readAsDataURL(blob);

};

recording.start();

$("voiceBtn").innerHTML="⏹";

$("voiceInfo").innerHTML=
"Recording... max 8 seconds";

setTimeout(function(){

if(recording)stopVoice();

},8000);

}).catch(function(e){

alert("Microphone permission nahi mili.");

});

}


function stopVoice(){

try{
recording.stop();
}catch(e){}

}

$("voiceBtn").innerHTML="🎙";

}

function playNotificationSound(){

if(!notificationsEnabled)return;

try{

var AC=window.AudioContext||
window.webkitAudioContext;

if(!AC)return;

if(!notifyAudioCtx)
notifyAudioCtx=new AC();

if(notifyAudioCtx.state==="suspended")
notifyAudioCtx.resume();

var o=notifyAudioCtx.createOscillator();
var g=notifyAudioCtx.createGain();

var t=notifyAudioCtx.currentTime;

o.type="sine";

o.frequency.setValueAtTime(
660,t
);

o.frequency.exponentialRampToValueAtTime(
880,t+.12
);

g.gain.setValueAtTime(
.0001,t
);

g.gain.exponentialRampToValueAtTime(
.13,t+.02
);

g.gain.exponentialRampToValueAtTime(
.0001,t+.28
);

o.connect(g);
g.connect(notifyAudioCtx.destination);

o.start(t);
o.stop(t+.3);

}catch(e){}

}
