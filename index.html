<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>Your Chat</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;
 min-height:100%;
 background:#07111f;
 color:#fff;
 font-family:Arial,sans-serif
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hide{display:none!important}

#loading{
 position:fixed;
 inset:0;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#07111f;
 z-index:9999
}
.loadbox{
 width:90%;
 max-width:400px;
 padding:30px 22px;
 text-align:center;
 background:#0c1b2d;
 border:1px solid #21466c;
 border-radius:22px
}
.logo{
 color:#4eb4ff;
 font-size:28px;
 font-weight:bold;
 letter-spacing:1px
}
.spinner{
 width:30px;
 height:30px;
 margin:18px auto;
 border:3px solid #24405d;
 border-top-color:#4eb4ff;
 border-radius:50%;
 animation:spin .8s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}

.small{
 color:#9eb2c8;
 font-size:13px;
 line-height:1.5
}
#error{
 color:#ff9b9b;
 font-size:13px;
 margin-top:10px
}

#auth{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:15px
}
.box{
 width:100%;
 max-width:420px;
 background:#0c1b2d;
 border:1px solid #21466c;
 border-radius:20px;
 padding:20px
}
input,textarea{
 width:100%;
 padding:12px;
 margin:6px 0;
 border-radius:11px;
 border:1px solid #244866;
 background:#081625;
 color:#fff;
 outline:none
}
textarea{min-height:75px}
input:focus,textarea:focus{border-color:#4eb4ff}

.btn{
 width:100%;
 padding:12px;
 margin-top:8px;
 border:0;
 border-radius:11px;
 background:#1677c8;
 color:white;
 font-weight:bold
}
.alt{
 background:#122941;
 border:1px solid #244866
}
.red{background:#a33a3a}

header{
 height:58px;
 padding:0 14px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 background:#0a1828;
 border-bottom:1px solid #173b5a
}
header b{color:#4eb4ff}

main{
 max-width:700px;
 margin:auto;
 padding:12px
}
.card{
 background:#0c1b2d;
 border:1px solid #173b5a;
 border-radius:17px;
 padding:15px;
 margin-bottom:12px
}
.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px
}
.item{
 min-height:90px;
 padding:15px;
 border-radius:15px;
 border:1px solid #1d4a70;
 background:#0d2034;
 color:white;
 text-align:left
}
.item b{
 display:block;
 color:#4eb4ff;
 margin-bottom:7px
}
.msg{
 padding:9px 11px;
 margin:7px 0;
 border-radius:13px;
 background:#10263d;
 max-width:88%
}
.mine{
 margin-left:auto;
 background:#125f96
}
.msg small{
 display:block;
 color:#9eb2c8;
 font-size:10px;
 margin-top:4px
}
.row{
 display:flex;
 gap:8px;
 align-items:center
}
.status{
 min-height:20px;
 color:#9eb2c8;
 font-size:13px;
 margin-top:8px
}
.user{
 padding:12px 0;
 border-bottom:1px solid #17324b
}
.badge{
 background:#143858;
 color:#91d2ff;
 padding:4px 8px;
 border-radius:20px;
 font-size:11px
}
@media(max-width:430px){
 .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<!-- LOADING -->
<div id="loading">
 <div class="loadbox">
  <div class="logo">YOUR CHAT</div>
  <div class="spinner"></div>
  <div id="loadText" class="small">
   Starting Your Chat...
  </div>
  <div id="error" class="hide"></div>
  <button id="retry" class="btn hide"
   onclick="location.reload()">Retry</button>
 </div>
</div>

<!-- LOGIN -->
<div id="auth" class="hide">
 <div class="box">
  <div class="logo">YOUR CHAT</div>

  <p class="small">
   Login or create your account.
  </p>

  <input id="username"
   maxlength="24"
   placeholder="Username">

  <input id="password"
   type="password"
   minlength="6"
   placeholder="Password">

  <button class="btn" onclick="login()">
   Login
  </button>

  <button class="btn alt"
   onclick="createAccount()">
   Create Account
  </button>

  <div id="authStatus" class="status"></div>
 </div>
</div>

<!-- APP -->
<div id="app" class="hide">

<header>
 <b>YOUR CHAT</b>
 <span id="userName" class="badge">User</span>
</header>

<main id="main"></main>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
"use strict";

/* =========================
   FIREBASE CONFIG
   ========================= */

const firebaseConfig={
 apiKey:"AIzaSyBmyYlEtZCm7yDsmqAsqdRNmxBjPSiCyQ",
 authDomain:"your-chat-24913.firebaseapp.com",
 projectId:"your-chat-24913",
 storageBucket:"your-chat-24913.firebasestorage.app",
 messagingSenderId:"700520326360",
 appId:"1:700520326360:web:a3dc5fd4e36b54dbb563ad",
 measurementId:"G-7JBWVDK838"
};

let auth=null;
let db=null;
let me=null;

const $=id=>document.getElementById(id);

function emailFromName(name){
 return name.toLowerCase()+"@yourchat.local";
}

function validName(name){
 return /^[A-Za-z0-9_]{3,24}$/.test(name);
}

function clean(v){
 return String(v||"").replace(/[&<>"']/g,x=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#039;"
 }[x]));
}

function loadMessage(text){
 $("loadText").textContent=text;
}

function showError(text){
 $("error").textContent=text;
 $("error").classList.remove("hide");
 $("retry").classList.remove("hide");
 $("loadText").textContent="Your Chat could not start.";
}

function showAuth(){
 $("loading").classList.add("hide");
 $("app").classList.add("hide");
 $("auth").classList.remove("hide");
}

function showApp(){
 $("loading").classList.add("hide");
 $("auth").classList.add("hide");
 $("app").classList.remove("hide");
}

/* =========================
   FIREBASE START
   ========================= */

try{

 if(!window.firebase){
  throw new Error("Firebase library did not load.");
 }

 firebase.initializeApp(firebaseConfig);

 auth=firebase.auth();
 db=firebase.firestore();

 auth.onAuthStateChanged(async user=>{

  me=user;

  if(user){

   try{
    await db.collection("users")
    .doc(user.uid)
    .set({
     uid:user.uid,
     online:true,
     lastSeen:
      firebase.firestore.FieldValue.serverTimestamp()
    },{merge:true});
   }catch(e){
    console.log(e);
   }

   showApp();
   home();

  }else{

   showAuth();
  }

 });

}catch(e){

 console.error(e);
 showError(
  e.message||
  "Firebase could not start."
 );
}


/* =========================
   CREATE ACCOUNT
   ========================= */

async function createAccount(){

 const name=$("username").value.trim();
 const pass=$("password").value;

 if(!validName(name)){
  $("authStatus").textContent=
   "Username 3-24 letters, numbers or _ only.";
  return;
 }

 if(pass.length<6){
  $("authStatus").textContent=
   "Password must be 6 characters or more.";
  return;
 }

 $("authStatus").textContent=
  "Creating account...";

 try{

  const result=
   await auth.createUserWithEmailAndPassword(
    emailFromName(name),
    pass
   );

  await db.collection("users")
  .doc(result.user.uid)
  .set({
   uid:result.user.uid,
   username:name,
   usernameLower:name.toLowerCase(),
   online:true,
   createdAt:
    firebase.firestore.FieldValue.serverTimestamp()
  });

  $("authStatus").textContent=
   "Account created.";

 }catch(e){

  console.error(e);

  $("authStatus").textContent=
   e.code==="auth/email-already-in-use"
   ?"Username already exists."
   :
   e.message||"Account creation failed.";
 }
}


/* =========================
   LOGIN
   ========================= */

async function login(){

 const name=$("username").value.trim();
 const pass=$("password").value;

 if(!validName(name)){
  $("authStatus").textContent=
   "Enter a valid username.";
  return;
 }

 if(pass.length<6){
  $("authStatus").textContent=
   "Password must be 6 characters or more.";
  return;
 }

 $("authStatus").textContent=
  "Logging in...";

 try{

  await auth.signInWithEmailAndPassword(
   emailFromName(name),
   pass
  );

 }catch(e){

  console.error(e);

  $("authStatus").textContent=
   "Login failed: "+
   (e.message||"Check username/password.");
 }
}


/* =========================
   HOME
   ========================= */

function home(){

 getMyName();

 $("main").innerHTML=`

 <div class="card">

  <h2>Welcome to Your Chat 👋</h2>

  <p class="small">
   Select an option.
  </p>

  <div class="grid">

   <button class="item"
    onclick="worldChat()">
    <b>🌍 World Chat</b>
    Chat with everyone
   </button>

   <button class="item"
    onclick="onlineUsers()">
    <b>🟢 Online Users</b>
    See online users
   </button>

   <button class="item"
    onclick="allUsers()">
    <b>👤 All Users</b>
    Find users
   </button>

   <button class="item"
    onclick="groups()">
    <b>👥 Group Chat</b>
    Open groups
   </button>

   <button class="item"
    onclick="privateInfo()">
    <b>💬 Private Chat</b>
    Private messages
   </button>

   <button class="item"
    onclick="settings()">
    <b>⚙️ Settings</b>
    Account settings
   </button>

  </div>

 </div>

 <button class="btn red"
  onclick="logout()">
  Log Out
 </button>

 `;
}


/* =========================
   MY NAME
   ========================= */

async function getMyName(){

 try{

  const d=
   await db.collection("users")
   .doc(me.uid)
   .get();

  $("userName").textContent=
   d.data()?.username||
   "User";

 }catch(e){

  $("userName").textContent="User";
 }
}


/* =========================
   WORLD CHAT
   ========================= */

function worldChat(){

 $("main").innerHTML=`

 <button class="btn alt"
  onclick="home()">
  ← Home
 </button>

 <div class="card">

  <h2>🌍 World Chat</h2>

  <div id="worldMessages"
   style="max-height:55vh;overflow:auto">
   Loading messages...
  </div>

  <textarea
   id="worldText"
   maxlength="1000"
   placeholder="Write message...">
  </textarea>

  <button class="btn"
   onclick="sendWorld()">
   Send
  </button>

  <div id="worldStatus"
   class="status">
  </div>

 </div>
 `;

 db.collection("worldMessages")
 .orderBy("createdAt","asc")
 .limit(100)
 .onSnapshot(

 snap=>{

  let html="";

  snap.forEach(doc=>{

   const m=doc.data();

   html+=`

   <div class="msg ${
    m.uid===me.uid?"mine":""
   }">

    <b>
     ${clean(m.username||"User")}
    </b>

    <br>

    ${clean(m.text)}

    <small>
     ${
      m.createdAt?.toDate
      ?
      m.createdAt.toDate().toLocaleString()
      :
      "Sending..."
     }
    </small>

   </div>

   `;
  });

  $("worldMessages").innerHTML=
   html||
   `<p class="small">
    No messages yet.
   </p>`;

 },

 error=>{

  console.error(error);

  $("worldMessages").innerHTML=
   `<p class="small">
    World Chat unavailable.
    Check Firestore rules.
   </p>`;
 }
 );
}


async function sendWorld(){

 const box=$("worldText");
 const text=box.value.trim();

 if(!text)return;

 try{

  const u=
   await db.collection("users")
   .doc(me.uid)
   .get();

  await db.collection("worldMessages")
  .add({

   uid:me.uid,

   username:
    u.data()?.username||"User",

   text:text,

   createdAt:
    firebase.firestore.FieldValue.serverTimestamp()
  });

  box.value="";

 }catch(e){

  console.error(e);

  $("worldStatus").textContent=
   "Message failed. Check Firestore rules.";
 }
}


/* =========================
   USERS
   ========================= */

function onlineUsers(){
 showUsers(false);
}

function allUsers(){
 showUsers(true);
}

function showUsers(all){

 $("main").innerHTML=`

 <button class="btn alt"
  onclick="home()">
  ← Home
 </button>

 <div class="card">

  <h2>
   ${all?"👤 All Users":"🟢 Online Users"}
  </h2>

  <div id="userList">
   Loading...
  </div>

 </div>
 `;

 db.collection("users")
 .limit(100)
 .get()

 .then(snap=>{

  let html="";

  snap.forEach(doc=>{

   const u=doc.data();

   if(u.uid===me.uid)return;

   if(!all && u.online!==true)return;

   html+=`

   <div class="user">

    <b>
     ${clean(u.username||"User")}
    </b>

    <span class="badge">
     ${u.online?"Online":"Offline"}
    </span>

    <button class="btn"
     onclick="privateChat(
      '${clean(u.uid)}',
      '${clean(u.username||"User")}'
     )">
     Private Chat
    </button>

   </div>
   `;
  });

  $("userList").innerHTML=
   html||
   `<p class="small">
    No users found.
   </p>`;

 })

 .catch(e=>{

  console.error(e);

  $("userList").textContent=
   "Users could not be loaded.";
 });
}


/* =========================
   PRIVATE CHAT
   ========================= */

function privateInfo(){

 $("main").innerHTML=`

 <button class="btn alt"
  onclick="home()">
  ← Home
 </button>

 <div class="card">

  <h2>💬 Private Chat</h2>

  <p class="small">
   Open All Users and choose a user
   to start a private chat.
  </p>

  <button class="btn"
   onclick="allUsers()">
   Find Users
  </button>

 </div>

 `;
}


function chatId(a,b){
 return [a,b].sort().join("_");
}


function privateChat(uid,name){

 const id=chatId(me.uid,uid);

 $("main").innerHTML=`

 <button class="btn alt"
  onclick="allUsers()">
  ← Users
 </button>

 <div class="card">

  <h2>💬 ${clean(name)}</h2>

  <div id="privateMessages"
   style="max-height:55vh;overflow:auto">
   Loading...
  </div>

  <textarea
   id="privateText"
   maxlength="1000"
   placeholder="Private message...">
  </textarea>

  <button class="btn"
   onclick="sendPrivate(
    '${clean(id)}',
    '${clean(uid)}'
   )">
   Send
  </button>

 </div>
 `;

 db.collection("chats")
 .doc(id)
 .collection("messages")
 .orderBy("createdAt","asc")
 .limit(100)
 .onSnapshot(

 snap=>{

  let html="";

  snap.forEach(doc=>{

   const m=doc.data();

   html+=`

   <div class="msg ${
    m.uid===me.uid?"mine":""
   }">

    <b>
     ${clean(m.username||"User")}
    </b>

    <br>

    ${clean(m.text||"")}

    <small>
     ${
      m.createdAt?.toDate
      ?
      m.createdAt.toDate().toLocaleString()
      :
      "Sending..."
     }
    </small>

   </div>
   `;
  });

  $("privateMessages").innerHTML=
   html||
   `<p class="small">
    No messages yet.
   </p>`;

 },

 error=>{

  console.error(error);

  $("privateMessages").innerHTML=
   `<p class="small">
    Private Chat unavailable.
   </p>`;
 }
 );
}


async function sendPrivate(id,uid){

 const box=$("privateText");
 const text=box.value.trim();

 if(!text)return;

 try{

  const u=
   await db.collection("users")
   .doc(me.uid)
   .get();

  await db.collection("chats")
  .doc(id)
  .collection("messages")
  .add({

   uid:me.uid,
   toUid:uid,

   username:
    u.data()?.username||"User",

   text:text,

   createdAt:
    firebase.firestore.FieldValue.serverTimestamp()
  });

  box.value="";

 }catch(e){

  console.error(e);

  alert(
   "Private message failed."
  );
 }
}


/* =========================
   GROUPS
   ========================= */

function groups(){

 $("main").innerHTML=`

 <button class="btn alt"
  onclick="home()">
  ← Home
 </button>

 <div class="card">

  <h2>👥 Groups</h2>

  <input
   id="groupName"
   maxlength="40"
   placeholder="Group name">

  <button class="btn"
   onclick="createGroup()">
   Create Group
  </button>

 </div>

 <div class="card">

  <div id="groupsList">
   Loading...
  </div>

 </div>
 `;

 db.collection("groups")
 .limit(50)
 .get()
 .then(snap=>{

  let html="";

  snap.forEach(doc=>{

   const g=doc.data();

   html+=`

   <div class="user">

    <b>
     ${clean(g.name||"Group")}
    </b>

    <button class="btn"
     onclick="openGroup(
      '${clean(doc.id)}',
      '${clean(g.name||"Group")}'
     )">
     Open
    </button>

   </div>
   `;
  });

  $("groupsList").innerHTML=
   html||
   `<p class="small">
    No groups yet.
   </p>`;

 })
 .catch(e=>{

  console.error(e);

  $("groupsList").textContent=
   "Groups unavailable.";
 });
}


async function createGroup(){

 const name=
  $("groupName").value.trim();

 if(!name)return;

 try{

  const ref=
   await db.collection("groups")
   .add({

    name:name,

    ownerUid:me.uid,

    createdAt:
     firebase.firestore.FieldValue.serverTimestamp()
   });

  openGroup(ref.id,name);

 }catch(e){

  console.error(e);

  alert(
   "Group creation failed."
  );
 }
}


function openGroup(id,name){

 $("main").innerHTML=`

 <button class="btn alt"
  onclick="groups()">
  ← Groups
 </button>

 <div class="card">

  <h2>👥 ${clean(name)}</h2>

  <div id="groupMessages"
   style="max-height:55vh;overflow:auto">
   Loading...
  </div>

  <textarea
   id="groupText"
   maxlength="1000"
   placeholder="Group message...">
  </textarea>

  <button class="btn"
   onclick="sendGroup('${clean(id)}')">
   Send
  </button>

 </div>
 `;

 db.collection("groups")
 .doc(id)
 .collection("messages")
 .orderBy("createdAt","asc")
 .limit(100)
 .onSnapshot(

 snap=>{

  let html="";

  snap.forEach(doc=>{

   const m=doc.data();

   html+=`

   <div class="msg ${
    m.uid===me.uid?"mine":""
   }">

    <b>
     ${clean(m.username||"User")}
    </b>

    <br>

    ${clean(m.text||"")}

   </div>
   `;
  });

  $("groupMessages").innerHTML=
   html||
   `<p class="small">
    No messages yet.
   </p>`;

 },

 error=>{

  console.error(error);

  $("groupMessages").textContent=
   "Group Chat unavailable.";
 }
 );
}


async function sendGroup(id){

 const box=$("groupText");
 const text=box.value.trim();

 if(!text)return;

 try{

  const u=
   await db.collection("users")
   .doc(me.uid)
   .get();

  await db.collection("groups")
  .doc(id)
  .collection("messages")
  .add({

   uid:me.uid,

   username:
    u.data()?.username||"User",

   text:text,

   createdAt:
    firebase.firestore.FieldValue.serverTimestamp()
  });

  box.value="";

 }catch(e){

  console.error(e);

  alert(
   "Group message failed."
  );
 }
}


/* =========================
   SETTINGS
   ========================= */

function settings(){

 $("main").innerHTML=`

 <button class="btn alt"
  onclick="home()">
  ← Home
 </button>

 <div class="card">

  <h2>⚙️ Settings</h2>

  <p class="small">
   Account
  </p>

  <p class="small">
   User ID: ${clean(me.uid)}
  </p>

 </div>

 <div class="card">

  <h3>🔒 Privacy & Security</h3>

  <p class="small">
   Your Chat uses Firebase Authentication
   and Firestore security rules.
  </p>

 </div>

 <div class="card">

  <h3>🔔 Notifications</h3>

  <p class="small">
   Notification settings can be added later.
  </p>

 </div>

 <div class="card">

  <h3>ℹ️ About</h3>

  <p class="small">
   YOUR CHAT<br>
   Lightweight Android/KaiOS build.
  </p>

 </div>

 <button class="btn red"
  onclick="logout()">
  Log Out
 </button>

 `;
}


/* =========================
   LOGOUT
   ========================= */

async function logout(){

 try{

  if(me){

   await db.collection("users")
   .doc(me.uid)
   .set({

    online:false,

    lastSeen:
     firebase.firestore.FieldValue.serverTimestamp()

   },{merge:true});
  }

  await auth.signOut();

 }catch(e){

  console.error(e);

  location.reload();
 }
}

</script>

</body>
 </html>
