uStatus=db.collection('statuses').orderBy('createdAt','desc').limit(40).onSnapshot(function(s){var m={};s.forEach(function(d){var x=d.data();if(x.uid!==me.uid&&fresh(x)&&!m[x.uid])m[x.uid]=Object.assign({id:d.id},x)});var l=$('statusList');if(l)l.innerHTML=Object.keys(m).map(function(k){var x=m[k],u=users.find(function(a){return a.uid===k})||x;return'<div class="status" onclick="viewStatus(\''+esc(k)+'\')">'+avatar(u)+'<div><b>'+esc(u.username||x.username)+'</b><div class="sub">'+esc(x.kind||'status')+' • '+esc(time(x.createdAt))+'</div></div></div>'}).join('')||'<div class="empty">No recent status</div>'},function(e){var l=$('statusList');if(l)l.innerHTML='<div class="empty">Status: '+esc(e.message)+'</div>'})}
function addStatus(){modal('<h3>Add Status</h3><textarea id="st" rows="4" placeholder="Write a status"></textarea><div class="mrow"><button class="no" onclick="closeModal()">Cancel</button><button class="ok" onclick="postStatus()">Post Text</button></div><div class="mrow"><button class="ok" onclick="closeModal();$(\'statusImg\').click()">Photo Status</button><button class="ok" onclick="closeModal();$(\'statusVid\').click()">Video Status</button></div>')}
function addSt(o){return db.collection('statuses').add(Object.assign({uid:me.uid,username:me.username,avatar:me.avatar||'',createdAt:ts()},o)).then(function(){toast('Status posted');if(scr==='status')statusList()}).catch(function(e){toast(e.message)})}
function postStatus(){var v=$('st').value.trim();if(!v)return toast('Write something');addSt({kind:'text',text:v}).then(closeModal)}
$('statusImg').onchange=function(){var f=this.files[0];this.value='';if(f)upload(f,'image',function(u){addSt({kind:'photo',imageUrl:u})})};
$('statusVid').onchange=function(){var f=this.files[0];this.value='';if(f)upload(f,'video',function(u){addSt({kind:'video',videoUrl:u})})};
function viewStatus(uid){db.collection('statuses').where('uid','==',uid).limit(30).get().then(function(s){var a=s.docs.map(function(d){return Object.assign({id:d.id},d.data())}).filter(fresh).sort(function(x,y){return(y.createdAt&&y.createdAt.seconds||0)-(x.createdAt&&x.createdAt.seconds||0)});if(!a.length)return toast('No status');var x=a[0],c=x.text?'<div style="font-size:22px">'+esc(x.text)+'</div>':x.imageUrl?'<img src="'+esc(x.imageUrl)+'" style="max-width:100%">':'<video controls src="'+esc(x.videoUrl||'')+'" style="max-width:100%"></video>';modal('<h3>'+esc(x.username||'Status')+'</h3><div style="background:#111;color:#fff;padding:15px;min-height:220px">'+c+'</div><div class="mrow"><button class="ok" onclick="statusReact(\''+esc(x.id)+'\');closeModal()">React</button>'+(uid===me.uid?'<button class="no" onclick="delStatus(\''+esc(x.id)+'\')">Delete</button>':'')+'<button class="no" onclick="closeModal()">Close</button></div>')}).catch(function(e){toast(e.message)})}
function delStatus(id){db.collection('statuses').doc(id).delete().then(function(){closeModal();toast('Status deleted')}).catch(function(e){toast(e.message)})}
function statusReact(id){var r=prompt('Reaction','❤️');if(!r)return;db.collection('statusReactions').doc(id+'_'+me.uid).set({statusId:id,uid:me.uid,reaction:r,createdAt:ts()},{merge:true}).then(function(){toast('Reaction saved')}).catch(function(e){toast(e.message)})}

/* ---------- SETTINGS ---------- */
function settings(){menus();var m=document.createElement('div');m.className='settings';m.innerHTML='<button onclick="menus();profileMe()">Edit Profile</button><button onclick="menus();lockMenu()">App Lock</button><button onclick="toggleSpam()">Spam Protection ['+(spam?'ON':'OFF')+']</button><button onclick="menus();themeMenu()">Change Chat BG</button><button onclick="toggleNotice()">Notifications ['+(notice?'ON':'OFF')+']</button><button onclick="menus();blockedList()">Blocked Users</button><button onclick="logout()">Logout</button>';document.body.appendChild(m)}
function lockMenu(){var has=false;try{has=!!localStorage.getItem('yc_lock')}catch(e){}modal('<h3>App Lock</h3><input id="lockPass" type="password" placeholder="4+ character password"><div class="mrow"><button class="no" onclick="closeModal()">Cancel</button>'+(has?'<button class="no" onclick="removeLock()">Remove</button>':'')+'<button class="ok" onclick="setLock()">Save</button></div>')}
function setLock(){var p=$('lockPass').value;if(p.length<4)return toast('Use 4+ characters');try{localStorage.setItem('yc_lock',p)}catch(e){}closeModal();toast('App Lock enabled')}
function removeLock(){try{localStorage.removeItem('yc_lock')}catch(e){}closeModal();toast('App Lock removed')}
function themeMenu(){modal('<h3>Change Chat BG</h3><div class="themes">'+themes.map(function(t){return'<button data-t="'+esc(t[0])+'" onclick="theme(this.dataset.t);savePrefs();closeModal();toast(this.dataset.t+\' applied\')">'+esc(t[0])+'</button>'}).join('')+'</div>')}
function blockedList(){db.collection('blocks').where('uid','==',me.uid).get().then(function(s){var a=[];s.forEach(function(d){var x=d.data();a.push(users.find(function(z){return z.uid===x.blockedUid})||{username:x.blockedUsername||'User',uid:x.blockedUid})});var rows=a.map(function(u){return'<div style="padding:8px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center"><span>'+esc(u.username)+'</span><button class="no" data-uid="'+esc(u.uid)+'" onclick="unblockUser(this.dataset.uid)">Unblock</button></div>'}).join('');modal('<h3>Blocked Users</h3>'+(rows||'<div class="empty">No blocked users</div>')+'<div class="mrow"><button class="ok" onclick="closeModal()">Close</button></div>')}).catch(function(){toast('Could not load blocked users')})}
function unblockUser(uid){db.collection('blocks').doc(me.uid+'_'+uid).delete().then(function(){toast('User unblocked');blockedList()}).catch(function(e){toast(e.message)})}
function logout(){menus();var u=me&&me.uid,p=u?db.collection('users').doc(u).set({online:false,lastSeen:ts()},{merge:true}).catch(function(){}):Promise.resolve();p.then(function(){closeChat();return auth.signOut()})}

/* ---------- BUTTONS ---------- */
$('chatTab').onclick=function(){home()};
$('statusTab').onclick=function(){statusList()};
$('k1').onclick=function(){if(!$('chat').classList.contains('hide')){if(mode==='private')privateMenu();else if(mode==='world')worldMenu();else if(mode==='group')groupMenu()}else settings()};
$('k2').onclick=function(){if(!$('chat').classList.contains('hide')){if(mode==='private')voice();else if(mode==='world')sendWorld();else if(mode==='group')sendGroup()}else if(scr==='status')addStatus();else online()};
$('k3').onclick=function(){if(!$('chat').classList.contains('hide'))closeChat();else home()};
$('loginBtn').onclick=function(){var n=$('user').value.trim(),p=$('pass').value;if(!n||!p){$('err').textContent='Enter username and password';return}$('err').textContent='Connecting…';auth.signInWithEmailAndPassword(email(n),p).catch(function(e){$('err').textContent=fe(e)})};
$('signupBtn').onclick=function(){var n=$('user').value.trim(),p=$('pass').value;if(n.length<3||p.length<6){$('err').textContent='Username 3+ chars, password 6+ chars';return}$('err').textContent='Creating account…';auth.createUserWithEmailAndPassword(email(n),p).then(function(c){if(me&&me.uid===c.user.uid)me.username=n;return db.collection('users').doc(c.user.uid).set({uid:c.user.uid,username:n,avatar:'',online:true,createdAt:ts()},{merge:true})}).catch(function(e){$('err').textContent=fe(e)})};
$('pass').addEventListener('keydown',function(e){if(e.key==='Enter')$('loginBtn').click()});
window.addEventListener('online',function(){if(db)db.enableNetwork().catch(function(){});if(me&&started)toast('Back online')});
window.addEventListener('offline',function(){toast('Internet connection lost')});

/* loading screen: exactly 2 seconds */
setTimeout(function(){loaded=true;if(authIn&&me)start();else if(window.authDone&&!authIn)showLogin()},2000);
prefs();init();
</script></body></html>
