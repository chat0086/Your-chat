h+='<div class="row">'+avatar(u)+'<div class="name">'+esc(u.username)+'<div class="sub">Blocked</div></div><button class="blockAction" onclick="unblockUser(\''+esc(x.blockedUid)+'\')">Unblock</button></div>'
});
$('mainScreen').innerHTML=h
}).catch(function(e){$('mainScreen').innerHTML='<div class="empty">Blocked Users: '+esc(e.message)+'</div>'})
}

function showBlockedNotice(){
if(!currentPeer)return;
$('chatView').classList.remove('hide');
$('chatView').innerHTML='<div class="chatHead"><button class="back" onclick="closeChat()">‹</button><div class="chatTitle">'+esc(currentPeer.username)+'</div><button class="back" onclick="chatMenu()">⋮</button></div><div class="empty" style="flex:1;display:flex;align-items:center;justify-content:center;font-weight:700">You have blocked '+esc(currentPeer.username)+'.</div><div class="chatBottom"><span>Menu</span><b>Blocked</b><span>Options</span></div>'
}

function isBlockedForMe(uid,cb){
db.collection('blocks').doc(blockDocId(me.uid,uid)).get().then(function(s){cb(s.exists)}).catch(function(){cb(false)})
}

function isBlockedByPeer(uid,cb){
db.collection('blocks').doc(blockDocId(uid,me.uid)).get().then(function(s){cb(s.exists)}).catch(function(){cb(false)})
}

function profileModal(){
var h='<div class="modalBox"><h3>App Profile</h3>'+avatar(me)+'<p><b>'+esc(me.username)+'</b></p><input id="dpUrl" placeholder="Paste image URL or upload below"><input id="dpFile" type="file" accept="image/*"><div class="modalBtns"><button class="no" onclick="closeModal()">Cancel</button><button class="ok" onclick="saveProfile()">Save DP</button></div></div>';
$('modal').innerHTML=h;$('modal').classList.remove('hide')
}

function closeModal(){$('modal').classList.add('hide');$('modal').innerHTML=''}

function saveProfile(){
var f=$('dpFile').files[0],url=$('dpUrl').value.trim();
if(f)cloudUpload(f,'image',function(u){db.collection('users').doc(me.uid).set({avatar:u},{merge:true}).then(function(){me.avatar=u;closeModal();renderChatList()})},function(e){toast(e)});
else if(url)db.collection('users').doc(me.uid).set({avatar:url},{merge:true}).then(function(){me.avatar=url;closeModal();renderChatList()});
else toast('Select an image')
}

function addStatus(){toast('Status: use text/image/video from the status area')}

window.openPrivateByUid=function(uid){var p=users.find(function(x){return x.uid===uid});if(p)openPrivate(p)};

function openPrivate(p){
currentPeer=p;currentChatId=chatId(me.uid,p.uid);
isBlockedForMe(p.uid,function(mine){
if(mine){showBlockedNotice();return}
isBlockedByPeer(p.uid,function(theirs){
if(theirs){
$('chatView').classList.remove('hide');
$('chatView').innerHTML='<div class="chatHead"><button class="back" onclick="closeChat()">‹</button><div class="chatTitle">'+esc(p.username)+'</div><button class="back" onclick="chatMenu()">⋮</button></div><div class="empty" style="flex:1;display:flex;align-items:center;justify-content:center;font-weight:700">'+esc(p.username)+' has blocked you.</div><div class="chatBottom"><span>Menu</span><b>Blocked</b><span>Options</span></div>';
return
}
openPrivateUI()
})
})
}

function openPrivateUI(){
db.collection('chats').doc(currentChatId).set({unread:(function(){var o={};o[me.uid]=0;return o})()},{merge:true}).then(function(){renderChatList()}).catch(function(){});
$('chatView').classList.remove('hide');
$('chatView').innerHTML='<div class="chatHead"><button class="back" onclick="closeChat()">‹</button>'+avatar(currentPeer)+'<div class="chatTitle">'+esc(currentPeer.username)+'</div><span class="online">'+(currentPeer.online?'online':'offline')+'</span><button class="back" onclick="chatMenu()">⋮</button></div><div id="privateMsgs" class="messages" style="background:#f4efec"></div><div id="typingLine" class="typingLine hide" aria-live="polite"><span class="typingName"></span><span class="typingDots"><i></i><i></i><i></i></span></div><div class="composer"><button class="iconBtn" onclick="privateAttach()">+</button><input id="privateInput" placeholder="Type a message…" oninput="privateTyping()" onkeydown="if(event.key===\'Enter\')sendPrivateText()"><button class="iconBtn" onclick="sendPrivateText()">➤</button></div><div class="chatBottom"><span>Menu</span><b>SEND</b><span>Options</span></div>';
listenPrivate();listenTyping()
}

function closeChat(){
stopTyping();
if(unsubMsgs){unsubMsgs();unsubMsgs=null}
if(typingUnsub){typingUnsub();typingUnsub=null}
clearTimeout(typingTimer);
$('chatView').classList.add('hide');
currentPeer=null;currentChatId=null;renderChatList()
}

function listenPrivate(){
if(unsubMsgs)unsubMsgs();
unsubMsgs=db.collection('chats').doc(currentChatId).collection('messages').orderBy('createdAt','desc').limit(12).onSnapshot(function(s){
var arr=[];s.forEach(function(d){arr.push(d.data())});arr.reverse();
$('privateMsgs').innerHTML=arr.map(msgHtml).join('')||'<div class="empty">No messages</div>';
$('privateMsgs').scrollTop=$('privateMsgs').scrollHeight
})
}

function privateTyping(){
if(!currentPeer||!me||!currentChatId)return;
clearTimeout(typingTimer);
db.collection('typing').doc(currentChatId+'_'+me.uid).set({uid:me.uid,toUid:currentPeer.uid,username:me.username,typing:true,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}).catch(function(){});
typingTimer=setTimeout(stopTyping,1800)
}

function stopTyping(){
clearTimeout(typingTimer);
if(!me||!currentChatId)return;
db.collection('typing').doc(currentChatId+'_'+me.uid).set({uid:me.uid,toUid:currentPeer?currentPeer.uid:'',username:me.username,typing:false,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}).catch(function(){})
}

function listenTyping(){
if(typingUnsub)typingUnsub();
if(!currentChatId||!me)return;
typingUnsub=db.collection('typing').where('toUid','==',me.uid).onSnapshot(function(s){
var active=null,now=Date.now();
s.forEach(function(d){
var x=d.data(),t=x.updatedAt&&x.updatedAt.toMillis?x.updatedAt.toMillis():now;
if(x.typing&&x.uid!==me.uid&&t>now-3500)active=x
});
var line=$('typingLine');if(!line)return;
if(active&&currentPeer&&active.uid===currentPeer.uid){
line.classList.remove('hide');line.querySelector('.typingName').textContent=active.username+' is typing'
}else line.classList.add('hide')
},function(){})
}

function msgHtml(x){
var mine=x.uid===me.uid,body='';
if(x.text)body+='<div>'+esc(x.text)+'</div>';
if(x.imageUrl)body+='<img class="media" src="'+esc(x.imageUrl)+'">';
if(x.videoUrl)body+='<video class="media" controls src="'+esc(x.videoUrl)+'"></video>';
if(x.voiceUrl)body+='<audio class="voice" controls src="'+esc(x.voiceUrl)+'"></audio>';
var t=x.createdAt&&x.createdAt.toDate?x.createdAt.toDate().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';
return'<div class="bubble '+(mine?'mine':'their')+'">'+body+'<span class="time">'+esc(t)+'</span></div>'
}

window.sendPrivateText=function(){
stopTyping();
var i=$('privateInput'),v=i&&i.value.trim();
if(!v||!currentPeer)return;
i.value='';
var ref=db.collection('chats').doc(currentChatId);
ref.collection('messages').add({uid:me.uid,toUid:currentPeer.uid,username:me.username,text:v,createdAt:firebase.firestore.FieldValue.serverTimestamp()}).then(function(){
return db.runTransaction(function(tx){
return tx.get(ref).then(function(s){
var d=s.exists?s.data():{},u=d.unread||{};
u[currentPeer.uid]=Number(u[currentPeer.uid]||0)+1;u[me.uid]=0;
tx.set(ref,{users:[me.uid,currentPeer.uid],lastText:v,lastAt:firebase.firestore.FieldValue.serverTimestamp(),unread:u},{merge:true})
})
})
}).catch(function(e){toast('Send failed: '+e.message)});
};

function privateAttach(){
var h='<div class="menu" id="attachMenu"><button onclick="pickImage()">📷 Image</button><button onclick="pickVideo()">🎥 Video</button><button onclick="startVoice()">🎤 Voice</button><button onclick="closeAttach()">Cancel</button></div>';
$('chatView').insertAdjacentHTML('beforeend',h)
}

window.closeAttach=function(){var e=document.getElementById('attachMenu');if(e)e.remove()};
window.pickImage=function(){$('imageFile').click();closeAttach()};
window.pickVideo=function(){$('videoFile').click();closeAttach()};

$('imageFile').addEventListener('change',function(){
if(this.files[0])cloudUpload(this.files[0],'image',function(u){sendMedia({imageUrl:u})},function(e){toast(e)});
this.value=''
});

$('videoFile').addEventListener('change',function(){
if(this.files[0])cloudUpload(this.files[0],'video',function(u){sendMedia({videoUrl:u})},function(e){toast(e)});
this.value=''
});

function sendMedia(extra){
var d=Object.assign({uid:me.uid,toUid:currentPeer.uid,username:me.username,createdAt:firebase.firestore.FieldValue.serverTimestamp()},extra);
var ref=db.collection('chats').doc(currentChatId);
ref.collection('messages').add(d).then(function(){
var preview=extra.imageUrl?'📷 Image':extra.videoUrl?'🎥 Video':'🎤 Voice';
return db.runTransaction(function(tx){
return tx.get(ref).then(function(s){
var data=s.exists?s.data():{},u=data.unread||{};
u[currentPeer.uid]=Number(u[currentPeer.uid]||0)+1;u[me.uid]=0;
tx.set(ref,{users:[me.uid,currentPeer.uid],lastText:preview,lastAt:firebase.firestore.FieldValue.serverTimestamp(),unread:u},{merge:true})
})
})
}).catch(function(e){toast('Media send failed: '+e.message)})
}

function startVoice(){
if(rec){try{rec.stop()}catch(e){}return}
closeAttach();
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){$('audioFile').click();return}
navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
recChunks=[];var opts='audio/webm;codecs=opus';
try{rec=new MediaRecorder(stream,{mimeType:opts})}catch(e){try{rec=new MediaRecorder(stream)}catch(e2){stream.getTracks().forEach(function(t){t.stop()});toast('Voice recording not supported');return}}
rec.ondataavailable=function(e){if(e.data&&e.data.size)recChunks.push(e.data)};
rec.onstop=function(){
var mime=rec&&rec.mimeType?rec.mimeType:'audio/webm';
stream.getTracks().forEach(function(t){t.stop()});
var b=new Blob(recChunks,{type:mime});rec=null;
if(b.size)cloudUpload(b,'voice',function(u){sendMedia({voiceUrl:u})},function(e){toast(e)});
else toast('Voice recording is empty')
};
rec.start();toast('Recording… open + and tap Voice again to stop');setTimeout(function(){if(rec)rec.stop()},60000)
}).catch(function(){toast('Microphone permission denied')})
}

$('audioFile').addEventListener('change',function(){
if(this.files[0])cloudUpload(this.files[0],'voice',function(u){sendMedia({voiceUrl:u})},function(e){toast(e)});
this.value=''
});

function cloudUpload(file,kind,ok,fail){
var resource=kind==='image'?'image':'video';
var url='https://api.cloudinary.com/v1_1/'+CLOUD_NAME+'/'+resource+'/upload';
if(kind==='image')url='https://api.cloudinary.com/v1_1/'+CLOUD_NAME+'/image/upload';
if(kind==='video'||kind==='voice')url='https://api.cloudinary.com/v1_1/'+CLOUD_NAME+'/video/upload';
var fd=new FormData();
fd.append('file',file,file.name||('yourchat_'+Date.now()));
fd.append('upload_preset',CLOUD_PRESET);
var xhr=new XMLHttpRequest();
xhr.open('POST',url,true);xhr.timeout=120000;
xhr.onload=function(){
try{
var j=JSON.parse(xhr.responseText||'{}');
if(xhr.status>=200&&xhr.status<300&&j.secure_url)ok(j.secure_url);
else fail((j.error&&j.error.message)||('Cloudinary error '+xhr.status))
}catch(e){fail('Upload response error')}
};
xhr.onerror=function(){fail('Upload network error')};
xhr.ontimeout=function(){fail('Upload timed out')};
xhr.send(fd)
}

function chatMenu(){
var m=document.createElement('div');m.className='menu';m.id='chatMenu';
var uid=currentPeer&&currentPeer.uid;if(!uid)return;

})

var n=$('loginUser').value.trim(),p=$('loginPass').value;

return db.collection('users').doc(c.user.uid).set({uid:c.user.uid,username:n,avatar:'',online:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()})
}).catch(function(e){
$('loginErr').textContent=e&&e.code==='auth/email-already-in-use'?'Username already exists. Please Login.':(e&&e.message?e.message:'Account creation failed.')
})
};

$('loginBtn').onclick=function(){

auth.signInWithEmailAndPassword(emailFor(n),p).catch(function(e){
$('loginErr').textContent=e&&e.code==='auth/user-not-found'?'Username not found. Please Create Account.':e&&e.code==='auth/wrong-password'?'Wrong password.':e&&e.code==='auth/invalid-api-key'?'Firebase API key is invalid.':e&&e.message?e.message:'Login failed.'

});

setTimeout(function(){
loadingDone=true;
$('loading').classList.add('hide');
if(authReady&&me)startApp();else if(!me)showLogin()
},3000);

initFirebase();

})();
