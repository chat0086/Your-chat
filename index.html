function showSettings(){currentPage='settings';stop();var b='<div class="wrap"><div class="card"><button class="setting" onclick="editDP()">Edit DP<small>Change your profile picture</small></button><button class="setting" onclick="toggleNotifications()">Notifications: '+(notificationsOn?'ON':'OFF')+'</button><button class="setting" onclick="toggleSound()">Notification Sound: '+(soundOn?'ON':'OFF')+'</button><button class="setting" onclick="toggleBlock()">Block / Unblock</button><button class="setting" onclick="showBlocked()">Blocked Users</button><button class="setting" onclick="removeId()">Remove ID</button><button class="setting" onclick="showNotifications()">Notifications</button><button class="setting" onclick="logout()">Logout</button></div></div>';document.getElementById('app').innerHTML=shell('Settings',b,true)}
function editProfile(){toast('Name cannot be edited.');}
function toggleNotifications(){notificationsOn=!notificationsOn;localStorage.setItem('yc_notifications',notificationsOn?'1':'0');showSettings()}function toggleSound(){soundOn=!soundOn;localStorage.setItem('yc_sound',soundOn?'1':'0');if(soundOn){initRing();sound()}showSettings()}function editDP(){var i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=function(){var f=i.files[0];if(!f)return;if(f.size>10*1024*1024){toast('DP must be under 10MB.');return}cloudUpload(f,function(url){db.collection('users').doc(me.uid).update({avatar:url}).then(function(){me.avatar=url;toast('DP updated.');showSettings()})},function(e){toast(e)},function(p){toast('Uploading DP '+p+'%')})};i.click()}
function toggleBlock(){if(!currentPeer){toast('Open a private chat first.');return}var id=me.uid+'_'+currentPeer.uid;db.collection('blocks').doc(id).get().then(function(d){if(d.exists)return db.collection('blocks').doc(id).delete().then(function(){toast('User unblocked.');showPrivateChat()});return db.collection('blocks').doc(id).set({uid:me.uid,blockedUid:currentPeer.uid,createdAt:ts()}).then(function(){toast('User blocked.');showPrivateChat()})})}function unblockFromChat(){var id=me.uid+'_'+currentPeer.uid;db.collection('blocks').doc(id).delete().then(function(){privateBlockedState=null;showPrivateChat()}).catch(function(){toast('Unblock failed.')})}
function showBlocked(){currentPage='blocked';stop();var b='<div class="wrap"><div id="bl" class="card">Loading...</div></div>';document.getElementById('app').innerHTML=shell('Blocked Users',b,true);loadUsers(function(){listen(db.collection('blocks').where('uid','==',me.uid),function(s){var h='';s.forEach(function(d){var x=d.data(),u=users[x.blockedUid]||{};h+='<div class="userRow"><div class="userInfo"><b>'+esc(u.username||'User')+'</b></div><button class="btn small" onclick="unblock(\''+x.blockedUid+'\')">Unblock</button></div>'});$('bl').innerHTML=h||'<div class="empty">No blocked users.</div>'})})}
function unblock(id){db.collection('blocks').doc(me.uid+'_'+id).delete().then(showBlocked)}function removeId(){if(!currentPeer)return;if(!confirm('Remove this ID/user from your private chat?'))return;db.collection('chats').doc(currentChatId).delete().then(function(){toast('ID removed.');showPrivate()})}
function showNotifications(){currentPage='notifications';stop();var b='<div class="wrap"><button class="btn danger" onclick="clearNotifications()">Clear Notifications</button><div id="nl" class="card">Loading...</div></div>';document.getElementById('app').innerHTML=shell('Notifications',b,true);listen(db.collection('notifications').where('toUid','==',me.uid).orderBy('createdAt','desc'),function(s){var h='';s.forEach(function(d){var x=d.data();h+='<div class="userRow"><div class="userInfo"><b>'+esc(x.type||'Notification')+'</b><div class="status">'+esc(x.text||'')+'</div></div><div class="status">'+esc(timeOf(x.createdAt))+'</div></div>'});$('nl').innerHTML=h||'<div class="empty">No notifications.</div>'})}
function clearNotifications(){db.collection('notifications').where('toUid','==',me.uid).get().then(function(s){var b=db.batch();s.forEach(function(d){b.delete(d.ref)});return b.commit()}).then(showNotifications)}
function logout(){db.collection('users').doc(me.uid).set({online:false,lastSeen:ts()},{merge:true}).catch(function(){});stop();auth.signOut()}
window.addEventListener('beforeunload',function(){if(auth.currentUser&&me)db.collection('users').doc(me.uid).set({online:false,lastSeen:ts()},{merge:true}).catch(function(){})});
</script></body></html>
